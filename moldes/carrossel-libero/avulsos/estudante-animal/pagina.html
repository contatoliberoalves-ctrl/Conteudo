function desenho(nome,x,y,tam,rot=0){

  const r=rough.svg(svg);(D[nome](r)).forEach(n=>svg.appendChild(n));return svg;
}
function rabisco(svgPai,cmd){ // rabiscos soltos (círculos, setas, sublinhados) por cima do slide

}
