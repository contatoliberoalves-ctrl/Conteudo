<title>Pauta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pauta, o estúdio de conteúdo jurídico da PratFlix: cronograma de 6 meses, ideias e roteiros por área de atuação.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Manrope:wght@500;600;700;800&family=Fraunces:wght@800&family=Inter:wght@500&family=Archivo+Black&family=Archivo:wght@500&family=Playfair+Display:wght@800&family=Lato:wght@400&display=swap">
<style>
/* Layout: estúdio de planejamento — papel frio e cobalto, barra lateral fixa, cartões só onde há ação. */
:root {
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EDEFF3; --line:#E1E4EA; --ink:#14161B; --muted:#596170; --faint:#8A919E;
  --accent:#3047E6; --accent-2:#E9ECFD; --on-accent:#FFFFFF; --areia:#E3D6B4; --ok:#0E9F6E; --warn:#B7791F; --bad:#D6363C;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif; --text:"Manrope",-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px #14161B0d, 0 8px 24px -12px #14161B26; color-scheme:light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1115; --surface:#171A20; --surface2:#1F232B; --line:#2A2F39; --ink:#EEF0F4; --muted:#A6ADBA; --faint:#7A8291;
  --accent:#7385FF; --accent-2:#232A52; --on-accent:#0F1115; --ok:#3CCB95; --warn:#E3A84A; --bad:#FF6B70; --shadow:0 1px 2px #0006, 0 10px 30px -14px #000a; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#0F1115; --surface:#171A20; --surface2:#1F232B; --line:#2A2F39; --ink:#EEF0F4; --muted:#A6ADBA; --faint:#7A8291;
  --accent:#7385FF; --accent-2:#232A52; --on-accent:#0F1115; --ok:#3CCB95; --warn:#E3A84A; --bad:#FF6B70; --shadow:0 1px 2px #0006, 0 10px 30px -14px #000a; color-scheme:dark }

* { box-sizing:border-box }
html, body { margin:0; background:var(--bg); color:var(--ink) }
body { font:500 16px/1.6 var(--text); -webkit-font-smoothing:antialiased }
body.travado { overflow:hidden }
h1, h2, h3, h4, p { margin:0 } p { text-wrap:pretty }
a { color:inherit; text-decoration:none }
button, input, select, textarea { font:inherit; color:inherit }
button { cursor:pointer; background:none; border:0; padding:0 }
.ic { width:20px; height:20px; flex:none }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
[hidden] { display:none !important }
.brand { font-family:var(--text); font-weight:800; font-size:28px; letter-spacing:-1.4px; line-height:1 }
.brand b { color:var(--accent); font-size:.6em; vertical-align:.3em; margin-left:2px }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent) }
.lead { font-size:17.5px; color:var(--muted); line-height:1.6; max-width:720px }
.hint { font-size:14.5px; color:var(--faint); margin-top:8px }
.vazio { color:var(--faint); font-size:15px; padding:8px 0 }
.link { display:inline-flex; align-items:center; gap:4px; font-size:15px; font-weight:700; color:var(--accent) }
.link .ic { width:16px; height:16px }

/* Botões e controles */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:46px; padding:10px 18px; border-radius:11px; background:var(--accent); color:var(--on-accent); font-weight:800; font-size:15px; border:1.5px solid var(--accent); transition:transform .15s, background .15s; white-space:nowrap }
.btn:hover { transform:translateY(-1px) }
.btn:disabled { opacity:.45; cursor:not-allowed; transform:none }
.btn.ghost { background:var(--surface); color:var(--ink); border-color:var(--line) }
.btn.ghost:hover { border-color:var(--accent) }
.btn.sm { min-height:38px; padding:7px 13px; font-size:14px; border-radius:9px }
.btn.sq { padding:0; width:46px } .btn.sm.sq { width:38px }
.btn .ic { width:18px; height:18px }
.btn.perigo-b { background:var(--bad); border-color:var(--bad); color:#fff }
.acoes { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px }
.acoes.col { flex-direction:column; align-items:stretch }
.chips { display:flex; gap:8px; flex-wrap:wrap }
.chip { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:7px 15px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); font-size:14.5px; font-weight:700 }
.chip .ic { width:16px; height:16px }
.chip:hover { color:var(--ink) }
.chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--bg) }
.seg { display:inline-flex; padding:4px; border-radius:12px; background:var(--surface2); gap:2px }
.seg button { min-height:38px; padding:6px 14px; border-radius:9px; font-weight:700; font-size:14.5px; color:var(--muted) }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:var(--shadow) }
.tabs { display:flex; gap:4px; border-bottom:1.5px solid var(--line); margin:4px 0 22px; overflow-x:auto; scrollbar-width:none }
.tabs button { padding:12px 16px; font-weight:800; font-size:15px; color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1.5px; white-space:nowrap }
.tabs button[aria-selected="true"] { color:var(--accent); border-color:var(--accent) }
.campo { display:grid; gap:6px; font-size:14.5px; font-weight:700; color:var(--muted) }
input:not([type=checkbox]):not([type=file]), select, textarea { width:100%; min-height:46px; padding:10px 14px; border-radius:11px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; font-weight:500; outline:0 }
input:focus, select:focus, textarea:focus { border-color:var(--accent) }
textarea { line-height:1.6; resize:vertical }
.mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:14.5px }
.pre { white-space:pre-wrap; background:var(--surface2); border-radius:12px; padding:18px; margin:16px 0 0; max-height:55vh; overflow:auto; line-height:1.6 }
.check-line { display:flex; gap:10px; align-items:center; font-weight:700; margin-top:20px }

/* Selos */
.fchip { display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 8px; border-radius:6px; font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent); white-space:nowrap }
.fchip::before { content:""; width:7px; height:7px; border-radius:2px; background:var(--c) }
.adot { width:10px; height:10px; border-radius:50%; background:var(--c); flex:none; display:inline-block }
.st { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:800; white-space:nowrap; background:var(--surface2); color:var(--muted) }
.st-roteiro { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent) }
.st-producao { background:color-mix(in srgb, #E5484D 14%, transparent); color:#D6363C }
.st-edicao { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn) }
.st-agendado { background:color-mix(in srgb, #7C3AED 14%, transparent); color:#8B5CF6 }
.st-publicado { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok) }

/* Estrutura */
.side { position:fixed; inset:0 auto 0 0; width:262px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:22px 14px 16px; z-index:30; overflow-y:auto }
.side-brand { display:grid; gap:6px; padding:0 10px 18px }
.side-brand small { font-size:12.5px; color:var(--faint); font-weight:700 }
.side nav { display:grid; gap:2px }
.nav { display:flex; align-items:center; gap:12px; min-height:44px; padding:8px 12px; border-radius:10px; color:var(--muted); font-weight:700; font-size:15px }
.nav:hover { background:var(--surface2); color:var(--ink) }
.nav.on { background:var(--accent-2); color:var(--accent) }
.nav em { margin-left:auto; font-style:normal; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--surface2); color:var(--faint) }
.side-sep { font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); padding:16px 12px 6px }
.side-foot { margin-top:auto; display:grid; gap:12px; padding-top:18px }
.side-fase { padding:14px; border-radius:12px; background:color-mix(in srgb, var(--c) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--c) 30%, transparent) }
.side-fase small { display:block; font-size:12.5px; color:var(--muted); font-weight:700 }
.side-fase strong { font-family:var(--display); font-size:26px; font-weight:800; text-transform:uppercase; color:var(--c); line-height:1.1 }
.side-fase i { display:block; height:5px; border-radius:5px; background:var(--line); margin-top:8px; overflow:hidden } .side-fase i b { display:block; height:100%; background:var(--c) }
.side-user { display:flex; gap:10px; align-items:center; padding:6px }
.side-user strong { display:block; font-size:14.5px; line-height:1.2 } .side-user small { font-size:12.5px; color:var(--faint); line-height:1.3; display:block }
.av { width:40px; height:40px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-weight:800; font-size:14px; flex:none }
.main { margin-left:262px; min-height:100vh }
.page { max-width:1320px; margin:0 auto; padding:34px clamp(18px, 3vw, 44px) 80px }
.tabbar { display:none }
.cab { display:flex; justify-content:space-between; align-items:end; gap:20px; flex-wrap:wrap; margin-bottom:26px }
.cab h1 { font-size:clamp(32px, 3.4vw, 46px); font-weight:800; letter-spacing:-1.4px; line-height:1.08; margin:10px 0 0; text-wrap:balance }
.cab h1 em, .hero-painel h1 em { font-style:normal; color:var(--accent) }
.cab .lead { margin-top:10px }
.cab-acoes { display:flex; gap:8px; align-items:center }
.cols { display:grid; grid-template-columns:minmax(0, 1.5fr) minmax(0, 1fr); gap:20px; align-items:start; margin-bottom:20px }
.col-side { display:grid; gap:20px }
.box { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:var(--shadow) }
.box + .box { margin-top:20px } .col-side .box + .box, .cols > .box + .box { margin-top:0 }
.box h2 { font-size:20px; font-weight:800; letter-spacing:-.3px; margin-bottom:12px }
.box h3 { font-size:17px; font-weight:800; margin:14px 0 8px }
.box-h { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px } .box-h h2, .box-h h3 { margin:0 }
.contador { font-weight:800; color:var(--muted); font-size:14.5px }

/* Painel */
.hero-painel { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:30px; align-items:center; padding:clamp(24px, 3vw, 40px); border-radius:20px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:18px }
.hero-painel::before { content:""; position:absolute; inset:0 auto 0 0; width:6px; background:var(--c) }
.hero-painel h1 { font-size:clamp(30px, 3.4vw, 46px); font-weight:800; letter-spacing:-1.4px; line-height:1.08; margin:10px 0; text-wrap:balance }
.anel { position:relative; width:150px; height:150px }
.anel svg { width:150px; height:150px; transform:rotate(-90deg) }
.anel circle { fill:none; stroke:var(--surface2); stroke-width:11 } .anel .fg { stroke:var(--c); stroke-linecap:round; stroke-dasharray:326.7; transition:stroke-dashoffset .6s }
.anel div { position:absolute; inset:0; display:grid; place-content:center; text-align:center }
.anel strong { font-family:var(--display); font-size:46px; font-weight:800; line-height:1 } .anel span { font-size:13px; color:var(--muted); font-weight:700 }
.stats { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; margin-bottom:20px }
.stats > div { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; display:grid }
.stats strong { font-family:var(--display); font-size:38px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums }
.stats span { font-size:14px; color:var(--muted); font-weight:600 }
.plist { display:grid; gap:8px }
.pcard { display:grid; grid-template-columns:56px minmax(0, 1fr) auto; gap:14px; align-items:center; width:100%; text-align:left; padding:12px 14px 12px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line); transition:border-color .15s }
.pcard:hover { border-color:var(--accent) }
.pcard.feito strong { color:var(--faint); text-decoration:line-through }
.pcard-data { display:grid; justify-items:center; padding:6px 0; border-radius:10px; background:var(--surface2); font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; line-height:1.2 }
.pcard-data b { font-family:var(--display); font-size:24px; color:var(--ink) }
.pcard-data.atraso { background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad) }
.pcard-meio { min-width:0; display:grid; gap:4px }
.pcard-meio strong { font-size:15.5px; line-height:1.35; font-weight:700 }
.pcard-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.pcard-meta small { font-size:13px; color:var(--faint); font-weight:700 }
.stories-sem { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:8px }
.stories-sem li { padding:10px 12px; border-radius:10px; background:var(--surface2); font-size:14.5px; line-height:1.4 }
.stories-sem b { display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent) }
.tarefas { list-style:none; margin:0; padding:0; display:grid; gap:4px }
.tarefas label { display:flex; gap:12px; align-items:flex-start; padding:9px 4px; cursor:pointer; font-size:15.5px; line-height:1.45 }
.tarefas input { position:absolute; opacity:0; pointer-events:none }
.box-ck { width:24px; height:24px; border-radius:7px; border:2px solid var(--line); display:grid; place-items:center; flex:none; transition:.15s; margin-top:1px; background:var(--surface) }
.box-ck .ic { width:15px; height:15px; stroke-width:3; opacity:0; color:var(--on-accent) }
.tarefas input:checked + .box-ck { background:var(--accent); border-color:var(--accent) } .tarefas input:checked + .box-ck .ic { opacity:1 }
.tarefas input:checked ~ span:last-child { color:var(--faint); text-decoration:line-through }
.tarefas input:focus-visible + .box-ck { outline:2px solid var(--accent); outline-offset:2px }
.ideia-dia { border-top:4px solid var(--c) }
.ideia-dia h3 { font-size:19px; line-height:1.3; margin:10px 0 }

/* Cronograma */
.fases { display:grid; gap:20px }
.fase { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:var(--shadow) }
.fase.atual { border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent), var(--shadow) }
.fase-cab { display:grid; grid-template-columns:auto minmax(0, 1fr) 180px; gap:20px; align-items:center }
.fase-n { font-family:var(--display); font-size:72px; font-weight:900; line-height:.85; color:var(--c) }
.fase-cab .eyebrow { color:var(--c) }
.fase-cab h2 { font-family:var(--display); font-size:40px; font-weight:800; text-transform:uppercase; line-height:1; margin-top:4px }
.fase-cab p { color:var(--muted); font-size:16px; margin-top:4px }
.fase-prog { display:grid; gap:2px } .fase-prog strong { font-family:var(--display); font-size:30px; line-height:1 } .fase-prog span { font-size:13.5px; color:var(--muted); font-weight:700 }
.fase-prog i { display:block; height:6px; border-radius:6px; background:var(--surface2); overflow:hidden; margin-top:6px } .fase-prog i b { display:block; height:100%; background:var(--c) }
.kpis { list-style:none; margin:18px 0; padding:0; display:flex; flex-wrap:wrap; gap:8px }
.kpis li { display:flex; gap:7px; align-items:center; padding:7px 12px; border-radius:999px; background:var(--surface2); font-size:14px; font-weight:700 }
.kpis .ic { width:15px; height:15px; color:var(--c) }
.semanas { display:grid; gap:8px }
.semana { border:1px solid var(--line); border-radius:12px; overflow:hidden }
.semana summary { display:grid; grid-template-columns:auto minmax(0, 1fr) auto auto; gap:14px; align-items:center; padding:14px 16px; cursor:pointer; list-style:none }
.semana summary::-webkit-details-marker { display:none }
.sem-n { font-family:var(--display); font-weight:800; font-size:22px; color:var(--c) }
.semana summary strong { font-size:16.5px }
.sem-meta { font-size:14px; color:var(--faint); font-weight:600 }
.chev { transition:transform .2s; color:var(--faint) } .semana[open] .chev { transform:rotate(90deg) }
.sem-corpo { display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(0, 1fr); gap:20px; padding:4px 16px 18px }
.sem-corpo h4 { font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); margin:6px 0 10px }

/* Calendário */
.legenda-f { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px }
.cal { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow) }
.cal-sem, .cal-grade { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)) }
.cal-sem span { padding:10px 12px; font-size:13px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; border-bottom:1px solid var(--line) }
.cal-dia { position:relative; min-height:128px; padding:8px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:5px; transition:background .15s }
.cal-dia:nth-child(7n) { border-right:0 }
.cal-dia.fora { background:var(--surface2); opacity:.6 }
.cal-dia.hoje .cal-n { background:var(--accent); color:var(--on-accent) }
.cal-dia.alvo { background:var(--accent-2) }
.cal-n { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px }
.cal-data { display:flex; gap:4px; align-items:center; font-size:11.5px; font-weight:800; color:var(--warn); line-height:1.25 }
.cal-data .ic { width:12px; height:12px }
.cal-post { text-align:left; padding:6px 8px; border-radius:8px; background:color-mix(in srgb, var(--c) 12%, var(--surface)); border-left:3px solid var(--c); font-size:13px; line-height:1.3; display:grid; gap:1px; cursor:grab }
.cal-post b { font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--c) }
.cal-post span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:600 }
.cal-post.st-b-publicado { opacity:.55 } .cal-post.st-b-publicado span { text-decoration:line-through }
.cal-add { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:7px; display:grid; place-items:center; color:var(--faint); opacity:0; transition:.15s }
.cal-dia:hover .cal-add, .cal-add:focus-visible { opacity:1 } .cal-add:hover { background:var(--surface2); color:var(--accent) }
.cal-add .ic { width:16px; height:16px }
.arrastando { opacity:.4 }

/* Produção */
.kanban { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px, 1fr); gap:12px; overflow-x:auto; padding-bottom:12px; align-items:start }
.col { background:var(--surface2); border-radius:14px; padding:10px; min-height:200px; transition:background .15s }
.col.alvo { background:var(--accent-2) }
.col-h { display:flex; justify-content:space-between; align-items:center; padding:4px 4px 10px } .col-h b { color:var(--faint); font-size:14px }
.col-l { display:grid; gap:8px }
.kcard { background:var(--surface); border:1px solid var(--line); border-radius:11px; cursor:grab; box-shadow:var(--shadow) }
.kcard-b { display:grid; gap:6px; padding:12px; text-align:left; width:100% }
.kcard-b strong { font-size:14.5px; line-height:1.35; font-weight:700 }
.kcard-nav { display:flex; justify-content:space-between; border-top:1px solid var(--line); padding:4px }
.kcard-nav button { display:inline-flex; align-items:center; gap:4px; padding:6px 8px; border-radius:7px; font-size:13px; font-weight:700; color:var(--muted) }
.kcard-nav button:hover { background:var(--surface2); color:var(--accent) }
.kcard-nav .ic { width:15px; height:15px }

/* Ideias */
.filtros { display:grid; gap:10px; margin-bottom:12px }
.busca { display:flex; align-items:center; gap:10px; max-width:420px; padding:0 14px; border-radius:11px; border:1.5px solid var(--line); background:var(--surface); color:var(--faint) }
.busca input { border:0 !important; padding-left:0 !important; background:none !important }
.contagem { font-size:14.5px; color:var(--faint); font-weight:700; margin:10px 0 }
.ideias { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px }

/* ---------- gerador do plano ---------- */
const DIAS_FREQ = { 2:[2, 4], 3:[1, 3, 5], 4:[1, 2, 4, 5], 5:[1, 2, 3, 4, 5] };
function gerarPlano(pf, manter = []) {
  const ini = segunda(dataDe(pf.inicio)), areas = pf.areas, posts = [];
  const filas = Object.fromEntries(['carrossel', 'reels', 'post', 'stories', 'live', 'youtube'].map(f => [f, []]));
  // Fila de temas por formato, intercalando as áreas (área principal aparece com mais frequência).
  const ordemAreas = areas.length > 1 ? [pf.principal, ...areas.filter(a => a !== pf.principal), pf.principal] : areas;
  const maxT = Math.max(...areas.map(a => AREA[a].temas.length));
  for (let ti = 0; ti < maxT; ti++) ordemAreas.forEach(ar => { if (!AREA[ar].temas[ti]) return;
    P.MODELOS_IDEIA.forEach(mo => { const k = `${ar}:${ti}:${mo.id}`; if (!filas[mo.formato].includes(k)) filas[mo.formato].push(k) }) });
  // Embaralha levemente mantendo a alternância (rotação por modelo dentro do formato).
  for (const f in filas) { const porModelo = {}; filas[f].forEach(k => { const m = k.split(':')[2]; (porModelo[m] ||= []).push(k) });
    const ms = Object.values(porModelo), r = []; for (let i = 0; r.length < filas[f].length; i++) ms.forEach(l => l[i] && r.push(l[i])); filas[f] = r }
  const usados = new Set(manter.map(p => p.ideia));
  const pega = f => { const fila = filas[f] || filas.carrossel; let k; while ((k = fila.shift()) && usados.has(k)); if (!k) k = filas.carrossel.shift() || `g:${(posts.length % (P.IDEIAS_GERAIS.length - 1)) + 1}`; usados.add(k); return k };
  const gerais = P.IDEIAS_GERAIS.map((g, i) => i).filter(i => i > 0); let gi = 0;
  const dias = (pf.dias && pf.dias.length ? pf.dias : DIAS_FREQ[pf.freq]).slice().sort();
  let liveFeita = false, nPost = 0;
  for (let w = 0; w < 26; w++) {
    const sem = P.SEMANAS[w], fase = P.FASES[sem.f - 1], seg = somaDias(ini, w * 7);
    dias.forEach((dw, k) => {
      const data = iso(somaDias(seg, (dw + 6) % 7));
      if (manter.some(p => p.data === data)) return;
      let fmt = fase.mix[(k + w) % fase.mix.length], id;
      if (fmt === 'live') { if (liveFeita || sem.f !== 5) fmt = 'carrossel'; else liveFeita = true }
      if (w === 0 && k === 0) { id = 'g:0'; fmt = null }
      else if (fmt === 'post' && (nPost++ % 2)) { id = 'g:' + gerais[gi++ % gerais.length]; fmt = null }
      else if (k === dias.length - 1 && w % 3 === 1 && sem.f !== 4) { id = 'g:' + gerais[gi++ % gerais.length]; fmt = null }
      else id = pega(fmt);
      // datas comemorativas da semana
      const dt = P.DATAS.findIndex(d => { const dd = new Date(seg.getFullYear(), d.m - 1, d.d); const dd2 = new Date(seg.getFullYear() + 1, d.m - 1, d.d);
        return [dd, dd2].some(x => x >= seg && x < somaDias(seg, 7)) && (!d.areas.length || d.areas.some(a => areas.includes(a))) });
      if (dt >= 0 && k === 0 && w > 0) { const d = P.DATAS[dt]; id = `d:${dt}:${d.areas.find(a => areas.includes(a)) || pf.principal}` }
      const ide = ideia(id); let formato = fmt || ide.formato;
      if (id.startsWith('d:')) formato = 'carrossel';

      if (formato === 'reels' && pf.video === 'asvezes' && (w + k) % 2) formato = 'reels-texto';
      if (formato === 'live' && pf.video === 'nao') formato = 'carrossel';
      posts.push({ id:'p' + Math.random().toString(36).slice(2, 9), data, semana:w, formato, pilar:ide.pilar, area:ide.area, ideia:id, titulo:ide.titulo, status:'ideia', roteiro:'', legenda:'', notas:'', check:[] });
    });
  }
  return [...manter, ...posts].sort((a, b) => a.data.localeCompare(b.data));
}

const CTA = (a, i = 0) => P.CTAS[i % P.CTAS.length].replace('{area}', a.nome.toLowerCase()).replace('{palavra}', (a.destaques[0] || 'GUIA').toUpperCase());

    else miolo = `SLIDE 2 · CONTEXTO\n[Por que esse assunto importa para quem segue]\n\nSLIDE 3 · PONTO 1\n[Ideia principal]\n\nSLIDE 4 · PONTO 2\n[Segunda ideia]\n\nSLIDE 5 · PONTO 3\n[Terceira ideia]\n\nSLIDE 6 · EXEMPLO\n[Situação fictícia ou fonte]\n\nSLIDE 7 · RESUMO\n[3 linhas para salvar]`;

  if (d.fav) { const l = S.favoritas; S.favoritas = l.includes(d.fav) ? l.filter(x => x !== d.fav) : [...l, d.fav]; salvar(); render(false); return }
  if (d.fid) { fId[d.fid] = d.v; render(false); return }
  if (d.favf !== undefined) { fId.fav = !fId.fav; render(false); return }
  if (d.mes) { const n = +d.mes; mesCal = n ? new Date(mesCal.getFullYear(), mesCal.getMonth() + n, 1) : new Date(hoje().getFullYear(), hoje().getMonth(), 1); render(false); return }
  if (d.novo) { const p = addIdeia('g:' + (1 + Math.floor(Math.random() * (P.IDEIAS_GERAIS.length - 1))), d.novo); abrirPost(p.id); return }
  if (d.prodf) { window.__prodFiltro = d.prodf; render(false); return }
  if (d.abarot) { abaRot = d.abarot; render(false); return }
  if (d.estr) { const fake = { ideia:`${S.perfil.principal}:0:${{ carrossel:'passo', reels:'mito', 'reels-texto':'mito', post:'quando', stories:'caixa', live:'live', youtube:'longo' }[d.estr]}`, area:S.perfil.principal, formato:d.estr };
    return modal(`<div class="mp"><span class="eyebrow">Estrutura · ${P.FORMATOS[d.estr].nome}</span><h2 class="mp-t2">${P.FORMATOS[d.estr].dur}</h2><pre class="mono pre">${E(roteiro(fake))}</pre></div>`) }
  if (d.abaest) { abaEst = d.abaest; render(false); return }
  if (d.pal) { S.identidade.paleta = d.pal; salvar(); render(false); return }
  if (d.fon) { S.identidade.fonte = d.fon; salvar(); render(false); return }
  if (d.delmet) { S.metricas = S.metricas.filter(m => m.data !== d.delmet); salvar(); render(false); return }
  if (d.acao === 'editar') { wiz.passo = 0; onboarding(true); return }
  if (d.acao === 'exportar') return baixar(`pauta-${iso(hoje())}.json`, JSON.stringify(S, null, 2), 'application/json');
  if (d.acao === 'ics') return baixar('pauta-calendario.ics', ics(), 'text/calendar');
  if (d.acao === 'zerar1') { $('#zerar').innerHTML = `<p><b>Tem certeza?</b> Isso não pode ser desfeito.</p><div class="acoes"><button class="btn perigo-b" data-acao="zerar2">Sim, apagar tudo</button><button class="btn ghost" data-acao="zerar0">Cancelar</button></div>`; return }
  if (d.acao === 'zerar0') return render(false);
  if (d.acao === 'zerar2') { S = novo(); salvar(); wiz = { passo:0, d:{} }; location.hash = ''; onboarding(); return }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.tarefa) { S.tarefas[t.dataset.tarefa] = t.checked; salvar(); if (t.checked) toast('Tarefa concluída.'); return }
  if (t.id === 'gt') { temaG = t.value; render(false); return }
  if (t.id === 'imp') { const f = t.files[0]; if (!f) return; f.text().then(txt => { try { const s = JSON.parse(txt); if (!s.perfil || !Array.isArray(s.posts)) throw 0; S = { ...novo(), ...s }; salvar(); toast('Dados importados.'); render() } catch { toast('Arquivo inválido. Use um arquivo exportado pela Pauta.') } }) }
});
document.addEventListener('change', e => { // checklist dentro do modal
  if (!e.target.dataset.pchk) return; const id = $('[data-delpost]')?.dataset.delpost, p = S.posts.find(x => x.id === id); if (!p) return;
  const i = +e.target.dataset.pchk; p.check = e.target.checked ? [...new Set([...p.check, i])] : p.check.filter(x => x !== i); salvar();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'fq') { fId.q = t.value; clearTimeout(t.__t); t.__t = setTimeout(() => { const pos = t.selectionStart; render(false); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos) }, 250); return }
  if (t.id === 'etx') return mostrarEtica(t.value, '#eres');
  if (t.id === 'mp-legenda' || t.id === 'mp-roteiro') return mostrarEtica($('#mp-legenda').value + '\n' + $('#mp-roteiro').value, '#mp-etica');
  if (t.id === 'w-nome') { wiz.d.nome = t.value; const b = $('[data-wiz="1"]'); if (b) b.disabled = t.value.trim().length < 2 }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'fmet') return; e.preventDefault(); const f = new FormData(e.target), r = Object.fromEntries(f.entries());
  ['seguidores', 'alcance', 'salvos', 'compart', 'visitas', 'mensagens'].forEach(k => r[k] = +r[k] || 0);
  S.metricas = S.metricas.filter(m => m.data !== r.data).concat(r); salvar(); toast('Semana registrada.'); render(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) fechar() });
// arrastar e soltar (calendário e produção)
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.drag); c.classList.add('arrastando') } });
document.addEventListener('dragend', e => e.target.classList?.remove('arrastando'));
document.addEventListener('dragover', e => { const z = e.target.closest?.('[data-drop],[data-dropst]'); if (z) { e.preventDefault(); z.classList.add('alvo') } });
document.addEventListener('dragleave', e => e.target.closest?.('[data-drop],[data-dropst]')?.classList.remove('alvo'));
document.addEventListener('drop', e => {
  const z = e.target.closest?.('[data-drop],[data-dropst]'); if (!z) return; e.preventDefault(); const p = S.posts.find(x => x.id === e.dataTransfer.getData('text/plain')); if (!p) return;
  if (z.dataset.drop) { p.data = z.dataset.drop; p.semana = Math.max(0, Math.floor((dataDe(p.data) - segunda(dataDe(S.perfil.inicio))) / 864e5 / 7)); S.posts.sort((a, b) => a.data.localeCompare(b.data)); toast(`Remarcado para ${fmt(p.data, { day:'2-digit', month:'long' })}.`) }
  else { p.status = z.dataset.dropst; toast(`Movido para “${STATUS[STI[p.status]].nome}”.`) }
  salvar(); render(false);
});

render();
})();

</script>
