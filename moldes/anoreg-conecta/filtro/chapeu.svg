<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520">
  <defs>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3559d6"/><stop offset=".55" stop-color="#1d3aa6"/><stop offset="1" stop-color="#132a7c"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="couro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4ded3"/>
    </linearGradient>
    <linearGradient id="couroSombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d2c4"/><stop offset="1" stop-color="#f3efe7"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#sombra)">
    <!-- aba de trás -->
    <ellipse cx="320" cy="318" rx="300" ry="78" fill="url(#couroSombra)" stroke="#bfb6a6" stroke-width="2"/>
    <!-- tiras laterais (barbicacho solto) -->
    <g id="tiras">
      <path d="M92 330 C80 380 86 420 98 470" fill="none" stroke="#f4f0e8" stroke-width="16" stroke-linecap="round"/>
      <path d="M92 330 C80 380 86 420 98 470" fill="none" stroke="#c9c0b0" stroke-width="2" stroke-dasharray="6 6"/>
      <rect x="80" y="395" width="28" height="44" rx="10" fill="#1d3aa6" transform="rotate(-4 94 417)"/>
      <path d="M98 470 l-14 44 M98 470 l-4 46 M98 470 l8 44 M98 470 l16 40" stroke="#1d3aa6" stroke-width="5" stroke-linecap="round"/>
      <path d="M548 330 C560 380 554 420 542 470" fill="none" stroke="#f4f0e8" stroke-width="16" stroke-linecap="round"/>
      <path d="M548 330 C560 380 554 420 542 470" fill="none" stroke="#c9c0b0" stroke-width="2" stroke-dasharray="6 6"/>
      <rect x="532" y="395" width="28" height="44" rx="10" fill="#1d3aa6" transform="rotate(4 546 417)"/>
      <path d="M542 470 l14 44 M542 470 l4 46 M542 470 l-8 44 M542 470 l-16 40" stroke="#1d3aa6" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- copa -->
    <path d="M150 318 C146 170 214 72 320 72 C426 72 494 170 490 318 Z" fill="url(#azul)"/>
    <path d="M150 318 C146 170 214 72 320 72 C426 72 494 170 490 318 Z" fill="url(#brilho)"/>
    <!-- costuras da copa -->
    <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.4" stroke-dasharray="7 7">
      <path d="M320 80 C318 160 318 230 320 300"/>
      <path d="M318 82 C260 120 232 200 228 300"/>
      <path d="M322 82 C380 120 408 200 412 300"/>
    </g>
    <!-- faixa decorada -->
    <path d="M152 262 C210 282 430 282 488 262 L490 318 C430 340 210 340 150 318 Z" fill="#c62828"/>
    <path d="M152 270 C210 290 430 290 488 270" fill="none" stroke="#f2c14e" stroke-width="3"/>
    <path d="M151 310 C210 330 430 330 489 310" fill="none" stroke="#f2c14e" stroke-width="3"/>
    <path d="M160 296 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14 l12 -14"
      transform="translate(0 6)" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- aba da frente -->
    <path d="M20 318 C24 384 170 428 320 428 C470 428 616 384 620 318 C590 346 470 356 320 356 C170 356 50 346 20 318 Z" fill="url(#couro)" stroke="#bfb6a6" stroke-width="2"/>
    <path d="M46 340 C90 386 200 410 320 410 C440 410 550 386 594 340" fill="none" stroke="#1d3aa6" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M28 330 C66 392 180 420 320 420 C460 420 574 392 612 330" fill="none" stroke="#c62828" stroke-width="2.5"/>
    <!-- cruz vermelha na lateral -->
    <g transform="translate(540 362) rotate(-12)"><rect x="-5" y="-20" width="10" height="40" rx="2" fill="#c62828"/><rect x="-15" y="-8" width="30" height="10" rx="2" fill="#c62828"/></g>
    <!-- estrelinhas -->
    <g fill="#f2c14e"><circle cx="196" cy="246" r="4"/><circle cx="444" cy="246" r="4"/></g>
  </g>
</svg>
