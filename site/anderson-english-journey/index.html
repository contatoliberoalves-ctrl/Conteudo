<title>English Journey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a plataforma é um passaporte de viagem. Unidades são destinos ilustrados, lições são paradas numa
   estrada desenhada sobre um mapa, conquistas viram carimbos. Azul-marinho do professor na capa do passaporte,
   papel creme nas páginas, vermelho e dourado como tinta de carimbo. Visual fixo (claro). */
:root {
  --navy: #0B2347; --navy-2: #143A6E; --navy-3: #1E4E8C; --red: #D7263D; --red-2: #B51C31; --gold: #E3A92F; --gold-2: #C98D17; --gold-3: #F6D27A;
  --paper: #FBF8F1; --paper-2: #F3EEE2; --paper-3: #EAE3D3; --card: #FFFFFF; --ink: #13213A; --muted: #637089; --line: #E3E1DA; --line-2: #EEECE6;
  --ok: #1E9B68; --ok-2: #157A51; --ok-bg: #E2F5EC; --bad: #D7263D; --bad-bg: #FCE8EB; --sky: #E7EEF9; --roxo: #6C4BD8; --roxo-2: #5236B5; --verde: #1E9B68;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mola: cubic-bezier(.34, 1.56, .64, 1); --suave: cubic-bezier(.2, .7, .2, 1);
  --sombra: 0 1px 0 var(--line-2), 0 14px 34px -22px rgba(19,33,58,.35);
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 90; background: var(--paper) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
img { max-width: 100%; display: block }
h1, h2, h3, h4, p { margin: 0 }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1.08; text-wrap: balance }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px }
.olho { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--red) }
.mudo { color: var(--muted) }
.num { font-variant-numeric: tabular-nums }

/* estrutura */
.app { display: grid; min-height: 100% }
@media (min-width: 1000px) { .app { grid-template-columns: 250px 1fr } }
.lado { display: none }
@media (min-width: 1000px) { .lado { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 22px 16px; background: var(--navy); color: #fff; overflow: auto } }
.marca { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px }
.selo-marca { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 16px; background: var(--red); color: #fff; box-shadow: inset 0 0 0 3px var(--navy), 0 0 0 2px var(--red); flex: none }
.marca b { display: block; font-size: 15px; line-height: 1.2 }
.marca small { font-size: 10px; letter-spacing: .14em; color: #9FB3D3; font-weight: 700 }
.nav { display: grid; gap: 3px }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; color: #C2CEE3; text-align: left; padding: 11px 12px; border-radius: 12px; font-weight: 600; font-size: 14.5px; transition: background .2s, color .2s }
.nav button svg { width: 22px; height: 22px; flex: none }
.nav button:hover { background: #ffffff12; color: #fff }
.nav button[aria-current="page"] { background: #fff; color: var(--navy) }
.nav-rot { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #7F93B6; padding: 14px 12px 6px }
.lado .prof { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 14px 8px 4px; border-top: 1px solid #ffffff1c }
.lado .prof img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover }
.lado .prof small { display: block; color: #9FB3D3; font-size: 12px }
.modo { display: flex; background: #ffffff14; border-radius: 12px; padding: 4px; margin: 8px 0 }
.modo button { flex: 1; border: 0; background: none; color: #C2CEE3; padding: 8px; border-radius: 9px; font-weight: 700; font-size: 12.5px }
.modo button[aria-pressed="true"] { background: #fff; color: var(--navy) }
.corpo { min-width: 0; display: flex; flex-direction: column }
.barra-topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: rgba(251,248,241,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line) }
@media (min-width: 1000px) { .barra-topo { padding-inline: 32px } }
.barra-topo .tit { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; min-width: 0 }
.barra-topo .tit .selo-marca { width: 34px; height: 34px; font-size: 12px }
@media (min-width: 1000px) { .barra-topo .tit .selo-marca { display: none } }
.stats { display: flex; gap: 6px; align-items: center }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 14px; white-space: nowrap }
.stat svg { width: 20px; height: 20px }
.stat.fogo { color: #E2621B }
.stat.xp { color: var(--navy-3) }
.stat .anel { width: 22px; height: 22px }
.fogo svg, .chama-anim { animation: chama 1.6s ease-in-out infinite; transform-origin: 50% 90% }
@keyframes chama { 0%, 100% { transform: scale(1) rotate(-2deg) } 50% { transform: scale(1.08, 1.12) rotate(2deg) } }
.trocar-modo { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card) }
.trocar-modo button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; color: var(--muted) }
.trocar-modo button[aria-pressed="true"] { background: var(--navy); color: #fff }
@media (min-width: 1000px) { .trocar-modo { display: none } }
@media (max-width: 520px) { .stat .rot-l { display: none } .barra-topo .tit { display: none } .stat { padding: 5px 9px; font-size: 13px } .stats { gap: 4px } .trocar-modo button { padding: 5px 9px } }
@media (max-width: 360px) { .stat.xp { display: none } }
main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); width: 100%; max-width: 1260px; margin: 0 auto }
@media (min-width: 1000px) { main { padding: 32px 32px 64px } }
.vista { display: grid; gap: 22px; animation: entra .5s var(--suave) }
.vista > *, #treino-corpo { min-width: 0 }
.mapa, .destino { overflow-x: clip }
.pop { width: min(280px, 80vw) }
@media (max-width: 600px) { .pino .fala-p { display: none } .parada { transform: translateX(calc(var(--x) * .6)) } .dia-b .medalha { width: 42px; height: 42px } .dia-b .medalha b { font-size: 14px } .dias { gap: 2px } .dia-b small { font-size: 10px } .tarefa-c { grid-template-columns: 46px 1fr; } .tarefa-c > div:last-child { grid-column: 1 / -1; justify-content: flex-end } .tarefa-c .ti { width: 46px; height: 46px } }
@keyframes entra { from { transform: translateY(12px); opacity: .3 } }
.cab { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px }
.cab h1 { font-size: clamp(28px, 3.6vw, 40px) }
.cab p { color: var(--muted); margin-top: 6px; max-width: 62ch }
.abas-baixo { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border-top: 1px solid var(--line) }
.abas-baixo button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 6px 8px; border-radius: 12px; min-width: 56px; min-height: 48px }
.abas-baixo button svg { width: 24px; height: 24px; transition: transform .3s var(--mola) }
.abas-baixo button[aria-current="page"] { color: var(--navy); background: var(--sky) }
.abas-baixo button[aria-current="page"] svg { transform: translateY(-2px) scale(1.1) }
@media (min-width: 1000px) { .abas-baixo { display: none } }

/* blocos comuns */
.grade { display: grid; gap: 16px }
@media (min-width: 760px) { .g2 { grid-template-columns: 1fr 1fr } .g3 { grid-template-columns: repeat(3, 1fr) } }
@media (min-width: 1100px) { .g-hoje { grid-template-columns: 1.55fr 1fr } }
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; min-width: 0; box-shadow: var(--sombra) }
.cartao h3 { font-size: 20px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 14px; border: 0; font-weight: 800; font-size: 14.5px; letter-spacing: .01em; text-decoration: none; position: relative; transition: transform .15s, box-shadow .15s, filter .2s }
.btn svg { width: 18px; height: 18px }
.btn.prim { background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-2) }
.btn.azul { background: var(--navy-3); color: #fff; box-shadow: 0 4px 0 var(--navy) }
.btn.ouro { background: var(--gold); color: var(--navy); box-shadow: 0 4px 0 var(--gold-2) }
.btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 var(--ok-2) }
.btn.roxo { background: var(--roxo); color: #fff; box-shadow: 0 4px 0 var(--roxo-2) }
.btn.branco { background: #fff; color: var(--navy); box-shadow: 0 4px 0 #C9D3E6 }
.btn.linha { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line) }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 transparent }
.btn:hover:not(:disabled) { filter: brightness(1.05) }
.btn:disabled { background: #E6E3DB; color: #A39E92; box-shadow: 0 4px 0 #D6D2C8; cursor: not-allowed }
.btn.peq { min-height: 38px; padding: 0 14px; font-size: 13px; border-radius: 11px }
.etq { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--paper-2); color: var(--muted) }
.etq svg { width: 14px; height: 14px }
.etq.ouro { background: #FCF0D3; color: #8C5F07 }
.etq.ok { background: var(--ok-bg); color: var(--ok-2) }
.etq.verm { background: var(--bad-bg); color: var(--red-2) }
.etq.azul { background: var(--sky); color: var(--navy-3) }
.etq.roxo { background: #EEE8FF; color: var(--roxo-2) }
.barra-p { height: 10px; border-radius: 10px; background: var(--paper-2); overflow: hidden }
.barra-p i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--gold), var(--red)); transition: width 1s var(--suave); position: relative }
.barra-p i::after { content: ""; position: absolute; inset: 2px 6px auto; height: 3px; border-radius: 3px; background: rgba(255,255,255,.45) }
.mini { display: flex; justify-content: space-between; align-items: center; gap: 10px }

/* velocidade do áudio */
.vel { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line) }
.vel button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 800; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; min-height: 32px; transition: background .2s, color .2s }
.vel button svg { width: 15px; height: 15px }
.vel button[aria-pressed="true"] { background: var(--navy); color: #fff }
.escuro .vel { background: #ffffff18; border-color: #ffffff22 }
.escuro .vel button { color: #C6D3EA }
.escuro .vel button[aria-pressed="true"] { background: #fff; color: var(--navy) }

/* hoje */
.missao { position: relative; overflow: hidden; border-radius: 26px; padding: clamp(22px, 3vw, 32px); background: var(--navy); color: #fff; display: grid; gap: 18px; isolation: isolate }
.missao::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(500px 300px at 85% 0%, #1E4E8C 0%, transparent 70%), repeating-linear-gradient(135deg, #ffffff06 0 2px, transparent 2px 14px) }
.missao .aviao { position: absolute; right: -10px; top: 22px; width: 180px; opacity: .9; z-index: -1; animation: voa 7s ease-in-out infinite }
@keyframes voa { 50% { transform: translate(-14px, -8px) rotate(-3deg) } }
.missao h2 { font-size: clamp(26px, 3vw, 36px); max-width: 18ch }
.missao p { color: #C6D3EA; max-width: 52ch }
.missao .infos { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: #C6D3EA }
.missao .infos b { display: block; color: #fff; font-size: 14px }
.meta-dia { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center }
.anel-grande { width: 108px; height: 108px; position: relative }
.anel-grande svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.anel-grande circle { fill: none; stroke-width: 10 }
.anel-grande .fundo { stroke: var(--paper-2) }
.anel-grande .frente { stroke: url(#grad-anel); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--suave) }
.anel-grande div { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1 }
.anel-grande b { font-size: 24px; font-weight: 800 }
.anel-grande small { font-size: 11px; color: var(--muted); display: block }
.semana-dots { display: flex; gap: 6px; margin-top: 12px }
.semana-dots span { width: 34px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--paper-2); color: var(--muted); position: relative }
.semana-dots span.feito { background: #FFE8D6; color: #C2510F }
.semana-dots span.hoje { background: var(--navy); color: #fff }
.recado { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start }
.recado img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold) }
.balao-recado { position: relative; background: var(--paper-2); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-family: var(--display); font-size: 17px; line-height: 1.35; font-weight: 600 }
.palavra-dia { perspective: 900px; cursor: pointer; min-height: 170px; border: 0; padding: 0; background: none; text-align: left; width: 100% }
.palavra-dia .gira { position: relative; width: 100%; height: 100%; min-height: 170px; transform-style: preserve-3d; transition: transform .7s var(--mola) }
.palavra-dia.virada .gira { transform: rotateY(180deg) }
.palavra-dia .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 22px; padding: 20px; display: grid; align-content: space-between }
.palavra-dia .f1 { background: var(--gold); color: var(--navy) }
.palavra-dia .f2 { background: var(--navy); color: #fff; transform: rotateY(180deg) }
.palavra-dia strong { font-family: var(--display); font-size: 38px; line-height: 1 }
.contagem { display: flex; gap: 8px }
.contagem div { flex: 1; text-align: center; background: var(--paper-2); border-radius: 12px; padding: 8px 4px; color: var(--ink) }
.contagem b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums }
.contagem small { font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em }

/* ===== JORNADA ===== */
.jornada { display: grid; gap: 22px; align-items: start }
@media (min-width: 1100px) { .jornada { grid-template-columns: minmax(0, 1fr) 330px } .jornada .coluna { position: sticky; top: 86px } }
.coluna { display: grid; gap: 16px }
.passaporte { position: relative; overflow: hidden; border-radius: 22px; padding: 20px; color: #F4E7C5; background: radial-gradient(120% 90% at 100% 0%, #1E4E8C 0%, transparent 55%), linear-gradient(160deg, #0F2C59, #0B2347 60%, #081A36); box-shadow: 0 18px 40px -22px rgba(11,35,71,.8), inset 0 0 0 1px #ffffff14; display: grid; gap: 14px }
.passaporte::before { content: ""; position: absolute; inset: 8px; border: 1px dashed #E3A92F55; border-radius: 16px; pointer-events: none }
.passaporte .emblema { position: absolute; right: -24px; top: -24px; width: 140px; opacity: .22; animation: gira-lento 60s linear infinite }
@keyframes gira-lento { to { transform: rotate(360deg) } }
.passaporte .topo-p { display: flex; gap: 12px; align-items: center }
.passaporte .foto-p { width: 54px; height: 54px; border-radius: 14px; background: var(--red); display: grid; place-items: center; font-family: var(--display); font-size: 26px; font-weight: 800; color: #fff; box-shadow: 0 0 0 3px #E3A92F66 }
.passaporte small { font-size: 10px; letter-spacing: .18em; font-weight: 800; color: #E3A92F }
.passaporte b.nome { display: block; font-family: var(--display); font-size: 21px; color: #fff }
.passaporte .linha-p { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center }
.passaporte .linha-p div { background: #ffffff10; border-radius: 12px; padding: 8px 4px }
.passaporte .linha-p b { display: block; font-size: 19px; color: #fff; font-variant-numeric: tabular-nums }
.passaporte .linha-p span { font-size: 10.5px; color: #C6D3EA; font-weight: 700 }
.passaporte .barra-p { background: #ffffff1a; height: 8px }
.passaporte .mrz { font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 10px; letter-spacing: .12em; color: #ffffff55; overflow: hidden; white-space: nowrap }
.missoes { display: grid; gap: 12px }
.missao-d { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center }
.missao-d .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: #fff }
.missao-d .ico svg { width: 22px; height: 22px }
.missao-d b { font-size: 13.5px; display: flex; justify-content: space-between; gap: 6px }
.missao-d .barra-p { height: 8px; margin-top: 5px }
.missao-d .barra-p i { background: var(--c) }
.missao-d.ok b span { color: var(--ok-2) }
.bau-missoes { display: flex; gap: 12px; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px }
.bau-missoes svg { width: 46px; height: 46px; flex: none }
.bau-missoes.pronto svg { animation: balanca 1.2s ease-in-out infinite }
@keyframes balanca { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-8deg) } 75% { transform: rotate(8deg) } }

.destino { position: relative; border-radius: 28px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--sombra) }
.cenario { position: relative; height: clamp(170px, 22vw, 230px); border-radius: 28px 28px 0 0; overflow: hidden; isolation: isolate }
.cenario svg.paisagem { position: absolute; inset: 0; width: 100%; height: 100% }
.cenario .info { position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 3; display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap }
.cenario .placa { background: #fff; border-radius: 16px; padding: 10px 14px; box-shadow: 0 10px 24px -12px rgba(0,0,0,.45); max-width: 360px }
.cenario .placa h2 { font-size: clamp(19px, 2.2vw, 25px) }
.cenario .placa p { font-size: 12.5px; color: var(--muted) }
.prog-u { width: 64px; height: 64px; border-radius: 50%; background: #fff; display: grid; place-items: center; position: relative; box-shadow: 0 10px 24px -12px rgba(0,0,0,.45); flex: none }
.prog-u svg { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); transform: rotate(-90deg) }
.prog-u b { font-size: 14px; font-weight: 800; position: relative }
.nuvem { animation: nuvem var(--t, 40s) linear infinite }
@keyframes nuvem { from { transform: translateX(-160px) } to { transform: translateX(900px) } }
.onibus { animation: onibus 16s linear infinite }
@keyframes onibus { from { transform: translateX(-140px) } to { transform: translateX(920px) } }
.roda-gigante { transform-origin: 640px 92px; animation: gira-lento 50s linear infinite }
.fumaca circle { animation: fumaca 3.5s ease-out infinite; transform-box: fill-box; transform-origin: center }
.fumaca circle:nth-child(2) { animation-delay: 1.1s } .fumaca circle:nth-child(3) { animation-delay: 2.2s }
@keyframes fumaca { 0% { transform: translate(0, 0) scale(.6); opacity: .8 } 100% { transform: translate(14px, -46px) scale(1.6); opacity: 0 } }
.bandeira-anim { transform-box: fill-box; transform-origin: left center; animation: tremula 1.4s ease-in-out infinite }
@keyframes tremula { 50% { transform: skewY(-8deg) scaleX(.92) } }
.aviao-c { animation: aviao-c 22s linear infinite }
@keyframes aviao-c { from { transform: translate(-80px, 40px) } to { transform: translate(900px, -20px) } }
.janela-luz { animation: piscaj 4s ease-in-out infinite }
@keyframes piscaj { 50% { opacity: .55 } }

.mapa { position: relative; padding: 40px 12px 30px; border-radius: 0 0 28px 28px; background:
  radial-gradient(circle at 20% 30%, transparent 0 38px, #E8E0CC55 39px 40px, transparent 41px 58px, #E8E0CC55 59px 60px, transparent 61px),
  radial-gradient(circle at 82% 70%, transparent 0 48px, #E8E0CC55 49px 50px, transparent 51px 72px, #E8E0CC55 73px 74px, transparent 75px),
  radial-gradient(#E0D8C4 1px, transparent 1.4px) 0 0 / 22px 22px, #FBF7EE }
.mapa .trilha { position: relative; margin: 0 auto; max-width: 520px }
.mapa svg.estrada { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1 }
.estrada .borda { fill: none; stroke: #E2D8C1; stroke-width: 30; stroke-linecap: round }
.estrada .base { fill: none; stroke: #F1EBDD; stroke-width: 22; stroke-linecap: round }
.estrada .feita { fill: none; stroke: var(--gold-3); stroke-width: 22; stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset 1.6s var(--suave) }
.estrada.desenhada .feita { stroke-dashoffset: 0 }
.estrada .meio { fill: none; stroke: #fff; stroke-width: 2.5; stroke-dasharray: 8 12; stroke-linecap: round; opacity: .9 }
.parada { position: relative; z-index: 2; width: 120px; margin: 0 auto 34px; transform: translateX(var(--x)); display: grid; justify-items: center; gap: 6px }
.moeda { position: relative; width: 96px; height: 96px; border-radius: 50%; border: 0; padding: 0; background: none; display: grid; place-items: center }
.moeda .aro { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg) }
.moeda .face { width: 76px; height: 70px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 35% 30%, #ffffff40, transparent 45%), var(--cor, var(--navy-3)); box-shadow: 0 7px 0 var(--sombra-c, var(--navy)), inset 0 -4px 0 #00000018; transition: transform .2s var(--mola) }
.moeda .face svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 0 #00000022) }
.moeda:hover:not(:disabled) .face { transform: translateY(-4px) }
.moeda:active:not(:disabled) .face { transform: translateY(5px); box-shadow: 0 2px 0 var(--sombra-c, var(--navy)) }
.moeda.feito { --cor: var(--gold); --sombra-c: var(--gold-2) }
.moeda.feito .face { color: var(--navy) }
.moeda.trancado { cursor: not-allowed; --cor: #E3E0D8; --sombra-c: #CBC7BC }
.moeda.trancado .face { color: #A7A194 }
.moeda.bau.atual .face, .moeda.bau.feito .face { --cor: #8E5A2B; --sombra-c: #6A3F17; color: #F6D27A }
.moeda.check:not(.trancado):not(.feito) { --cor: var(--red); --sombra-c: var(--red-2) }
.moeda.atual::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 4px solid var(--cor, var(--navy-3)); opacity: .35; animation: pulsa 1.8s ease-out infinite }
@keyframes pulsa { 0% { transform: scale(.9); opacity: .5 } 100% { transform: scale(1.35); opacity: 0 } }
.parada .rot { font-size: 12px; font-weight: 800; text-align: center; color: var(--ink); background: #ffffffd9; padding: 3px 8px; border-radius: 8px; max-width: 150px; line-height: 1.25 }
.parada .rot.tr { color: #A7A194 }
.pino { position: absolute; z-index: 4; left: -18px; top: -22px; display: grid; justify-items: center; animation: quica-p 1.4s ease-in-out infinite; pointer-events: none }
@keyframes quica-p { 50% { transform: translateY(-7px) } }
.pino .cabeca { width: 44px; height: 44px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 19px; box-shadow: 0 0 0 3px #fff, 0 8px 16px -6px rgba(0,0,0,.4) }
.pino::after { content: ""; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid #fff; margin-top: 2px }
.pino .fala-p { position: absolute; right: 50px; top: 8px; white-space: nowrap; background: var(--navy); color: #fff; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 10px }
@keyframes quica { 50% { transform: translate(-50%, -7px) } }
.adesivo { position: absolute; z-index: 1; width: 64px; height: 64px; filter: drop-shadow(0 6px 8px rgba(60,40,10,.18)); animation: boia 5s ease-in-out infinite }
.adesivo:nth-of-type(even) { animation-delay: -2.5s }
@keyframes boia { 50% { transform: translateY(-6px) rotate(3deg) } }
.pop { position: absolute; z-index: 6; left: 50%; top: 110px; width: 280px; transform: translateX(-50%); background: var(--navy); color: #fff; border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 20px 40px -12px rgba(11,35,71,.5); animation: popa .35s var(--mola) }
.pop::before { content: ""; position: absolute; left: 50%; top: -7px; width: 14px; height: 14px; background: var(--navy); transform: translateX(-50%) rotate(45deg) }
@keyframes popa { from { transform: translateX(-50%) scale(.85); opacity: 0 } }
.pop h4 { font-size: 17px }
.pop p { font-size: 13px; color: #C6D3EA }
.pop .btn { width: 100% }
.pop .coroas { display: flex; gap: 4px }
.pop .coroas svg { width: 18px; height: 18px; color: #ffffff30 }
.pop .coroas svg.on { color: var(--gold) }
.travada { position: absolute; inset: 0; z-index: 5; border-radius: 28px; background: linear-gradient(180deg, transparent 0 150px, #FBF8F1d9 230px); display: grid; place-items: end center; padding-bottom: 40px; pointer-events: none }
.travada div { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 14px; box-shadow: var(--sombra) }

.voo { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; font-weight: 700; padding: 0 12px }
.voo::before, .voo::after { content: ""; flex: 1; border-top: 2px dashed var(--line) }
.voo svg { width: 28px; height: 28px; color: var(--navy-3); animation: voa 4s ease-in-out infinite }

/* carimbos */
.carimbos { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px }
.carimbo { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center; padding: 14px; position: relative; color: var(--cor, var(--red)); border: 3px solid currentColor; box-shadow: inset 0 0 0 5px #fff, inset 0 0 0 7px currentColor; background: #fff; transform: rotate(var(--r, -8deg)); transition: transform .4s var(--mola) }
.carimbo:hover { transform: rotate(0) scale(1.05) }
.carimbo b { display: block; font-family: var(--display); font-size: 22px; line-height: 1 }
.carimbo small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; line-height: 1.25 }
.carimbo.trancado { color: #C9C4B8; background: var(--paper); border-style: dashed; box-shadow: none }
.carimbo.novo { animation: bate .7s var(--mola) both }
@keyframes bate { 0% { transform: scale(2.2) rotate(10deg); opacity: 0 } 60% { transform: scale(.92) rotate(-10deg); opacity: 1 } 100% { transform: scale(1) rotate(-8deg) } }
.mini-carimbos { display: flex; gap: 6px; flex-wrap: wrap }
.mini-carimbos span { width: 34px; height: 34px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-family: var(--display); font-size: 11px; font-weight: 800; background: #ffffff10; transform: rotate(-10deg) }

/* ===== LIÇÃO ===== */
.licao { position: fixed; inset: 0; z-index: 100; background: #fff; display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); animation: sobe-l .45s var(--suave) }
@keyframes sobe-l { from { transform: translateY(30px); opacity: 0 } }
.licao-topo { display: flex; align-items: center; gap: 14px; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); max-width: 980px; width: 100%; margin: 0 auto }
.fechar { width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none }
.fechar:hover { background: var(--paper-2) }
.fechar svg { width: 22px; height: 22px }
.licao .barra-p { flex: 1; height: 16px }
.licao .barra-p i { background: linear-gradient(90deg, var(--ok), #38C98A) }
.combo { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; color: #E2621B; font-size: 14px; min-width: 60px; justify-content: flex-end }
.combo.ativo { animation: combo .5s var(--mola) }
@keyframes combo { 40% { transform: scale(1.4) } }
.licao-meio { overflow: auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 30px max(18px, env(safe-area-inset-left, 0px)) }
.ex { max-width: 700px; margin: 0 auto; display: grid; gap: 22px; animation: ex-in .45s var(--suave) }
@keyframes ex-in { from { transform: translateX(40px); opacity: 0 } }
.ex .tipo { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--navy-3); display: flex; gap: 8px; align-items: center }
.ex .tipo.rev { color: #C2510F }
.ex h2 { font-size: clamp(24px, 3vw, 32px) }
.cena { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: end }
.cena img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold) }
.fala { position: relative; border: 2px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 14px 16px; font-size: 18px; font-weight: 600 }
.player { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.ouvir { width: 64px; height: 64px; border-radius: 20px; border: 0; background: var(--navy-3); color: #fff; display: grid; place-items: center; box-shadow: 0 5px 0 var(--navy); flex: none; position: relative }
.ouvir svg { width: 30px; height: 30px }
.ouvir.tocando::after { content: ""; position: absolute; inset: -6px; border-radius: 24px; border: 3px solid var(--navy-3); animation: pulsa 1.2s ease-out infinite }
.ondas-som { display: flex; gap: 3px; align-items: center; height: 30px }
.ondas-som i { width: 4px; border-radius: 4px; background: var(--navy-3); height: 8px; opacity: .35 }
.tocando-g .ondas-som i { animation: onda .9s ease-in-out infinite; opacity: 1 }
.ondas-som i:nth-child(2) { animation-delay: .1s } .ondas-som i:nth-child(3) { animation-delay: .2s } .ondas-som i:nth-child(4) { animation-delay: .3s } .ondas-som i:nth-child(5) { animation-delay: .4s } .ondas-som i:nth-child(6) { animation-delay: .5s }
@keyframes onda { 50% { height: 28px } }
.opcoes { display: grid; gap: 10px }
.opc { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 2px solid var(--line); border-radius: 16px; background: #fff; padding: 14px 16px; font-size: 16.5px; font-weight: 600; box-shadow: 0 4px 0 var(--line); transition: transform .12s, border-color .15s, background .15s }
.opc kbd { width: 28px; height: 28px; flex: none; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; font: 700 12.5px var(--ui); color: var(--muted) }
.opc:hover:not(:disabled) { background: var(--paper) }
.opc[aria-pressed="true"] { border-color: var(--navy-3); background: var(--sky); box-shadow: 0 4px 0 #9FB8E0 }
.opc[aria-pressed="true"] kbd { border-color: var(--navy-3); color: var(--navy-3) }
.opc.certa { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 4px 0 #9ED8BD }
.opc.errada { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 4px 0 #F1A9B3; animation: treme .4s }
@keyframes treme { 20%, 60% { transform: translateX(-6px) } 40%, 80% { transform: translateX(6px) } }
.linha-resp { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 8px 0 }

.banco { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 60px }
.ficha { border: 2px solid var(--line); background: #fff; border-radius: 13px; padding: 9px 14px; font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 var(--line); transition: transform .12s }
.ficha:active { transform: translateY(3px); box-shadow: none }
.ficha.vazia { color: transparent; background: var(--paper-2); border-color: var(--paper-2); box-shadow: none; pointer-events: none }
.ficha.voando { position: fixed; z-index: 200; margin: 0; pointer-events: none; transition: left .32s var(--suave), top .32s var(--suave) }
.pares { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.pares .col { display: grid; gap: 10px; align-content: start }
.par { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 13px 12px; font-weight: 600; font-size: 15.5px; box-shadow: 0 4px 0 var(--line); transition: transform .15s, opacity .4s, border-color .15s, background .15s; min-height: 52px }
.par[aria-pressed="true"] { border-color: var(--navy-3); background: var(--sky) }
.par.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok-2); animation: ok-pop .45s var(--mola) }
.par.sumiu { opacity: .35; pointer-events: none; box-shadow: none }
.par.erro { border-color: var(--bad); background: var(--bad-bg); animation: treme .35s }
@keyframes ok-pop { 40% { transform: scale(1.06) } }
.frase-lacuna { font-size: 21px; line-height: 2; font-weight: 600 }
.lacuna { display: inline-block; min-width: 110px; border-bottom: 3px solid var(--navy-3); text-align: center; color: var(--navy-3); padding: 0 6px; transition: background .2s }
.lacuna.cheia { background: var(--sky); border-radius: 6px 6px 0 0 }
.entrada { width: 100%; min-height: 120px; border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 18px; resize: none; background: var(--paper) }
.entrada:focus { outline: none; border-color: var(--navy-3); background: #fff }
.erro-frase { display: flex; flex-wrap: wrap; gap: 6px; font-size: 21px; font-weight: 600 }
.erro-frase button { border: 0; background: none; padding: 4px 6px; border-radius: 8px; border-bottom: 2px dashed var(--line) }
.erro-frase button:hover { background: var(--paper-2) }
.erro-frase button[aria-pressed="true"] { background: var(--bad-bg); color: var(--red-2); border-bottom-color: var(--red) }
.leitura { display: grid; gap: 14px }
.leitura p { font-family: var(--display); font-weight: 600; font-size: 19.5px; line-height: 1.75 }
.leitura .w { border-radius: 5px; transition: background .15s, color .15s; padding: 0 1px }
.leitura .w.lendo { background: var(--navy-3); color: #fff }
.vocab { border: 0; background: #FCF0D3; border-bottom: 2px solid var(--gold); padding: 0 3px; border-radius: 4px 4px 0 0; font: inherit; cursor: help; position: relative }
.vocab.lendo { background: var(--navy-3); color: #fff; border-color: var(--navy) }
.vocab .dica { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; background: var(--navy); color: #fff; font: 700 13px var(--ui); padding: 6px 10px; border-radius: 9px; pointer-events: none; animation: popa .3s var(--mola); z-index: 3 }
.leitura-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: 18px; background: var(--paper-2); font-size: 14px }
.capa-texto { border-radius: 20px; padding: 18px 20px; color: #fff; background: var(--c, var(--navy-3)); display: flex; gap: 14px; align-items: center; position: relative; overflow: hidden }
.capa-texto::after { content: attr(data-n); position: absolute; right: 12px; bottom: -22px; font-family: var(--display); font-size: 90px; font-weight: 900; opacity: .12 }
.capa-texto svg { width: 46px; height: 46px; flex: none }
.chat { display: grid; gap: 10px }
.msg { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: end; max-width: 85%; animation: msg .45s var(--mola) both }
.msg.b { margin-left: auto; grid-template-columns: 1fr 40px }
.msg.b .av { order: 2 }
@keyframes msg { from { transform: translateY(10px) scale(.96); opacity: 0 } }
.msg .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--c) }
.msg .bal { border-radius: 18px 18px 18px 4px; background: var(--paper-2); padding: 10px 14px; font-size: 16.5px; font-weight: 600; cursor: pointer; border: 2px solid transparent; text-align: left }
.msg.b .bal { border-radius: 18px 18px 4px 18px; background: var(--sky) }
.msg .bal small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.msg.falando .bal { border-color: var(--navy-3) }
.msg.oculta { display: none }
.licao-baixo { border-top: 2px solid var(--line-2); padding: 16px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); transition: background .25s }
.licao-baixo .dentro { max-width: 980px; margin: 0 auto; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.licao-baixo .btn { min-width: 160px; min-height: 52px }
.licao-baixo.certo { background: var(--ok-bg); border-color: transparent }
.licao-baixo.errado { background: var(--bad-bg); border-color: transparent }
.retorno { display: flex; gap: 14px; align-items: flex-start; flex: 1; min-width: 240px; animation: ex-in .35s var(--suave) }
.retorno .ic { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none }
.retorno .ic svg { width: 28px; height: 28px }
.certo .retorno { color: var(--ok-2) }
.errado .retorno { color: var(--red-2) }
.retorno b { font-size: 20px; font-weight: 800; display: block }
.retorno p { font-size: 14.5px; color: var(--ink) }
.retorno .porque { margin-top: 6px; font-size: 13.5px; color: var(--ink); background: #ffffffa8; border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start }
.retorno .porque img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none }
.pular { border: 0; background: none; color: var(--muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; padding: 12px }
.resultado { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; justify-items: center; text-align: center; padding-top: 20px }
.resultado h2 { font-size: clamp(30px, 4vw, 42px) }
.trofeu { width: 150px; height: 150px; animation: trofeu .9s var(--mola) both }
@keyframes trofeu { from { transform: scale(.3) rotate(-20deg); opacity: 0 } }
.res-cartoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100% }
.res-c { border-radius: 16px; border: 2px solid var(--c); overflow: hidden; animation: ex-in .5s var(--suave) both }
.res-c:nth-child(2) { animation-delay: .12s } .res-c:nth-child(3) { animation-delay: .24s }
.res-c small { display: block; background: var(--c); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 5px }

.aprendidas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
canvas.confete { position: fixed; inset: 0; z-index: 300; pointer-events: none; width: 100%; height: 100% }
.xp-voa { position: fixed; z-index: 250; font-weight: 800; color: var(--gold-2); font-size: 18px; pointer-events: none; animation: xpvoa 1s var(--suave) forwards }
@keyframes xpvoa { to { transform: translateY(-60px); opacity: 0 } }

/* ===== TREINO ===== */
.subabas { display: inline-flex; gap: 4px; padding: 5px; border-radius: 18px; background: #fff; border: 1px solid var(--line); box-shadow: var(--sombra); max-width: 100%; overflow-x: auto }
.subabas button { border: 0; background: none; border-radius: 13px; padding: 10px 16px; font-weight: 800; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; min-height: 44px; transition: background .25s, color .25s }

.subabas button[aria-selected="true"] { background: var(--navy); color: #fff }
.trilhas { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) }
.trilha-c { position: relative; border-radius: 26px; overflow: hidden; border: 0; padding: 0; text-align: left; background: #fff; box-shadow: var(--sombra); display: grid; transition: transform .35s var(--mola), box-shadow .3s }
.trilha-c:hover { transform: translateY(-6px) rotate(-.5deg); box-shadow: 0 24px 40px -24px rgba(19,33,58,.5) }
.trilha-c .capa { position: relative; height: 150px; background: var(--c); overflow: hidden; display: grid; place-items: center; isolation: isolate }
.trilha-c .capa::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 20% 20%, #ffffff30 0 30px, transparent 31px), radial-gradient(circle at 85% 80%, #00000022 0 60px, transparent 61px), repeating-linear-gradient(-45deg, #ffffff10 0 8px, transparent 8px 18px) }
.trilha-c .capa svg.grande { width: 84px; height: 84px; color: #fff; filter: drop-shadow(0 8px 10px #00000030); transition: transform .5s var(--mola) }
.trilha-c:hover .capa svg.grande { transform: scale(1.12) rotate(-6deg) }

function decide(r) {

POS['p-alunos'] = () => { $$('[data-comoaluno]').forEach(b => b.onclick = () => trocaModo('aluno')); $$('[data-lembrete]').forEach(b => b.onclick = () => { b.textContent = 'Lembrete preparado'; b.disabled = true; toast('Nesta demonstração o lembrete não é enviado de verdade.'); }); };
const CORR = [{ id: 'marina', n: 'Marina Costa', t: 'My last weekend', txt: 'Last weekend I [visit] my family. We cooked dinner and [watch] a movie. It was very fun.', com: 'Ótimo texto, Marina! Só atenção ao passado: depois de “last weekend”, os verbos vão para o simple past (visited, watched).', notas: { visit: 'visited · “last weekend” pede passado', watch: 'watched · também no passado' } }, { id: 'lucas', n: 'Lucas Rocha', t: 'My house', txt: 'There [is] two bedrooms and a small kitchen. My desk is near the window.', com: 'Boa descrição, Lucas! Com plural, use “there are”: there are two bedrooms.', notas: { is: 'are · “two bedrooms” é plural' } }];
function pCorr() {
  return `<div class="cab"><div><span class="olho">Devolutivas</span><h1>Correções</h1><p>Toque nos trechos marcados para ver a sugestão, escreva o comentário e devolva ao aluno.</p></div></div>
  ${CORR.map(c => { const feito = E.corrigidos[c.id]; return `<article class="cartao" style="display:grid;gap:14px;${feito ? 'opacity:.7' : ''}"><div class="mini"><div><span class="olho" style="color:var(--navy-3)">${c.n}</span><h3>${c.t}</h3></div><span class="etq ${feito ? 'ok' : 'verm'}">${feito ? 'Devolvido' : 'Aguardando'}</span></div><p class="texto-corr">${esc(c.txt).replace(/\[(\w+)\]/g, (_, w) => `<mark tabindex="0" data-nota="${esc(c.notas[w])}">${w}</mark>`)}</p><p class="mudo" id="nota-${c.id}" style="font-size:14px;min-height:20px"></p>${feito ? `<p><b>Seu comentário:</b> ${esc(feito)}</p>` : `<label class="campo">Comentário para o aluno<textarea id="com-${c.id}">${esc(c.com)}</textarea></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok peq" type="button" data-devolver="${c.id}">Devolver com nota 8</button><button class="btn linha peq" type="button" data-refazer="${c.id}">Pedir para refazer</button></div>`}</article>`; }).join('')}`;
}
POS['p-corr'] = () => {
  $$('mark[data-nota]').forEach(m => { const f = () => { m.closest('.cartao').querySelector('[id^=nota-]').innerHTML = `<b style="color:var(--ok-2)">Sugestão:</b> ${esc(m.dataset.nota)}`; }; m.onclick = f; m.onkeydown = e => e.key === 'Enter' && f(); });
  $$('[data-devolver],[data-refazer]').forEach(b => b.onclick = () => { const id = b.dataset.devolver || b.dataset.refazer; E.corrigidos[id] = $(`#com-${id}`).value + (b.dataset.refazer ? ' (pedido para refazer)' : ''); salva(); render(); toast('Devolutiva salva nesta demonstração.'); });
};
function pCriar() {
  return `<div class="cab"><div><span class="olho">Produção de conteúdo</span><h1>Criar exercício</h1><p>Escreva à esquerda e veja à direita como o aluno vai receber. Teste antes de publicar.</p></div></div>
  <div class="grade g2" style="align-items:start">
    <form class="cartao" id="f-criar" style="display:grid;gap:14px">
      <label class="campo">Tipo<select id="c-tipo"><option value="escolha">Escolha a resposta</option><option value="montar">Monte a frase</option><option value="lacuna">Complete a frase</option></select></label>
      <label class="campo">Enunciado ou frase em português<input id="c-q" value="Como se diz “Eu estudo todos os dias”?"></label>
      <label class="campo">Resposta certa<input id="c-a" value="I study every day."></label>
      <label class="campo">Alternativas erradas (separe com ;)<input id="c-e" value="I studies every day.; I am study every day."></label>
      <label class="campo">Por quê (aparece quando o aluno erra)<textarea id="c-p">Com “I”, o verbo fica na forma base: study. “Studies” é para he, she e it.</textarea></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn azul" type="button" id="c-testar">Testar como aluno</button><button class="btn linha" type="button" id="c-pub">Publicar na parada “Study habits”</button></div>
    </form>
    <div class="telefone"><div class="tela" id="c-prev"></div></div>
  </div>`;
}
function exCriado() { const t = $('#c-tipo').value, q = $('#c-q').value, a = $('#c-a').value, e = $('#c-e').value.split(';').map(s => s.trim()).filter(Boolean), p = $('#c-p').value;
  if (t === 'montar') return { t, pt: q, resp: a.replace(/[.!?]$/, ''), extras: e.join(' ').split(' ').filter(Boolean).slice(0, 4), porque: p };
  if (t === 'lacuna') { const [antes, depois = ''] = q.split('___'); return { t, antes: antes || q, depois, ops: embaralhaFixo([a, ...e]), a: 0, porque: p }; }
  const ops = [a, ...e]; return { t: 'escolha', q, ops, a: 0, porque: p }; }
const embaralhaFixo = a => a;
POS['p-criar'] = () => {
  const prev = () => { const x = exCriado(); $('#c-prev').innerHTML = `<div class="barra-p" style="height:10px"><i style="width:35%;background:var(--ok)"></i></div><span class="olho" style="color:var(--navy-3)">${{ escolha: 'Escolha a resposta', montar: 'Monte a frase em inglês', lacuna: 'Complete a frase' }[x.t]}</span>${x.t === 'escolha' ? `<h3>${esc(x.q)}</h3><div class="opcoes">${x.ops.map((o, i) => `<div class="opc" style="font-size:14px;padding:10px 12px"><kbd>${i + 1}</kbd>${esc(o)}</div>`).join('')}</div>` : x.t === 'montar' ? `<div class="fala" style="font-size:15px">${esc(x.pt)}</div><div class="linha-resp" style="min-height:44px"></div><div class="banco">${embaralha([...x.resp.split(' '), ...x.extras]).map(w => `<span class="ficha" style="font-size:14px;padding:6px 10px">${esc(w)}</span>`).join('')}</div>` : `<p class="frase-lacuna" style="font-size:17px">${esc(x.antes)} <span class="lacuna">&nbsp;</span> ${esc(x.depois)}</p><div class="opcoes">${x.ops.map((o, i) => `<div class="opc" style="font-size:14px;padding:10px 12px"><kbd>${i + 1}</kbd>${esc(o)}</div>`).join('')}</div>`}<div class="porque" style="font-size:12.5px;background:var(--paper-2);border-radius:10px;padding:8px 10px;display:flex;gap:8px"><img src="${FOTO}" alt="" style="width:22px;height:22px;border-radius:50%;object-fit:cover">${esc(x.porque)}</div>`; };
  $('#f-criar').addEventListener('input', prev); prev();
  $('#c-tipo').onchange = () => { const t = $('#c-tipo').value; if (t === 'lacuna') { $('#c-q').value = 'I study English ___ day.'; $('#c-a').value = 'every'; $('#c-e').value = 'all; each of'; } else if (t === 'montar') { $('#c-q').value = 'Eu estudo inglês todos os dias.'; $('#c-a').value = 'I study English every day'; $('#c-e').value = 'studies; all'; } else { $('#c-q').value = 'Como se diz “Eu estudo todos os dias”?'; $('#c-a').value = 'I study every day.'; $('#c-e').value = 'I studies every day.; I am study every day.'; } prev(); };
  $('#c-testar').onclick = () => { const x = exCriado(); if (x.t !== 'montar') { const ord = embaralha(x.ops.map((o, i) => [o, i])); x.ops = ord.map(o => o[0]); x.a = ord.findIndex(o => o[1] === 0); } LICOES['teste-prof'] = { titulo: 'Teste do exercício', tipo: 'Pré-visualização', xp: 0, passos: [x] }; abreLicao('teste-prof'); };
  $('#c-pub').onclick = () => { const x = exCriado(); if (x.t !== 'montar') { const ord = embaralha(x.ops.map((o, i) => [o, i])); x.ops = ord.map(o => o[0]); x.a = ord.findIndex(o => o[1] === 0); } LICOES['l-habitos'].passos.push(x); toast('Exercício publicado na parada “Study habits” (só nesta demonstração).'); };
};


render();
</script>
