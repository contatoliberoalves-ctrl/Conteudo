<title>English Journey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a plataforma é um passaporte de viagem. Unidades são destinos, lições são paradas numa trilha,
   conquistas viram carimbos. Azul-marinho do professor como capa do passaporte, papel creme nas páginas,
   vermelho e dourado como tinta de carimbo. Visual fixo (claro), cores todas definidas aqui. */
:root {
  --navy: #0B2347; --navy-2: #143A6E; --navy-3: #1E4E8C; --red: #D7263D; --red-2: #B51C31; --gold: #E3A92F; --gold-2: #C98D17;
  --paper: #FBF8F1; --paper-2: #F3EEE2; --card: #FFFFFF; --ink: #13213A; --muted: #637089; --line: #E3E1DA; --line-2: #EEECE6;
  --ok: #1E9B68; --ok-2: #157A51; --ok-bg: #E2F5EC; --bad: #D7263D; --bad-bg: #FCE8EB; --sky: #E7EEF9;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mola: cubic-bezier(.34, 1.56, .64, 1); --suave: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 90; background: var(--paper) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
img { max-width: 100%; display: block }
h1, h2, h3, h4, p { margin: 0 }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1.08; text-wrap: balance }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px }
.olho { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--red) }
.mudo { color: var(--muted) }
.num { font-variant-numeric: tabular-nums }

/* estrutura */
.app { display: grid; min-height: 100% }
@media (min-width: 1000px) { .app { grid-template-columns: 250px 1fr } }
.lado { display: none }
@media (min-width: 1000px) { .lado { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 22px 16px; background: var(--navy); color: #fff; overflow: auto } }
.marca { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px }
.selo-marca { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 16px; background: var(--red); color: #fff; box-shadow: inset 0 0 0 3px var(--navy), 0 0 0 2px var(--red) }
.marca b { display: block; font-size: 15px; line-height: 1.2 }
.marca small { font-size: 10px; letter-spacing: .14em; color: #9FB3D3; font-weight: 700 }
.nav { display: grid; gap: 3px }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; color: #C2CEE3; text-align: left; padding: 11px 12px; border-radius: 12px; font-weight: 600; font-size: 14.5px; transition: background .2s, color .2s }
.nav button svg { width: 22px; height: 22px; flex: none }
.nav button:hover { background: #ffffff12; color: #fff }
.nav button[aria-current="page"] { background: #fff; color: var(--navy) }
.nav-rot { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #7F93B6; padding: 14px 12px 6px }
.lado .prof { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 14px 8px 4px; border-top: 1px solid #ffffff1c }
.lado .prof img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover }
.lado .prof small { display: block; color: #9FB3D3; font-size: 12px }
.modo { display: flex; background: #ffffff14; border-radius: 12px; padding: 4px; margin: 8px 0 }
.modo button { flex: 1; border: 0; background: none; color: #C2CEE3; padding: 8px; border-radius: 9px; font-weight: 700; font-size: 12.5px }
.modo button[aria-pressed="true"] { background: #fff; color: var(--navy) }

.corpo { min-width: 0; display: flex; flex-direction: column }
.barra-topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: rgba(251,248,241,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line) }
@media (min-width: 1000px) { .barra-topo { padding-inline: 32px } }
.barra-topo .tit { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; min-width: 0 }
.barra-topo .tit .selo-marca { width: 34px; height: 34px; font-size: 12px }
@media (min-width: 1000px) { .barra-topo .tit .selo-marca { display: none } }
.stats { display: flex; gap: 6px; align-items: center }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 14px; white-space: nowrap }
.stat svg { width: 20px; height: 20px }
.stat.fogo { color: #E2621B }
.stat.xp { color: var(--navy-3) }
.stat .anel { width: 22px; height: 22px }
.fogo svg { animation: chama 1.6s ease-in-out infinite; transform-origin: 50% 90% }
@keyframes chama { 0%, 100% { transform: scale(1) rotate(-2deg) } 50% { transform: scale(1.08, 1.12) rotate(2deg) } }
.trocar-modo { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card) }
.trocar-modo button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; color: var(--muted) }
.trocar-modo button[aria-pressed="true"] { background: var(--navy); color: #fff }
@media (min-width: 1000px) { .trocar-modo { display: none } }
@media (max-width: 520px) { .stat .rot-l { display: none } .barra-topo .tit { display: none } .stat { padding: 5px 9px; font-size: 13px } .stats { gap: 4px } .trocar-modo button { padding: 5px 9px } }
@media (max-width: 360px) { .stat.xp { display: none } }

main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); width: 100%; max-width: 1240px; margin: 0 auto }
@media (min-width: 1000px) { main { padding: 32px 32px 64px } }
.vista { display: grid; gap: 22px; animation: entra .5s var(--suave) }
@keyframes entra { from { transform: translateY(12px); opacity: .3 } }
.cab { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px }
.cab h1 { font-size: clamp(28px, 3.6vw, 40px) }
.cab p { color: var(--muted); margin-top: 6px; max-width: 60ch }

/* barra de abas no celular */
.abas-baixo { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border-top: 1px solid var(--line) }
.abas-baixo button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 6px 8px; border-radius: 12px; min-width: 56px; min-height: 48px }
.abas-baixo button svg { width: 24px; height: 24px; transition: transform .3s var(--mola) }
.abas-baixo button[aria-current="page"] { color: var(--navy); background: var(--sky) }
.abas-baixo button[aria-current="page"] svg { transform: translateY(-2px) scale(1.1) }
@media (min-width: 1000px) { .abas-baixo { display: none } }

/* blocos */
.grade { display: grid; gap: 16px }
@media (min-width: 760px) { .g2 { grid-template-columns: 1fr 1fr } .g3 { grid-template-columns: repeat(3, 1fr) } }
@media (min-width: 1100px) { .g-hoje { grid-template-columns: 1.55fr 1fr } }
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; min-width: 0; box-shadow: 0 1px 0 var(--line-2) }
.cartao h3 { font-size: 20px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 14px; border: 0; font-weight: 800; font-size: 14.5px; letter-spacing: .01em; text-decoration: none; position: relative; transition: transform .15s, box-shadow .15s, filter .2s }
.btn.prim { background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-2) }
.btn.azul { background: var(--navy-3); color: #fff; box-shadow: 0 4px 0 var(--navy) }
.btn.ouro { background: var(--gold); color: var(--navy); box-shadow: 0 4px 0 var(--gold-2) }
.btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 var(--ok-2) }
.btn.branco { background: #fff; color: var(--navy); box-shadow: 0 4px 0 #C9D3E6 }
.btn.linha { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line) }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 transparent }
.btn:hover:not(:disabled) { filter: brightness(1.05) }
.btn:disabled { background: #E6E3DB; color: #A39E92; box-shadow: 0 4px 0 #D6D2C8; cursor: not-allowed }
.btn.peq { min-height: 38px; padding: 0 14px; font-size: 13px; border-radius: 11px }
.etq { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--paper-2); color: var(--muted) }
.etq.ouro { background: #FCF0D3; color: #8C5F07 }
.etq.ok { background: var(--ok-bg); color: var(--ok-2) }
.etq.verm { background: var(--bad-bg); color: var(--red-2) }
.etq.azul { background: var(--sky); color: var(--navy-3) }
.barra-p { height: 10px; border-radius: 10px; background: var(--paper-2); overflow: hidden }
.barra-p i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--gold), var(--red)); transition: width 1s var(--suave); position: relative }
.barra-p i::after { content: ""; position: absolute; inset: 2px 6px auto; height: 3px; border-radius: 3px; background: rgba(255,255,255,.45) }

/* hoje */
.missao { position: relative; overflow: hidden; border-radius: 26px; padding: clamp(22px, 3vw, 32px); background: var(--navy); color: #fff; display: grid; gap: 18px; isolation: isolate }
.missao::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(500px 300px at 85% 0%, #1E4E8C 0%, transparent 70%), repeating-linear-gradient(135deg, #ffffff06 0 2px, transparent 2px 14px) }
.missao .aviao { position: absolute; right: -10px; top: 22px; width: 180px; opacity: .9; z-index: -1; animation: voa 7s ease-in-out infinite }
@keyframes voa { 50% { transform: translate(-14px, -8px) rotate(-3deg) } }
.missao h2 { font-size: clamp(26px, 3vw, 36px); max-width: 18ch }
.missao p { color: #C6D3EA; max-width: 52ch }
.missao .infos { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: #C6D3EA }
.missao .infos b { display: block; color: #fff; font-size: 14px }
.meta-dia { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center }
.anel-grande { width: 108px; height: 108px; position: relative }
.anel-grande svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.anel-grande circle { fill: none; stroke-width: 10 }
.anel-grande .fundo { stroke: var(--paper-2) }
.anel-grande .frente { stroke: url(#grad-anel); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--suave) }
.anel-grande div { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1 }
.anel-grande b { font-size: 24px; font-weight: 800 }
.anel-grande small { font-size: 11px; color: var(--muted); display: block }
.semana-dots { display: flex; gap: 6px; margin-top: 12px }
.semana-dots span { width: 34px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--paper-2); color: var(--muted); position: relative }
.semana-dots span.feito { background: #FFE8D6; color: #C2510F }
.semana-dots span.feito::after { content: ""; position: absolute; bottom: 4px; width: 6px; height: 6px; border-radius: 50%; background: #E2621B }
.semana-dots span.hoje { background: var(--navy); color: #fff }
.recado { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start }
.recado img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold) }
.balao-recado { position: relative; background: var(--paper-2); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-family: var(--display); font-size: 17px; line-height: 1.35; font-weight: 600 }
.palavra-dia { perspective: 900px; cursor: pointer; min-height: 170px; border: 0; padding: 0; background: none; text-align: left; width: 100% }
.palavra-dia .gira { position: relative; width: 100%; height: 100%; min-height: 170px; transform-style: preserve-3d; transition: transform .7s var(--mola) }
.palavra-dia.virada .gira { transform: rotateY(180deg) }
.palavra-dia .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 22px; padding: 20px; display: grid; align-content: space-between }
.palavra-dia .f1 { background: var(--gold); color: var(--navy) }
.palavra-dia .f2 { background: var(--navy); color: #fff; transform: rotateY(180deg) }
.palavra-dia strong { font-family: var(--display); font-size: 38px; line-height: 1 }
.mini { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.prox-aula { display: grid; gap: 10px }
.contagem { display: flex; gap: 8px }
.contagem div { flex: 1; text-align: center; background: var(--paper-2); border-radius: 12px; padding: 8px 4px }
.contagem b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums }
.contagem small { font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em }
.nivel { display: grid; gap: 10px }
.nivel-topo { display: flex; justify-content: space-between; align-items: baseline }
.nivel-topo b { font-family: var(--display); font-size: 22px }

/* jornada */
.unidade { position: relative; border-radius: 26px; background: var(--card); border: 1px solid var(--line) }
.unidade-cab { position: relative; border-radius: 26px 26px 0 0; padding: 22px 24px; color: #fff; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; isolation: isolate; overflow: hidden }
.unidade-cab::after { content: attr(data-cidade); position: absolute; right: -6px; bottom: -26px; z-index: -1; font-family: var(--display); font-weight: 800; font-size: 110px; line-height: 1; opacity: .09; white-space: nowrap }
.unidade-cab h2 { font-size: clamp(22px, 2.6vw, 30px) }
.unidade-cab p { color: #ffffffcc; font-size: 14px; margin-top: 4px }
.u1 .unidade-cab { background: var(--red) }
.u2 .unidade-cab { background: var(--navy-3) }
.u3 .unidade-cab { background: #5A6378 }
.trilha { position: relative; margin: 0 auto; max-width: 460px; padding: 30px 0 40px }
.trilha svg.caminho { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
.trilha .linha-c { fill: none; stroke: var(--line); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 2 22 }
.trilha .linha-f { fill: none; stroke: var(--gold); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 2 22 }
.parada { position: relative; z-index: 2; width: 84px; height: 84px; margin: 0 auto 26px; transform: translateX(var(--x)) }
.no { width: 84px; height: 78px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #fff; position: relative; transition: transform .2s var(--mola); background: var(--cor, var(--navy-3)); box-shadow: 0 7px 0 var(--sombra, var(--navy)) }
.no svg { width: 36px; height: 36px }
.no:hover:not(:disabled) { transform: translateY(-3px) }
.no:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 var(--sombra, var(--navy)) }
.no.feito { --cor: var(--gold); --sombra: var(--gold-2); color: var(--navy) }
.no.trancado { --cor: #E3E0D8; --sombra: #CBC7BC; color: #A7A194; cursor: not-allowed }
.no.atual::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--cor); opacity: .35; animation: pulsa 1.8s ease-out infinite }
@keyframes pulsa { 0% { transform: scale(.9); opacity: .5 } 100% { transform: scale(1.35); opacity: 0 } }
.parada .comecar { position: absolute; left: 50%; top: -42px; transform: translateX(-50%); white-space: nowrap; background: #fff; color: var(--red); border: 2px solid var(--line); padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; animation: quica 1.4s ease-in-out infinite; pointer-events: none }
.parada .comecar::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; background: #fff; border: 2px solid var(--line); border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg) }
@keyframes quica { 50% { transform: translate(-50%, -6px) } }
.no .coroa { position: absolute; right: -4px; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--gold-2); display: grid; place-items: center; box-shadow: 0 2px 0 var(--line) }
.no .coroa svg { width: 16px; height: 16px }
.pop { position: absolute; z-index: 5; left: 50%; top: 96px; width: 270px; transform: translateX(-50%); background: var(--navy); color: #fff; border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 20px 40px -12px rgba(11,35,71,.5); animation: popa .35s var(--mola) }
.pop::before { content: ""; position: absolute; left: 50%; top: -7px; width: 14px; height: 14px; background: var(--navy); transform: translateX(-50%) rotate(45deg) }
@keyframes popa { from { transform: translateX(-50%) scale(.85); opacity: 0 } }
.pop h4 { font-size: 17px }
.pop p { font-size: 13px; color: #C6D3EA }
.pop .btn { width: 100% }
.carimbo-u { position: absolute; right: 18px; top: 50%; transform: translateY(-50%) rotate(-12deg) }

/* carimbos (conquistas) */
.carimbos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px }
.carimbo { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center; padding: 14px; position: relative; color: var(--cor, var(--red)); border: 3px solid currentColor; box-shadow: inset 0 0 0 5px #fff, inset 0 0 0 7px currentColor; background: #fff; transform: rotate(var(--r, -8deg)); transition: transform .4s var(--mola) }
.carimbo:hover { transform: rotate(0) scale(1.05) }
.carimbo b { display: block; font-family: var(--display); font-size: 22px; line-height: 1 }
.carimbo small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; line-height: 1.25 }
.carimbo.trancado { color: #C9C4B8; background: var(--paper); border-style: dashed; box-shadow: none }
.carimbo.novo { animation: bate .7s var(--mola) both }
@keyframes bate { 0% { transform: scale(2.2) rotate(10deg); opacity: 0 } 60% { transform: scale(.92) rotate(-10deg); opacity: 1 } 100% { transform: scale(1) rotate(-8deg) } }

/* lição (tela cheia) */
.licao { position: fixed; inset: 0; z-index: 100; background: #fff; display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); animation: sobe-l .45s var(--suave) }
@keyframes sobe-l { from { transform: translateY(30px); opacity: 0 } }
.licao-topo { display: flex; align-items: center; gap: 14px; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); max-width: 980px; width: 100%; margin: 0 auto }
.fechar { width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none }
.fechar:hover { background: var(--paper-2) }
.fechar svg { width: 22px; height: 22px }
.licao .barra-p { flex: 1; height: 16px }
.licao .barra-p i { background: linear-gradient(90deg, var(--ok), #38C98A) }
.combo { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; color: #E2621B; font-size: 14px; min-width: 60px; justify-content: flex-end }
.combo.ativo { animation: combo .5s var(--mola) }
@keyframes combo { 40% { transform: scale(1.4) } }
.licao-meio { overflow: auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 30px max(18px, env(safe-area-inset-left, 0px)) }
.ex { max-width: 680px; margin: 0 auto; display: grid; gap: 22px; animation: ex-in .45s var(--suave) }
@keyframes ex-in { from { transform: translateX(40px); opacity: 0 } }
.ex .tipo { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--navy-3); display: flex; gap: 8px; align-items: center }
.ex .tipo.rev { color: #C2510F }
.ex h2 { font-size: clamp(24px, 3vw, 32px) }
.cena { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: end }
.cena img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold) }

.opcoes { display: grid; gap: 10px }
.opc { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 2px solid var(--line); border-radius: 16px; background: #fff; padding: 14px 16px; font-size: 16.5px; font-weight: 600; box-shadow: 0 4px 0 var(--line); transition: transform .12s, border-color .15s, background .15s }
.opc kbd { width: 28px; height: 28px; flex: none; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; font: 700 12.5px var(--ui); color: var(--muted) }

.opc[aria-pressed="true"] { border-color: var(--navy-3); background: var(--sky); box-shadow: 0 4px 0 #9FB8E0 }
.opc[aria-pressed="true"] kbd { border-color: var(--navy-3); color: var(--navy-3) }
.opc.certa { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 4px 0 #9ED8BD }
.opc.errada { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 4px 0 #F1A9B3; animation: treme .4s }
@keyframes treme { 20%, 60% { transform: translateX(-6px) } 40%, 80% { transform: translateX(6px) } }
.linha-resp { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 8px 0 }
.linha-resp + .linha-resp { min-height: 0; padding: 0; border-bottom-style: dashed }
.banco { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 60px }
.ficha { border: 2px solid var(--line); background: #fff; border-radius: 13px; padding: 9px 14px; font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 var(--line); transition: transform .12s }

.ficha.voando { position: fixed; z-index: 200; margin: 0; pointer-events: none; transition: left .32s var(--suave), top .32s var(--suave) }
.pares { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.pares .col { display: grid; gap: 10px; align-content: start }
.par { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 13px 12px; font-weight: 600; font-size: 15.5px; box-shadow: 0 4px 0 var(--line); transition: transform .15s, opacity .4s, border-color .15s, background .15s; min-height: 52px }

.licao-baixo { border-top: 2px solid var(--line-2); padding: 16px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); transition: background .25s }

  <section class="cartao" style="display:grid;gap:16px"><div class="mini"><div><span class="olho">Passaporte</span><h3>Seus carimbos</h3></div><span class="etq ouro">${E.carimbos.length} de ${CARIMBOS.length}</span></div><div class="carimbos">${CARIMBOS.map((c, i) => { const tem = E.carimbos.includes(c.id); return `<div class="carimbo ${tem ? '' : 'trancado'}" style="--cor:${c.cor};--r:${[-8, 6, -4, 10, -12, 4, -6, 8, -10][i]}deg" title="${c.t}"><span><b>${tem ? c.b : '?'}</b><small>${c.t}</small></span></div>`; }).join('')}</div></section>`;
}
POS.progresso = () => { requestAnimationFrame(() => { $$('.graf rect.b').forEach(r => { r.setAttribute('y', 170 - r.dataset.h); r.setAttribute('height', r.dataset.h); }); $$('.habil i').forEach(i => i.style.width = i.dataset.w + '%'); }); contaAte($('#vs-a'), E.xpSemana.reduce((a, b) => a + b, 0)); };

/* ================== PROFESSOR ================== */
const spark = s => { const m = Math.max(...s, 1); const pts = s.map((v, i) => `${i * 50 + 5},${40 - v / m * 34}`).join(' '); return `<svg class="spark" viewBox="0 0 310 44" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${(s.length - 1) * 50 + 5}" cy="${40 - s[s.length - 1] / m * 34}" r="4" fill="currentColor"/></svg>`; };
function pGeral() {
  const pend = 2 - Object.keys(E.corrigidos).length;
  return `<div class="cab"><div><span class="olho">Central do professor</span><h1>Good afternoon, Anderson.</h1><p>O que pede a sua atenção hoje, em ordem de prioridade.</p></div></div>
  <div class="grade g-hoje">
    <section class="cartao" style="display:grid;gap:14px"><h3>Prioridades</h3><div class="prior">
      ${pend > 0 ? `<button type="button" data-ir="p-corr"><span class="ic" style="--c:var(--red)">${pend}</span><span><b>Corrigir produções escritas</b><small>Marina e Lucas enviaram textos</small></span></button>` : ''}
      <button type="button" data-ir="p-alunos"><span class="ic" style="--c:#C98D17">!</span><span><b>Lucas está sem atividade há 4 dias</b><small>Uma mensagem curta costuma trazer o aluno de volta</small></span></button>
      <button type="button" data-ir="p-criar"><span class="ic" style="--c:var(--navy-3)">+</span><span><b>A parada “Study habits” está vazia</b><small>Crie os exercícios para liberar a unidade 3</small></span></button>
    </div></section>
    <section class="cartao" style="display:grid;gap:12px;align-content:start"><h3>Saúde da turma</h3>${[['Alunos em ritmo', 67, '2 de 3 ativos nos últimos 3 dias'], ['Entregas no prazo', 76, '38 de 50 atividades'], ['Média nos quizzes', 82, '+4% no mês']].map(([t, v, s]) => `<div style="display:grid;gap:6px"><div class="mini"><b style="font-size:14px">${t}</b><b class="num">${v}%</b></div><div class="barra-p"><i data-w="${v}" style="width:0"></i></div><small class="mudo">${s}</small></div>`).join('')}</section>
  </div>
  <section class="cartao" style="display:grid;gap:12px"><h3>Engajamento da semana</h3><div class="alunos">${ALUNOS.map(a => `<div style="color:${a.c}"><b style="color:var(--ink);font-size:14px">${a.n}</b>${spark(a.s)}</div>`).join('')}</div></section>`;
}
POS['p-geral'] = () => { $$('[data-ir]').forEach(b => b.onclick = () => navega(b.dataset.ir)); requestAnimationFrame(() => $$('[data-w]').forEach(i => i.style.width = i.dataset.w + '%')); };
function pAlunos() {
  return `<div class="cab"><div><span class="olho">Gestão individual</span><h1>Alunos</h1><p>Evolução, constância e sinais de alerta de cada um.</p></div></div>
  <div class="alunos">${ALUNOS.map(a => `<article class="cartao aluno" style="${a.alerta ? 'border-color:#F1C7A3' : ''}"><div class="aluno-topo"><span class="avatar" style="--c:${a.c}">${a.i}</span><div><b>${a.n}</b><p class="mudo" style="font-size:13px">${a.nivel}</p></div></div><span class="etq ${a.alerta ? 'verm' : 'ok'}" style="justify-self:start">${a.sinal}</span><div style="color:${a.c}">${spark(a.s)}<small class="mudo">minutos de estudo nos últimos 7 dias</small></div><div style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px"><div><b class="num">${a.xp}</b><small class="mudo" style="display:block;font-size:11px">XP</small></div><div><b class="num">${a.seq}</b><small class="mudo" style="display:block;font-size:11px">dias seguidos</small></div><div><b class="num">${a.media}%</b><small class="mudo" style="display:block;font-size:11px">média</small></div></div>${a.alerta ? `<button class="btn ouro peq" type="button" data-lembrete="${a.n}">Mandar um lembrete</button>` : `<button class="btn linha peq" type="button" data-comoaluno>Ver como aluno</button>`}</article>`).join('')}</div>`;
}
POS['p-alunos'] = () => { $$('[data-comoaluno]').forEach(b => b.onclick = () => trocaModo('aluno')); $$('[data-lembrete]').forEach(b => b.onclick = () => { b.textContent = 'Lembrete preparado'; b.disabled = true; toast('Nesta demonstração o lembrete não é enviado de verdade.'); }); };
const CORR = [{ id: 'marina', n: 'Marina Costa', t: 'My last weekend', txt: 'Last weekend I [visit] my family. We cooked dinner and [watch] a movie. It was very fun.', com: 'Ótimo texto, Marina! Só atenção ao passado: depois de “last weekend”, os verbos vão para o simple past (visited, watched).', notas: { visit: 'visited · “last weekend” pede passado', watch: 'watched · também no passado' } }, { id: 'lucas', n: 'Lucas Rocha', t: 'My house', txt: 'There [is] two bedrooms and a small kitchen. My desk is near the window.', com: 'Boa descrição, Lucas! Com plural, use “there are”: there are two bedrooms.', notas: { is: 'are · “two bedrooms” é plural' } }];
function pCorr() {
  return `<div class="cab"><div><span class="olho">Devolutivas</span><h1>Correções</h1><p>Toque nos trechos marcados para ver a sugestão, escreva o comentário e devolva ao aluno.</p></div></div>
  ${CORR.map(c => { const feito = E.corrigidos[c.id]; return `<article class="cartao" style="display:grid;gap:14px;${feito ? 'opacity:.7' : ''}"><div class="mini"><div><span class="olho" style="color:var(--navy-3)">${c.n}</span><h3>${c.t}</h3></div><span class="etq ${feito ? 'ok' : 'verm'}">${feito ? 'Devolvido' : 'Aguardando'}</span></div><p class="texto-corr">${esc(c.txt).replace(/\[(\w+)\]/g, (_, w) => `<mark tabindex="0" data-nota="${esc(c.notas[w])}">${w}</mark>`)}</p><p class="mudo" id="nota-${c.id}" style="font-size:14px;min-height:20px"></p>${feito ? `<p><b>Seu comentário:</b> ${esc(feito)}</p>` : `<label class="campo">Comentário para o aluno<textarea id="com-${c.id}">${esc(c.com)}</textarea></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok peq" type="button" data-devolver="${c.id}">Devolver com nota 8</button><button class="btn linha peq" type="button" data-refazer="${c.id}">Pedir para refazer</button></div>`}</article>`; }).join('')}`;
}
POS['p-corr'] = () => {
  $$('mark[data-nota]').forEach(m => { const f = () => { m.closest('.cartao').querySelector('[id^=nota-]').innerHTML = `<b style="color:var(--ok-2)">Sugestão:</b> ${esc(m.dataset.nota)}`; }; m.onclick = f; m.onkeydown = e => e.key === 'Enter' && f(); });
  $$('[data-devolver],[data-refazer]').forEach(b => b.onclick = () => { const id = b.dataset.devolver || b.dataset.refazer; E.corrigidos[id] = $(`#com-${id}`).value + (b.dataset.refazer ? ' (pedido para refazer)' : ''); salva(); render(); toast('Devolutiva salva nesta demonstração.'); });
};
function pCriar() {
  return `<div class="cab"><div><span class="olho">Produção de conteúdo</span><h1>Criar exercício</h1><p>Escreva à esquerda e veja à direita como o aluno vai receber. Teste antes de publicar.</p></div></div>
  <div class="grade g2" style="align-items:start">
    <form class="cartao" id="f-criar" style="display:grid;gap:14px">
      <label class="campo">Tipo<select id="c-tipo"><option value="escolha">Escolha a resposta</option><option value="montar">Monte a frase</option><option value="lacuna">Complete a frase</option></select></label>
      <label class="campo">Enunciado ou frase em português<input id="c-q" value="Como se diz “Eu estudo todos os dias”?"></label>
      <label class="campo">Resposta certa<input id="c-a" value="I study every day."></label>
      <label class="campo">Alternativas erradas (separe com ;)<input id="c-e" value="I studies every day.; I am study every day."></label>
      <label class="campo">Por quê (aparece quando o aluno erra)<textarea id="c-p">Com “I”, o verbo fica na forma base: study. “Studies” é para he, she e it.</textarea></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn azul" type="button" id="c-testar">Testar como aluno</button><button class="btn linha" type="button" id="c-pub">Publicar na parada “Study habits”</button></div>
    </form>
    <div class="telefone"><div class="tela" id="c-prev"></div></div>
  </div>`;
}
function exCriado() { const t = $('#c-tipo').value, q = $('#c-q').value, a = $('#c-a').value, e = $('#c-e').value.split(';').map(s => s.trim()).filter(Boolean), p = $('#c-p').value;
  if (t === 'montar') return { t, pt: q, resp: a.replace(/[.!?]$/, ''), extras: e.join(' ').split(' ').filter(Boolean).slice(0, 4), porque: p };
  if (t === 'lacuna') { const [antes, depois = ''] = q.split('___'); return { t, antes: antes || q, depois, ops: embaralhaFixo([a, ...e]), a: 0, porque: p }; }
  const ops = [a, ...e]; return { t: 'escolha', q, ops, a: 0, porque: p }; }
const embaralhaFixo = a => a;
POS['p-criar'] = () => {
  const prev = () => { const x = exCriado(); $('#c-prev').innerHTML = `<div class="barra-p" style="height:10px"><i style="width:35%;background:var(--ok)"></i></div><span class="olho" style="color:var(--navy-3)">${{ escolha: 'Escolha a resposta', montar: 'Monte a frase em inglês', lacuna: 'Complete a frase' }[x.t]}</span>${x.t === 'escolha' ? `<h3>${esc(x.q)}</h3><div class="opcoes">${x.ops.map((o, i) => `<div class="opc" style="font-size:14px;padding:10px 12px"><kbd>${i + 1}</kbd>${esc(o)}</div>`).join('')}</div>` : x.t === 'montar' ? `<div class="fala" style="font-size:15px">${esc(x.pt)}</div><div class="linha-resp" style="min-height:44px"></div><div class="banco">${embaralha([...x.resp.split(' '), ...x.extras]).map(w => `<span class="ficha" style="font-size:14px;padding:6px 10px">${esc(w)}</span>`).join('')}</div>` : `<p class="frase-lacuna" style="font-size:17px">${esc(x.antes)} <span class="lacuna">&nbsp;</span> ${esc(x.depois)}</p><div class="opcoes">${x.ops.map((o, i) => `<div class="opc" style="font-size:14px;padding:10px 12px"><kbd>${i + 1}</kbd>${esc(o)}</div>`).join('')}</div>`}<div class="porque" style="font-size:12.5px;background:var(--paper-2);border-radius:10px;padding:8px 10px;display:flex;gap:8px"><img src="${FOTO}" alt="" style="width:22px;height:22px;border-radius:50%;object-fit:cover">${esc(x.porque)}</div>`; };
  $('#f-criar').addEventListener('input', prev); prev();
  $('#c-tipo').onchange = () => { const t = $('#c-tipo').value; if (t === 'lacuna') { $('#c-q').value = 'I study English ___ day.'; $('#c-a').value = 'every'; $('#c-e').value = 'all; each of'; } else if (t === 'montar') { $('#c-q').value = 'Eu estudo inglês todos os dias.'; $('#c-a').value = 'I study English every day'; $('#c-e').value = 'studies; all'; } else { $('#c-q').value = 'Como se diz “Eu estudo todos os dias”?'; $('#c-a').value = 'I study every day.'; $('#c-e').value = 'I studies every day.; I am study every day.'; } prev(); };
  $('#c-testar').onclick = () => { const x = exCriado(); if (x.t !== 'montar') { const ord = embaralha(x.ops.map((o, i) => [o, i])); x.ops = ord.map(o => o[0]); x.a = ord.findIndex(o => o[1] === 0); } LICOES['teste-prof'] = { titulo: 'Teste do exercício', tipo: 'Pré-visualização', xp: 0, passos: [x] }; abreLicao('teste-prof'); };
  $('#c-pub').onclick = () => { const x = exCriado(); if (x.t !== 'montar') { const ord = embaralha(x.ops.map((o, i) => [o, i])); x.ops = ord.map(o => o[0]); x.a = ord.findIndex(o => o[1] === 0); } LICOES['l-habitos'].passos.push(x); toast('Exercício publicado na parada “Study habits” (só nesta demonstração).'); };
};

render();
</script>
