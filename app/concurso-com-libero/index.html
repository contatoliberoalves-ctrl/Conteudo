<title>Concurso com Líbero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de estudos mobile-first. Celular = barra superior + conteúdo em cards + navegação inferior.
   Desktop (≥1024px) = menu lateral fixo e colunas lado a lado (calendário + detalhe da meta). */
:root{
  --bg:#F6F7F2; --card:#FFFFFF; --verde:#163D30; --verde2:#22563F; --verde3:#2F7356;
  --lima:#D9F575; --lima2:#EFFAC7; --tx:#14251F; --mu:#55665D; --ln:#E1E6DA; --ln2:#CDD5C6;
  --ok:#1D7448; --okbg:#E2F2E8; --at:#8A5300; --atbg:#FFF0D2; --er:#B23A2C; --erbg:#FBE5E1;
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --d:'Big Shoulders Display','Figtree',Impact,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance;font-weight:800;letter-spacing:-.015em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px} h4{font-size:16px}
p{margin:0}
a{color:var(--verde2);font-weight:700}
.ic{flex:none;display:block}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px;box-shadow:0 0 0 6px var(--lima);border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mu{color:var(--mu)} .sm{font-size:14px} .xs{font-size:13px}
.num{font-family:var(--d);font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* casca */
.shell{min-height:100%}
.side{display:none}
.main{min-width:0;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(246,247,242,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--ln);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:8px;max-width:1120px;margin:0 auto}
.seletor{display:flex;align-items:center;gap:10px;min-height:48px;min-width:0;flex:1;padding:4px 10px 4px 4px;border-radius:12px}
.seletor:hover{background:#fff}
.seletor .sig{flex:none;width:40px;height:40px;border-radius:10px;background:var(--verde);color:var(--lima);display:grid;place-items:center;font-family:var(--d);font-weight:900;font-size:13px;letter-spacing:.02em;line-height:1}
.seletor .tx{min-width:0;display:grid;line-height:1.2}
.seletor b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seletor small{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:999px;background:var(--lima);color:var(--verde);font-weight:800;font-size:14px;flex:none}
.xp.fogo{background:#fff;border:1px solid var(--ln);color:var(--at)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--verde);color:#fff;font-weight:800;flex:none}
.content{padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:16px;min-width:0}
.wrap>*{min-width:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--mu)}
.bnav .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.bnav button[aria-current=page]{color:var(--verde)}
.bnav button[aria-current=page] .pill{background:var(--lima)}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.side .logo b{display:block;font-size:16px;line-height:1.1}
.side .logo span{font-size:12.5px;color:rgba(255,255,255,.7)}
.side nav{display:grid;gap:2px}
.side .nv{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:10px;font-weight:700;color:rgba(255,255,255,.82)}
.side .nv:hover{background:rgba(255,255,255,.08);color:#fff}
.side .nv[aria-current=page]{background:var(--lima);color:var(--verde)}
.side .nv .lk{margin-left:auto;opacity:.7}
.side .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:16px 12px 6px;font-weight:700}
.side .rodape{margin-top:auto;display:grid;gap:8px;padding-top:16px}
.side .seletor{flex:none;background:rgba(255,255,255,.08);color:#fff;margin-bottom:12px}
.side .seletor small{color:rgba(255,255,255,.7)}
.side .seletor .sig{background:var(--lima);color:var(--verde)}
@media(min-width:1024px){
  .shell{display:grid;grid-template-columns:272px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;background:var(--verde);color:#fff;padding:20px 16px}
  .bnav{display:none}
  .main{padding-bottom:48px}
  .top .seletor,.top .logo-m{display:none}
  .top-in{justify-content:flex-end}
  .content{padding-block:24px 32px;padding-left:32px;padding-right:32px}
  h1{font-size:34px}
}

/* blocos */
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;min-width:0}
.card.pad{padding:20px}
.stack{display:grid;gap:12px;min-width:0;align-content:start}
.stack>*{min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row>.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--verde3)}
.g2{display:grid;gap:16px;min-width:0}
@media(min-width:760px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats .card{padding:12px}
.stats .num{font-size:clamp(19px,5.6vw,30px)!important;white-space:nowrap}
@media(min-width:760px){.stats{gap:12px}.stats .card{padding:16px}}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(min-width:1024px){.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}.cols>.stick{position:sticky;top:88px}}
.cols{display:grid;gap:16px;min-width:0}
.cols>*{min-width:0}

.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;line-height:1.15;text-align:center;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--verde);color:#fff}
.btn-p:hover{background:var(--verde2)}
.btn-l{background:var(--lima);color:var(--verde)}
.btn-s{background:#fff;border:1.5px solid var(--ln2);color:var(--verde)}
.btn-s:hover{border-color:var(--verde)}
.btn-g{min-height:44px;padding:0 8px;color:var(--verde2);font-weight:800;display:inline-flex;align-items:center;gap:6px;border-radius:10px}
.btn-g:hover{background:rgba(22,61,48,.06)}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns>.btn{flex:1 1 180px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:6px;line-height:1.3;background:#EEF1EA;color:var(--verde);white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)} .t-at{background:var(--atbg);color:var(--at)} .t-er{background:var(--erbg);color:var(--er)}
.t-lima{background:var(--lima);color:var(--verde)} .t-dark{background:var(--verde);color:var(--lima)} .t-line{background:#fff;border:1px solid var(--ln2);color:var(--mu)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ilus{font-size:12.5px;color:var(--mu);display:flex;gap:6px;align-items:center}
.ilus::before{content:"";width:8px;height:8px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--mu) 0 2px,transparent 2px 4px);flex:none}

.seg{display:flex;gap:4px;background:#E9EDE4;padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:40px;padding:0 14px;border-radius:9px;font-weight:800;font-size:14.5px;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed=true],.seg button[aria-current=page]{background:#fff;color:var(--verde);box-shadow:0 1px 2px rgba(20,37,31,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--ln2);background:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.chip.dif[aria-pressed=true]{background:var(--atbg);border-color:var(--at);color:var(--at)}
.chip.est[aria-pressed=true]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.field{display:grid;gap:6px}
.field label,.flabel{font-weight:800;font-size:14px}
select,.inp{min-height:48px;border-radius:12px;border:1.5px solid var(--ln2);background:#fff;padding:0 12px;width:100%;max-width:100%}
textarea.inp{padding:12px;min-height:110px;resize:vertical}
.search{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--ln2);padding:0 14px}
.search:focus-within{border-color:var(--verde);box-shadow:0 0 0 4px var(--lima)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;min-height:48px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:800;color:var(--verde2);padding-right:8px;border-radius:10px}

/* listas */
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;background:#fff;border:1px solid var(--ln);border-radius:12px;width:100%;min-width:0}
button.li:hover,a.li:hover{border-color:var(--ln2);background:#FCFDF9}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:800;line-height:1.25}
.li .s{font-size:14px;color:var(--mu);line-height:1.35}
.li .chev{color:var(--mu)}
.st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--ln2);color:transparent}
.st.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st.at{border-color:var(--at);color:var(--at)}
.st.rg{border-color:#9DBB2B;background:var(--lima2);color:var(--verde)}
.li.feita .t{text-decoration:line-through;text-decoration-color:rgba(20,37,31,.35);color:var(--mu)}

/* hoje */
.hero{background:var(--verde);color:#fff;border-radius:18px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(217,245,117,.08)}
.hero .eyebrow{color:var(--lima)}
.hero .mu{color:rgba(255,255,255,.75)}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rv b{font-family:var(--d);font-size:30px;font-weight:900}
.ring .rv small{display:block;font-size:11px;font-weight:700;opacity:.8;margin-top:2px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.1);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.meta-card{border:2px solid var(--verde);border-radius:18px;background:#fff;padding:20px;display:grid;gap:14px}
.meta-card h2{font-size:26px}
@media(min-width:1024px){.meta-card h2{font-size:30px}}
.motivo{background:var(--lima2);border-radius:12px;padding:12px 14px;display:grid;gap:2px;font-size:15px}
.motivo b{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--verde2)}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--atbg);color:#4A2E00}
.aviso.er{background:var(--erbg);color:#5A1A12}
.aviso.ok{background:var(--okbg);color:#0F3D25}
.aviso.neutro{background:#EAEFE4;color:var(--tx)}
.aviso .grow{flex:1;min-width:0;display:grid;gap:6px}
.semana-bar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.semana-bar .d{display:grid;gap:4px;justify-items:center;font-size:12px;font-weight:700;color:var(--mu)}
.semana-bar .b{width:100%;max-width:28px;height:56px;border-radius:6px;background:#EEF1EA;position:relative;overflow:hidden}
.semana-bar .b i{position:absolute;left:0;right:0;bottom:0;background:var(--verde3);border-radius:6px}
.semana-bar .hj{color:var(--verde)}
.semana-bar .hj .b{outline:2px solid var(--lima);outline-offset:1px}
.prog{height:10px;border-radius:999px;background:#E9EDE4;overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde3);border-radius:999px;transition:width .5s}
.prog.l i{background:var(--lima)}

/* catálogo */
.cat-hero{display:grid;gap:14px;padding-block:8px 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:17px;line-height:1.1}
.brand span{font-size:13px;color:var(--mu)}
.cc{display:grid;gap:10px;text-align:left;width:100%}
.cc:hover{border-color:var(--verde)}
.cc .sigla{font-family:var(--d);font-weight:900;font-size:30px;line-height:1;color:var(--verde)}
.cargo{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;border:2px solid var(--ln);background:#fff;width:100%;text-align:left}
.cargo[aria-checked=true]{border-color:var(--verde);box-shadow:0 0 0 3px var(--lima)}
.cargo .radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln2);flex:none;margin-top:2px;display:grid;place-items:center}
.cargo[aria-checked=true] .radio{border-color:var(--verde)}
.cargo[aria-checked=true] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde)}
.sticky-cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;padding-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}
@media(min-width:1024px){.sticky-cta{bottom:16px}}

/* edital */
.kv{display:grid;gap:0}
.kv>div{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.kv>div:first-child{border-top:0}
.kv dt{font-size:14px;color:var(--mu);font-weight:700;margin:0}
.kv dd{margin:0;font-weight:600}
.tl{display:grid;gap:0;padding-left:4px}
.tl>div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.tl>div::before{content:"";position:absolute;left:9px;top:18px;bottom:0;width:2px;background:var(--ln)}
.tl>div:last-child::before{display:none}
.tl .dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ln2);background:#fff;margin-top:1px}
.tl .passou .dot{background:var(--verde3);border-color:var(--verde3)}
.tl .prova .dot{background:var(--lima);border-color:var(--verde)}
.lockcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.lockcard .ico{width:44px;height:44px;border-radius:12px;background:#EEF1EA;display:grid;place-items:center;color:var(--verde);flex:none}
.lockcard.livre .ico{background:var(--lima)}
.diff{display:grid;gap:6px}
.diff div{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.diff s{color:var(--er)}
.diff ins{text-decoration:none;color:var(--ok);font-weight:700}

/* raio-x */
.rk{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--ln)}
.rk:first-child{border-top:0;padding-top:4px}
.rk-h{display:flex;align-items:center;gap:12px}
.rk-n{font-family:var(--d);font-weight:900;font-size:26px;color:var(--verde3);width:30px;flex:none;line-height:1}
.rk-dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rk-dados>div{background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.rk-dados small{font-size:12px;color:var(--mu);font-weight:700}
.rk-dados b{font-size:15px}
.bar{height:8px;border-radius:999px;background:#E9EDE4;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde3);border-radius:999px}
.bar.peso i{background:#9DBB2B}
.ass-li{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:10px;width:100%;text-align:left}
.ass-li:hover{background:var(--bg)}
.ass-li .bar{flex:0 0 80px}
details.acc>summary{list-style:none;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc[open] .rot{transform:rotate(90deg)}
.rot{transition:transform .2s}

/* plano */
.dia{display:grid;gap:8px}
.dia-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 2px}
.dia-h b{font-size:15px;text-transform:capitalize}
.dia.hj .dia-h b::after{content:"Hoje";margin-left:8px;font-size:11.5px;background:var(--lima);color:var(--verde);padding:2px 7px;border-radius:5px;vertical-align:2px}
.folga{padding:12px 14px;border:1.5px dashed var(--ln2);border-radius:12px;color:var(--mu);font-size:14px}
.painel{display:none!important}
@media(min-width:1024px){.painel{display:grid!important}}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mes .h{font-size:12px;font-weight:800;color:var(--mu);text-align:center;padding:4px 0;text-transform:uppercase}
.mes .c{aspect-ratio:1/1;max-width:100%;min-height:44px;border-radius:10px;background:#fff;border:1px solid var(--ln);display:grid;align-content:space-between;padding:5px;font-size:13px;font-weight:800;text-align:left}
.mes .c.fora{opacity:.35}
.mes .c.hj{border:2px solid var(--verde)}
.mes .c[aria-pressed=true]{background:var(--verde);color:#fff}
.mes .dots{display:flex;gap:3px;flex-wrap:wrap}
.mes .dots i{width:7px;height:7px;border-radius:50%;background:var(--ln2)}
.mes .dots i.ok{background:var(--ok)} .mes .dots i.at{background:var(--at)} .mes .dots i.rg{background:#9DBB2B}
.mes .c[aria-pressed=true] .dots i{outline:1px solid rgba(255,255,255,.6)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu);font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--ln);align-items:center}
.chg:first-child{border-top:0}
.chg .de{font-size:14px;color:var(--mu);white-space:nowrap}
.chg .de s{color:var(--er)}
.chg .de b{color:var(--ok)}

 {id:'q1',conc:'tjsp',mat:'adm',ass:'atos',dif:'média',ano:'2023',enun:'Sobre a revogação do ato administrativo, assinale a alternativa correta.',alts:['Pode ser feita pelo Poder Judiciário, no exercício da função jurisdicional, por razões de conveniência.','Produz efeitos retroativos (ex tunc).','Incide sobre atos discricionários válidos, por conveniência e oportunidade, com efeitos ex nunc.','É cabível para atos vinculados que já geraram direitos adquiridos.','É a forma adequada de extinguir atos ilegais.'],gab:2,com:'Revogação retira um ato válido por conveniência e oportunidade, com efeitos daqui para frente (ex nunc), e só a própria Administração pode fazê-la (Súmula 473 do STF). Ato ilegal se anula, com efeitos ex tunc.'},
 {id:'q2',conc:'tjsp',mat:'adm',ass:'atos',dif:'fácil',ano:'2021',enun:'O atributo do ato administrativo que permite à Administração impor obrigações a terceiros, independentemente da concordância deles, é a',alts:['presunção de legitimidade.','imperatividade.','autoexecutoriedade.','tipicidade.','motivação.'],gab:1,com:'Imperatividade é o poder de impor obrigações unilateralmente. Autoexecutoriedade é executar o ato sem ordem judicial, que é coisa diferente.'},
 {id:'q3',conc:'tjsp',mat:'adm',ass:'atos',dif:'fácil',ano:'2019',enun:'Segundo a Lei nº 4.717/1965, são elementos do ato administrativo:',alts:['competência, finalidade, forma, motivo e objeto.','imperatividade, tipicidade, forma, motivo e objeto.','competência, legalidade, publicidade, motivo e objeto.','presunção de legitimidade, finalidade, forma e conteúdo.','competência, finalidade, eficiência, motivo e forma.'],gab:0,com:'O art. 2º da Lei da Ação Popular lista os cinco elementos: competência, forma, objeto, motivo e finalidade. Macete: COMFIFORMOB.'},
 {id:'q4',conc:'tjsp',mat:'adm',ass:'atos',dif:'difícil',ano:'2017',enun:'Admite convalidação o ato administrativo que apresenta vício de',alts:['finalidade.','motivo.','objeto.','competência, desde que não se trate de competência exclusiva.','qualquer elemento, desde que haja interesse público.'],gab:3,com:'Só vícios sanáveis se convalidam: competência (se não for exclusiva) e forma (se não for essencial). Finalidade, motivo e objeto não admitem convalidação (Lei 9.784/1999, art. 55).'},
 {id:'q5',conc:'tjsp',mat:'adm',ass:'improb',dif:'média',ano:'2023',enun:'Após a Lei nº 14.230/2021, para a configuração de ato de improbidade administrativa, exige-se',alts:['dolo, em todas as modalidades.','dolo ou culpa grave nos atos que causam prejuízo ao erário.','culpa simples nos atos que atentam contra os princípios.','apenas a voluntariedade do agente.','responsabilidade objetiva do agente público.'],gab:0,com:'A reforma tornou todas as modalidades dolosas (art. 1º, § 1º). E o § 2º deixa claro que a simples voluntariedade não basta.'},
 {id:'q6',conc:'tjsp',mat:'const',ass:'dirfund',dif:'fácil',ano:'2021',enun:'Conforme a Constituição Federal, a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo',alts:['em flagrante delito ou desastre, para prestar socorro ou, durante o dia, por determinação judicial.','por determinação da autoridade policial, a qualquer hora.','por determinação judicial, a qualquer hora do dia ou da noite.','durante o dia, por determinação do Ministério Público.','em flagrante delito, somente durante o dia.'],gab:0,com:'Art. 5º, XI. A ordem judicial só autoriza a entrada durante o dia. Flagrante, desastre e socorro valem a qualquer hora.'},
 {id:'q7',conc:'tjsp',mat:'const',ass:'dirfund',dif:'média',ano:'2019',enun:'O mandado de segurança coletivo pode ser impetrado por',alts:['qualquer cidadão, em defesa do patrimônio público.','partido político com representação no Congresso Nacional.','associação legalmente constituída e em funcionamento há pelo menos seis meses.','qualquer pessoa jurídica, independentemente do tempo de constituição.','exclusivamente pelo Ministério Público.'],gab:1,com:'Art. 5º, LXX. A associação precisa de pelo menos um ano de funcionamento, não seis meses. Cidadão em defesa do patrimônio público é ação popular.'},
 {id:'q8',conc:'tjsp',mat:'const',ass:'judic',dif:'fácil',ano:'2017',enun:'Um quinto dos lugares dos Tribunais dos Estados será composto de membros do Ministério Público e de advogados com',alts:['mais de cinco anos de carreira ou de atividade.','mais de dez anos de carreira ou de efetiva atividade profissional.','mais de quinze anos de carreira ou de atividade.','mais de três anos de atividade jurídica.','mais de vinte anos de carreira ou de atividade.'],gab:1,com:'Art. 94 da CF: mais de dez anos de carreira (MP) ou de efetiva atividade profissional (advocacia).'},

const TIPOS={teoria:'Teoria',lei:'Lei seca',rev:'Revisão'};
function tituloTipo(m){if(m.tipo==='teoria')return`Teoria · parte ${m.parte} de ${m.de}`;if(m.tipo==='lei')return'Lei seca direcionada';return m.parte===1?'Revisão de 48 horas':'Revisão de 7 dias'}
function ranking(cid,cfg){
  const c=C(cid),tot=c.materias.reduce((s,m)=>s+m.peso,0),L=[];
  c.materias.forEach(m=>m.assuntos.forEach(a=>{
    let s=((m.peso/tot)+m.freq/100)/2*a.freq/100;const dif=cfg.dificeis.includes(m.id),est=cfg.estudadas.includes(m.id);
    if(dif)s*=1.6;if(est)s*=.7;L.push({a,m,s,dif,est})}));
  return L.sort((x,y)=>y.s-x.s);
}
function gerarItens(cid,cfg){
  const c=C(cid),tot=c.materias.reduce((s,m)=>s+m.peso,0);
  const filas=ranking(cid,cfg).map(L=>{
    const imp=((L.m.peso/tot)+L.m.freq/100)/2*L.a.freq/100;
    const nT=Math.max(1,Math.min(6,Math.round(2+imp*30))+(L.dif?1:0)-(L.est?1:0));
    const base={ass:L.a.id,mat:L.m.id};
    let mot=`${L.m.curto} vale ${L.m.peso} ${c.unidade} no edital (${Math.round(L.m.peso/tot*100)}% da prova) e ${L.a.freq>=100?'este é o assunto que concentra as questões dela':`este assunto aparece em ${L.a.freq}% das questões da matéria`} nas provas anteriores.`;
    if(L.dif)mot+=' Você marcou a matéria como difícil, então ela ganhou mais tempo.';
    if(L.est)mot+=' Você já estudou a matéria, então o plano encurtou a teoria.';
    const its=[];
    for(let i=1;i<=nT;i++)its.push({...base,tipo:'teoria',parte:i,de:nT,min:25,motivo:mot});
    if(L.a.lei)its.push({...base,tipo:'lei',parte:1,min:15,motivo:`A ${c.banca} cobra a letra da lei neste assunto. Leitura só dos artigos que mais caem.`});
    const dep=`${L.a.id}|teoria|${nT}`;
    its.push({...base,tipo:'rev',parte:1,min:10,dep,gap:2,motivo:'Revisão de 48 horas: fixa o que você estudou antes que esqueça.'});
    its.push({...base,tipo:'rev',parte:2,min:15,dep,gap:7,motivo:'Revisão de 7 dias: segunda passada para levar o conteúdo à memória de longo prazo.'});
    its.forEach(x=>x.key=`${x.ass}|${x.tipo}|${x.parte}`);
    return its;
  });
  const out=[],ativas=[];let prox=0;
  while(ativas.length<3&&prox<filas.length)ativas.push(filas[prox++]);
  while(ativas.length){
    for(let i=0;i<ativas.length;){const f=ativas[i];out.push(f.shift());
      if(!f.length){ativas.splice(i,1);if(prox<filas.length){ativas.splice(i,0,filas[prox++]);i++}}else i++;}
  }
  out.forEach((x,i)=>{x.ordem=i;x.id=x.key});
  return out;
}
function agendar(itens,cfg,inicio,fim,ocupado,datas){
  const fila=itens.slice();let d=inicio;
  while(fila.length&&d<=fim){
    const w=wd(d);
    if(cfg.dias[w]){
      let rest=cfg.min[w]-(ocupado[d]||0),olhados=0;
      for(let i=0;i<fila.length&&olhados<16&&rest>=10;){
        const it=fila[i];let pode=it.min<=rest;
        if(pode&&it.dep){const dd=datas[it.dep];pode=!!dd&&addD(dd,it.gap)<=d}
        if(pode){it.data=d;datas[it.key]=d;rest-=it.min;fila.splice(i,1)}else{i++;olhados++}
      }
    }
    d=addD(d,1);
  }
  return fila;
}
function simularPlano(P,cfg,inicio=HOJE){
  const c=C(P.conc);
  const feitas=P.metas.filter(m=>m.ok);const feitasK=new Set(feitas.map(m=>m.key));
  const itens=gerarItens(P.conc,cfg).filter(x=>!feitasK.has(x.key));
  const datas={},ocupado={};feitas.forEach(m=>{datas[m.key]=m.data;if(m.data>=inicio)ocupado[m.data]=(ocupado[m.data]||0)+m.min});
  const sobra=agendar(itens,cfg,inicio,addD(c.prova,-1),ocupado,datas);
  const ag=itens.filter(x=>x.data);
  const total=itens.reduce((s,x)=>s+x.min,0),agMin=ag.reduce((s,x)=>s+x.min,0);
  return{metas:[...feitas,...ag],sobra,cobertura:total?Math.round(agMin/total*100):100,ultimo:ag.length?ag.reduce((a,x)=>x.data>a?x.data:a,inicio):inicio};
}
function aplicarPlano(P,cfg,inicio=HOJE){
  P.cfg=cfg;const r=simularPlano(P,cfg,inicio);
  P.metas=r.metas.map(m=>({ok:false,reag:null,...m}));
  P.adiadas=r.sobra.map(x=>({ass:x.ass,mat:x.mat,tipo:x.tipo,parte:x.parte,key:x.key,min:x.min}));
}

function simularReorg(P){
  const c=C(P.conc),fimSem=addD(segunda(HOJE),6);
  const pend=P.metas.filter(m=>!m.ok).slice().sort((a,b)=>((a.data<HOJE?0:1)-(b.data<HOJE?0:1))||a.data.localeCompare(b.data)||a.ordem-b.ordem);
  const clones=pend.map(m=>({...m,data:null}));
  const datas={},ocupado={};
  P.metas.filter(m=>m.ok).forEach(m=>{datas[m.key]=m.data;if(m.data>=HOJE)ocupado[m.data]=(ocupado[m.data]||0)+m.min});
  const sobra=agendar(clones,P.cfg,HOJE,addD(c.prova,-1),ocupado,datas);
  const novo={};clones.forEach(x=>novo[x.id]=x.data);
  const mud=[],depois=[];let outras=0;
  pend.forEach(m=>{const nw=novo[m.id];if(nw===m.data)return;
    const rel=m.data<=fimSem||(nw&&nw<=fimSem);
    if(m.data<=fimSem&&(!nw||nw>fimSem))depois.push({m,de:m.data,para:nw});
    else if(rel)mud.push({m,de:m.data,para:nw});else outras++;});
  return{novo,mud,depois,outras,atrasadas:pend.filter(m=>m.data<HOJE).length,semVaga:sobra.length};
}

// ---------- sessão de questões ----------
function montarSessao({conc,mat,ass,dif,n=5,ids}){
  const P=prepPorConc(conc);
  if(ids)return ids.map(id=>({id}));
  let pool=QUESTOES.filter(q=>q.conc===conc&&(!mat||q.mat===mat)&&(!ass||q.ass===ass)&&(!dif||q.dif===dif));
  const sel=[];
  if(P){
    P.erros.filter(e=>!e.revisado&&(!ass||e.ass===ass)&&(!mat||e.mat===mat)).forEach(e=>{
      if(sel.length>=n||sel.some(s=>s.rev&&s.rev.ass===e.ass))return;
      const cands=pool.filter(q=>q.ass===e.ass&&q.id!==e.qid&&!sel.some(s=>s.id===q.id));
      const alt=cands.find(q=>!P.resp[q.id])||cands.find(q=>P.resp[q.id]!=='ok')||cands[0];
      if(alt)sel.push({id:alt.id,rev:e});
    });
  }
  const resto=pool.filter(q=>!sel.some(s=>s.id===q.id)).sort((a,b)=>((P&&P.resp[a.id])?1:0)-((P&&P.resp[b.id])?1:0));
  for(const q of resto){if(sel.length>=n)break;sel.push({id:q.id})}
  return sel;
}

function exec(a){
  if(a.gate){const cid=a.conc||concAtivo()?.id;const ok=a.gate==='questoes'?temQuestoes():cobre(cid);
    if(!ok){const {el,...rest}=a;UI.pend=rest;abrirSheet('paywall',{tipo:a.gate,conc:cid,ass:a.ass,acao:a.v||a.a});return}}
  const f=ACT[a.a];if(f)f(a);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;
  e.preventDefault();
  exec({...el.dataset,el});
});
document.addEventListener('input',e=>{
  if(e.target.id==='busca'){UI.busca=e.target.value;$('#resultados').innerHTML=listaCat()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cfgmin!=null){UI.cfgDraft.min[Number(t.dataset.cfgmin)]=Number(t.value);render()}
  if(t.dataset.f){UI.f[t.dataset.f]=t.value||'';if(t.dataset.f==='conc'){UI.f.mat='';UI.f.ass=''}if(t.dataset.f==='mat')UI.f.ass='';render()}
  if(t.dataset.rx){UI.rx[t.dataset.rx]=t.value;render()}
  if(t.id==='umConc'&&UI.sheet){UI.sheet.p.escolha=t.value;renderSheet()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)fecharSheet()});

// ---------- concluir meta / treino ----------
function concluir(id,el){
  const P=prep(),m=P.metas.find(x=>x.id===id);if(!m||m.ok)return;
  if(!cobre(P.conc)){exec({a:'marcar',m:id,gate:'estudo'});return}
  m.ok=true;m.okEm=HOJE;if(m.data>HOJE){m.reag=m.reag||m.data;m.data=HOJE}
  const doDia=P.metas.filter(x=>x.data===HOJE);const fechou=doDia.length&&doDia.every(x=>x.ok);
  confete(el);
  ganhar(m.tipo==='rev'?15:20,`Meta concluída: ${achaAss(P.conc,m.ass).a.nome}`);
  conquista('primeira-meta');if(fechou)conquista('dia-fechado');
  salvar();fecharSheet(true);
  if(UI.view==='leitor'){voltar()}else render();
}
function iniciarTreino(o){
  const qs=montarSessao(o);
  UI.tr={qs,i:0,sel:null,conf:false,res:[],conc:o.conc,ass:o.ass,mat:o.mat,meta:o.meta,de:o.de,inicio:Date.now()};
  go(qs.length?'treino':'treino',{},{});
}
function responder(el){
  const t=UI.tr;if(t.sel==null||t.conf)return;
  const it=t.qs[t.i],q=qDe(it.id),P=prepPorConc(q.conc);
  const certo=t.sel===q.gab;t.conf=true;t.res.push({id:q.id,ok:certo,sel:t.sel,rev:!!it.rev});
  if(P){P.resp[q.id]=certo?'ok':'erro';P.respondidas++;if(certo)P.acertos++;
    if(!certo&&!P.erros.some(e=>e.qid===q.id&&!e.revisado))P.erros.push({qid:q.id,ass:q.ass,mat:q.mat,data:HOJE,sel:t.sel,revisado:false});
    if(certo&&it.rev){const e=P.erros.find(x=>x.qid===it.rev.qid&&!x.revisado);if(e){e.revisado=true;e.revEm=HOJE}conquista('volta-erro')}
  }
  if(certo){ganhar(10,'Resposta certa');conquista('primeiro-acerto');confete(el)}else{S.xp+=2;if(P)P.xp+=2}
  salvar();render();
}
function finalizarTreino(saiu){
  const t=UI.tr||{};const P=prepPorConc(t.conc);if(P&&t.res&&t.res.length){P.sessoes++;if(!saiu)ganhar(15,'Rodada concluída')}
  salvar();UI.view='resultado';UI.p={};render(true);
}

function carregarExemplo(){
  S=novoEstado();S.plano='um';S.planoConc='tjsp';S.xp=340;S.streak=6;S.ultimoDia=addD(HOJE,-1);S.badges=['primeira-meta','dia-fechado'];
  const k='tjsp:escrevente';S.preps[k]=novaPrep('tjsp','escrevente');S.preps[k].vistoEdital=true;S.preps[k].criado=addD(HOJE,-2);
  const P=S.preps[k];
  aplicarPlano(P,{dias:[1,1,1,1,1,1,1].map(Boolean),min:[75,75,75,75,75,75,75],dificeis:['adm'],estudadas:['port']},addD(HOJE,-2));
  P.metas.filter(m=>m.data===addD(HOJE,-2)).forEach(m=>{m.ok=true;m.okEm=m.data});
  const ontem=P.metas.filter(m=>m.data===addD(HOJE,-1)).sort((a,b)=>a.ordem-b.ordem);if(ontem[0]){ontem[0].ok=true;ontem[0].okEm=ontem[0].data}
  P.xp=340;
  const k2='pppe:policial';S.preps[k2]=novaPrep('pppe','policial');S.preps[k2].vistoEdital=true;S.preps[k2].criado=addD(HOJE,-1);
  S.ativo=k;salvar();
}

}

function ring(feitas,total,cor='#D9F575',fundo='rgba(255,255,255,.15)',tam=88){
  const r=38,cf=2*Math.PI*r,pct=total?feitas/total:0;
  return`<div class="ring" style="width:${tam}px;height:${tam}px" role="img" aria-label="${feitas} de ${total} metas concluídas"><svg width="${tam}" height="${tam}" viewBox="0 0 88 88"><circle cx="44" cy="44" r="${r}" fill="none" stroke="${fundo}" stroke-width="9"/><circle cx="44" cy="44" r="${r}" fill="none" stroke="${cor}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${cf}" stroke-dashoffset="${cf*(1-pct)}" style="transition:stroke-dashoffset .6s"/></svg><div class="rv"><div><b>${feitas}/${total}</b><small>metas</small></div></div></div>`;
}

V.leitor=p=>{
  const c=concAtivo(),P=prep(),[aid,tipo]=p.mat.split(':'),aa=achaAss(c.id,aid);
  if(!aa)return'<p>Material não encontrado.</p>';
  const meta=p.meta?P.metas.find(m=>m.id===p.meta):null;
  if(tipo==='lei')conquista('leitor');
  const titulo={resumo:'Resumo',mapa:'Mapa mental',lei:'Lei seca direcionada'}[tipo];
  let corpo='';
  if(tipo==='resumo')corpo=`<div class="card pad">${aa.a.pontos.map(t=>{const [h,...r]=t.split(': ');return r.length?`<div class="pt"><b>${esc(h)}</b><span>${esc(r.join(': '))}</span></div>`:`<div class="pt"><span>${esc(t)}</span></div>`}).join('')}</div>`;
  if(tipo==='mapa')corpo=`<div class="mm"><div class="centro">${esc(aa.a.nome)}</div><div class="ramos">${aa.a.pontos.map((t,i)=>{const [h,...r]=t.split(': ');return`<div class="ramo"><b>${r.length?esc(h):`Ponto ${i+1}`}</b><span class="sm">${esc(r.length?r.join(': '):t)}</span></div>`}).join('')}</div></div>`;
  if(tipo==='lei')corpo=(aa.a.lei||[]).map(([r,t])=>`<div class="lei"><span class="ref">${esc(r)}</span><p>${t}</p></div>`).join('')+'<p class="xs mu">Trechos marcados em verde-limão: o que a banca costuma trocar nas alternativas.</p>';
  const voltarTxt=meta?'Voltar à meta':({materiais:'Materiais',raiox:'Raio-X',banca:'Perfil da banca',plano:'Meu plano',hoje:'Hoje'}[p.de]||'Voltar');
  return`<div class="leitor">
   <button class="back" data-a="voltar">${I('esq',18)} ${voltarTxt}</button>
   <div class="stack" style="gap:6px"><div class="tags"><span class="tag t-dark">${titulo}</span><span class="tag t-line">${esc(aa.m.nome)}</span></div><h1>${esc(aa.a.nome)}</h1>${meta?`<p class="sm mu">Material da meta: ${tituloTipo(meta)} · ${meta.min} min</p>`:''}</div>
   ${corpo}
   <div class="card stack">${meta&&!meta.ok?`<b>Terminou a leitura?</b><button class="btn btn-p w" data-a="marcar" data-m="${meta.id}">${I('check',18)} Marcar meta como concluída</button>`:meta?`<div class="aviso ok">${I('check')}<div class="grow sm">Meta concluída.</div></div>`:''}
    ${nQuest(c.id,aid)?`<button class="btn ${meta&&!meta.ok?'btn-s':'btn-p'} w" data-a="treinar" data-gate="questoes" data-ass="${aid}" data-meta="${meta?meta.id:''}" data-de="leitor">${temQuestoes()?I('praticar',18):I('lock',18)} Treinar este assunto</button>`:''}
    <button class="btn-g" data-a="voltar">${I('esq',16)} ${voltarTxt}</button></div>
  </div>`;
};

   <div class="kpis"><span class="kpi">${I('edital',16)} ${c.situacao}</span><span class="kpi">${I('plano',16)} Prova ${dm(c.prova)}</span>${S.expirado?'<span class="kpi">Acesso expirado</span>':''}</div></section>
  ${S.expirado?`<div class="aviso">${I('alerta')}<div class="grow"><b>Seu acesso ao plano terminou.</b><span class="sm">Seu histórico está salvo: ${P.metas.filter(m=>m.ok).length} metas concluídas e ${P.respondidas} questões. Agora você tem o resumo gratuito do edital.</span><button class="btn btn-s" style="justify-self:start" data-a="sheet" data-s="paywall" data-tipo="estudo" data-conc="${c.id}">Ver como reativar</button></div></div>`:''}
  ${umOutro?`<div class="aviso neutro">${I('ajuda')}<div class="grow sm">Seu plano Um Concurso cobre o <b>${C(S.planoConc).sigla}</b>. Aqui no ${c.sigla} você tem o resumo gratuito do edital.</div></div>`:''}
  <section class="meta-card"><span class="eyebrow">Seu próximo passo</span>
   ${!visto?`<h2>Entenda seu edital em 5 minutos</h2><p class="mu">Vagas, datas, etapas e o que elimina, tudo resumido em cards.</p><button class="btn btn-p w" data-a="tab" data-v="edital">${I('edital',18)} Ver meu edital</button>`
   :`<h2>Monte um plano que caiba na sua rotina</h2><p class="mu">Você diz quantos dias e quanto tempo tem. O app transforma o edital em metas diárias, com material e questões de cada assunto.</p><button class="btn btn-p w" data-a="${umOutro?'sheet':'go'}" data-s="paywall" data-tipo="estudo" data-conc="${c.id}" data-v="planos">Ver planos de estudo</button>`}
  </section>
  <section class="stack"><h3>Como fica o seu dia com um plano</h3>
   <div class="card stack" style="opacity:.9"><div class="between"><span class="tag t-dark">Exemplo de meta</span><span class="tag t-at">${I('lock',13)} Plano de estudo</span></div><h3>${c.id==='tjsp'?'Atos administrativos':'Remição de pena'} · 25 min</h3><p class="sm mu">${c.id==='tjsp'?'Direito Administrativo':'Lei de Execução Penal'} · Teoria</p>
    <div class="motivo"><b>Por que esta meta</b><span>${c.id==='tjsp'?'Administrativo vale 14 questões e este assunto aparece em 40% delas nas provas anteriores.':'A LEP vale 30 itens e remição aparece em 35% deles.'}</span></div></div>
  </section>
  <section class="stats">${[['Vagas',cargoDe(P).vagas.split(' ')[0]],['Inscrições até',c.inscricoes.split(' a ')[1]?.split(' ')[0]||c.inscricoes],['Banca',c.banca]].map(([k,v])=>`<div class="card"><span class="eyebrow">${k}</span><p class="num" style="font-size:28px;color:var(--verde)">${v}</p></div>`).join('')}</section>
  <p class="ilus">Dados de exemplo</p>`;

V.hoje=()=>{
  const P=prep(),c=concAtivo();
  if(!cobre(c.id))return hojeFree(P,c);
  if(!P.cfg)return`<section class="hero"><span class="eyebrow">Plano ativo · ${PLANOS[S.plano].nome}</span><h1 style="color:#fff">Falta só a sua rotina</h1><p class="mu">Responda 3 perguntas e o app monta suas metas até a prova de ${dmy(c.prova)}.</p></section>
   <section class="meta-card"><span class="eyebrow">Seu próximo passo</span><h2>Montar meu plano de estudos</h2><p class="mu">Quantos dias por semana, quanto tempo por dia e quais matérias você já estudou ou acha difíceis.</p><button class="btn btn-p w" data-a="go" data-v="config">${I('plano',18)} Montar meu plano</button></section>`;
  const doDia=P.metas.filter(m=>m.data===HOJE).sort((a,b)=>a.ordem-b.ordem),feitas=doDia.filter(m=>m.ok).length;
  const atual=doDia.find(m=>!m.ok),atras=P.metas.filter(m=>!m.ok&&m.data<HOJE);
  const futuras=P.metas.filter(m=>!m.ok&&m.data>HOJE).sort((a,b)=>a.data.localeCompare(b.data)||a.ordem-b.ordem);
  const depois=[...doDia.filter(m=>!m.ok&&m!==atual),...futuras].slice(0,4);
  const restMin=doDia.filter(m=>!m.ok).reduce((s,m)=>s+m.min,0);
  const seg=segunda(HOJE),semMetas=P.metas.filter(m=>m.data>=seg&&m.data<=addD(seg,6)),semOk=semMetas.filter(m=>m.ok).length;
  const nv=nivel();
  const errosPend=P.erros.filter(e=>!e.revisado);
  let principal;
  if(atual){const aa=achaAss(P.conc,atual.ass),nq=nQuest(c.id,atual.ass);
    principal=`<section class="meta-card" id="metaAtual"><div class="between"><span class="eyebrow">Sua meta agora</span><div class="tags"><span class="tag t-dark">${TIPOS[atual.tipo]}</span>${atual.reag?'<span class="tag t-lima">Reagendada</span>':''}</div></div>
     <div class="stack" style="gap:4px"><h2>${esc(aa.a.nome)} · ${atual.min} min</h2><p class="mu">${esc(aa.m.nome)} · ${tituloTipo(atual)}</p></div>
     <div class="motivo"><b>Por que agora</b><span>${esc(atual.motivo)}</span></div>
     <div class="btns"><button class="btn btn-p" data-a="material" data-mat="${atual.ass}:${materialDaMeta(atual)}" data-meta="${atual.id}" data-de="hoje">${I('livro',18)} Abrir material</button><button class="btn btn-s" data-a="marcar" data-m="${atual.id}">${I('check',18)} Marcar como concluída</button></div>
     ${nq?`<button class="btn-g" data-a="treinar" data-gate="questoes" data-ass="${atual.ass}" data-meta="${atual.id}" data-de="hoje" style="justify-self:start">${temQuestoes()?I('praticar',18):I('lock',18)} Treinar esta meta · ${nq} ${nq===1?'questão':'questões'}${temQuestoes()?'':' · Premium'}</button>`:''}
    </section>`;
  }else if(doDia.length){principal=`<section class="meta-card" style="background:var(--lima2)"><span class="eyebrow">Dia fechado</span><h2>${feitas} de ${doDia.length} metas concluídas. Mandou bem!</h2><p class="mu">Quer adiantar? A próxima meta do plano é ${futuras[0]?`<b>${esc(achaAss(P.conc,futuras[0].ass).a.nome)}</b>, ${quando(futuras[0].data)}`:'a revisão final'}.</p>
     <div class="btns">${futuras[0]?`<button class="btn btn-p" data-a="adiantar" data-m="${futuras[0].id}">Adiantar próxima meta</button>`:''}<button class="btn btn-s" data-a="tab" data-v="praticar">Treinar questões</button></div></section>`;
  }else{principal=`<section class="meta-card"><span class="eyebrow">Hoje está livre no seu plano</span><h2>Descanso também faz parte</h2><p class="mu">Seu próximo estudo é ${futuras[0]?`<b>${esc(achaAss(P.conc,futuras[0].ass).a.nome)}</b>, ${quando(futuras[0].data)}`:'a definir'}.</p>
     ${futuras[0]?`<button class="btn btn-p w" data-a="adiantar" data-m="${futuras[0].id}">Adiantar esta meta para hoje</button>`:''}</section>`}
  return`<div class="cols"><div class="stack" style="gap:16px">
   <section class="hero"><div class="row" style="align-items:center;position:relative;z-index:1">${ring(feitas,doDia.length)}<div class="grow stack" style="gap:4px"><span class="eyebrow">${DL[wd(HOJE)]}, ${dm(HOJE)}</span><h2 style="color:#fff">${doDia.length?`${feitas} de ${doDia.length} metas concluídas`:'Sem metas hoje'}</h2><p class="mu sm">${restMin?`Faltam ${hm(restMin)} de estudo hoje`:doDia.length?'Tudo feito por hoje':'Dia de descanso no seu plano'}</p></div></div>
    <div class="kpis"><span class="kpi">${I('fogo',16)} ${S.streak} ${S.streak===1?'dia':'dias'} seguidos</span><span class="kpi">${I('raio',16)} ${S.xp} XP</span><span class="kpi">${I('plano',16)} Prova em ${diasAte(c.prova)} dias</span></div></section>
   ${atras.length?`<div class="aviso">${I('alerta')}<div class="grow"><b>${atras.length} ${atras.length===1?'meta atrasada':'metas atrasadas'} desde ${quando(atras.map(m=>m.data).sort()[0])}</b><span class="sm">O app encaixa nos próximos dias livres sem mexer no que você já concluiu.</span><button class="btn btn-s" style="justify-self:start" data-a="reorg">${I('reorg',18)} Reorganizar semana</button></div></div>`:''}
   ${principal}
   ${depois.length?`<section class="stack"><div class="between"><h3>Depois desta</h3><button class="btn-g" data-a="tab" data-v="plano">Ver semana ${I('dir',16)}</button></div>${depois.map(m=>linhaMeta(m,{data:m.data!==HOJE})).join('')}</section>`:''}
   ${doDia.filter(m=>m.ok).length?`<section class="stack"><h3>Concluídas hoje</h3>${doDia.filter(m=>m.ok).map(m=>linhaMeta(m)).join('')}</section>`:''}
  </div>
  <aside class="stack stick" style="gap:16px">
   <section class="card pad stack"><div class="between"><h3>Sua semana</h3><span class="sm mu">${semOk} de ${semMetas.length} metas</span></div>
    <div class="semana-bar">${DS.map((d,i)=>{const dd=addD(seg,i),ms=P.metas.filter(m=>m.data===dd),ok=ms.filter(m=>m.ok).length;return`<div class="d ${dd===HOJE?'hj':''}"><div class="b" title="${ok} de ${ms.length}"><i style="height:${ms.length?ok/ms.length*100:0}%"></i></div>${d}</div>`}).join('')}</div>
    <div class="prog"><i style="width:${semMetas.length?semOk/semMetas.length*100:0}%"></i></div>
    <p class="sm mu">Missão da semana: concluir ${Math.min(10,semMetas.length)} metas. ${semOk>=Math.min(10,semMetas.length)?'<b style="color:var(--ok)">Cumprida!</b>':`Faltam ${Math.min(10,semMetas.length)-semOk}.`}</p></section>
   ${temQuestoes()&&errosPend.length?`<section class="card pad stack"><div class="between"><h3>Caderno de erros</h3><span class="tag t-er">${errosPend.length} para revisar</span></div><p class="sm">O app vai trazer ${errosPend.length===1?'o tema':'os temas'} de volta em outra questão: ${[...new Set(errosPend.map(e=>achaAss(P.conc,e.ass).a.nome))].slice(0,2).map(esc).join(', ')}.</p><button class="btn btn-s w" data-a="revisarCaderno">Revisar meus erros</button></section>`:''}
   <section class="card pad lvl"><span class="n">${nv.n}</span><div class="grow stack" style="gap:6px"><b>Nível ${nv.n} · ${nv.nome}</b><div class="prog"><i style="width:${nv.pct}%"></i></div><span class="xs mu">${nv.falta} XP para o próximo nível</span></div></section>
  </aside></div>`;
};

V.plano=()=>{
  const P=prep(),c=concAtivo();
  if(!cobre(c.id))return`<div class="card empty"><div class="ico">${I('lock',26)}</div><h2>Seu cronograma fica aqui</h2><p class="mu">Visão da semana e do mês, metas concluídas, pendentes e reagendadas, e o botão para reorganizar quando a rotina apertar.</p>
    ${P.metas.length?`<p class="sm">Seu histórico está salvo: ${P.metas.filter(m=>m.ok).length} metas concluídas.</p>`:''}<button class="btn btn-p" data-a="go" data-v="plano" data-gate="estudo">Ver plano que libera o cronograma</button></div>`;
  if(!P.cfg)return`<div class="card empty"><div class="ico">${I('plano',26)}</div><h2>Monte seu cronograma</h2><p class="mu">Leva um minuto. Depois você pode ajustar quando quiser.</p><button class="btn btn-p" data-a="go" data-v="config">Montar meu plano</button></div>`;
  const seg=addD(segunda(HOJE),UI.semOff*7),fim=addD(seg,6);
  const semMetas=P.metas.filter(m=>m.data>=seg&&m.data<=fim),ok=semMetas.filter(m=>m.ok).length;
  const antes=UI.semOff===0?P.metas.filter(m=>!m.ok&&m.data<seg):[];
  const sel=UI.metaSel&&P.metas.find(m=>m.id===UI.metaSel);
  let cal;
  if(UI.planoModo==='semana'){
    cal=`<div class="between"><button class="x" data-a="sem" data-v="-1" aria-label="Semana anterior">${I('esq')}</button><div style="text-align:center"><b>${UI.semOff===0?'Esta semana':UI.semOff===1?'Próxima semana':UI.semOff===-1?'Semana passada':'Semana'}</b><p class="sm mu">${dm(seg)} a ${dm(fim)} · ${ok} de ${semMetas.length} concluídas</p></div><button class="x" data-a="sem" data-v="1" aria-label="Próxima semana">${I('dir')}</button></div>
     ${antes.length?`<section class="dia"><div class="dia-h"><b style="color:var(--at)">Atrasadas de semanas anteriores</b></div>${antes.map(m=>linhaMeta(m,{data:true})).join('')}</section>`:''}
     ${DS.map((d,i)=>{const dd=addD(seg,i),ms=P.metas.filter(m=>m.data===dd).sort((a,b)=>a.ordem-b.ordem);const min=ms.reduce((s,m)=>s+m.min,0);

    ${cfg.dias.some(Boolean)?cfg.dias.map((on,i)=>on?`<div class="tempo-li"><label for="cm${i}" style="text-transform:capitalize;font-weight:700">${DL[i]}</label><select id="cm${i}" data-cfgmin="${i}">${opts.map(o=>`<option value="${o}" ${cfg.min[i]===o?'selected':''}>${hm(o)}</option>`).join('')}</select></div>`:'').join(''):'<p class="mu sm">Escolha pelo menos um dia acima.</p>'}

     :`<div class="aviso ok">${I('check')}<div class="grow sm">Tudo cabe até a prova. A primeira volta termina em ${dmy(sim.ultimo)} e sobra tempo para revisar.</div></div>`}

  const Pp=prepPorConc(f.conc),errosP=Pp?Pp.erros.filter(e=>!e.revisado):[];

     <button class="btn btn-s w" data-a="go" data-v="banco" data-gate="questoes">Abrir banco com estes filtros</button>`

   ${P?`<section class="card pad stack"><h3>Seu desempenho</h3><div class="placar"><div><b>${P.respondidas}</b><small>respondidas</small></div><div><b style="color:var(--ok)">${P.acertos}</b><small>acertos</small></div><div><b>${P.respondidas?Math.round(P.acertos/P.respondidas*100):0}%</b><small>aproveit.</small></div></div></section>`:''}

V.treino=()=>{
  const t=UI.tr;
  if(!t)return`<div class="card empty"><b>Nenhum treino em andamento</b><button class="btn btn-p" data-a="tab" data-v="praticar">Ir para Praticar</button></div>`;
  if(!t.qs.length){const aa=t.ass?achaAss(t.conc,t.ass):null;const meta=t.meta?prep().metas.find(m=>m.id===t.meta):null;
    return`<div class="card empty" style="padding:36px 20px"><div class="ico">${I('busca',26)}</div><h2>Ainda não há questões ${aa?`de ${esc(aa.a.nome)}`:'com esses filtros'}</h2><p class="mu">O banco de exemplo não tem questões desse assunto. Volte à meta e siga pelo material, ou mude os filtros.</p>
     <div class="btns" style="width:100%;max-width:420px">${meta?`<button class="btn btn-p" data-a="voltar">Voltar à meta</button>`:''}<button class="btn btn-s" data-a="ajustarFiltros">Ajustar filtros</button></div></div>`}
  const it=t.qs[t.i],q=qDe(it.id),aa=achaAss(q.conc,q.ass),c=C(q.conc);
  const alts=q.ce?['Certo','Errado']:q.alts,letras=q.ce?['C','E']:['A','B','C','D','E'];
  return`<div class="leitor" style="max-width:760px">
   <div class="q-top"><button class="x" data-a="sairTreino" aria-label="Sair do treino">${I('x')}</button><div class="prog"><i style="width:${(t.i+(t.conf?1:0))/t.qs.length*100}%"></i></div><b class="sm" style="white-space:nowrap">${t.i+1} de ${t.qs.length}</b></div>
   ${it.rev?`<div class="aviso ok">${I('caderno')}<div class="grow sm"><b>Volta do caderno de erros.</b> Em ${dm(it.rev.data)} você errou uma questão de ${esc(aa.a.nome)}. Esta é outra questão sobre o mesmo tema.</div></div>`:''}
   <div class="tags"><span class="tag t-dark">${c.banca}</span><span class="tag t-line">${esc(aa.m.curto)} · ${esc(aa.a.nome)}</span><span class="tag t-line">${q.dif}</span><span class="tag t-line">Questão de exemplo</span></div>
   <p class="enun">${esc(q.enun)}</p>

     return`<button class="alt ${cl}" role="radio" aria-checked="${t.sel===i}" data-a="resp" data-i="${i}" ${t.conf?'disabled':''}><span class="lt">${letras[i]}</span><span style="flex:1;min-width:0">${esc(a)}</span></button>`}).join('')}</div>
   ${t.conf?`<div class="aviso ${t.sel===q.gab?'ok':'er'} pop">${I(t.sel===q.gab?'check':'x')}<div class="grow"><b>${t.sel===q.gab?'Certa! +10 XP':'Não foi dessa vez'}</b><span class="sm">Gabarito: ${letras[q.gab]}${q.ce?` (${alts[q.gab]})`:''}${t.sel!==q.gab?'. A questão foi para o seu caderno de erros.':''}</span></div></div>
     <div class="coment"><b>Comentário</b><p>${esc(q.com)}</p></div>
     <button class="btn btn-p w" data-a="proxima">${t.i+1<t.qs.length?'Próxima questão':'Ver resultado'} ${I('dir',18)}</button>`
   :`<button class="btn btn-p w" data-a="confirmarResp" ${t.sel==null?'disabled':''}>Confirmar resposta</button>`}
  </div>`;
};
ACT.ajustarFiltros=()=>{const t=UI.tr;UI.f={conc:t.conc,mat:t.mat||'',ass:'',dif:''};UI.tr=null;go('praticar',{},{raiz:true})};

V.resultado=()=>{
  const t=UI.tr;if(!t)return V.treino();
  const ac=t.res.filter(r=>r.ok).length,er=t.res.length-ac,P=prepPorConc(t.conc);
  const errAss=[...new Set(t.res.filter(r=>!r.ok).map(r=>qDe(r.id).ass))];
  const meta=t.meta&&P?P.metas.find(m=>m.id===t.meta):null;
  return`<div class="leitor" style="max-width:760px">
   <div class="stack" style="gap:4px"><span class="eyebrow">Resultado da rodada</span><h1>${ac===t.res.length?'Gabaritou!':ac>=er?'Bom treino!':'Erros mostram o caminho'}</h1></div>
   <div class="placar"><div><b style="color:var(--ok)">${ac}</b><small>acertos</small></div><div><b style="color:var(--er)">${er}</b><small>erros</small></div><div><b>${t.res.length?Math.round(ac/t.res.length*100):0}%</b><small>aproveit.</small></div></div>
   ${t.res.some(r=>r.rev)?`<div class="aviso ${t.res.filter(r=>r.rev).every(r=>r.ok)?'ok':'neutro'}">${I('caderno')}<div class="grow sm">${t.res.filter(r=>r.rev).every(r=>r.ok)?'Você acertou a questão que voltou do caderno de erros. O erro foi marcado como revisado.':'A questão de revisão ainda pegou você. O tema continua no caderno e volta numa próxima rodada.'}</div></div>`:''}
   <section class="card pad stack"><h3>Assuntos que merecem revisão</h3>${errAss.length?errAss.map(a=>{const aa=achaAss(t.conc,a);return`<div class="between" style="padding-top:10px;border-top:1px solid var(--ln)"><div><b>${esc(aa.a.nome)}</b><p class="sm mu">${esc(aa.m.nome)} · volta numa próxima rodada como outra questão</p></div><button class="btn btn-s" data-a="material" data-mat="${a}:resumo" data-de="resultado" data-gate="estudo" data-conc="${t.conc}">Abrir resumo</button></div>`}).join(''):'<p class="mu">Nenhum. Todos os assuntos desta rodada estão em dia.</p>'}</section>
   <div class="btns">${meta?`<button class="btn btn-p" data-a="voltarMeta">Voltar à meta</button>`:''}${er?`<button class="btn ${meta?'btn-s':'btn-p'}" data-a="go" data-v="caderno">Ver caderno de erros</button>`:''}<button class="btn btn-s" data-a="tab" data-v="praticar">Nova rodada</button></div>
  </div>`;
};

V.caderno=()=>{
  const P=prep(),c=concAtivo(),todos=P.erros.slice().reverse();
  const assL=[...new Set(todos.map(e=>e.ass))];const lista=todos.filter(e=>!UI.cadF||e.ass===UI.cadF);
  const pend=lista.filter(e=>!e.revisado);
  return`<button class="back" data-a="voltar">${I('esq',18)} Voltar</button>
  <div class="stack"><span class="eyebrow">Caderno de erros · ${c.sigla}</span><h1>${todos.filter(e=>!e.revisado).length} ${todos.filter(e=>!e.revisado).length===1?'erro para revisar':'erros para revisar'}</h1><p class="mu">Cada erro volta numa rodada futura como <b>outra questão sobre o mesmo tema</b>. Acertou, está revisado.</p></div>
  ${todos.length?`<div class="chips"><button class="chip" aria-pressed="${!UI.cadF}" data-a="cadF" data-v="">Todos</button>${assL.map(a=>`<button class="chip" aria-pressed="${UI.cadF===a}" data-a="cadF" data-v="${a}">${esc(achaAss(c.id,a).a.nome)}</button>`).join('')}</div>
   ${pend.length?`<button class="btn btn-p w" data-a="revisarCaderno" data-ass="${UI.cadF}">${I('play',18)} Abrir revisão${UI.cadF?` de ${esc(achaAss(c.id,UI.cadF).a.nome)}`:''}</button>`:''}
   <div class="stack">${lista.map(e=>{const q=qDe(e.qid),aa=achaAss(c.id,e.ass),L=q.ce?['C','E']:['A','B','C','D','E'];return`<div class="card stack"><div class="between"><div class="tags"><span class="tag t-line">${esc(aa.a.nome)}</span><span class="tag t-line">${dm(e.data)}</span></div>${e.revisado?'<span class="tag t-ok">Revisado</span>':'<span class="tag t-er">Pendente</span>'}</div><p class="sm">${esc(q.enun.length>160?q.enun.slice(0,160)+'…':q.enun)}</p><p class="sm"><span style="color:var(--er);font-weight:800">Você marcou ${L[e.sel]}</span> · <span style="color:var(--ok);font-weight:800">Gabarito ${L[q.gab]}</span></p></div>`}).join('')}</div>`
  :`<div class="card empty"><div class="ico">${I('caderno',26)}</div><h3>Seu caderno está vazio</h3><p class="mu sm">Quando errar uma questão, ela aparece aqui e o tema volta numa próxima rodada.</p><button class="btn btn-p" data-a="tab" data-v="praticar">Fazer uma rodada</button></div>`}`;
};

V.planos=()=>{
  const c=concAtivo();
  const linhas=[['Análise geral do edital',1,1,1,1],['Datas, etapas e retificações',1,1,1,1],['Cronograma adaptável',0,1,1,1],['Raio-X dos temas cobrados',0,1,1,1],['Perfil da banca',0,1,1,1],['Materiais de apoio',0,1,1,1],['Banco de questões comentadas',0,0,0,1],['Caderno de erros',0,0,0,1],['Concursos cobertos','Todos (só resumo)','1 escolhido','Todos','A definir']];
  const k=['gratuito','um','todos','premium'];
  return`${UI.stack.length?`<button class="back" data-a="voltar">${I('esq',18)} Voltar</button>`:''}
  <div class="stack"><span class="eyebrow">Planos</span><h1>Escolha como estudar</h1><p class="mu">Simulação: nenhum pagamento é feito no protótipo.</p></div>
  <section class="card pad between"><div><span class="eyebrow">Sua assinatura</span><h3>${PLANOS[S.plano].nome}${S.expirado?' · expirada':''}</h3><p class="sm mu">${S.plano==='um'?`Cobre o ${C(S.planoConc).sigla} · ${esc(C(S.planoConc).nome)}`:PLANOS[S.plano].abr}</p></div>${S.plano!=='gratuito'?`<span class="tag ${S.expirado?'t-at':'t-ok'}">${S.expirado?'Expirada':'Ativa'}</span>`:''}</section>
  <div class="planos">${k.map(p=>{const pl=PLANOS[p],at=S.plano===p&&!S.expirado,dest=p==='um';return`<section class="card pad plano ${at?'atual':''} ${dest&&!at?'dest':''}">
    <div class="between"><b>${pl.nome}</b>${at?'<span class="tag t-ok">Seu plano</span>':dest?'<span class="tag t-lima">Mais escolhido</span>':''}</div>
    <p class="preco">${pl.preco}<small>${pl.sufixo}</small></p><p class="sm ${dest&&!at?'':'mu'}">${p==='um'&&c?`Para ${c.sigla} ou outro que você escolher`:pl.abr}</p>
    <ul>${pl.rec.map(r=>`<li>${I('check',18)}<span>${r}</span></li>`).join('')}</ul>
    ${at?`<button class="btn btn-s w" disabled>Plano atual</button>`:p==='gratuito'?`<button class="btn btn-s w" data-a="assinar" data-plano="gratuito">Usar o gratuito</button>`:`<button class="btn ${dest?'btn-l':'btn-p'} w" data-a="sheet" data-s="checkout" data-plano="${p}">${p==='premium'?'Simular Premium':'Escolher este plano'}</button>`}
   </section>`}).join('')}</div>
  <h3>Comparação completa</h3>
  <div class="tab-wrap"><table><thead><tr><th>Recurso</th>${k.map(p=>`<th class="c">${PLANOS[p].nome}<br><span style="font-weight:600">${PLANOS[p].preco}${PLANOS[p].sufixo}</span></th>`).join('')}</tr></thead><tbody>${linhas.map(([r,...v])=>`<tr><td>${r}</td>${v.map(x=>`<td class="c">${x===1?`<span style="color:var(--ok)">${I('check',18,3).replace('class="ic"','class="ic" style="margin:auto"')}</span><span class="sr">Sim</span>`:x===0?'<span class="mu">—</span><span class="sr">Não</span>':x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};

V.perfil=()=>{
  const nv=nivel();
  return`<div class="stack"><span class="eyebrow">Perfil</span><div class="row"><span class="avatar" style="width:64px;height:64px;font-size:24px">A</span><div class="grow"><h1 style="font-size:26px">Aluno de exemplo</h1><p class="mu">Nível ${nv.n} · ${nv.nome} · ${S.xp} XP · ${S.streak} dias seguidos</p></div></div></div>
  <div class="g2">
   <section class="card pad stack"><div class="between"><h3>Assinatura</h3><span class="tag ${S.expirado?'t-at':S.plano==='gratuito'?'t-line':'t-ok'}">${S.expirado?'Expirada':S.plano==='gratuito'?'Gratuito':'Ativa'}</span></div>
    <p><b>${PLANOS[S.plano].nome}</b> · ${PLANOS[S.plano].preco}${PLANOS[S.plano].sufixo}</p><p class="sm mu">${S.plano==='um'?`Concurso coberto: ${C(S.planoConc).sigla} · ${esc(C(S.planoConc).nome)}`:S.plano==='gratuito'?'Resumo gratuito de qualquer edital':PLANOS[S.plano].abr}</p>
    <button class="btn btn-s w" data-a="go" data-v="planos">Comparar planos</button></section>
   <section class="card pad stack"><h3>Preferências de estudo</h3>${prep()&&prep().cfg?`<p class="sm">${cfgDias(prep().cfg)} · ${hm(cargaSemanal(prep().cfg))} por semana</p><p class="sm mu">Difíceis: ${prep().cfg.dificeis.map(id=>C(prep().conc).materias.find(m=>m.id===id)?.curto).filter(Boolean).join(', ')||'nenhuma'}</p><button class="btn btn-s w" data-a="editarCfg" data-gate="estudo">${I('ajuste',18)} Ajustar rotina</button>`:'<p class="sm mu">Você ainda não montou um plano para o concurso ativo.</p>'}</section>
  </div>
  <section class="card pad stack"><h3>Conquistas</h3><div class="g3">${Object.entries(BADGES).map(([k,[n,d,ic]])=>{const on=S.badges.includes(k);return`<div class="row"><span class="badge-m ${on?'':'off'}">${I(ic,24)}</span><div class="grow"><b class="sm" style="display:block">${n}</b><span class="xs mu">${on?d:'Bloqueada'}</span></div></div>`}).join('')}</div></section>
  <section class="stack"><h3>Histórico por concurso</h3>${Object.entries(S.preps).map(([k,P])=>{const c=C(P.conc);return`<button class="li" data-a="trocarPrep" data-k="${k}"><span class="seletor" style="padding:0;min-height:0;flex:none"><span class="sig">${c.sigla}</span></span><span class="grow"><span class="t" style="display:block">${esc(cargoDe(P).nome)}</span><span class="s" style="display:block">${P.metas.filter(m=>m.ok).length} metas concluídas · ${P.respondidas} questões · ${P.erros.length} no caderno · ${P.xp} XP</span></span>${k===S.ativo?'<span class="tag t-lima">Ativo</span>':I('dir',18)}</button>`}).join('')||'<p class="mu">Nenhuma preparação ainda.</p>'}</section>
  <section class="card pad stack"><h3>Suporte</h3>
   ${[['Posso trocar o concurso do plano Um Concurso?','Sim. Em Planos, escolha Um Concurso de novo e selecione outro concurso. O histórico de cada preparação fica salvo.'],['O que acontece se meu acesso acabar?','Nada é apagado. Metas, questões e caderno de erros continuam salvos e voltam quando você reativar.'],['De onde vêm as prioridades do plano?','Do peso de cada matéria no edital, da frequência dos assuntos nas provas anteriores e do que você marcou como difícil ou já estudado.']].map(([q,r])=>`<details class="acc" style="border-top:1px solid var(--ln);padding-top:10px"><summary class="between" style="min-height:40px"><b class="sm">${q}</b>${I('dir',18).replace('class="ic"','class="ic rot"')}</summary><p class="sm mu" style="padding:6px 0 4px">${r}</p></details>`).join('')}
   <div class="field"><label for="sup">Fale com a equipe</label><textarea id="sup" class="inp" placeholder="Conte sua dúvida"></textarea></div><button class="btn btn-s" data-a="suporte" style="justify-self:start">Enviar mensagem (simulação)</button></section>`;
};

// ---------- render ----------
function bloqueio(v){
  const c=concAtivo();if(!c)return'';
  const est={raiox:'Raio-X dos temas cobrados',banca:'Perfil da banca',materiais:'Materiais de apoio',leitor:'Material de apoio'}[v];
  const qst={banco:'Banco de questões',caderno:'Caderno de erros',treino:'Treino de questões'}[v];
  if(est&&!cobre(c.id))return`${['raiox','banca','materiais'].includes(v)?subnavEdital(v):''}<div class="card empty"><div class="ico">${I('lock',26)}</div><h2>${est}</h2><p class="mu">${S.expirado?'Seu acesso terminou. O histórico continua salvo.':`Este recurso não está no seu plano para o ${c.sigla}.`}</p><button class="btn btn-p" data-a="go" data-v="${v==='leitor'?'materiais':v}" data-gate="estudo">Ver o plano que libera</button><button class="btn-g" data-a="tab" data-v="edital">Voltar ao resumo gratuito</button></div>`;
  if(qst&&!temQuestoes()&&!(v==='treino'&&!UI.tr))return`<div class="card empty"><div class="ico">${I('lock',26)}</div><h2>${qst}</h2><p class="mu">Faz parte do Premium com Questões.</p><button class="btn btn-p" data-a="go" data-v="praticar" data-gate="questoes">Simular Premium</button></div>`;
  return'';
}
const $=s=>document.querySelector(s);
function topo(){
  const P=prep(),c=concAtivo();
  if(!P)return`<div class="top-in"><span class="logo-m" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">${LOGO(36)}<span style="display:grid;line-height:1.15"><b>Concurso com Líbero</b><small class="mu" style="font-size:12.5px">por Líbero Filho</small></span></span><button class="demo-b" data-a="sheet" data-s="demo" aria-label="Painel de demonstração">${I('ajuste',18)}<span>Demo</span></button></div>`;
  return`<div class="top-in">
   <button class="seletor" data-a="sheet" data-s="seletor" aria-label="Trocar concurso. Ativo: ${c.sigla}, ${esc(cargoDe(P).nome)}"><span class="sig">${c.sigla}</span><span class="tx"><b>${esc(cargoDe(P).curto)}</b><small>${cobre(c.id)?PLANOS[S.plano].nome:S.expirado?'Acesso expirado':'Resumo gratuito'}</small></span>${I('baixo',18)}</button>
   <span class="xp fogo" title="Dias seguidos estudando">${I('fogo',16)}${S.streak}</span>
   <span class="xp" title="Pontos de experiência">${I('raio',16)}${S.xp}</span><button class="demo-b" data-a="sheet" data-s="demo" aria-label="Painel de demonstração">${I('ajuste',18)}<span>Demo</span></button>
   <button class="avatar" data-a="go" data-v="perfil" aria-label="Abrir perfil">A</button></div>`;
}
function lateral(){
  const P=prep(),tab=TAB[UI.view],c=concAtivo(),cb=c&&cobre(c.id);
  const nv=[['hoje','Hoje','hoje'],['edital','Edital','edital'],['plano','Meu Plano','plano'],['praticar','Praticar','praticar']];
  const sec=[['materiais','Materiais','camadas','estudo'],['raiox','Raio-X','barras','estudo'],['banca','Perfil da banca','martelo','estudo'],['caderno','Caderno de erros','caderno','questoes'],['planos','Planos','cartao','']];
  return`<div class="logo">${LOGO(40,'#D9F575','#163D30')}<div><b>Concurso com Líbero</b><span>por Líbero Filho</span></div></div>
   ${P?`<button class="seletor" data-a="sheet" data-s="seletor"><span class="sig">${c.sigla}</span><span class="tx"><b>${esc(cargoDe(P).curto)}</b><small>${cb?PLANOS[S.plano].nome:S.expirado?'Acesso expirado':'Resumo gratuito'}</small></span>${I('baixo',18)}</button>
   <nav>${nv.map(([v,l,ic])=>`<button class="nv" data-a="tab" data-v="${v}" ${tab===v?'aria-current="page"':''}>${I(ic)}${l}</button>`).join('')}</nav>
   <span class="lbl">Recursos</span><nav>${sec.map(([v,l,ic,g])=>{const ok=!g||(g==='questoes'?temQuestoes():cb);return`<button class="nv" data-a="go" data-v="${v}" ${g?`data-gate="${g}"`:''} ${UI.view===v?'aria-current="page"':''}>${I(ic)}${l}${ok?'':`<span class="lk">${I('lock',16)}</span>`}</button>`}).join('')}</nav>`
   :`<nav><button class="nv" aria-current="page">${I('busca')}Catálogo</button><button class="nv" data-a="go" data-v="planos">${I('cartao')}Planos</button></nav>`}
   <div class="rodape"><button class="nv" data-a="sheet" data-s="demo" style="border:1.5px dashed rgba(255,255,255,.35)">${I('ajuste')}Painel de demonstração</button>${P?`<button class="nv" data-a="go" data-v="perfil" ${UI.view==='perfil'?'aria-current="page"':''}>${I('usuario')}Perfil · ${S.xp} XP</button>`:''}</div>`;
}
function navInferior(){
  const tab=TAB[UI.view];
  return[['hoje','Hoje','hoje'],['edital','Edital','edital'],['plano','Meu Plano','plano'],['praticar','Praticar','praticar']].map(([v,l,ic])=>`<button data-a="tab" data-v="${v}" ${tab===v?'aria-current="page"':''}><span class="pill">${I(ic,22)}</span>${l}</button>`).join('');
}
function render(topoScroll){
  if(!UI.view)UI.view=S.ativo?'hoje':'catalogo';
  if(!S.ativo&&!['catalogo','concurso','planos'].includes(UI.view))UI.view='catalogo';
  const focoId=document.activeElement&&document.activeElement.id;
  const main=$('#main');const f=V[UI.view]||V.hoje;
  main.innerHTML=`<div class="wrap">${bloqueio(UI.view)||f(UI.p)}</div>`;
  renderChrome();
  if(topoScroll){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true})}
  else if(focoId){const el=document.getElementById(focoId);if(el)el.focus({preventScroll:true})}
  if(UI.sheet)renderSheet();
  window.claude?.hot?.snapshot?.(()=>({S,view:UI.view,p:UI.p}));
}
function renderChrome(){
  const semNav=!S.ativo||UI.view==='treino';
  $('#top').innerHTML=topo();$('#side').innerHTML=lateral();
  $('#bnav').innerHTML=navInferior();$('#bnav').hidden=semNav;
  $('#top').hidden=UI.view==='treino'&&!matchMedia('(min-width:1024px)').matches;
  document.body.classList.toggle('sem-nav',semNav);
}
function renderAll(){render()}
let tt;
function toast(msg,xp=0,ic){
  const t=$('#toast');clearTimeout(tt);
  t.innerHTML=`<div class="toast" role="status">${ic?I(ic,18):''}${xp?`<span class="xpb">+${xp} XP</span>`:''}<span>${esc(msg)}</span></div>`;
  tt=setTimeout(()=>t.innerHTML='',2800);
}
// trocar de aba rola até o topo; navegação dentro do app mantém foco no conteúdo
const start=(h)=>{if(h&&h.S){S=h.S;UI.view=h.view;UI.p=h.p||{}}render(true)};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
</script>
