<title>Concurso com Líbero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de estudos mobile-first, superfícies brancas com borda fina e um único bloco verde sólido para o que é ação agora.
   Celular = topo simples + navegação inferior branca. Desktop (≥1024px) = menu lateral branco e colunas lado a lado. */
:root{
  --bg:#F6F7F2; --sf:#FFFFFF; --sf2:#F0F3EB; --sf3:#E6EBE0;
  --ln:#E1E6DA; --ln2:#C9D2C2;
  --tx:#14251F; --mu:#4D5D55; --mu2:#6E7D75;
  --verde:#163D30; --verde2:#1E4F3D; --verde3:#2E7052;
  --lima:#D9F575; --lima2:#F2FAD3;
  --ok:#1B6E44; --okbg:#E3F2E8; --at:#8A5200; --atbg:#FDF0D8; --er:#B3352A; --erbg:#FCE7E3;
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.18;text-wrap:balance;font-weight:700;letter-spacing:-.022em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17.5px;letter-spacing:-.012em} h4{font-size:16px}
p{margin:0}
a{color:var(--verde2);font-weight:700}
ul{margin:0;padding-left:20px}
.ic{flex:none;display:block}
:focus-visible{outline:2.5px solid var(--verde3);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
#main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mu{color:var(--mu)} .mu2{color:var(--mu2)} .sm{font-size:14.5px} .xs{font-size:13px}
.num{font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.eyebrow{font-size:13.5px;font-weight:600;color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--verde3));flex:none;display:inline-block}

/* casca */
.shell{min-height:100%}
.side{display:none}
.main{min-width:0;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(246,247,242,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:6px;max-width:1120px;margin:0 auto;min-height:48px}
.sel{display:flex;align-items:center;gap:10px;min-height:48px;min-width:0;flex:1;padding:4px 8px 4px 0;border-radius:12px}
.sig{flex:none;width:40px;height:40px;border-radius:10px;background:var(--verde);color:var(--lima);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:-.01em;line-height:1}
.sig.g{width:52px;height:52px;border-radius:12px;font-size:13px}
.sel .tx{min-width:0;display:grid;line-height:1.25;flex:1}
.sel b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.sel small{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-s{display:flex;align-items:center;gap:4px;height:40px;padding:0 8px;font-weight:700;font-size:14.5px;flex:none;color:var(--tx);font-variant-numeric:tabular-nums}
.stat-s .ic{color:var(--verde3)}
.stat-s.fogo .ic{color:#C2540A}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--verde);color:#fff;font-weight:700;font-size:15px}
.demo-b{height:40px;padding:0 10px;border-radius:10px;border:1px dashed var(--ln2);color:var(--mu);font-size:13px;font-weight:600;flex:none}
.content{padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px;min-width:0;animation:fade .2s ease}
.wrap>*{min-width:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--mu2);position:relative}
.bnav button[aria-current=page]{color:var(--verde);font-weight:700}
.bnav button[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--verde)}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.side .logo b{display:block;font-size:15.5px;line-height:1.15}
.side .logo span{font-size:13px;color:var(--mu)}
.side nav{display:grid;gap:2px}
.side .nv{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-weight:600;color:var(--mu);font-size:15px}
.side .nv .ic{color:var(--mu2)}
.side .nv:hover{background:var(--sf2);color:var(--tx)}
.side .nv[aria-current=page]{background:var(--sf2);color:var(--verde);font-weight:700}
.side .nv[aria-current=page] .ic{color:var(--verde)}
.side .nv .lk{margin-left:auto}
.side .nv .pr{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--at);background:var(--atbg);padding:2px 7px;border-radius:5px}
.side .lbl{font-size:12.5px;color:var(--mu2);padding:20px 12px 6px;font-weight:600}
.side .rodape{margin-top:auto;display:grid;gap:4px;padding-top:16px;border-top:1px solid var(--ln)}
.side .sel{border:1px solid var(--ln);padding:6px 10px 6px 6px;margin-bottom:16px;flex:none}
@media(min-width:1024px){
  .shell{display:grid;grid-template-columns:264px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px}
  .bnav{display:none}
  .main{padding-bottom:48px}
  .top .sel,.top .logo-m,.top .demo-b{display:none}
  .top-in{justify-content:flex-end}
  .content{padding-block:28px 40px;padding-left:40px;padding-right:40px}
  h1{font-size:32px}
}
@media(max-width:400px){.stat-s.fogo{display:none}}

/* blocos */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px;min-width:0}
.card.pad{padding:22px}
.card.soft{background:var(--sf2);border-color:transparent}
.dark{background:var(--verde);color:#fff;border-radius:20px;padding:22px;display:grid;gap:16px;min-width:0}
.dark .eyebrow{color:var(--lima)}
.dark .mu{color:rgba(255,255,255,.8)}
.dark .mu2{color:rgba(255,255,255,.66)}
.stack{display:grid;gap:12px;min-width:0;align-content:start}
.stack>*{min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.g2{display:grid;gap:16px;min-width:0}
@media(min-width:760px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cols{display:grid;gap:20px;min-width:0}
.cols>*{min-width:0}
@media(min-width:1024px){.cols{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}.cols>.stick{position:sticky;top:84px}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h3{font-size:18px}
.hr{height:1px;background:var(--ln);border:0;margin:0}
.ilus{font-size:13px;color:var(--mu2);display:flex;gap:6px;align-items:center}
.ilus::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;opacity:.6}

.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;line-height:1.15;text-align:center;transition:background .15s,border-color .15s}
.btn-p{background:var(--verde);color:#fff}
.btn-p:hover{background:var(--verde2)}
.btn-l{background:var(--lima);color:var(--verde)}
.btn-l:hover{background:#E3F99A}
.btn-s{background:var(--sf);color:var(--verde);border:1px solid var(--ln2)}
.btn-s:hover{border-color:var(--verde3)}
.btn-o{color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn-o:hover{background:rgba(255,255,255,.08)}
.btn-g{min-height:44px;padding:0 4px;color:var(--verde3);font-weight:700;display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-size:15px}
.btn-g:hover{text-decoration:underline;text-underline-offset:3px}
.dark .btn-g{color:var(--lima)}
.btn.w{width:100%}
.btn.sm{min-height:42px;font-size:14.5px;padding:0 14px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns>.btn{flex:1 1 170px}
.links{display:flex;flex-wrap:wrap;gap:4px 18px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:6px;line-height:1.35;background:var(--sf2);color:var(--mu);white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)} .t-at{background:var(--atbg);color:var(--at)} .t-er{background:var(--erbg);color:var(--er)}
.t-lima{background:var(--lima2);color:var(--verde2)} .t-dark{background:var(--verde);color:#fff} .t-line{background:transparent;border:1px solid var(--ln);color:var(--mu)}
.t-pr{background:#FFF4D6;color:#7A4A00}
.dark .tag{background:rgba(255,255,255,.12);color:#fff}
.dark .t-lima{background:var(--lima);color:var(--verde)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.meta-l{font-size:14.5px;color:var(--mu);display:flex;flex-wrap:wrap;gap:2px 0}
.meta-l>span:not(:last-child)::after{content:"·";margin:0 7px;color:var(--mu2)}
.dark .meta-l{color:rgba(255,255,255,.8)}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--atbg);color:#4A2E00}
.aviso.er{background:var(--erbg);color:#5A1A12}
.aviso.ok{background:var(--okbg);color:#0F3D25}
.aviso.neutro{background:var(--sf2);color:var(--tx)}
.aviso .grow{display:grid;gap:6px}
.prog{height:8px;border-radius:999px;background:var(--sf3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde3);border-radius:999px;transition:width .5s ease}
.dark .prog{background:rgba(255,255,255,.16)} .dark .prog i{background:var(--lima)}
.bar{height:8px;border-radius:999px;background:var(--sf3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--c,var(--verde3));border-radius:999px}
.bar .corte{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.stats>div{background:var(--sf);padding:12px 14px;min-width:0;display:grid;gap:2px}
.stats small{font-size:12.5px;color:var(--mu);font-weight:600}
.stats b{font-size:clamp(15px,4.2vw,20px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.dark .stats{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.14)}
.dark .stats>div{background:var(--verde)}
.dark .stats small{color:rgba(255,255,255,.72)}
.kv{display:grid}
.kv>div{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.kv>div:first-child{border-top:0;padding-top:4px}
.kv dt{font-size:14px;color:var(--mu);margin:0}
.kv dd{margin:0;font-weight:600}

/* listas */
.list{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.list>*+*{border-top:1px solid var(--ln)}
.ri{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;width:100%;text-align:left;min-width:0}
button.ri:hover{background:#FAFBF7}
.ri.sel{background:var(--lima2)}
.ri .t{font-weight:700;line-height:1.3;display:block}
.ri .s{font-size:14px;color:var(--mu);line-height:1.4;display:block}
.ri.feita .t{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(20,37,31,.3)}
.ri .min{font-size:13.5px;color:var(--mu);font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.li{display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;width:100%;min-width:0;text-align:left}
button.li:hover{border-color:var(--ln2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;line-height:1.3;display:block}
.li .s{font-size:14px;color:var(--mu);line-height:1.4;display:block}
.chev{color:var(--mu2);flex:none}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--ln2);color:transparent}
.st.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st.at{border-color:var(--at);color:var(--at)}
.st.rg{border-color:var(--verde3);border-style:dashed}

/* semana */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk .d{display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mu2);padding:6px 0 8px;border-radius:12px}
.wk .d:hover{background:var(--sf2)}
.wk .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--tx)}
.wk .d.hj .n{background:var(--verde);color:#fff}
.wk .b{width:24px;height:4px;border-radius:4px;background:var(--sf3);overflow:hidden}
.wk .b i{display:block;height:100%;background:var(--verde3)}
.wk .d.off .n{color:var(--mu2)}

/* catálogo */
.search{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:12px;background:var(--sf);padding:0 14px;color:var(--mu2);border:1px solid var(--ln2)}
.search:focus-within{border-color:var(--verde3);box-shadow:0 0 0 3px rgba(46,112,82,.15)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;min-height:48px;color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:10px;background:var(--sf);border:1px solid var(--ln2);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;color:var(--mu)}
.chip[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.chip.dif[aria-pressed=true]{background:var(--atbg);border-color:var(--at);color:var(--at)}
.chip.est[aria-pressed=true]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cc{display:grid;gap:14px;text-align:left;width:100%}
.cc:hover{border-color:var(--ln2)}
.cc .sigla{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--verde)}
.cargo{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);width:100%;text-align:left}
.cargo[aria-checked=true]{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde)}
.cargo .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ln2);flex:none;display:grid;place-items:center;margin-top:2px}
.cargo[aria-checked=true] .radio{border-color:var(--verde)}
.cargo[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--verde)}
.sticky-cta{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:5;padding-top:12px;background:linear-gradient(rgba(246,247,242,0),var(--bg) 35%)}
body.sem-nav .sticky-cta{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media(min-width:1024px){.sticky-cta{bottom:16px}}

/* edital */
.tl{display:grid}
.tl>div{display:grid;grid-template-columns:16px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.tl>div::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--ln)}
.tl>div:last-child::before{display:none}
.tl .dt{width:16px;height:16px;border-radius:50%;border:2px solid var(--ln2);background:var(--sf);margin-top:3px}
.tl .passou .dt{background:var(--verde3);border-color:var(--verde3)}
.tl .prova .dt{background:var(--lima);border-color:var(--verde)}
.diff{display:grid;gap:4px}
.diff s{color:var(--er)}
.diff ins{text-decoration:none;color:var(--ok);font-weight:700}
.seg{display:flex;gap:2px;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;min-height:44px;padding:0 14px;font-weight:600;font-size:15px;color:var(--mu);display:flex;align-items:center;gap:6px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-pressed=true],.seg button[aria-current=page]{color:var(--verde);border-bottom-color:var(--verde);font-weight:700}
.seg.pill{border:0;background:var(--sf2);padding:3px;border-radius:10px}
.seg.pill button{border:0;margin:0;border-radius:8px;min-height:38px}
.seg.pill button[aria-pressed=true]{background:var(--sf);box-shadow:0 1px 2px rgba(20,37,31,.12)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 12px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mu);font-weight:600}
td.c,th.c,td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
.tab-wrap{position:relative;overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf)}
.tab-wrap table{min-width:620px}

/* raio-x */
.rk{display:grid;gap:12px;padding:14px 0;border-top:1px solid var(--ln)}
.rk:first-of-type{border-top:0}
.rk-h{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;min-height:44px}
.rk-h::-webkit-details-marker{display:none}
.rk-n{font-weight:700;width:22px;color:var(--mu2);font-variant-numeric:tabular-nums}
.rk-dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rk-dados>div{background:var(--sf2);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.rk-dados small{font-size:12.5px;color:var(--mu)}
.rk-dados b{font-size:15px}
.ass-li{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 8px;border-radius:10px;width:100%;text-align:left}
.ass-li:hover{background:var(--sf2)}
.ass-li .bar{flex:0 0 72px}
details.acc>summary{list-style:none;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc[open] .rot{transform:rotate(90deg)}
.rot{transition:transform .2s;color:var(--mu2)}

/* plano */
.dia{display:grid;gap:8px}
.dia-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.dia-h b{font-size:15px}
.dia-h .cap{text-transform:capitalize}
.folga{padding:14px 16px;border:1px dashed var(--ln2);border-radius:14px;color:var(--mu2);font-size:14px}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

function ganhar(xp,msg){

}

function confete(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!el)return;
  const r=el.getBoundingClientRect();const cores=['#D9F575','#163D30','#2F7356','#9DBB2B'];
  for(let i=0;i<18;i++){const d=document.createElement('i');d.className='burst';d.style.background=cores[i%4];d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=60+Math.random()*90;
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+40}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:700+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove();}
}

// ---------- plano de estudos ----------
const TIPOS={teoria:'Teoria',lei:'Lei seca',rev:'Revisão'};
function tituloTipo(m){if(m.tipo==='teoria')return`Teoria · parte ${m.parte} de ${m.de}`;if(m.tipo==='lei')return'Lei seca direcionada';return m.parte===1?'Revisão de 48 horas':'Revisão de 7 dias'}
function ranking(cid,cfg){
  const c=C(cid),tot=c.materias.reduce((s,m)=>s+m.peso,0),L=[];
  c.materias.forEach(m=>m.assuntos.forEach(a=>{
    let s=((m.peso/tot)+m.freq/100)/2*a.freq/100;const dif=cfg.dificeis.includes(m.id),est=cfg.estudadas.includes(m.id);
    if(dif)s*=1.6;if(est)s*=.7;L.push({a,m,s,dif,est})}));
  return L.sort((x,y)=>y.s-x.s);
}
function gerarItens(cid,cfg){
  const c=C(cid),tot=c.materias.reduce((s,m)=>s+m.peso,0);
  const filas=ranking(cid,cfg).map(L=>{
    const imp=((L.m.peso/tot)+L.m.freq/100)/2*L.a.freq/100;
    const nT=Math.max(1,Math.min(6,Math.round(2+imp*30))+(L.dif?1:0)-(L.est?1:0));
    const base={ass:L.a.id,mat:L.m.id};
    let mot=`${L.m.curto} vale ${L.m.peso} ${c.unidade} no edital (${Math.round(L.m.peso/tot*100)}% da prova) e ${L.a.freq>=100?'este é o assunto que concentra as questões dela':`este assunto aparece em ${L.a.freq}% das questões da matéria`} nas provas anteriores.`;
    if(L.dif)mot+=' Você marcou a matéria como difícil, então ela ganhou mais tempo.';
    if(L.est)mot+=' Você já estudou a matéria, então o plano encurtou a teoria.';
    const its=[];
    for(let i=1;i<=nT;i++)its.push({...base,tipo:'teoria',parte:i,de:nT,min:25,motivo:mot});
    if(L.a.lei)its.push({...base,tipo:'lei',parte:1,min:15,motivo:`A ${c.banca} cobra a letra da lei neste assunto. Leitura só dos artigos que mais caem.`});
    const dep=`${L.a.id}|teoria|${nT}`;
    its.push({...base,tipo:'rev',parte:1,min:10,dep,gap:2,motivo:'Revisão de 48 horas: fixa o que você estudou antes que esqueça.'});
    its.push({...base,tipo:'rev',parte:2,min:15,dep,gap:7,motivo:'Revisão de 7 dias: segunda passada para levar o conteúdo à memória de longo prazo.'});
    its.forEach(x=>x.key=`${x.ass}|${x.tipo}|${x.parte}`);
    return its;
  });
  const out=[],ativas=[];let prox=0;
  while(ativas.length<3&&prox<filas.length)ativas.push(filas[prox++]);
  while(ativas.length){
    for(let i=0;i<ativas.length;){const f=ativas[i];out.push(f.shift());
      if(!f.length){ativas.splice(i,1);if(prox<filas.length){ativas.splice(i,0,filas[prox++]);i++}}else i++;}
  }
  out.forEach((x,i)=>{x.ordem=i;x.id=x.key});
  return out;
}
function agendar(itens,cfg,inicio,fim,ocupado,datas){
  const fila=itens.slice();let d=inicio;
  while(fila.length&&d<=fim){
    const w=wd(d);
    if(cfg.dias[w]){
      let rest=cfg.min[w]-(ocupado[d]||0),olhados=0;
      for(let i=0;i<fila.length&&olhados<16&&rest>=10;){
        const it=fila[i];let pode=it.min<=rest;
        if(pode&&it.dep){const dd=datas[it.dep];pode=!!dd&&addD(dd,it.gap)<=d}
        if(pode){it.data=d;datas[it.key]=d;rest-=it.min;fila.splice(i,1)}else{i++;olhados++}
      }
    }
    d=addD(d,1);
  }
  return fila;
}
function simularPlano(P,cfg,inicio=HOJE){
  const c=C(P.conc);
  const feitas=P.metas.filter(m=>m.ok);const feitasK=new Set(feitas.map(m=>m.key));
  const itens=gerarItens(P.conc,cfg).filter(x=>!feitasK.has(x.key));
  const datas={},ocupado={};feitas.forEach(m=>{datas[m.key]=m.data;if(m.data>=inicio)ocupado[m.data]=(ocupado[m.data]||0)+m.min});
  const sobra=agendar(itens,cfg,inicio,addD(c.prova,-1),ocupado,datas);
  const ag=itens.filter(x=>x.data);
  const total=itens.reduce((s,x)=>s+x.min,0),agMin=ag.reduce((s,x)=>s+x.min,0);
  return{metas:[...feitas,...ag],sobra,cobertura:total?Math.round(agMin/total*100):100,ultimo:ag.length?ag.reduce((a,x)=>x.data>a?x.data:a,inicio):inicio};
}
function aplicarPlano(P,cfg,inicio=HOJE){
  P.cfg=cfg;const r=simularPlano(P,cfg,inicio);
  P.metas=r.metas.map(m=>({ok:false,reag:null,...m}));
  P.adiadas=r.sobra.map(x=>({ass:x.ass,mat:x.mat,tipo:x.tipo,parte:x.parte,key:x.key,min:x.min}));
}

function simularReorg(P){
  const c=C(P.conc),fimSem=addD(segunda(HOJE),6);
  const pend=P.metas.filter(m=>!m.ok).slice().sort((a,b)=>((a.data<HOJE?0:1)-(b.data<HOJE?0:1))||a.data.localeCompare(b.data)||a.ordem-b.ordem);
  const clones=pend.map(m=>({...m,data:null}));
  const datas={},ocupado={};
  P.metas.filter(m=>m.ok).forEach(m=>{datas[m.key]=m.data;if(m.data>=HOJE)ocupado[m.data]=(ocupado[m.data]||0)+m.min});
  const sobra=agendar(clones,P.cfg,HOJE,addD(c.prova,-1),ocupado,datas);
  const novo={};clones.forEach(x=>novo[x.id]=x.data);
  const mud=[],depois=[];let outras=0;
  pend.forEach(m=>{const nw=novo[m.id];if(nw===m.data)return;
    const rel=m.data<=fimSem||(nw&&nw<=fimSem);
    if(m.data<=fimSem&&(!nw||nw>fimSem))depois.push({m,de:m.data,para:nw});
    else if(rel)mud.push({m,de:m.data,para:nw});else outras++;});
  return{novo,mud,depois,outras,atrasadas:pend.filter(m=>m.data<HOJE).length,semVaga:sobra.length};
}

// ---------- sessão de questões ----------
function montarSessao({conc,mat,ass,dif,n=5,ids}){
  const P=prepPorConc(conc);
  if(ids)return ids.map(id=>({id}));
  let pool=QUESTOES.filter(q=>q.conc===conc&&(!mat||q.mat===mat)&&(!ass||q.ass===ass)&&(!dif||q.dif===dif));
  const sel=[];
  if(P){
    P.erros.filter(e=>!e.revisado&&(!ass||e.ass===ass)&&(!mat||e.mat===mat)).forEach(e=>{
      if(sel.length>=n||sel.some(s=>s.rev&&s.rev.ass===e.ass))return;
      const cands=pool.filter(q=>q.ass===e.ass&&q.id!==e.qid&&!sel.some(s=>s.id===q.id));
      const alt=cands.find(q=>!P.resp[q.id])||cands.find(q=>P.resp[q.id]!=='ok')||cands[0];
      if(alt)sel.push({id:alt.id,rev:e});
    });
  }
  const resto=pool.filter(q=>!sel.some(s=>s.id===q.id)).sort((a,b)=>((P&&P.resp[a.id])?1:0)-((P&&P.resp[b.id])?1:0));
  for(const q of resto){if(sel.length>=n)break;sel.push({id:q.id})}
  return sel;
}

function concluir(id,el){
  const P=prep(),m=P.metas.find(x=>x.id===id);if(!m||m.ok)return;
  if(!cobre(P.conc)){exec({a:'marcar',m:id,gate:'estudo'});return}
  if(UI.foco&&UI.foco.m===id){UI.foco=null;clearInterval(focoT);renderFoco()}
  m.ok=true;m.okEm=HOJE;if(m.data>HOJE){m.reag=m.reag||m.data;m.data=HOJE}
  const doDia=P.metas.filter(x=>x.data===HOJE);const fechou=doDia.length&&doDia.every(x=>x.ok);
  confete(el);
  ganhar(m.tipo==='rev'?15:20,`Meta concluída: ${achaAss(P.conc,m.ass).a.nome}`);
  conquista('primeira-meta');if(fechou)conquista('dia-fechado');
  salvar();fecharSheet(true);
  if(UI.view==='leitor'){voltar()}else render();
}
function iniciarTreino(o){
  const qs=montarSessao(o);
  UI.tr={qs,i:0,sel:null,conf:false,res:[],conc:o.conc,ass:o.ass,mat:o.mat,meta:o.meta,de:o.de,inicio:Date.now()};
  go(qs.length?'treino':'treino',{},{});
}
function responder(el){
  const t=UI.tr;if(t.sel==null||t.conf)return;
  const it=t.qs[t.i],q=qDe(it.id),P=prepPorConc(q.conc);
  const certo=t.sel===q.gab;t.conf=true;t.res.push({id:q.id,ok:certo,sel:t.sel,rev:!!it.rev});
  if(P&&t.dia)P.qdia={data:HOJE,ok:certo};
  if(P){P.resp[q.id]=certo?'ok':'erro';P.respondidas++;if(certo)P.acertos++;
    if(!certo&&!P.erros.some(e=>e.qid===q.id&&!e.revisado))P.erros.push({qid:q.id,ass:q.ass,mat:q.mat,data:HOJE,sel:t.sel,revisado:false});
    if(certo&&it.rev){const e=P.erros.find(x=>x.qid===it.rev.qid&&!x.revisado);if(e){e.revisado=true;e.revEm=HOJE}conquista('volta-erro')}
  }
  if(certo){ganhar(10,'Resposta certa');conquista('primeiro-acerto');confete(el)}else{S.xp+=2;if(P)P.xp+=2}
  salvar();render();
}
function finalizarTreino(saiu){
  const t=UI.tr||{};const P=prepPorConc(t.conc);if(P&&t.res&&t.res.length){P.sessoes++;if(!saiu)ganhar(15,'Rodada concluída')}
  salvar();UI.view='resultado';UI.p={};render(true);
}

function notaEst(P,cid){
  const c=C(cid),tot=c.materias.reduce((s,m)=>s+m.peso,0);
  const pm=c.materias.map(m=>{const qs=QUESTOES.filter(q=>q.conc===cid&&q.mat===m.id&&P.resp[q.id]);const ok=qs.filter(q=>P.resp[q.id]==='ok').length;return{m,n:qs.length,ok,taxa:qs.length?Math.round(ok/qs.length*100):null}});
  const r=pm.filter(x=>x.n),pesoR=r.reduce((s,x)=>s+x.m.peso,0);
  return{pm,proj:pesoR?Math.round(r.reduce((s,x)=>s+x.m.peso*x.taxa,0)/pesoR):null,cob:Math.round(pesoR/tot*100),corte:c.corteP};
}

}

     <div class="locked"><div class="blur">${barrasNota(ex,c.corteP)}</div><div class="lk-ov"><div class="stack" style="gap:8px;justify-items:center;max-width:280px"><b>Sua nota passa da nota de corte?</b><span class="sm mu">Com as questões do Premium, o app estima sua nota por matéria e compara com o corte de ${c.hist.ano} (${c.hist.corte}, exemplo).</span><button class="btn btn-p sm" data-a="go" data-v="premium">Conhecer o Premium</button></div></div></div></section>`;

function deck(){
  const P=prep(),c=concAtivo();
  let ass=[...new Set(P.metas.filter(m=>m.ok).map(m=>m.ass))];

  const cards=[];ass.forEach(id=>{const aa=achaAss(c.id,id);aa.a.pontos.forEach(p=>{const k=p.indexOf(': ');if(k>0&&k<44)cards.push({ass:id,mat:aa.m.id,f:p.slice(0,k),b:p.slice(k+2)})})});

}

V.raiox=()=>{
  const c=concAtivo(),P=prep(),a=amostra(c);
  const mult=(id)=>{let h=0;for(const ch of id+UI.rx.per+UI.rx.banca)h=(h*31+ch.charCodeAt(0))%997;return 1+((h%9)-4)/40};
  let mats=c.materias.map(m=>({m,f:m.freq*mult(m.id)}));const s=mats.reduce((x,y)=>x+y.f,0);mats.forEach(x=>x.f=Math.round(x.f/s*100));mats.sort((x,y)=>y.f-x.f);
  const tot=c.materias.reduce((x,m)=>x+m.peso,0),max=Math.max(...mats.map(x=>x.f));
  return`${subnavEdital('raiox')}
  <section class="stack" style="gap:8px"><h1>O que mais cai no ${c.sigla}</h1><p class="mu">${a.p} ${a.p===1?'prova':'provas'} e ${a.q} ${c.unidade} analisados. <button class="btn-g" style="min-height:0;display:inline" data-a="sheet" data-s="amostra">Ver amostra</button></p></section>
  <div class="g3">
    <div class="field"><label for="rxb">Banca</label><select id="rxb" data-rx="banca"><option value="banca" ${UI.rx.banca==='banca'?'selected':''}>${c.banca}</option><option value="todas" ${UI.rx.banca==='todas'?'selected':''}>Todas as bancas</option></select></div>
    <div class="field"><label for="rxc">Cargo</label><select id="rxc" data-rx="cargo">${c.cargos.map(x=>`<option value="${x.id}" ${(UI.rx.cargo||P.cargo)===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>
    <div class="field"><label for="rxp">Período</label><select id="rxp" data-rx="per">${[['3','Últimos 3 anos'],['5','Últimos 5 anos'],['10','Últimos 10 anos']].map(([k,l])=>`<option value="${k}" ${UI.rx.per===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
  ${a.pequena?`<div class="aviso">${I('alerta')}<div class="grow sm"><b>Amostra pequena.</b> Com menos de 3 provas, a frequência pode mudar bastante. Use como pista, não como regra.</div></div>`:''}
  <section class="card pad"><div class="sec-h" style="margin-bottom:4px"><h3>Ranking de matérias</h3><span class="xs mu">toque para ver os assuntos</span></div>
   ${mats.map((x,i)=>{const cor=corMat(c.id,x.m.id);return`<details class="rk acc" ${i===0?'open':''}><summary class="rk-h"><span class="rk-n">${i+1}</span>${dotM(c.id,x.m.id)}<b class="grow">${esc(x.m.nome)}</b><span class="num sm">${x.f}%</span><span class="rot">${I('dir',18)}</span></summary>
     <div class="rk-dados"><div><small>Peso no edital</small><b>${x.m.peso} ${c.unidade} (${Math.round(x.m.peso/tot*100)}%)</b></div><div><small>Frequência nas provas</small><b>${x.f}% das ${c.unidade}</b></div></div>
     <div class="stack" style="gap:0">${x.m.assuntos.slice().sort((p,q)=>q.freq-p.freq).map(as=>{const nq=nQuest(c.id,as.id);return`<button class="ass-li" data-a="assunto" data-ass="${as.id}"><span class="grow"><b class="sm" style="display:block">${esc(as.nome)}</b><span class="xs mu">${nq?`${nq} ${nq===1?'questão':'questões'} no banco`:'sem questões no banco'}</span></span><span class="bar" style="--c:${cor}"><i style="width:${as.freq}%"></i></span><span class="sm mu num" style="width:38px;text-align:right">${as.freq}%</span></button>`}).join('')}</div>

V.leitor=p=>{
  const c=concAtivo(),P=prep(),[aid,tipo]=p.mat.split(':'),aa=achaAss(c.id,aid);
  if(!aa)return'<p>Material não encontrado.</p>';
  const meta=p.meta?P.metas.find(m=>m.id===p.meta):null;
  if(tipo==='lei')conquista('leitor');
  const titulo={resumo:'Resumo',mapa:'Mapa mental',lei:'Lei seca direcionada'}[tipo];
  let corpo='';
  if(tipo==='resumo')corpo=`<div class="card pad">${aa.a.pontos.map((t,i)=>{const [h,...r]=t.split(': ');return`<div class="pt"><span class="n">${i+1}</span>${r.length?`<b>${esc(h)}</b><span>${esc(r.join(': '))}</span>`:`<span style="grid-row:span 2">${esc(t)}</span>`}</div>`}).join('')}</div>`;
  if(tipo==='mapa')corpo=`<div class="mm"><div class="centro">${esc(aa.a.nome)}</div><div class="ramos">${aa.a.pontos.map((t,i)=>{const [h,...r]=t.split(': ');return`<div class="ramo"><b>${dotM(c.id,aa.m.id)}${r.length?esc(h):`Ponto ${i+1}`}</b><span class="sm mu">${esc(r.length?r.join(': '):t)}</span></div>`}).join('')}</div></div>`;
  if(tipo==='lei')corpo=(aa.a.lei||[]).map(([r,t])=>`<div class="lei"><span class="ref">${esc(r)}</span><p>${t}</p></div>`).join('')+'<p class="xs mu">Grifado: o trecho que a banca costuma trocar nas alternativas.</p>';
  const voltarTxt=p.foco?'Voltar ao modo foco':meta?'Voltar à meta':({materiais:'Materiais',raiox:'Raio-X',banca:'Perfil da banca',plano:'Meu plano',hoje:'Hoje',resultado:'Resultado'}[p.de]||'Voltar');
  const vAct=p.foco?'voltarFoco':'voltar',nq=nQuest(c.id,aid);
  const outros=['resumo','mapa','lei'].filter(t=>t!==tipo&&(t!=='lei'||aa.a.lei));
  return`<div class="leitor">
   <button class="back" data-a="${vAct}">${I('esq',18)} ${voltarTxt}</button>
   <section class="stack" style="gap:8px"><span class="eyebrow">${titulo} · ${esc(aa.m.nome)}</span><h1>${esc(aa.a.nome)}</h1>${meta?`<p class="sm mu">Material da meta: ${tituloTipo(meta)}, ${meta.min} min</p>`:''}</section>
   ${corpo}
   <div class="links">${outros.map(t=>`<button class="btn-g" data-a="material" data-mat="${aid}:${t}" data-meta="${meta?meta.id:''}" data-de="${p.de||''}">${{resumo:'Ver o resumo',mapa:'Ver o mapa mental',lei:'Ver a lei seca'}[t]}</button>`).join('')}</div>
   ${meta&&!meta.ok?`<section class="card pad stack"><b>Terminou a leitura?</b><button class="btn btn-p w" data-a="marcar" data-m="${meta.id}">Marcar meta como concluída</button></section>`:meta?`<div class="aviso ok">${I('check')}<div class="grow sm"><b>Meta concluída.</b></div></div>`:''}
   ${nq?(temQuestoes()?`<button class="btn btn-s w" data-a="treinar" data-gate="questoes" data-ass="${aid}" data-meta="${meta?meta.id:''}" data-de="leitor">Treinar este assunto (${nq} questões)</button>`
    :`<section class="card pad stack" style="border-color:#EAD9A8;background:#FFFBEF"><div class="between"><b>Agora, teste se ficou</b>${tagPr}</div><p class="sm mu">Há ${nq} ${nq===1?'questão comentada':'questões comentadas'} de ${esc(aa.a.nome)} no estilo ${c.banca}. Quem erra recebe o tema de volta em outra questão, 2 e 7 dias depois.</p><button class="btn btn-p" style="justify-self:start" data-a="treinar" data-gate="questoes" data-ass="${aid}" data-meta="${meta?meta.id:''}" data-de="leitor">Treinar este assunto</button></section>`):''}
  </div>`;

     <div class="links"><button class="btn-g" data-a="foco" data-m="${atual.id}">${I('timer',17)} Modo foco</button>${nq?`<button class="btn-g" data-a="treinar" data-gate="questoes" data-ass="${atual.ass}" data-meta="${atual.id}" data-de="hoje">${I('praticar',17)} Treinar esta meta (${nq})</button>`:''}</div>

V.banco=()=>{
  const f=UI.f,cid=f.conc||concAtivo().id,qs=QUESTOES.filter(q=>q.conc===cid&&(!f.mat||q.mat===f.mat)&&(!f.ass||q.ass===f.ass)&&(!f.dif||q.dif===f.dif)),P=prepPorConc(cid);
  return`<button class="back" data-a="voltar">${I('esq',18)} Praticar</button><section class="stack" style="gap:4px"><span class="eyebrow">Banco de questões · ${C(cid).sigla}</span><h1>${qs.length} ${qs.length===1?'questão':'questões'}</h1></section>
  ${qs.length?lista(qs.map(q=>{const aa=achaAss(cid,q.ass),r=P&&P.resp[q.id];return`<button class="ri" data-a="treinarIds" data-ids="${q.id}" style="align-items:flex-start"><span class="grow"><span class="s" style="margin-bottom:4px">${dotM(cid,q.mat)} ${esc(aa.a.nome)} · ${q.dif}${r?` · <b style="color:${r==='ok'?'var(--ok)':'var(--er)'}">${r==='ok'?'acertou':'errou'}</b>`:''}</span><span style="display:block;font-size:15px">${esc(q.enun.length>140?q.enun.slice(0,140)+'…':q.enun)}</span></span>${chevR()}</button>`})):`<div class="card empty"><b>Nenhuma questão com esses filtros</b><button class="btn btn-s" data-a="voltar">Ajustar filtros</button></div>`}`;
};
ACT.treinarIds=d=>{const q=qDe(d.ids);UI.tr={qs:montarSessao({ids:d.ids.split(',')}),i:0,sel:null,conf:false,res:[],conc:q.conc,de:'banco'};go('treino')};

V.treino=()=>{
  const t=UI.tr;
  if(!t)return`<div class="card empty"><b>Nenhum treino em andamento</b><button class="btn btn-p" data-a="tab" data-v="praticar">Ir para Praticar</button></div>`;
  if(!t.qs.length){const aa=t.ass?achaAss(t.conc,t.ass):null;const meta=t.meta?prep().metas.find(m=>m.id===t.meta):null;
    return`<div class="card empty" style="padding:40px 20px">${I('busca',30)}<h2>Ainda não há questões ${aa?`de ${esc(aa.a.nome)}`:'com esses filtros'}</h2><p class="mu">O banco de exemplo não tem questões desse assunto. Volte à meta e siga pelo material, ou mude os filtros.</p>
     <div class="btns" style="width:100%;max-width:420px">${meta?`<button class="btn btn-p" data-a="voltar">Voltar à meta</button>`:''}<button class="btn btn-s" data-a="ajustarFiltros">Ajustar filtros</button></div></div>`}
  const it=t.qs[t.i],q=qDe(it.id),aa=achaAss(q.conc,q.ass),c=C(q.conc);
  const alts=q.ce?['Certo','Errado']:q.alts,letras=q.ce?['C','E']:['A','B','C','D','E'];
  return`<div class="leitor ${q.ce?'ce':''}" style="margin:0 auto">
   <div class="q-top"><button class="x" data-a="sairTreino" aria-label="Sair do treino">${I('x')}</button><div class="prog"><i style="width:${(t.i+(t.conf?1:0))/t.qs.length*100}%"></i></div><span class="sm mu num">${t.i+1} de ${t.qs.length}</span></div>
   ${t.dia?`<p class="sm mu">Questão do dia · grátis em qualquer plano</p>`:t.sim?`<p class="sm mu">Simulado relâmpago</p>`:''}
   ${it.rev?`<div class="aviso ok">${I('caderno')}<div class="grow sm"><b>Volta do caderno de erros.</b> Em ${dm(it.rev.data)} você errou uma questão de ${esc(aa.a.nome)}. Esta é outra sobre o mesmo tema.</div></div>`:''}
   <div class="meta-l"><span>${c.banca}</span><span>${dotM(q.conc,q.mat)} ${esc(aa.m.curto)} · ${esc(aa.a.nome)}</span><span>${q.dif}</span></div>
   <p class="enun">${esc(q.enun)}</p>
   ${q.ce?'<p class="sm mu" style="margin-top:-6px">Julgue o item.</p>':''}
   <div class="alts" role="radiogroup" aria-label="Alternativas">${alts.map((a,i)=>{let cl='';if(t.conf){if(i===q.gab)cl='certa';else if(i===t.sel)cl='errada'}
     return`<button class="alt ${cl}" role="radio" aria-checked="${t.sel===i}" data-a="resp" data-i="${i}" ${t.conf?'disabled':''}><span class="lt">${letras[i]}</span><span style="${q.ce?'':'flex:1;'}min-width:0">${esc(a)}</span></button>`}).join('')}</div>
   ${t.conf?`<div class="fb ${t.sel===q.gab?'ok':'er'}"><h3>${t.sel===q.gab?'Resposta certa':'Resposta errada'}<span class="sm" style="font-weight:600;margin-left:auto">${t.sel===q.gab?'+10 XP':''}</span></h3><p class="sm"><b>Gabarito ${letras[q.gab]}${q.ce?` (${alts[q.gab]})`:''}.</b> ${esc(q.com)}</p>${t.sel!==q.gab?'<p class="xs">Foi para o caderno de erros. O tema volta numa próxima rodada.</p>':''}</div>
     <button class="btn btn-p w" data-a="proxima">${t.i+1<t.qs.length?'Próxima questão':'Ver resultado'}</button>`
   :`<button class="btn btn-p w" data-a="confirmarResp" ${t.sel==null?'disabled':''}>Confirmar resposta</button>`}
   <p class="ilus">Questão de exemplo, escrita no estilo da banca</p>
  </div>`;
};
ACT.ajustarFiltros=()=>{const t=UI.tr;UI.f={conc:t.conc,mat:t.mat||'',ass:'',dif:''};UI.tr=null;go('praticar',{},{raiz:true})};

V.resultado=()=>{
  const t=UI.tr;if(!t)return V.treino();
  const ac=t.res.filter(r=>r.ok).length,er=t.res.length-ac,P=prepPorConc(t.conc),pct=t.res.length?Math.round(ac/t.res.length*100):0,c=C(t.conc);
  const errAss=[...new Set(t.res.filter(r=>!r.ok).map(r=>qDe(r.id).ass))];
  const meta=t.meta&&P?P.metas.find(m=>m.id===t.meta):null,xp=ac*10+er*2+(t.res.length>1?15:0);
  let porMat='';
  if(t.sim){const g={};t.res.forEach(r=>{const q=qDe(r.id);(g[q.mat]=g[q.mat]||[0,0]);g[q.mat][1]++;if(r.ok)g[q.mat][0]++});
    porMat=`<section class="card pad stack"><h3>Nota por matéria</h3>${barrasNota(Object.entries(g).map(([m,[a,n]])=>[c.materias.find(x=>x.id===m).curto,corMat(c.id,m),Math.round(a/n*100),`· ${a}/${n}`]),c.corteP)}<p class="xs mu2">A linha preta marca a nota de corte de ${c.hist.ano} (exemplo).</p></section>`}
  return`<div class="leitor" style="margin:0 auto">
   <section class="stack" style="gap:6px"><span class="eyebrow">${t.dia?'Questão do dia':t.sim?'Simulado relâmpago':'Resultado da rodada'}</span><h1>${ac===t.res.length?'Tudo certo':ac>=er?'Bom treino':'Os erros mostram o caminho'}</h1><p class="mu">Você ganhou ${xp} XP${t.sim?` · ${Math.max(1,Math.round((Date.now()-t.inicio)/60000))} min de prova`:''}.</p></section>
   <div class="placar"><div><b style="color:var(--ok)">${ac}</b><small>acertos</small></div><div><b style="color:var(--er)">${er}</b><small>erros</small></div><div><b>${pct}%</b><small>aproveitamento</small></div></div>
   ${t.res.some(r=>r.rev)?`<div class="aviso ${t.res.filter(r=>r.rev).every(r=>r.ok)?'ok':'neutro'}">${I('caderno')}<div class="grow sm">${t.res.filter(r=>r.rev).every(r=>r.ok)?'Você acertou a questão que voltou do caderno de erros. O erro foi marcado como revisado.':'A questão de revisão ainda pegou você. O tema continua no caderno e volta numa próxima rodada.'}</div></div>`:''}
   ${porMat}
   <section class="card pad stack"><h3>Assuntos para revisar</h3>${errAss.length?lista(errAss.map(a=>{const aa=achaAss(t.conc,a);return`<button class="ri" data-a="material" data-mat="${a}:resumo" data-de="resultado" data-gate="estudo" data-conc="${t.conc}"><span class="grow"><span class="t">${esc(aa.a.nome)}</span><span class="s">${esc(aa.m.nome)} · abrir o resumo</span></span>${chevR()}</button>`})):'<p class="mu">Nenhum. Todos os assuntos desta rodada estão em dia.</p>'}</section>
   ${t.dia&&!temQuestoes()?`<section class="dark"><h2 style="color:#fff">Gostou? Há ${QUESTOES.filter(q=>q.conc===t.conc).length} questões do ${c.sigla} no banco</h2><p class="mu">No Premium você treina cada assunto depois da teoria, guarda os erros num caderno que traz o tema de volta e acompanha sua nota contra o corte.</p><button class="btn btn-l w" data-a="go" data-v="premium">Conhecer o Premium</button></section>`:''}
   <div class="btns">${meta?`<button class="btn btn-p" data-a="voltarMeta">Voltar à meta</button>`:''}${er&&temQuestoes()?`<button class="btn ${meta?'btn-s':'btn-p'}" data-a="go" data-v="caderno">Ver caderno de erros</button>`:''}<button class="btn btn-s" data-a="tab" data-v="${t.dia?'hoje':'praticar'}">${t.dia?'Voltar para Hoje':'Nova rodada'}</button></div>
  </div>`;
};
ACT.voltarMeta=()=>{const t=UI.tr;UI.tr=null;voltar();if(UI.view==='plano'){UI.metaSel=t.meta;if(!desk())abrirSheet('meta',{m:t.meta});else render()}};

V.caderno=()=>{
  const P=prep(),c=concAtivo(),todos=P.erros.slice().reverse();
  const assL=[...new Set(todos.map(e=>e.ass))];const lst=todos.filter(e=>!UI.cadF||e.ass===UI.cadF);
  const pend=lst.filter(e=>!e.revisado),nPend=todos.filter(e=>!e.revisado).length;
  return`<button class="back" data-a="voltar">${I('esq',18)} Voltar</button>
  <section class="stack" style="gap:6px"><span class="eyebrow">Caderno de erros · ${c.sigla}</span><h1>${nPend} ${nPend===1?'erro para revisar':'erros para revisar'}</h1><p class="mu">Cada erro volta numa rodada futura como outra questão sobre o mesmo tema. Acertou, está revisado.</p></section>
  ${todos.length?`<div class="chips"><button class="chip" aria-pressed="${!UI.cadF}" data-a="cadF" data-v="">Todos</button>${assL.map(a=>`<button class="chip" aria-pressed="${UI.cadF===a}" data-a="cadF" data-v="${a}">${esc(achaAss(c.id,a).a.nome)}</button>`).join('')}</div>
   ${pend.length?`<button class="btn btn-p" style="justify-self:start" data-a="revisarCaderno" data-ass="${UI.cadF}">Abrir revisão${UI.cadF?` de ${esc(achaAss(c.id,UI.cadF).a.nome)}`:''}</button>`:''}
   <div class="stack">${lst.map(e=>{const q=qDe(e.qid),aa=achaAss(c.id,e.ass),L=q.ce?['C','E']:['A','B','C','D','E'];return`<div class="card stack"><div class="between"><span class="sm mu">${dotM(c.id,aa.m.id)} ${esc(aa.a.nome)} · ${dm(e.data)}</span>${e.revisado?'<span class="tag t-ok">Revisado</span>':'<span class="tag t-er">Pendente</span>'}</div><p class="sm">${esc(q.enun.length>160?q.enun.slice(0,160)+'…':q.enun)}</p><p class="sm"><span style="color:var(--er);font-weight:700">Você marcou ${L[e.sel]}</span> · <span style="color:var(--ok);font-weight:700">gabarito ${L[q.gab]}</span></p></div>`}).join('')}</div>`
  :`<div class="card empty">${I('caderno',28)}<h3>Seu caderno está vazio</h3><p class="mu sm">Quando errar uma questão, ela aparece aqui e o tema volta numa próxima rodada.</p><button class="btn btn-p" data-a="tab" data-v="praticar">Fazer uma rodada</button></div>`}`;
};

V.flash=()=>{

  const c=concAtivo();
  if(!F.cards.length)return`<button class="back" data-a="voltar">${I('esq',18)} Voltar</button><div class="card empty">${I('cartas',28)}<h2>Sem cartões ainda</h2><p class="mu">Conclua metas e os pontos principais viram cartões de revisão.</p></div>`;
  if(F.i>=F.cards.length)return`<div class="leitor" style="margin:0 auto"><section class="stack" style="gap:6px"><span class="eyebrow">Flashcards</span><h1>${F.sim} de ${F.cards.length} na memória</h1><p class="mu">Você ganhou ${F.sim*5} XP. Os cartões que você não lembrou voltam na próxima revisão.</p></section>
    <div class="btns"><button class="btn btn-p" data-a="flash">Revisar de novo</button><button class="btn btn-s" data-a="tab" data-v="hoje">Voltar para Hoje</button></div></div>`;
  const k=F.cards[F.i],aa=achaAss(c.id,k.ass);

   <button class="flash ${F.vira?'vira':''}" data-a="virar" aria-label="Virar cartão"><div class="in">
    <div class="fc frente"><span class="sm mu">${dotM(c.id,k.mat)} ${esc(aa.a.nome)}</span><div class="stack" style="gap:8px"><span class="sm mu">O que você lembra sobre</span><h2>${esc(k.f)}?</h2></div><span class="xs mu2">Toque para ver a resposta</span></div>
    <div class="fc verso"><span class="sm mu">${esc(aa.m.curto)} · ${esc(k.f)}</span><p style="font-size:19px;font-weight:600;line-height:1.5">${esc(k.b)}</p><span class="xs mu">Você lembrou?</span></div>
   </div></button>
   <button class="btn btn-p w fc-ver" data-a="virar" ${F.vira?'hidden':''}>Ver resposta</button>
   <div class="btns fc-res" ${F.vira?'':'hidden'}><button class="btn btn-s" data-a="lembrei" data-v="0">Não lembrei</button><button class="btn btn-p" data-a="lembrei" data-v="1">Lembrei</button></div>
   <p class="ilus">Cartões gerados dos resumos dos assuntos que você já estudou</p>
  </div>`;

    ${p==='premium'?`<button class="btn-g" style="justify-self:start;${dest?'color:var(--lima)':''}" data-a="go" data-v="premium">Ver o que o Premium inclui</button>`:''}
   </section>`}).join('')}</div>
  <h3>Comparação completa</h3>
  <div class="tab-wrap"><table><thead><tr><th>Recurso</th>${k.map(p=>`<th class="c">${PLANOS[p].nome}<br><span style="font-weight:500">${PLANOS[p].preco}${PLANOS[p].sufixo}</span></th>`).join('')}</tr></thead><tbody>${linhas.map(([r,...v])=>`<tr><td>${r}</td>${v.map(x=>`<td class="c">${x===1?`<span style="color:var(--ok);display:inline-block">${I('check',18,2.5)}</span><span class="sr">Sim</span>`:x===0?'<span class="mu2">—</span><span class="sr">Não</span>':x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};

V.perfil=()=>{
  const nv=nivel(),P=prep();
  const totMetas=Object.values(S.preps).reduce((s,p)=>s+p.metas.filter(m=>m.ok).length,0),totQ=Object.values(S.preps).reduce((s,p)=>s+p.respondidas,0);
  return`<section class="row" style="gap:16px"><span class="av" style="width:64px;height:64px;font-size:24px">A</span><div class="grow"><h1 style="font-size:26px">Aluno de exemplo</h1><p class="mu">Nível ${nv.n} · ${nv.nome} · ${S.xp} XP</p></div></section>
  <div class="stats" style="--n:3"><div><small>Metas concluídas</small><b>${totMetas}</b></div><div><small>Questões</small><b>${totQ}</b></div><div><small>Dias seguidos</small><b>${S.streak}</b></div></div>
  <div class="g2">${cardConstancia()}${cardLiga(false)}</div>
  <section class="card pad stack"><div class="between"><h3>Conquistas</h3><span class="sm mu">${S.badges.length} de ${Object.keys(BADGES).length}</span></div><div class="g3">${Object.entries(BADGES).map(([k,[n,d,ic]])=>{const on=S.badges.includes(k);return`<div class="row"><span class="badge-m ${on?'':'off'}">${I(ic,20)}</span><div class="grow"><b class="sm" style="display:block">${n}</b><span class="xs mu">${on?d:'Bloqueada'}</span></div></div>`}).join('')}</div></section>
  <div class="g2">
   <section class="card pad stack"><div class="between"><h3>Assinatura</h3><span class="tag ${S.expirado?'t-at':S.plano==='gratuito'?'t-line':'t-ok'}">${S.expirado?'Expirada':S.plano==='gratuito'?'Gratuito':'Ativa'}</span></div>
    <p><b>${PLANOS[S.plano].nome}</b> · ${PLANOS[S.plano].preco}${PLANOS[S.plano].sufixo}</p><p class="sm mu">${S.plano==='um'?`Concurso coberto: ${C(S.planoConc).sigla} · ${esc(C(S.planoConc).nome)}`:S.plano==='gratuito'?'Resumo gratuito de qualquer edital':PLANOS[S.plano].abr}</p>
    <button class="btn btn-s w" data-a="go" data-v="planos">Comparar planos</button></section>
   <section class="card pad stack"><h3>Preferências de estudo</h3>${P&&P.cfg?`<p class="sm">${cfgDias(P.cfg)} · ${hm(cargaSemanal(P.cfg))} por semana</p><p class="sm mu">Difíceis: ${P.cfg.dificeis.map(id=>C(P.conc).materias.find(m=>m.id===id)?.curto).filter(Boolean).join(', ')||'nenhuma'}</p><button class="btn btn-s w" data-a="editarCfg" data-gate="estudo">Ajustar rotina</button>`:'<p class="sm mu">Você ainda não montou um plano para o concurso ativo.</p>'}</section>
  </div>
  <section class="stack" style="gap:10px"><h3>Histórico por concurso</h3>${lista(Object.entries(S.preps).map(([k,Pp])=>{const c=C(Pp.conc);return`<button class="ri" data-a="trocarPrep" data-k="${k}"><span class="sig">${c.sigla}</span><span class="grow"><span class="t">${esc(cargoDe(Pp).nome)}</span><span class="s">${Pp.metas.filter(m=>m.ok).length} metas · ${Pp.respondidas} questões · ${Pp.erros.length} no caderno</span></span>${k===S.ativo?'<span class="tag t-lima">Ativo</span>':chevR()}</button>`}))}</section>
  <section class="card pad stack"><h3>Suporte</h3>
   ${[['Posso trocar o concurso do plano Um Concurso?','Sim. Em Planos, escolha Um Concurso de novo e selecione outro concurso. O histórico de cada preparação fica salvo.'],['O que acontece se meu acesso acabar?','Nada é apagado. Metas, questões e caderno de erros continuam salvos e voltam quando você reativar.'],['De onde vêm as prioridades do plano?','Do peso de cada matéria no edital, da frequência dos assuntos nas provas anteriores e do que você marcou como difícil ou já estudado.']].map(([q,r])=>`<details class="acc" style="border-top:1px solid var(--ln);padding-top:8px"><summary class="between" style="min-height:40px"><b class="sm">${q}</b><span class="rot">${I('dir',16)}</span></summary><p class="sm mu" style="padding:4px 0 6px">${r}</p></details>`).join('')}
   <div class="field"><label for="sup">Fale com a equipe</label><textarea id="sup" class="inp" placeholder="Conte sua dúvida"></textarea></div><button class="btn btn-s sm" data-a="suporte" style="justify-self:start">Enviar mensagem (simulação)</button></section>
  <button class="btn-g" style="justify-self:start" data-a="sheet" data-s="demo">Abrir o painel de demonstração</button>`;
};

// ---------- render ----------
function bloqueio(v){
  const c=concAtivo();if(!c)return'';
  const est={raiox:'Raio-X dos temas cobrados',banca:'Perfil da banca',materiais:'Materiais de apoio',leitor:'Material de apoio',flash:'Flashcards'}[v];
  const qst={banco:'Banco de questões',caderno:'Caderno de erros',treino:'Treino de questões'}[v];
  if(est&&!cobre(c.id))return`${['raiox','banca','materiais'].includes(v)?subnavEdital(v):''}<div class="card empty">${I('lock',28)}<h2>${est}</h2><p class="mu">${S.expirado?'Seu acesso terminou. O histórico continua salvo.':`Este recurso não está no seu plano para o ${c.sigla}.`}</p><button class="btn btn-p" data-a="go" data-v="${v==='leitor'||v==='flash'?'materiais':v}" data-gate="estudo">Ver o plano que libera</button><button class="btn-g" data-a="tab" data-v="edital">Voltar ao resumo gratuito</button></div>`;
  if(qst&&!temQuestoes()&&!(v==='treino'&&(!UI.tr||UI.tr.dia)))return V.premium({embutido:1});
  return'';
}
const $=s=>document.querySelector(s);
function topo(){
  const P=prep(),c=concAtivo();
  const demo=`<button class="demo-b" data-a="sheet" data-s="demo" aria-label="Painel de demonstração">Demo</button>`;
  if(!P)return`<div class="top-in"><span class="logo-m" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">${LOGO(34)}<b>Concurso com Líbero</b></span>${demo}</div>`;
  return`<div class="top-in">
   <button class="sel" data-a="sheet" data-s="seletor" aria-label="Trocar concurso. Ativo: ${c.sigla}, ${esc(cargoDe(P).nome)}"><span class="sig">${c.sigla}</span><span class="tx"><b>${esc(cargoDe(P).curto)}</b><small>${cobre(c.id)?PLANOS[S.plano].nome:S.expirado?'Acesso expirado':'Resumo gratuito'}</small></span>${I('baixo',18)}</button>
   <span class="stat-s fogo" title="Dias seguidos estudando">${I('fogo',17)}${S.streak}</span>
   <span class="stat-s" title="Pontos de experiência">${I('raio',17)}${S.xp}</span>
   ${demo}
   <button class="av" data-a="go" data-v="perfil" aria-label="Abrir perfil">A</button></div>`;
}
function lateral(){
  const P=prep(),tab=TAB[UI.view],c=concAtivo(),cb=c&&cobre(c.id);
  const nvs=[['hoje','Hoje','hoje'],['edital','Edital','edital'],['plano','Meu Plano','plano'],['praticar','Praticar','praticar']];
  const sec=[['materiais','Materiais','camadas','estudo'],['flash','Flashcards','cartas','estudo'],['raiox','Raio-X','barras','estudo'],['banca','Perfil da banca','martelo','estudo'],['caderno','Caderno de erros','caderno','questoes'],['planos','Planos','cartao','']];
  return`<div class="logo">${LOGO(38)}<div><b>Concurso com Líbero</b><span>por Líbero Filho</span></div></div>
   ${P?`<button class="sel" data-a="sheet" data-s="seletor"><span class="sig">${c.sigla}</span><span class="tx"><b>${esc(cargoDe(P).curto)}</b><small>${cb?PLANOS[S.plano].nome:S.expirado?'Acesso expirado':'Resumo gratuito'}</small></span>${I('baixo',18)}</button>
   <nav>${nvs.map(([v,l,ic])=>`<button class="nv" data-a="tab" data-v="${v}" ${tab===v&&UI.view!=='premium'?'aria-current="page"':''}>${I(ic)}${l}</button>`).join('')}</nav>
   <span class="lbl">Recursos</span><nav>${sec.map(([v,l,ic,g])=>{const ok=!g||(g==='questoes'?temQuestoes():cb);return`<button class="nv" data-a="${v==='flash'?'flash':'go'}" data-v="${v}" ${g?`data-gate="${g}"`:''} ${UI.view===v?'aria-current="page"':''}>${I(ic)}${l}${ok?'':`<span class="lk">${I('lock',15)}</span>`}</button>`}).join('')}
    ${temQuestoes()?'':`<button class="nv" data-a="go" data-v="premium" ${UI.view==='premium'?'aria-current="page"':''}>${I('estrela')}Premium<span class="pr">Novo</span></button>`}</nav>`
   :`<nav><button class="nv" aria-current="page">${I('busca')}Catálogo</button><button class="nv" data-a="go" data-v="planos">${I('cartao')}Planos</button></nav>`}
   <div class="rodape">${P?`<button class="nv" data-a="go" data-v="perfil" ${UI.view==='perfil'?'aria-current="page"':''}>${I('usuario')}Perfil · ${S.xp} XP</button>`:''}
   <button class="nv" data-a="sheet" data-s="demo">${I('ajuste')}Painel de demonstração</button></div>`;
}
function navInferior(){
  const tab=TAB[UI.view];
  return[['hoje','Hoje','hoje'],['edital','Edital','edital'],['plano','Meu Plano','plano'],['praticar','Praticar','praticar']].map(([v,l,ic])=>`<button data-a="tab" data-v="${v}" ${tab===v?'aria-current="page"':''}>${I(ic,22,1.8)}${l}</button>`).join('');
}
function render(topoScroll){
  if(!UI.view)UI.view=S.ativo?'hoje':'catalogo';
  if(!S.ativo&&!['catalogo','concurso','planos'].includes(UI.view))UI.view='catalogo';
  const focoId=document.activeElement&&document.activeElement.id;
  const main=$('#main');const f=V[UI.view]||V.hoje;
  main.innerHTML=`<div class="wrap" ${topoScroll?'':'style="animation:none"'}>${bloqueio(UI.view)||f(UI.p)}</div>`;
  renderChrome();
  if(topoScroll){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true})}
  else if(focoId){const el=document.getElementById(focoId);if(el)el.focus({preventScroll:true})}
  if(UI.sheet)renderSheet();
  window.claude?.hot?.snapshot?.(()=>({S,view:UI.view,p:UI.p}));
}
function renderChrome(){
  const imersivo=['treino','flash'].includes(UI.view),semNav=!S.ativo||imersivo;
  $('#top').innerHTML=topo();$('#side').innerHTML=lateral();
  $('#bnav').innerHTML=navInferior();$('#bnav').hidden=semNav;
  $('#top').hidden=imersivo&&!desk();
  document.body.classList.toggle('sem-nav',semNav);
}
function renderAll(){render()}
let tt;
function toast(msg,xp=0){
  const t=$('#toast');clearTimeout(tt);
  t.innerHTML=`<div class="toast" role="status">${xp?`<span class="xpb">+${xp} XP</span>`:''}<span>${esc(msg)}</span></div>`;
  tt=setTimeout(()=>t.innerHTML='',2800);
}
const start=(h)=>{if(h&&h.S){S=h.S;UI.view=h.view;UI.p=h.p||{}}if(!S.hist)S.hist={};render(true)};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
</script>
