<title>Concurso com Líbero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
/* Layout: app de estudos mobile-first. Celular = topo com seletor, conteúdo em cards e barra de navegação flutuante.
   Desktop (≥1024px) = menu lateral escuro e colunas lado a lado (calendário + detalhe). Blocos-herói em degradê verde com brilho lima. */
:root{
  --bg:#F6F7F2; --sf:#FFFFFF; --sf2:#EEF1E8; --sf3:#E5EADF;
  --verde:#163D30; --verde2:#1F5541; --verde3:#2F7356; --deep:#0E2A20;
  --lima:#D9F575; --lima2:#F1FBCF; --lima3:#C6E85A;
  --tx:#14251F; --mu:#5E6E66; --mu2:#8A978F; --ln:#E4E8DE;
  --ok:#1D7448; --okbg:#E0F3E7; --at:#9A5B00; --atbg:#FFF0D0; --er:#C0392B; --erbg:#FDE5E1;
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --d:'Unbounded','Plus Jakarta Sans',system-ui,sans-serif;
  --r:22px; --r2:16px;
  --sh1:0 1px 2px rgba(20,37,31,.05),0 6px 20px -10px rgba(20,37,31,.14);
  --sh2:0 2px 6px rgba(20,37,31,.06),0 24px 48px -20px rgba(14,42,32,.35);
  --grad:radial-gradient(120% 130% at 100% 0%,#2F7356 0%,#1B4A39 42%,#10301F 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.12;text-wrap:balance;font-weight:800;letter-spacing:-.025em}
h1{font-size:30px} h2{font-size:23px} h3{font-size:18px;letter-spacing:-.015em} h4{font-size:16px}
p{margin:0}
a{color:var(--verde2);font-weight:700}
.ic{flex:none;display:block}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px;box-shadow:0 0 0 6px var(--lima);border-radius:10px}
[hidden]{display:none!important}
#main:focus{outline:none;box-shadow:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mu{color:var(--mu)} .sm{font-size:14.5px} .xs{font-size:13px}
.num,.dsp{font-family:var(--d);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* casca */
.shell{min-height:100%}
.side{display:none}
.main{min-width:0;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(246,247,242,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:8px;max-width:1160px;margin:0 auto}
.sel{display:flex;align-items:center;gap:10px;min-height:48px;min-width:0;flex:1;padding:4px 10px 4px 4px;border-radius:16px;background:var(--sf);box-shadow:var(--sh1)}
.sig{flex:none;width:40px;height:40px;border-radius:12px;background:var(--grad);color:var(--lima);display:grid;place-items:center;font-family:var(--d);font-weight:700;font-size:10.5px;letter-spacing:-.01em;line-height:1}
.sig.g{width:56px;height:56px;border-radius:16px;font-size:14px}
.sel .tx{min-width:0;display:grid;line-height:1.2;flex:1}
.sel b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.sel small{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pill-s{display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:999px;font-weight:800;font-size:14px;flex:none;background:var(--sf);box-shadow:var(--sh1);font-variant-numeric:tabular-nums}
.pill-s.fogo{color:#D9480F}
.pill-s.xp{background:var(--lima);color:var(--verde);box-shadow:none}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--lima3) calc(var(--p,0)*1%),var(--sf3) 0);padding:3px}
.av span{width:100%;height:100%;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.demo-b{height:40px;width:40px;border-radius:12px;border:1.5px dashed var(--verde3);color:var(--verde);display:grid;place-items:center;flex:none}
.content{padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:grid;gap:18px;min-width:0}
.wrap>*{min-width:0}
.wrap>*{animation:entra .35s cubic-bezier(.2,.8,.2,1) both}
.wrap>*:nth-child(2){animation-delay:.03s}.wrap>*:nth-child(3){animation-delay:.06s}.wrap>*:nth-child(4){animation-delay:.09s}.wrap>*:nth-child(5){animation-delay:.12s}
@keyframes entra{from{opacity:.001;transform:translateY(8px)}}

.bnav{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));height:68px;border-radius:24px;background:rgba(14,42,32,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 40px -14px rgba(14,42,32,.55);display:grid;grid-template-columns:repeat(4,1fr);padding:6px;gap:4px;max-width:520px;margin:0 auto}
.bnav button{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.66);transition:background .2s,color .2s}
.bnav button[aria-current=page]{background:var(--lima);color:var(--verde)}
.side .logo{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.side .logo b{display:block;font-size:16px;line-height:1.1;font-weight:800}
.side .logo span{font-size:12.5px;color:rgba(255,255,255,.65)}
.side nav{display:grid;gap:4px}
.side .nv{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;font-weight:700;color:rgba(255,255,255,.78);font-size:15px}
.side .nv:hover{background:rgba(255,255,255,.07);color:#fff}
.side .nv[aria-current=page]{background:var(--lima);color:var(--verde)}
.side .nv .lk{margin-left:auto;opacity:.6}
.side .lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:18px 14px 6px;font-weight:800}
.side .rodape{margin-top:auto;display:grid;gap:8px;padding-top:16px}
.side .sel{background:rgba(255,255,255,.07);box-shadow:none;color:#fff;margin-bottom:14px;flex:none}
.side .sel small{color:rgba(255,255,255,.65)}
.side .sel .sig{background:var(--lima);color:var(--verde)}
.side .mini-xp{background:rgba(255,255,255,.07);border-radius:16px;padding:14px;display:grid;gap:8px}
@media(min-width:1024px){
  .shell{display:grid;grid-template-columns:276px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;background:var(--grad);background-color:var(--deep);color:#fff;padding:22px 16px}
  .bnav{display:none}
  .main{padding-bottom:48px}
  .top .sel,.top .logo-m,.top .demo-b{display:none}
  .top-in{justify-content:flex-end}
  .content{padding-block:12px 32px;padding-left:36px;padding-right:36px}
  h1{font-size:36px}
}
@media(max-width:400px){.pill-s.fogo{display:none}}

/* blocos */
.card{background:var(--sf);border-radius:var(--r);padding:18px;box-shadow:var(--sh1);min-width:0;border:1px solid rgba(20,37,31,.04)}
.card.pad{padding:22px}
.card.flat{box-shadow:none;background:var(--sf2);border:0}
.stack{display:grid;gap:12px;min-width:0;align-content:start}
.stack>*{min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row>.grow,.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--verde3)}
.g2{display:grid;gap:16px;min-width:0}
@media(min-width:760px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cols{display:grid;gap:18px;min-width:0}
.cols>*{min-width:0}
@media(min-width:1024px){.cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}.cols>.stick{position:sticky;top:84px}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h3{font-size:19px}

.it{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--t,var(--sf2));color:var(--c,var(--verde))}
.it.dk{background:rgba(255,255,255,.12);color:var(--lima)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--verde3));flex:none;display:inline-block}

.btn{min-height:52px;padding:0 22px;border-radius:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;line-height:1.15;text-align:center;transition:transform .1s,background .15s,box-shadow .15s;letter-spacing:-.01em}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--verde);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 18px -10px rgba(22,61,48,.8)}
.btn-p:hover{background:var(--verde2)}
.btn-l{background:var(--lima);color:var(--verde);box-shadow:0 10px 22px -12px rgba(170,210,40,.9)}
.btn-l:hover{background:#E2F98C}
.btn-s{background:var(--sf);color:var(--verde);box-shadow:inset 0 0 0 1.5px var(--ln)}
.btn-s:hover{box-shadow:inset 0 0 0 1.5px var(--verde3)}
.btn-gl{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn-gl:hover{background:rgba(255,255,255,.18)}
.btn-g{min-height:44px;padding:0 10px;color:var(--verde2);font-weight:800;display:inline-flex;align-items:center;gap:6px;border-radius:12px}
.btn-g:hover{background:rgba(22,61,48,.06)}
.btn.w{width:100%}
.btn.sm{min-height:44px;font-size:14.5px;padding:0 16px;border-radius:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns>.btn{flex:1 1 170px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;line-height:1.3;background:var(--sf2);color:var(--verde);white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)} .t-at{background:var(--atbg);color:var(--at)} .t-er{background:var(--erbg);color:var(--er)}
.t-lima{background:var(--lima);color:var(--verde)} .t-dark{background:var(--verde);color:var(--lima)} .t-line{background:var(--sf);box-shadow:inset 0 0 0 1px var(--ln);color:var(--mu)}
.t-gl{background:rgba(255,255,255,.12);color:#fff}
.t-c{background:var(--t);color:var(--c)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ilus{font-size:12.5px;color:var(--mu2);display:flex;gap:6px;align-items:center;font-weight:600}
.ilus::before{content:"";width:8px;height:8px;border-radius:2px;background:repeating-linear-gradient(45deg,currentColor 0 2px,transparent 2px 4px);flex:none}

/* herói em degradê */
.hero{background:var(--grad);background-color:var(--deep);color:#fff;border-radius:28px;padding:22px;display:grid;gap:16px;position:relative;overflow:hidden;isolation:isolate;box-shadow:var(--sh2)}
.hero::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(217,245,117,.38),rgba(217,245,117,0) 68%);z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:16px 16px;-webkit-mask-image:linear-gradient(200deg,#000 10%,transparent 60%);mask-image:linear-gradient(200deg,#000 10%,transparent 60%);z-index:-1}
.hero .eyebrow{color:var(--lima)}
.hero .mu{color:rgba(255,255,255,.72)}
.hero h1,.hero h2{color:#fff}
.glass{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:rgba(255,255,255,.1);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.big-n{font-family:var(--d);font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.04em}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rv b{font-family:var(--d);font-size:22px;font-weight:700;letter-spacing:-.03em}
.ring .rv small{display:block;font-size:10.5px;font-weight:700;opacity:.75;margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.segbar{display:flex;gap:4px}
.segbar i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.16)}
.segbar i.on{background:var(--lima)}
.segbar.lt i{background:var(--sf3)} .segbar.lt i.on{background:var(--verde3)}
.motivo{background:var(--lima2);border-radius:16px;padding:12px 14px;display:grid;gap:3px;font-size:15px}
.motivo b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--verde2)}
.hero details.why{background:rgba(255,255,255,.08);border-radius:16px;padding:0 14px}
.hero details.why summary{min-height:44px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;color:var(--lima)}
.hero details.why summary::-webkit-details-marker{display:none}
.hero details.why p{padding:0 0 12px;font-size:14.5px;color:rgba(255,255,255,.85)}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--atbg);color:#4A2E00}
.aviso.er{background:var(--erbg);color:#5A1A12}
.aviso.ok{background:var(--okbg);color:#0F3D25}
.aviso.neutro{background:var(--sf2);color:var(--tx)}
.aviso .grow{display:grid;gap:6px}
.prog{height:10px;border-radius:999px;background:var(--sf3);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--verde3),#46A077);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prog.l i{background:linear-gradient(90deg,var(--lima3),var(--lima))}
.hero .prog{background:rgba(255,255,255,.14)}

/* faixa da semana */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk .d{display:grid;justify-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;padding:8px 0;border-radius:16px}
.wk .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--verde3) calc(var(--p)*1%),var(--sf3) 0);position:relative}
.wk .c::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--sf)}
.wk .c b{position:relative;font-size:14px;color:var(--tx);font-weight:800}
.wk .d.hj{background:var(--verde);color:var(--lima)}
.wk .d.hj .c{background:conic-gradient(var(--lima) calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
.wk .d.hj .c::before{background:var(--verde)}
.wk .d.hj .c b{color:#fff}
.wk .d.full .c::before{background:var(--verde3)} .wk .d.full .c b{color:#fff}
.wk .d.off{opacity:.45}
button.d:hover{background:var(--sf2)}
button.d.hj:hover{background:var(--verde2)}

/* atalhos */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--sf);border-radius:20px;padding:16px;box-shadow:var(--sh1);display:grid;gap:12px;text-align:left;align-content:start;min-height:132px;position:relative;transition:transform .15s,box-shadow .15s;border:1px solid rgba(20,37,31,.04)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.tile b{font-size:15.5px;line-height:1.2;display:block}
.tile small{font-size:13px;color:var(--mu);font-weight:600}
.tile .lk{position:absolute;top:14px;right:14px;color:var(--mu2)}

/* listas */
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;background:var(--sf);border-radius:18px;width:100%;min-width:0;box-shadow:var(--sh1);border:1px solid rgba(20,37,31,.04);transition:transform .12s}
button.li:hover{transform:translateY(-1px)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:800;line-height:1.25;display:block;letter-spacing:-.01em}
.li .s{font-size:13.5px;color:var(--mu);line-height:1.35;display:block;font-weight:500}
.li .chev{color:var(--mu2)}
.li.feita{background:var(--sf2);box-shadow:none}
.li.feita .t{text-decoration:line-through;text-decoration-color:rgba(20,37,31,.3);color:var(--mu)}
.li.sel{box-shadow:0 0 0 2px var(--verde),var(--sh1)}
.st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px var(--ln);color:transparent}
.st.ok{background:var(--ok);box-shadow:none;color:#fff}
.st.at{box-shadow:inset 0 0 0 2px var(--at);color:var(--at)}
.st.rg{background:var(--lima2);box-shadow:inset 0 0 0 2px var(--lima3);color:var(--verde)}
.tl-list{display:grid;gap:10px}

/* catálogo */
.cat-hero{padding:26px 22px}
.search{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:18px;background:var(--sf);padding:0 16px;color:var(--mu);box-shadow:0 10px 30px -16px rgba(0,0,0,.5)}
.search:focus-within{box-shadow:0 0 0 4px var(--lima)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;min-height:52px;color:var(--tx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--ln);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.chip[aria-pressed=true]{background:var(--verde);box-shadow:none;color:#fff}
.chip.dk{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff}
.chip.dk[aria-pressed=true]{background:var(--lima);color:var(--verde)}
.chip.dif[aria-pressed=true]{background:var(--atbg);box-shadow:inset 0 0 0 1.5px var(--at);color:var(--at)}
.chip.est[aria-pressed=true]{background:var(--okbg);box-shadow:inset 0 0 0 1.5px var(--ok);color:var(--ok)}
.cc{display:grid;text-align:left;width:100%;padding:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.cc:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.cc-top{background:var(--grad);background-color:var(--deep);color:#fff;padding:18px;display:grid;gap:10px;position:relative;overflow:hidden;isolation:isolate}
.cc-top::before{content:"";position:absolute;right:-50px;top:-70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(217,245,117,.3),transparent 68%);z-index:-1}
.cc-sig{font-family:var(--d);font-weight:800;font-size:34px;line-height:1;color:var(--lima);letter-spacing:-.04em}
.cc-body{padding:16px 18px 18px;display:grid;gap:12px}
.cargo{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--sf);box-shadow:var(--sh1);width:100%;text-align:left;transition:box-shadow .15s}

function confete(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!el)return;
  const r=el.getBoundingClientRect();const cores=['#D9F575','#163D30','#2F7356','#9DBB2B'];
  for(let i=0;i<18;i++){const d=document.createElement('i');d.className='burst';d.style.background=cores[i%4];d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=60+Math.random()*90;
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+40}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:700+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove();}
}

// ---------- plano de estudos ----------
const TIPOS={teoria:'Teoria',lei:'Lei seca',rev:'Revisão'};
function tituloTipo(m){if(m.tipo==='teoria')return`Teoria · parte ${m.parte} de ${m.de}`;if(m.tipo==='lei')return'Lei seca direcionada';return m.parte===1?'Revisão de 48 horas':'Revisão de 7 dias'}
function ranking(cid,cfg){
  const c=C(cid),tot=c.materias.reduce((s,m)=>s+m.peso,0),L=[];
  c.materias.forEach(m=>m.assuntos.forEach(a=>{
    let s=((m.peso/tot)+m.freq/100)/2*a.freq/100;const dif=cfg.dificeis.includes(m.id),est=cfg.estudadas.includes(m.id);
    if(dif)s*=1.6;if(est)s*=.7;L.push({a,m,s,dif,est})}));
  return L.sort((x,y)=>y.s-x.s);
}
function gerarItens(cid,cfg){
  const c=C(cid),tot=c.materias.reduce((s,m)=>s+m.peso,0);
  const filas=ranking(cid,cfg).map(L=>{
    const imp=((L.m.peso/tot)+L.m.freq/100)/2*L.a.freq/100;
    const nT=Math.max(1,Math.min(6,Math.round(2+imp*30))+(L.dif?1:0)-(L.est?1:0));
    const base={ass:L.a.id,mat:L.m.id};
    let mot=`${L.m.curto} vale ${L.m.peso} ${c.unidade} no edital (${Math.round(L.m.peso/tot*100)}% da prova) e ${L.a.freq>=100?'este é o assunto que concentra as questões dela':`este assunto aparece em ${L.a.freq}% das questões da matéria`} nas provas anteriores.`;
    if(L.dif)mot+=' Você marcou a matéria como difícil, então ela ganhou mais tempo.';
    if(L.est)mot+=' Você já estudou a matéria, então o plano encurtou a teoria.';
    const its=[];
    for(let i=1;i<=nT;i++)its.push({...base,tipo:'teoria',parte:i,de:nT,min:25,motivo:mot});
    if(L.a.lei)its.push({...base,tipo:'lei',parte:1,min:15,motivo:`A ${c.banca} cobra a letra da lei neste assunto. Leitura só dos artigos que mais caem.`});
    const dep=`${L.a.id}|teoria|${nT}`;
    its.push({...base,tipo:'rev',parte:1,min:10,dep,gap:2,motivo:'Revisão de 48 horas: fixa o que você estudou antes que esqueça.'});
    its.push({...base,tipo:'rev',parte:2,min:15,dep,gap:7,motivo:'Revisão de 7 dias: segunda passada para levar o conteúdo à memória de longo prazo.'});
    its.forEach(x=>x.key=`${x.ass}|${x.tipo}|${x.parte}`);
    return its;
  });
  const out=[],ativas=[];let prox=0;
  while(ativas.length<3&&prox<filas.length)ativas.push(filas[prox++]);
  while(ativas.length){
    for(let i=0;i<ativas.length;){const f=ativas[i];out.push(f.shift());
      if(!f.length){ativas.splice(i,1);if(prox<filas.length){ativas.splice(i,0,filas[prox++]);i++}}else i++;}
  }
  out.forEach((x,i)=>{x.ordem=i;x.id=x.key});
  return out;
}
function agendar(itens,cfg,inicio,fim,ocupado,datas){
  const fila=itens.slice();let d=inicio;
  while(fila.length&&d<=fim){
    const w=wd(d);
    if(cfg.dias[w]){
      let rest=cfg.min[w]-(ocupado[d]||0),olhados=0;
      for(let i=0;i<fila.length&&olhados<16&&rest>=10;){
        const it=fila[i];let pode=it.min<=rest;
        if(pode&&it.dep){const dd=datas[it.dep];pode=!!dd&&addD(dd,it.gap)<=d}
        if(pode){it.data=d;datas[it.key]=d;rest-=it.min;fila.splice(i,1)}else{i++;olhados++}
      }
    }
    d=addD(d,1);
  }
  return fila;
}
function simularPlano(P,cfg,inicio=HOJE){
  const c=C(P.conc);
  const feitas=P.metas.filter(m=>m.ok);const feitasK=new Set(feitas.map(m=>m.key));
  const itens=gerarItens(P.conc,cfg).filter(x=>!feitasK.has(x.key));
  const datas={},ocupado={};feitas.forEach(m=>{datas[m.key]=m.data;if(m.data>=inicio)ocupado[m.data]=(ocupado[m.data]||0)+m.min});
  const sobra=agendar(itens,cfg,inicio,addD(c.prova,-1),ocupado,datas);
  const ag=itens.filter(x=>x.data);
  const total=itens.reduce((s,x)=>s+x.min,0),agMin=ag.reduce((s,x)=>s+x.min,0);
  return{metas:[...feitas,...ag],sobra,cobertura:total?Math.round(agMin/total*100):100,ultimo:ag.length?ag.reduce((a,x)=>x.data>a?x.data:a,inicio):inicio};
}
function aplicarPlano(P,cfg,inicio=HOJE){
  P.cfg=cfg;const r=simularPlano(P,cfg,inicio);
  P.metas=r.metas.map(m=>({ok:false,reag:null,...m}));
  P.adiadas=r.sobra.map(x=>({ass:x.ass,mat:x.mat,tipo:x.tipo,parte:x.parte,key:x.key,min:x.min}));
}
const cfgPadrao=cid=>({dias:[1,1,1,1,1,0,0].map(Boolean),min:[60,60,60,60,60,120,60],dificeis:cid==='tjsp'?['adm']:['lep'],estudadas:cid==='tjsp'?['port']:[]});
const cargaSemanal=cfg=>cfg.dias.reduce((s,on,i)=>s+(on?cfg.min[i]:0),0);

function simularReorg(P){
  const c=C(P.conc),fimSem=addD(segunda(HOJE),6);
  const pend=P.metas.filter(m=>!m.ok).slice().sort((a,b)=>((a.data<HOJE?0:1)-(b.data<HOJE?0:1))||a.data.localeCompare(b.data)||a.ordem-b.ordem);
  const clones=pend.map(m=>({...m,data:null}));
  const datas={},ocupado={};
  P.metas.filter(m=>m.ok).forEach(m=>{datas[m.key]=m.data;if(m.data>=HOJE)ocupado[m.data]=(ocupado[m.data]||0)+m.min});
  const sobra=agendar(clones,P.cfg,HOJE,addD(c.prova,-1),ocupado,datas);
  const novo={};clones.forEach(x=>novo[x.id]=x.data);
  const mud=[],depois=[];let outras=0;
  pend.forEach(m=>{const nw=novo[m.id];if(nw===m.data)return;
    const rel=m.data<=fimSem||(nw&&nw<=fimSem);
    if(m.data<=fimSem&&(!nw||nw>fimSem))depois.push({m,de:m.data,para:nw});
    else if(rel)mud.push({m,de:m.data,para:nw});else outras++;});
  return{novo,mud,depois,outras,atrasadas:pend.filter(m=>m.data<HOJE).length,semVaga:sobra.length};
}

// ---------- sessão de questões ----------
function montarSessao({conc,mat,ass,dif,n=5,ids}){
  const P=prepPorConc(conc);
  if(ids)return ids.map(id=>({id}));
  let pool=QUESTOES.filter(q=>q.conc===conc&&(!mat||q.mat===mat)&&(!ass||q.ass===ass)&&(!dif||q.dif===dif));
  const sel=[];
  if(P){
    P.erros.filter(e=>!e.revisado&&(!ass||e.ass===ass)&&(!mat||e.mat===mat)).forEach(e=>{
      if(sel.length>=n||sel.some(s=>s.rev&&s.rev.ass===e.ass))return;
      const cands=pool.filter(q=>q.ass===e.ass&&q.id!==e.qid&&!sel.some(s=>s.id===q.id));
      const alt=cands.find(q=>!P.resp[q.id])||cands.find(q=>P.resp[q.id]!=='ok')||cands[0];
      if(alt)sel.push({id:alt.id,rev:e});
    });
  }
  const resto=pool.filter(q=>!sel.some(s=>s.id===q.id)).sort((a,b)=>((P&&P.resp[a.id])?1:0)-((P&&P.resp[b.id])?1:0));
  for(const q of resto){if(sel.length>=n)break;sel.push({id:q.id})}
  return sel;
}

// ---------- concluir meta / treino ----------
function concluir(id,el){
  const P=prep(),m=P.metas.find(x=>x.id===id);if(!m||m.ok)return;
  if(!cobre(P.conc)){exec({a:'marcar',m:id,gate:'estudo'});return}
  if(UI.foco&&UI.foco.m===id){UI.foco=null;clearInterval(focoT);renderFoco()}
  m.ok=true;m.okEm=HOJE;if(m.data>HOJE){m.reag=m.reag||m.data;m.data=HOJE}
  const doDia=P.metas.filter(x=>x.data===HOJE);const fechou=doDia.length&&doDia.every(x=>x.ok);
  confete(el);
  ganhar(m.tipo==='rev'?15:20,`Meta concluída: ${achaAss(P.conc,m.ass).a.nome}`);
  conquista('primeira-meta');if(fechou)conquista('dia-fechado');
  salvar();fecharSheet(true);
  if(UI.view==='leitor'){voltar()}else render();
}
function iniciarTreino(o){
  const qs=montarSessao(o);
  UI.tr={qs,i:0,sel:null,conf:false,res:[],conc:o.conc,ass:o.ass,mat:o.mat,meta:o.meta,de:o.de,inicio:Date.now()};
  go(qs.length?'treino':'treino',{},{});
}
function responder(el){
  const t=UI.tr;if(t.sel==null||t.conf)return;
  const it=t.qs[t.i],q=qDe(it.id),P=prepPorConc(q.conc);
  const certo=t.sel===q.gab;t.conf=true;t.res.push({id:q.id,ok:certo,sel:t.sel,rev:!!it.rev});
  if(P&&t.dia)P.qdia={data:HOJE,ok:certo};
  if(P){P.resp[q.id]=certo?'ok':'erro';P.respondidas++;if(certo)P.acertos++;
    if(!certo&&!P.erros.some(e=>e.qid===q.id&&!e.revisado))P.erros.push({qid:q.id,ass:q.ass,mat:q.mat,data:HOJE,sel:t.sel,revisado:false});
    if(certo&&it.rev){const e=P.erros.find(x=>x.qid===it.rev.qid&&!x.revisado);if(e){e.revisado=true;e.revEm=HOJE}conquista('volta-erro')}
  }
  if(certo){ganhar(10,'Resposta certa');conquista('primeiro-acerto');confete(el)}else{S.xp+=2;if(P)P.xp+=2}
  salvar();render();
}

V.raiox=()=>{

  let mats=c.materias.map(m=>({m,f:m.freq*mult(m.id)}));const s=mats.reduce((x,y)=>x+y.f,0);mats.forEach(x=>x.f=Math.round(x.f/s*100));mats.sort((x,y)=>y.f-x.f);

  <section class="hero"><span class="eyebrow">Raio-X dos temas cobrados</span><h1 style="font-size:28px">O que mais cai no ${c.sigla}</h1>
   <div class="stats"><div><small>Provas</small><b>${a.p}</b></div><div><small>${c.unidade}</small><b>${a.q}</b></div><div><small>Período</small><b>${UI.rx.per} anos</b></div></div>

  <div class="card stack"><div class="g3">

    <div class="field"><label for="rxc">Cargo</label><select id="rxc" data-rx="cargo">${c.cargos.map(x=>`<option value="${x.id}" ${(UI.rx.cargo||P.cargo)===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>

   ${a.pequena?`<div class="aviso">${I('alerta')}<div class="grow sm"><b>Amostra pequena.</b> Com menos de 3 provas, a frequência pode mudar bastante. Use como pista, não como regra. Tente "Todas as bancas" ou um período maior.</div></div>`:''}

   ${mats.map((x,i)=>{const cor=corMat(c.id,x.m.id);return`<details class="rk acc" ${i===0?'open':''} style="${cv(cor)}"><summary class="rk-h"><span class="rk-n">${i+1}</span><b class="grow">${esc(x.m.nome)}</b><span class="tag t-c">${x.f}%</span><span class="rot" style="color:var(--mu2)">${I('dir',18)}</span></summary>
     <div class="rk-dados"><div><small>Peso oficial no edital</small><b>${x.m.peso} ${c.unidade} · ${Math.round(x.m.peso/tot*100)}%</b><div class="bar" style="--c:var(--mu2)"><i style="width:${Math.min(100,x.m.peso/tot*100*2.5)}%"></i></div></div><div><small>Frequência nas provas</small><b>${x.f}% das ${c.unidade}</b><div class="bar"><i style="width:${x.f/max*100}%"></i></div></div></div>

  const segb=`<div class="segbar">${doDia.map(m=>`<i class="${m.ok?'on':''}"></i>`).join('')}</div>`;
  let principal;
  if(atual){const aa=achaAss(P.conc,atual.ass),nq=nQuest(c.id,atual.ass),cor=corMat(c.id,atual.mat);
    principal=`<section class="hero" id="metaAtual">

function acertoPorMateria(P,cid){
  return C(cid).materias.map(m=>{const qs=QUESTOES.filter(q=>q.conc===cid&&q.mat===m.id&&P.resp[q.id]);const ok=qs.filter(q=>P.resp[q.id]==='ok').length;return{m,n:qs.length,ok}}).filter(x=>x.n);
}

    ${pm.length?pm.map(x=>{const cor=corMat(f.conc,x.m.id),p=Math.round(x.ok/x.n*100);return`<div class="stack" style="gap:6px"><div class="between sm"><b class="row" style="gap:8px"><span class="dot" style="--c:${cor[0]}"></span>${esc(x.m.curto)}</b><span style="font-weight:800">${p}% <span class="mu" style="font-weight:600">· ${x.n}</span></span></div><div class="bar" style="--c:${cor[0]}"><i style="width:${p}%"></i></div></div>`}).join(''):'<p class="sm mu">Responda algumas questões e o seu desempenho por matéria aparece aqui.</p>'}</section>

   <p class="ilus">Questões de exemplo escritas para a demonstração, no estilo da banca.</p>

ACT.limparF=()=>{UI.f={conc:UI.f.conc};render()};

V.banco=()=>{
  const f=UI.f,cid=f.conc||concAtivo().id,qs=QUESTOES.filter(q=>q.conc===cid&&(!f.mat||q.mat===f.mat)&&(!f.ass||q.ass===f.ass)&&(!f.dif||q.dif===f.dif)),P=prepPorConc(cid);

ACT.treinarIds=d=>{const q=qDe(d.ids);UI.tr={qs:montarSessao({ids:d.ids.split(',')}),i:0,sel:null,conf:false,res:[],conc:q.conc,de:'banco'};go('treino')};

V.treino=()=>{
  const t=UI.tr;
  if(!t)return`<div class="card empty"><b>Nenhum treino em andamento</b><button class="btn btn-p" data-a="tab" data-v="praticar">Ir para Praticar</button></div>`;
  if(!t.qs.length){const aa=t.ass?achaAss(t.conc,t.ass):null;const meta=t.meta?prep().metas.find(m=>m.id===t.meta):null;
    return`<div class="card empty" style="padding:40px 20px">${tile('busca',null,60)}<h2>Ainda não há questões ${aa?`de ${esc(aa.a.nome)}`:'com esses filtros'}</h2><p class="mu">O banco de exemplo não tem questões desse assunto. Volte à meta e siga pelo material, ou mude os filtros.</p>
     <div class="btns" style="width:100%;max-width:420px">${meta?`<button class="btn btn-p" data-a="voltar">Voltar à meta</button>`:''}<button class="btn btn-s" data-a="ajustarFiltros">Ajustar filtros</button></div></div>`}
  const it=t.qs[t.i],q=qDe(it.id),aa=achaAss(q.conc,q.ass),c=C(q.conc),cor=corMat(q.conc,q.mat);
  const alts=q.ce?['Certo','Errado']:q.alts,letras=q.ce?['C','E']:['A','B','C','D','E'];
  let combo=0;for(let i=t.res.length-1;i>=0&&t.res[i].ok;i--)combo++;
  return`<div class="leitor ${q.ce?'ce':''}" style="max-width:760px;margin:0 auto">
   <div class="q-top"><button class="x" data-a="sairTreino" aria-label="Sair do treino">${I('x')}</button><div class="segbar lt">${t.qs.map((x,i)=>`<i class="${i<t.i||(i===t.i&&t.conf)?'on':''}" ${t.res[i]&&!t.res[i].ok?'style="background:var(--er)"':''}></i>`).join('')}</div><b class="sm" style="white-space:nowrap">${t.i+1}/${t.qs.length}</b></div>
   ${t.dia?`<div class="aviso neutro">${I('lampada')}<div class="grow sm"><b>Questão do dia.</b> Uma por dia, grátis em qualquer plano.</div></div>`:''}
   ${it.rev?`<div class="aviso ok">${I('caderno')}<div class="grow sm"><b>Volta do caderno de erros.</b> Em ${dm(it.rev.data)} você errou uma questão de ${esc(aa.a.nome)}. Esta é outra sobre o mesmo tema.</div></div>`:''}
   <div class="between"><div class="tags"><span class="tag t-dark">${c.banca}</span><span class="tag t-c" style="${cv(cor)}">${esc(aa.a.nome)}</span><span class="tag t-line">${q.dif}</span></div>${combo>=2?`<span class="combo">${I('fogo',16)} ${combo} seguidas</span>`:''}</div>
   <p class="enun">${esc(q.enun)}</p>
   ${q.ce?'<p class="sm mu" style="font-weight:700;margin-top:-6px">Julgue o item.</p>':''}
   <div class="alts" role="radiogroup" aria-label="Alternativas">${alts.map((a,i)=>{let cl='';if(t.conf){if(i===q.gab)cl='certa';else if(i===t.sel)cl='errada'}
     return`<button class="alt ${cl}" role="radio" aria-checked="${t.sel===i}" data-a="resp" data-i="${i}" ${t.conf?'disabled':''}>${q.ce?`<span class="lt">${I(i?'x':'check',16,3)}</span>`:`<span class="lt">${letras[i]}</span>`}<span style="${q.ce?'':'flex:1;'}min-width:0">${esc(a)}</span></button>`}).join('')}</div>
   ${t.conf?`<div class="fb ${t.sel===q.gab?'ok':'er'}"><h3>${I(t.sel===q.gab?'check':'x',22,3)} ${t.sel===q.gab?'Certa! +10 XP':'Não foi dessa vez'}</h3><p class="sm"><b>Gabarito: ${letras[q.gab]}${q.ce?` (${alts[q.gab]})`:''}.</b> ${esc(q.com)}</p>${t.sel!==q.gab?'<p class="xs" style="font-weight:700">Foi para o caderno de erros. O tema volta numa próxima rodada.</p>':''}
     <button class="btn btn-p w" data-a="proxima">${t.i+1<t.qs.length?'Continuar':'Ver resultado'} ${I('seta',18)}</button></div>`
   :`<button class="btn btn-p w" data-a="confirmarResp" ${t.sel==null?'disabled':''}>Confirmar resposta</button>`}
   <span class="ilus">Questão de exemplo, escrita no estilo da banca</span>
  </div>`;
};
ACT.ajustarFiltros=()=>{const t=UI.tr;UI.f={conc:t.conc,mat:t.mat||'',ass:'',dif:''};UI.tr=null;go('praticar',{},{raiz:true})};

V.resultado=()=>{
  const t=UI.tr;if(!t)return V.treino();
  const ac=t.res.filter(r=>r.ok).length,er=t.res.length-ac,P=prepPorConc(t.conc),pct=t.res.length?Math.round(ac/t.res.length*100):0;
  const errAss=[...new Set(t.res.filter(r=>!r.ok).map(r=>qDe(r.id).ass))];
  const meta=t.meta&&P?P.metas.find(m=>m.id===t.meta):null,xp=ac*10+er*2+(t.res.length>1?15:0);
  return`<div class="leitor" style="max-width:760px;margin:0 auto">
   <section class="hero" style="justify-items:center;text-align:center"><span class="eyebrow">${t.dia?'Questão do dia':'Resultado da rodada'}</span>${ringPct(pct,128,'#D9F575','rgba(255,255,255,.16)','acerto')}<h1 style="font-size:26px">${ac===t.res.length?'Gabaritou!':ac>=er?'Bom treino!':'Erros mostram o caminho'}</h1><div class="kpis" style="justify-content:center"><span class="kpi" style="background:var(--lima);color:var(--verde)">${I('raio',15)} +${xp} XP</span><span class="kpi">${I('fogo',15)} ${S.streak} dias seguidos</span></div></section>
   <div class="placar"><div><b style="color:var(--ok)">${ac}</b><small>acertos</small></div><div><b style="color:var(--er)">${er}</b><small>erros</small></div><div><b>${t.res.length}</b><small>questões</small></div></div>
   ${t.res.some(r=>r.rev)?`<div class="aviso ${t.res.filter(r=>r.rev).every(r=>r.ok)?'ok':'neutro'}">${I('caderno')}<div class="grow sm">${t.res.filter(r=>r.rev).every(r=>r.ok)?'Você acertou a questão que voltou do caderno de erros. O erro foi marcado como revisado.':'A questão de revisão ainda pegou você. O tema continua no caderno e volta numa próxima rodada.'}</div></div>`:''}
   <section class="card pad stack"><h3>Assuntos que merecem revisão</h3>${errAss.length?errAss.map(a=>{const aa=achaAss(t.conc,a);return`<div class="row" style="padding-top:12px;border-top:1px solid var(--ln);flex-wrap:wrap">${tile('alerta',corMat(t.conc,aa.m.id),40)}<div class="grow" style="min-width:160px"><b>${esc(aa.a.nome)}</b><p class="sm mu">Volta numa próxima rodada como outra questão</p></div><button class="btn btn-s sm" data-a="material" data-mat="${a}:resumo" data-de="resultado" data-gate="estudo" data-conc="${t.conc}">Abrir resumo</button></div>`}).join(''):'<p class="mu">Nenhum. Todos os assuntos desta rodada estão em dia.</p>'}</section>
   <div class="btns">${meta?`<button class="btn btn-p" data-a="voltarMeta">Voltar à meta</button>`:''}${er&&temQuestoes()?`<button class="btn ${meta?'btn-s':'btn-p'}" data-a="go" data-v="caderno">Ver caderno de erros</button>`:''}<button class="btn btn-s" data-a="tab" data-v="${t.dia?'hoje':'praticar'}">${t.dia?'Voltar para Hoje':'Nova rodada'}</button></div>
  </div>`;
};
ACT.voltarMeta=()=>{const t=UI.tr;UI.tr=null;voltar();if(UI.view==='plano'){UI.metaSel=t.meta;if(!desk())abrirSheet('meta',{m:t.meta});else render()}};

V.caderno=()=>{
  const P=prep(),c=concAtivo(),todos=P.erros.slice().reverse();
  const assL=[...new Set(todos.map(e=>e.ass))];const lista=todos.filter(e=>!UI.cadF||e.ass===UI.cadF);

  <section class="hero"><span class="eyebrow">Caderno de erros · ${c.sigla}</span><div class="row" style="gap:16px">${ringPct(todos.length?Math.round(nRev/todos.length*100):0,84,'#D9F575','rgba(255,255,255,.16)','revisado')}<div class="grow"><h2>${nPend} ${nPend===1?'erro para revisar':'erros para revisar'}</h2><p class="mu sm">Cada erro volta numa rodada futura como outra questão sobre o mesmo tema. Acertou, está revisado.</p></div></div>
   ${pend.length?`<button class="btn btn-l w" data-a="revisarCaderno" data-ass="${UI.cadF}">${I('play',18)} Abrir revisão${UI.cadF?` de ${esc(achaAss(c.id,UI.cadF).a.nome)}`:''}</button>`:''}</section>
  ${todos.length?`<div class="chips"><button class="chip" aria-pressed="${!UI.cadF}" data-a="cadF" data-v="">Todos</button>${assL.map(a=>`<button class="chip" aria-pressed="${UI.cadF===a}" data-a="cadF" data-v="${a}">${esc(achaAss(c.id,a).a.nome)}</button>`).join('')}</div>
   <div class="tl-list">${lista.map(e=>{const q=qDe(e.qid),aa=achaAss(c.id,e.ass),L=q.ce?['C','E']:['A','B','C','D','E'];return`<div class="card stack"><div class="between"><div class="tags"><span class="tag t-c" style="${cv(corMat(c.id,aa.m.id))}">${esc(aa.a.nome)}</span><span class="tag t-line">${dm(e.data)}</span></div>${e.revisado?'<span class="tag t-ok">Revisado</span>':'<span class="tag t-er">Pendente</span>'}</div><p class="sm">${esc(q.enun.length>160?q.enun.slice(0,160)+'…':q.enun)}</p><div class="tags"><span class="tag t-er">Você marcou ${L[e.sel]}</span><span class="tag t-ok">Gabarito ${L[q.gab]}</span></div></div>`}).join('')}</div>`
  :`<div class="card empty">${tile('caderno',PAL[3],56)}<h3>Seu caderno está vazio</h3><p class="mu sm">Quando errar uma questão, ela aparece aqui e o tema volta numa próxima rodada.</p><button class="btn btn-p" data-a="tab" data-v="praticar">Fazer uma rodada</button></div>`}`;
};

    <div class="fc verso"><span class="tag t-c" style="justify-self:start;${cv(cor)}">${esc(aa.m.curto)}</span><div class="stack" style="gap:8px"><span class="eyebrow">${esc(k.f)}</span><p style="font-size:19px;font-weight:600;line-height:1.5">${esc(k.b)}</p></div><span class="xs mu" style="font-weight:700">Você lembrou?</span></div>
   </div></button>
   <button class="btn btn-p w" data-a="virar" ${F.vira?'hidden':''}>Ver resposta</button>
   <div class="btns fc-res" ${F.vira?'':'hidden'}><button class="btn btn-s" data-a="lembrei" data-v="0">${I('x',18)} Não lembrei</button><button class="btn btn-p" data-a="lembrei" data-v="1">${I('check',18)} Lembrei</button></div>
   <p class="ilus">Cartões gerados dos resumos dos assuntos que você já estudou</p>

V.planos=()=>{
  const c=concAtivo();
  const linhas=[['Análise geral do edital',1,1,1,1],['Datas, etapas e retificações',1,1,1,1],['Questão do dia',1,1,1,1],['Cronograma adaptável',0,1,1,1],['Raio-X dos temas cobrados',0,1,1,1],['Perfil da banca',0,1,1,1],['Materiais e flashcards',0,1,1,1],['Banco de questões comentadas',0,0,0,1],['Caderno de erros',0,0,0,1],['Concursos cobertos','Todos (só resumo)','1 escolhido','Todos','A definir']];

  <section class="card pad stack"><div class="between"><h3>Conquistas</h3><span class="tag">${S.badges.length} de ${Object.keys(BADGES).length}</span></div><div class="g3">${Object.entries(BADGES).map(([k,[n,d,ic]])=>{const on=S.badges.includes(k);return`<div class="row"><span class="badge-m ${on?'':'off'}">${I(ic,24)}</span><div class="grow"><b class="sm" style="display:block">${n}</b><span class="xs mu">${on?d:'Bloqueada'}</span></div></div>`}).join('')}</div></section>
  <div class="g2">
   <section class="card pad stack"><div class="between"><div class="card-h">${tile('cartao',PAL[2],40)}<h3>Assinatura</h3></div><span class="tag ${S.expirado?'t-at':S.plano==='gratuito'?'t-line':'t-ok'}">${S.expirado?'Expirada':S.plano==='gratuito'?'Gratuito':'Ativa'}</span></div>
    <p><b>${PLANOS[S.plano].nome}</b> · ${PLANOS[S.plano].preco}${PLANOS[S.plano].sufixo}</p><p class="sm mu">${S.plano==='um'?`Concurso coberto: ${C(S.planoConc).sigla} · ${esc(C(S.planoConc).nome)}`:S.plano==='gratuito'?'Resumo gratuito de qualquer edital':PLANOS[S.plano].abr}</p>
    <button class="btn btn-s w" data-a="go" data-v="planos">Comparar planos</button></section>
   <section class="card pad stack"><div class="card-h">${tile('ajuste',PAL[0],40)}<h3>Preferências de estudo</h3></div>${P&&P.cfg?`<p class="sm">${cfgDias(P.cfg)} · ${hm(cargaSemanal(P.cfg))} por semana</p><p class="sm mu">Difíceis: ${P.cfg.dificeis.map(id=>C(P.conc).materias.find(m=>m.id===id)?.curto).filter(Boolean).join(', ')||'nenhuma'}</p><button class="btn btn-s w" data-a="editarCfg" data-gate="estudo">${I('ajuste',18)} Ajustar rotina</button>`:'<p class="sm mu">Você ainda não montou um plano para o concurso ativo.</p>'}</section>
  </div>
  <section class="stack"><div class="sec-h"><h3>Histórico por concurso</h3></div><div class="tl-list">${Object.entries(S.preps).map(([k,Pp])=>{const c=C(Pp.conc);return`<button class="li" data-a="trocarPrep" data-k="${k}"><span class="sig">${c.sigla}</span><span class="grow"><span class="t">${esc(cargoDe(Pp).nome)}</span><span class="s">${Pp.metas.filter(m=>m.ok).length} metas · ${Pp.respondidas} questões · ${Pp.erros.length} no caderno · ${Pp.xp} XP</span></span>${k===S.ativo?'<span class="tag t-lima">Ativo</span>':chevR()}</button>`}).join('')||'<p class="mu">Nenhuma preparação ainda.</p>'}</div></section>
  <section class="card pad stack"><div class="card-h">${tile('ajuda',PAL[1],40)}<h3>Suporte</h3></div>
   ${[['Posso trocar o concurso do plano Um Concurso?','Sim. Em Planos, escolha Um Concurso de novo e selecione outro concurso. O histórico de cada preparação fica salvo.'],['O que acontece se meu acesso acabar?','Nada é apagado. Metas, questões e caderno de erros continuam salvos e voltam quando você reativar.'],['De onde vêm as prioridades do plano?','Do peso de cada matéria no edital, da frequência dos assuntos nas provas anteriores e do que você marcou como difícil ou já estudado.']].map(([q,r])=>`<details class="acc" style="border-top:1px solid var(--ln);padding-top:10px"><summary class="between" style="min-height:40px"><b class="sm">${q}</b><span class="rot" style="color:var(--mu2)">${I('dir',18)}</span></summary><p class="sm mu" style="padding:6px 0 4px">${r}</p></details>`).join('')}
   <div class="field"><label for="sup">Fale com a equipe</label><textarea id="sup" class="inp" placeholder="Conte sua dúvida"></textarea></div><button class="btn btn-s sm" data-a="suporte" style="justify-self:start">Enviar mensagem (simulação)</button></section>`;
};

// ---------- render ----------
function bloqueio(v){
  const c=concAtivo();if(!c)return'';
  const est={raiox:'Raio-X dos temas cobrados',banca:'Perfil da banca',materiais:'Materiais de apoio',leitor:'Material de apoio',flash:'Flashcards'}[v];
  const qst={banco:'Banco de questões',caderno:'Caderno de erros',treino:'Treino de questões'}[v];
  if(est&&!cobre(c.id))return`${['raiox','banca','materiais'].includes(v)?subnavEdital(v):''}<div class="card empty">${tile('lock',null,56)}<h2>${est}</h2><p class="mu">${S.expirado?'Seu acesso terminou. O histórico continua salvo.':`Este recurso não está no seu plano para o ${c.sigla}.`}</p><button class="btn btn-p" data-a="go" data-v="${v==='leitor'||v==='flash'?'materiais':v}" data-gate="estudo">Ver o plano que libera</button><button class="btn-g" data-a="tab" data-v="edital">Voltar ao resumo gratuito</button></div>`;
  if(qst&&!temQuestoes()&&!(v==='treino'&&(!UI.tr||UI.tr.dia)))return`<div class="card empty">${tile('lock',null,56)}<h2>${qst}</h2><p class="mu">Faz parte do Premium com Questões.</p><button class="btn btn-p" data-a="go" data-v="praticar" data-gate="questoes">Simular Premium</button></div>`;
  return'';
}
const $=s=>document.querySelector(s);
function topo(){
  const P=prep(),c=concAtivo(),nv=nivel();
  const demo=`<button class="demo-b" data-a="sheet" data-s="demo" aria-label="Painel de demonstração">${I('ajuste',18)}</button>`;
  if(!P)return`<div class="top-in"><span class="logo-m" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">${LOGO(38)}<span style="display:grid;line-height:1.15"><b style="font-weight:800">Concurso com Líbero</b><small class="mu" style="font-size:12.5px;font-weight:600">por Líbero Filho</small></span></span>${demo}</div>`;
  return`<div class="top-in">
   <button class="sel" data-a="sheet" data-s="seletor" aria-label="Trocar concurso. Ativo: ${c.sigla}, ${esc(cargoDe(P).nome)}"><span class="sig">${c.sigla}</span><span class="tx"><b>${esc(cargoDe(P).curto)}</b><small>${cobre(c.id)?PLANOS[S.plano].nome:S.expirado?'Acesso expirado':'Resumo gratuito'}</small></span>${I('baixo',18)}</button>
   <span class="pill-s fogo" title="Dias seguidos estudando">${I('fogo',16)}${S.streak}</span>
   <span class="pill-s xp" title="Pontos de experiência">${I('raio',16)}${S.xp}</span>
   ${demo}
   <button class="av" style="--p:${nv.pct}" data-a="go" data-v="perfil" aria-label="Abrir perfil, nível ${nv.n}"><span>A</span></button></div>`;
}
function lateral(){
  const P=prep(),tab=TAB[UI.view],c=concAtivo(),cb=c&&cobre(c.id),nv=nivel();
  const nvs=[['hoje','Hoje','hoje'],['edital','Edital','edital'],['plano','Meu Plano','plano'],['praticar','Praticar','praticar']];
  const sec=[['materiais','Materiais','camadas','estudo'],['flash','Flashcards','cartas','estudo'],['raiox','Raio-X','barras','estudo'],['banca','Perfil da banca','martelo','estudo'],['caderno','Caderno de erros','caderno','questoes'],['planos','Planos','cartao','']];
  return`<div class="logo">${LOGO(42,'#D9F575','#163D30')}<div><b>Concurso com Líbero</b><span>por Líbero Filho</span></div></div>
   ${P?`<button class="sel" data-a="sheet" data-s="seletor"><span class="sig">${c.sigla}</span><span class="tx"><b>${esc(cargoDe(P).curto)}</b><small>${cb?PLANOS[S.plano].nome:S.expirado?'Acesso expirado':'Resumo gratuito'}</small></span>${I('baixo',18)}</button>
   <nav>${nvs.map(([v,l,ic])=>`<button class="nv" data-a="tab" data-v="${v}" ${tab===v?'aria-current="page"':''}>${I(ic)}${l}</button>`).join('')}</nav>
   <span class="lbl">Recursos</span><nav>${sec.map(([v,l,ic,g])=>{const ok=!g||(g==='questoes'?temQuestoes():cb);return`<button class="nv" data-a="${v==='flash'?'flash':'go'}" data-v="${v}" ${g?`data-gate="${g}"`:''} ${UI.view===v?'aria-current="page"':''}>${I(ic)}${l}${ok?'':`<span class="lk">${I('lock',16)}</span>`}</button>`}).join('')}</nav>`
   :`<nav><button class="nv" aria-current="page">${I('busca')}Catálogo</button><button class="nv" data-a="go" data-v="planos">${I('cartao')}Planos</button></nav>`}
   <div class="rodape">${P?`<div class="mini-xp"><div class="between"><b class="sm">Nível ${nv.n} · ${nv.nome}</b><span class="xs" style="color:var(--lima);font-weight:800">${S.xp} XP</span></div><div class="prog l" style="background:rgba(255,255,255,.12)"><i style="width:${nv.pct}%"></i></div></div><button class="nv" data-a="go" data-v="perfil" ${UI.view==='perfil'?'aria-current="page"':''}>${I('usuario')}Perfil</button>`:''}
   <button class="nv" data-a="sheet" data-s="demo" style="box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)">${I('ajuste')}Painel de demonstração</button></div>`;
}
function navInferior(){
  const tab=TAB[UI.view];
  return[['hoje','Hoje','hoje'],['edital','Edital','edital'],['plano','Meu Plano','plano'],['praticar','Praticar','praticar']].map(([v,l,ic])=>`<button data-a="tab" data-v="${v}" ${tab===v?'aria-current="page"':''}>${I(ic,22)}${l}</button>`).join('');
}
TAB.flash='hoje';
function render(topoScroll){
  if(!UI.view)UI.view=S.ativo?'hoje':'catalogo';
  if(!S.ativo&&!['catalogo','concurso','planos'].includes(UI.view))UI.view='catalogo';
  const focoId=document.activeElement&&document.activeElement.id;
  const main=$('#main');const f=V[UI.view]||V.hoje;
  main.innerHTML=`<div class="wrap">${bloqueio(UI.view)||f(UI.p)}</div>`;
  if(!topoScroll)main.querySelectorAll('.wrap>*').forEach(e=>e.style.animation='none');
  renderChrome();
  if(topoScroll){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true})}
  else if(focoId){const el=document.getElementById(focoId);if(el)el.focus({preventScroll:true})}
  if(UI.sheet)renderSheet();
  window.claude?.hot?.snapshot?.(()=>({S,view:UI.view,p:UI.p}));
}
function renderChrome(){
  const imersivo=['treino','flash'].includes(UI.view),semNav=!S.ativo||imersivo;
  $('#top').innerHTML=topo();$('#side').innerHTML=lateral();
  $('#bnav').innerHTML=navInferior();$('#bnav').hidden=semNav;
  $('#top').hidden=imersivo&&!desk();
  document.body.classList.toggle('sem-nav',semNav);
}
function renderAll(){render()}
let tt;
function toast(msg,xp=0,ic){
  const t=$('#toast');clearTimeout(tt);
  t.innerHTML=`<div class="toast" role="status">${ic?I(ic,18):''}${xp?`<span class="xpb">+${xp} XP</span>`:''}<span>${esc(msg)}</span></div>`;
  tt=setTimeout(()=>t.innerHTML='',2800);
}
const start=(h)=>{if(h&&h.S){S=h.S;UI.view=h.view;UI.p=h.p||{}}if(!S.hist)S.hist={};render(true)};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
</script>
