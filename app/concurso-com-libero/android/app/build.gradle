plugins { id 'com.android.application' }
android {
    namespace 'com.liberofilho.concursos'
    compileSdk 35
    defaultConfig {
        applicationId 'com.liberofilho.concursos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            // Chave fora do repositório: informe pelo ambiente (veja build.sh).
            storeFile System.getenv('CCL_KEYSTORE') ? file(System.getenv('CCL_KEYSTORE')) : null
            storePassword System.getenv('CCL_KEYSTORE_PASS')
            keyAlias 'concursocomlibero'
            keyPassword System.getenv('CCL_KEYSTORE_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('CCL_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
