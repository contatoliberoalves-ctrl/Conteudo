<title>Casa & Cartórios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
/* Layout: menu lateral no computador e barra flutuante no celular; cada área (casa, cartório) é uma grade de cartões com borda fina sobre fundo branco, resumo antes do detalhe.
   Escalas: espaços 4/8/12/16/24; texto 12/13/14/16/20/28/40; raios 8/12/16. */
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--soft:#F4F6FA;--line:#E6E9F0;
  --ink:#0E1320;--ink2:#566074;--ink3:#6B7588;
  --accent:#2457E6;--accent-soft:#E6EDFF;--pill:#0E1320;--pillfg:#FFFFFF;--on:#FFFFFF;--onacc:#FFFFFF;--tinta:#0E1320;
  --p1:#2F8BFF;--p2:#D9457A;--navy:#4B3FB5;--sobra:#14A05A;--neutro:#C9CFDA;
  --rec:#2457E6;--sai:#E0812B;
  --good:#0E8A4B;--warn:#A86400;--bad:#CC2C3B;--good-soft:#E2F5EA;--warn-soft:#FFF1D6;--bad-soft:#FDE7E9;
  --shadow:0 1px 2px rgba(14,19,32,.05);--pop:0 8px 28px rgba(14,19,32,.16);--veil:rgba(10,14,22,.5);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fd:'Inter Tight','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14;--card:#141923;--soft:#1A202C;--line:#262D3B;
  --ink:#EEF1F7;--ink2:#A7B0C4;--ink3:#8791A6;
  --accent:#7398FF;--accent-soft:#1C2848;--pill:#EEF1F7;--pillfg:#0B0E14;--on:#FFFFFF;--onacc:#0B0E14;--tinta:#0E1320;
  --p1:#3B8BEA;--p2:#D9508A;--navy:#6A5AE0;--sobra:#1FA866;--neutro:#3A4252;
  --rec:#5F86F0;--sai:#D07A2A;
  --good:#3DCB84;--warn:#F0B34A;--bad:#FF6B78;--good-soft:#12301F;--warn-soft:#33270F;--bad-soft:#3A161B;
  --shadow:none;--pop:0 8px 28px rgba(0,0,0,.5);--veil:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E14;--card:#141923;--soft:#1A202C;--line:#262D3B;
  --ink:#EEF1F7;--ink2:#A7B0C4;--ink3:#8791A6;
  --accent:#7398FF;--accent-soft:#1C2848;--pill:#EEF1F7;--pillfg:#0B0E14;--on:#FFFFFF;--onacc:#0B0E14;--tinta:#0E1320;
  --p1:#3B8BEA;--p2:#D9508A;--navy:#6A5AE0;--sobra:#1FA866;--neutro:#3A4252;
  --rec:#5F86F0;--sai:#D07A2A;
  --good:#3DCB84;--warn:#F0B34A;--bad:#FF6B78;--good-soft:#12301F;--warn-soft:#33270F;--bad-soft:#3A161B;
  --shadow:none;--pop:0 8px 28px rgba(0,0,0,.5);--veil:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);gap:24px;max-width:1320px;margin:0 auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 12px}
.duo{display:flex;flex:none}.duo b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--on);font:700 12px var(--f);border:2px solid var(--bg)}
.duo b+b{margin-left:-8px}
.brand>div:last-child{min-width:0}.brand strong{font:700 16px var(--fd);display:block}.brand small{color:var(--ink3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navlab{font-size:12px;color:var(--ink3);padding:16px 12px 4px}
.nav{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink2);font-weight:500;text-align:left}
.nav:hover{background:var(--soft)}.nav[aria-current="page"]{background:var(--pill);color:var(--pillfg);font-weight:600}
.nav svg{flex:none}.nav span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav .cnt{margin-left:auto;background:var(--bad);color:var(--on);border-radius:99px;font-size:12px;padding:0 8px;font-weight:600;font-variant-numeric:tabular-nums;overflow:visible}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:40px}
.mes{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.top h1{font:700 24px/1.2 var(--fd);margin:0 8px 0 0;white-space:nowrap}.mes h1{margin-left:8px}.top h1 span{color:var(--ink3);font-weight:600}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink2);padding:0}
.ib:hover,.btn:hover{background:var(--soft)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 16px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onacc)}.btn.pri:hover{background:var(--accent);filter:brightness(1.08)}
.btn.sm{padding:4px 12px;font-size:13px}.btn.danger{color:var(--bad)}
.grid{display:grid;align-items:start;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c3{grid-column:span 3}
.colL{grid-column:span 8;display:flex;flex-direction:column;gap:16px;min-width:0}
.colR{grid-column:span 4;display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;min-width:0;display:flex;flex-direction:column;gap:16px}
button.card{text-align:left}button.card:hover{border-color:var(--neutro)}
.card>header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.card h2{font:600 16px/1.3 var(--f);margin:0}.card h2 small{color:var(--ink3);font-weight:500;font-size:13px}
.card h3{font:600 13px var(--f);margin:0;color:var(--ink2)}
/* Ilustração: ocupa uma coluna própria ao lado do título, então nunca fica por cima do texto. */
.has-art{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-content:start}
.has-art>*{grid-column:1/-1;min-width:0}
.has-art>header,.has-art>.kt{grid-column:1;grid-row:1;align-self:center}
.has-art>.art{grid-column:2;grid-row:1;width:56px;height:56px;align-self:center}.art svg{width:100%;height:100%;display:block}
.kcard{gap:8px;padding:16px}.kcard>.art{width:40px;height:40px}.kt{font-size:14px;font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{display:block;width:100%;height:36px;margin-top:4px}
details.info{display:contents}
details.info summary{list-style:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink3);cursor:pointer;font-weight:600;flex:none}
details.info summary::-webkit-details-marker{display:none}
details.info p{order:9;flex-basis:100%;margin:0;background:var(--soft);border-radius:8px;padding:8px 12px;color:var(--ink2);font-size:13px;max-width:70ch}
.mny{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.mny i{font-style:normal;color:var(--ink3);font-size:.6em;margin-right:.2em}.mny small{font-size:.55em;color:var(--ink3);font-weight:600}
.big{font-size:40px;line-height:1.1}.mid{font-size:28px;line-height:1.15}.kp{font-size:20px;line-height:1.3}
.muted{color:var(--ink3)}.sub{color:var(--ink2);font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}.aviso{color:var(--warn)}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.heroN{display:flex;gap:8px 24px;align-items:flex-end;flex-wrap:wrap}.heroN .sub{padding-bottom:4px}
.stack{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stack span{min-width:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 16px}
.legend div{min-width:0}.legend label{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px}
.keys{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink2)}.keys span{display:inline-flex;align-items:center;gap:8px}.keys b{width:14px;height:3px;border-radius:2px;background:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.list>.row:first-child{border-top:0;padding-top:0}.list>.row:last-child{padding-bottom:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--ink3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.row{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left}
button.row:hover,.rowbtn:hover{background:var(--soft)}
.rowbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:4px;margin:-4px;border-radius:8px}
.rt{flex:none;display:flex;flex-direction:column;align-items:flex-end}.st{font-size:12px;font-weight:500;color:var(--ink3)}.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--neutro);background:none;display:grid;place-items:center;color:var(--on);padding:0}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.neu{background:var(--soft);color:var(--ink2)}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:var(--on);font:700 10px var(--f);flex:none;vertical-align:middle}
.two{display:flex;justify-content:space-between;gap:12px}
.split{display:flex;gap:2px;height:24px;border-radius:6px;overflow:hidden;font-size:12px;font-weight:700;color:var(--on)}
.split span{display:flex;align-items:center;padding:0 8px;min-width:0;overflow:hidden}
.split span:last-child{justify-content:flex-end}
.splitw{position:relative}.splitw u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.acerto{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;border-block:1px solid var(--line);padding:12px 0}
.acerto .t{flex:1;min-width:160px}.acerto .t b{display:block;font-weight:600}.acerto .t small{color:var(--ink3);font-size:12px}.acerto .de{display:inline-flex;align-items:center;gap:4px;color:var(--ink3)}
/* Pares rótulo/valor separados por fio, sem caixa. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px;border-top:1px solid var(--line);padding-top:16px}
.kpi{min-width:0}
.kpi label{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px;margin-bottom:4px}
.kpi small{display:block;color:var(--ink3);font-size:12px;margin-top:4px}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.meta{border:1px solid var(--line);background:none;border-radius:12px;padding:12px 16px;text-align:left;min-width:0}.meta:hover{background:var(--soft)}
.meta label{display:block;color:var(--ink2);font-size:12px;margin-bottom:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{display:block;color:var(--ink3);font-size:12px;margin:4px 0 8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;color:var(--ink3);text-align:left;font-weight:500;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
th:last-child,td:last-child{padding-right:0}tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr[data-act]{cursor:pointer}tbody tr[data-act]:hover{background:var(--soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-weight:500;color:var(--ink2);font-size:13px}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pillfg);border-color:var(--pill)}
.inp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;min-width:0;width:100%}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.banner.erro{background:var(--bad-soft)}
.banner p{margin:0;flex:1;min-width:220px}
.empty{color:var(--ink3);padding:4px 0;font-size:13px;margin:0;max-width:60ch}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.steps{display:grid;gap:16px 24px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-top:1px solid var(--line);padding-top:16px}
.step b{display:block;margin-bottom:4px}.step p{margin:0;color:var(--ink2);font-size:13px}
.prose p{max-width:70ch;margin:0;color:var(--ink2)}.prose dl{margin:0}.prose dt{font-weight:600;margin-top:12px}.prose dt:first-child{margin-top:0}.prose dd{margin:4px 0 0;color:var(--ink2);max-width:70ch}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100% - 24px);box-shadow:var(--pop)}
dialog::backdrop{background:var(--veil)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:16px}
.dlg h2{margin:0;font:700 20px var(--fd)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:500;min-width:0}
.fg label.full{grid-column:1/-1}.fg label.ck{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.fg small{color:var(--ink3);font-weight:400}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;inset:auto auto calc(24px + env(safe-area-inset-bottom,0px)) 50%;margin:0;border:0;transform:translateX(-50%);background:var(--pill);color:var(--pillfg);padding:8px 16px;border-radius:8px;font-weight:500;z-index:60;width:max-content;max-width:calc(100vw - 32px)}
#tip{position:fixed;z-index:70;background:var(--pill);color:var(--pillfg);padding:8px 12px;border-radius:8px;font-size:12px;pointer-events:none;white-space:pre-line;max-width:240px}
.dias{display:flex;gap:8px;overflow-x:auto;padding:2px}
.dia{flex:1 0 48px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.dia b{font:700 14px var(--fd);font-variant-numeric:tabular-nums}.dia span{display:flex;gap:3px;height:4px}.dia i{width:4px;height:4px;border-radius:50%;background:var(--neutro)}.dia i.ok{background:var(--good)}
.dia[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onacc)}.dia[aria-pressed="true"] i{background:currentColor}
.tile{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile.cor{background:var(--cc);color:var(--on)}.tile.cor.luz,.cc.luz{color:var(--tinta)}
.catrow{display:flex;gap:12px;align-items:center;padding:8px 0}.catrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.catrow .pc{width:36px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.catrow .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));column-gap:32px}
.ccs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px}
.cc{flex:0 0 min(300px,88%);aspect-ratio:1.586;border:0;border-radius:12px;padding:16px;color:var(--on);text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 82%,var(--on)),var(--cc) 50%)}
.cc .two{align-items:center}.ccn{font:700 16px var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.ccp{border:1px solid currentColor;border-radius:99px;padding:0 8px;font-size:12px;font-weight:600;flex:none;opacity:.9}
.ccmid{display:flex;align-items:center;gap:12px}.ccv{flex:1;font:700 20px var(--fd);font-variant-numeric:tabular-nums}
.ccf{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}.ccf small{display:block;font-size:12px;opacity:.75;font-weight:500}
.prox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.px{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:112px;position:relative;overflow:hidden;text-align:center}
.px.on{border-color:var(--accent)}.px b{font-size:12px;position:absolute;top:8px;left:0;right:0;font-weight:600}
.px .fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent-soft);border-top:2px solid var(--accent)}.px .num{position:relative;font-size:13px}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--soft)}.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--sobra)}.gauge i.w{background:var(--sai)}.gauge u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);padding:4px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tl{display:flex;gap:12px;align-items:center;min-width:0}.tl div{min-width:0}.tl small{display:block;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clp{display:inline-flex;align-items:center;gap:2px;color:var(--ink3);font-size:12px;font-weight:600;vertical-align:middle;flex:none}
.anx{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}.anxl{display:flex;flex-direction:column;gap:8px}
.anxi{display:flex;align-items:center;gap:12px;min-width:0}.anxi img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}.anxi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent);font-weight:500}.anxi a.tile{text-decoration:none;width:44px;height:44px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline}
.bnav,.fab{display:none}
svg text{font-family:var(--f);font-variant-numeric:tabular-nums}
@media (max-width:1280px){.c3{grid-column:span 6}}
@media (max-width:1100px){.colR,.colL,.c7,.c6,.c5{grid-column:span 12}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:16px 112px}.side{display:none}
  .card{padding:16px}.dlg{padding:16px}.big{font-size:32px}.mid{font-size:24px}.top h1{font-size:20px}.fg{grid-template-columns:1fr}
  .has-art>.art{width:48px;height:48px}.kcard>.art{width:40px;height:40px}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

<script>
'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Lê "1.234,56", "1234.56", "1.234", "R$ -10,00" e "(10,00)". Com vírgula e ponto, o último é o decimal.
function parseBR(s){
  if(typeof s==='number')return s;
  s=String(s??'').replace(/\s|R\$/gi,'').replace(/−/g,'-');if(!s)return NaN;
  const neg=/^-|-$|^\(.*\)$/.test(s);s=s.replace(/[^\d.,]/g,'');if(!/\d/.test(s))return NaN;
  const iv=s.lastIndexOf(','),ip=s.lastIndexOf('.');
  if(iv>=0&&ip>=0)s=iv>ip?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(iv>=0)s=s.split(',').length>2?s.replace(/,/g,''):s.replace(',','.');
  else if(ip>=0&&(s.split('.').length>2||/^\d{1,3}\.\d{3}$/.test(s)))s=s.replace(/\./g,'');
  const n=parseFloat(s);return neg?-n:n}
const nv=v=>{if(typeof v!=='number')v=parseBR(v);return Number.isFinite(v)?v:0};
const r2=v=>Math.round(nv(v)*100)/100||0;
const cent=v=>Math.round(nv(v)*100);
const fmt=v=>r2(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=v=>{v=r2(v);return(v<0?'− ':'')+'R$ '+fmt(Math.abs(v))};
const money=(v,cls='')=>{v=r2(v);const [a,b]=fmt(Math.abs(v)).split(',');return `<span class="mny ${cls}">${v<0?'− ':''}<i>R$</i>${a}<small>,${b}</small></span>`};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const pl=(n,um,varios)=>n+' '+(n===1?um:varios);
const pad=n=>String(n).padStart(2,'0');
const ymIdx=m=>(+m.slice(0,4))*12+(+m.slice(5,7))-1;
const idxYm=i=>`${Math.floor(i/12)}-${pad(i%12+1)}`;
const addMes=(m,n)=>idxYm(ymIdx(m)+n);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mesNome=m=>MESES[+String(m).slice(5,7)-1]||'';
const mesMin=m=>mesNome(m).toLowerCase();
const mesAbr=m=>mesNome(m).slice(0,3);
const dBR=d=>d?`${d.slice(8,10)}/${d.slice(5,7)}`:'sem data';
const diasNoMes=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const dataNoMes=(m,dia)=>`${m}-${pad(Math.min(Math.max(1,parseInt(dia)||1),diasNoMes(m)))}`;
const difDias=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
const okMes=m=>typeof m==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(m);
const okData=d=>typeof d==='string'&&/^\d{4}-\d\d-\d\d$/.test(d)&&okMes(d.slice(0,7))&&+d.slice(8)>=1&&+d.slice(8)<=diasNoMes(d);
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+f(x),0);
const semAcento=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// O dia de hoje é relido a cada desenho: a página pode ficar aberta de um dia (ou mês) para o outro.
let HOJE='',MES_HOJE='';

/* ============ categorias ============ */
// Grupo das despesas de cartório: rep = repasse obrigatório; ded = despesa dedutível no livro caixa;
// nd = não dedutível; ret = retirada do titular (não entra no resultado).
const CATS={
  casa:{rec:['Salário','Retirada do cartório','Cursos e aulas','Rendimentos','Outras receitas'],
        desp:['Moradia','Contas da casa','Mercado','Alimentação fora','Transporte','Saúde','Educação','Lazer e viagens','Assinaturas','Família','Dízimos e ofertas','Compras','Impostos','Reserva e investimentos','Outros']},
  cart:{rec:['Emolumentos','Ressarcimento de atos gratuitos','Complementação de renda mínima','Outras receitas'],
        desp:[['Repasses ao Tribunal e fundos','rep'],['ISS','rep'],['Folha de pagamento','ded'],['Encargos (INSS, FGTS)','ded'],['Aluguel do imóvel','ded'],['Sistema e informática','ded'],['Água, luz e internet','ded'],['Material de expediente','ded'],['Selos e papel de segurança','ded'],['Contabilidade','ded'],['Manutenção e limpeza','ded'],['Outras despesas dedutíveis','ded'],['Despesa não dedutível','nd'],['Carnê-leão (DARF)','nd'],['Retirada do titular','ret']]}};
const GRUPO=Object.fromEntries(CATS.cart.desp);
const GRN={rep:'Repasses obrigatórios',ded:'Despesas dedutíveis',nd:'Não dedutíveis',ret:'Retirada do titular'};
const grupo=c=>GRUPO[c]||'ded';
const CAT_IMPOSTO=new Set(['Impostos','Repasses ao Tribunal e fundos','ISS','Carnê-leão (DARF)']);
const catsDe=(esp,tipo)=>esp==='casa'?CATS.casa[tipo==='rec'?'rec':'desp']:(tipo==='rec'?CATS.cart.rec:CATS.cart.desp.map(c=>c[0]));
const REGRAS=[[/supermerc|atacad|assai|mercad|hortifr|carrefour|mateus/i,'Mercado'],[/uber|99 ?app|posto|combust|ipiranga|shell|estaciona|ped[aá]gio/i,'Transporte'],[/netflix|spotify|prime|disney|hbo|youtube|icloud|google one|apple\.com/i,'Assinaturas'],[/ifood|restaur|padaria|lanch|pizza|burger|caf[eé]/i,'Alimentação fora'],[/farm[aá]c|drog|unimed|hapvida|cl[ií]nica|hospital|laborat/i,'Saúde'],[/aluguel|condom|imobili/i,'Moradia'],[/celpe|neoenergia|compesa|energia|vivo|claro|tim |oi fibra|internet/i,'Contas da casa'],[/escola|faculdade|curso|livraria|udemy/i,'Educação'],[/cinema|hotel|airbnb|latam|gol |azul |booking/i,'Lazer e viagens'],[/darf|iptu|ipva|receita federal/i,'Impostos']];
const sugerirCat=(desc,esp,tipo)=>{const cs=catsDe(esp,tipo);if(esp==='casa'&&tipo!=='rec'){const r=REGRAS.find(r=>r[0].test(String(desc??'')));return r?r[1]:'Outros'}return cs[esp==='casa'?cs.length-1:(tipo==='rec'?0:11)]};

/* ============ estado ============ */
const CFG0={p1:'Você',p2:'Cônjuge',divPadrao:50,c1:{nome:'Cartório 1',regime:'titular'},c2:{nome:'Cartório 2',regime:'titular'},teto:41845.49,outrasDed:0,dizimoPct:10,acertos:{}};
const S={cfg:CFG0,lanc:[],fixas:[],contas:[],metas:[],of:null,inbox:[],ign:{},tem:{},mes:'',view:'geral',ok:{},fEsp:'todos',dia:{},busca:'',lim:200,imp:null,tema:null,ocup:{}};
function relogio(){const d=new Date(),t=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;if(t===HOJE)return;
  if(!S.mes||S.mes===MES_HOJE)S.mes=t.slice(0,7);HOJE=t;MES_HOJE=t.slice(0,7)}
relogio();
let DB=null,DL=null,AS=null;
const cfg=()=>S.cfg;
const ESP_OK={casa:1,c1:1,c2:1};
const ESPS=()=>[['casa','Casa'],['c1',cfg().c1.nome],['c2',cfg().c2.nome]];
const espNome=e=>(ESPS().find(x=>x[0]===e)||[0,e||'Sem painel'])[1];
const pNome=p=>p==='p2'?cfg().p2:cfg().p1;
const av=p=>`<span class="av" style="background:var(--${p==='p2'?'p2':'p1'})">${h(pNome(p)[0]||'?')}</span>`;
const carregado=()=>['cfg','lanc','fixas','contas','metas'].every(k=>S.ok[k]);

/* ============ dados que chegam do banco ============ */
// Cada documento passa por aqui antes de entrar no estado: campo que falta ou veio em outro
// formato (valor em texto, data vazia, mapa ausente) vira um valor seguro em vez de quebrar a tela.
const obj=o=>o&&typeof o==='object'&&!Array.isArray(o)?o:{};
const str=(s,d='')=>s==null||s===''?d:String(s);
const dia31=(d,p)=>{d=parseInt(d);return d>=1&&d<=31?d:p};
const pctOk=v=>Math.min(100,Math.max(0,nv(v)));
const divOk=d=>d==null||d===''||!Number.isFinite(+d)?null:pctOk(+d);
const normData=d=>{d=String(d??'').slice(0,10);return okData(d)?d:''};
const corOk=(c,p)=>/^#[0-9a-f]{6}$/i.test(c||'')?c:p;
const corClara=c=>{const n=parseInt(c.slice(1),16);return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))>170};
const normAnx=a=>Array.isArray(a)?a.filter(x=>x&&x.id).map(x=>({id:String(x.id),nome:str(x.nome,'arquivo'),tipo:str(x.tipo)})):[];
const quemOk=q=>q==='p2'?'p2':'p1';
const NORM={
  lanc:d=>({...d,esp:str(d.esp),tipo:d.tipo==='rec'?'rec':'desp',data:normData(d.data),desc:str(d.desc,'Sem descrição'),valor:Math.abs(nv(d.valor)),cat:str(d.cat),conta:str(d.conta),quem:quemOk(d.quem),div:divOk(d.div),anexos:normAnx(d.anexos)}),
  fixas:d=>({...d,esp:str(d.esp),tipo:d.tipo==='rec'?'rec':'desp',desc:str(d.desc,'Sem descrição'),valor:Math.abs(nv(d.valor)),dia:dia31(d.dia,1),cat:str(d.cat),quem:quemOk(d.quem),div:divOk(d.div),est:!!d.est,desde:okMes(d.desde)?d.desde:'',pagos:obj(d.pagos),valores:obj(d.valores),anexosMes:obj(d.anexosMes)}),
  contas:d=>({...d,tipo:d.tipo==='cartao'?'cartao':'conta',esp:str(d.esp),nome:str(d.nome,'Sem nome'),dono:quemOk(d.dono),saldo:nv(d.saldo),limite:Math.abs(nv(d.limite)),fecha:dia31(d.fecha,0),vence:dia31(d.vence,0),cor:corOk(d.cor,d.tipo==='cartao'?'#1b1f2a':'#2457e6'),pagos:obj(d.pagos),pluggy:str(d.pluggy)}),
  metas:d=>({...d,nome:str(d.nome,'Meta'),esp:str(d.esp,'casa'),alvo:Math.abs(nv(d.alvo)),atual:nv(d.atual)}),
  inbox:d=>({...d,nome:str(d.nome,'Conta do banco'),banco:str(d.banco),tipo:d.tipo==='cartao'?'cartao':'conta',final:str(d.final),saldo:d.saldo!=null&&Number.isFinite(+d.saldo)?+d.saldo:null,
    itens:(Array.isArray(d.itens)?d.itens:[]).filter(x=>x&&x.id!=null).map(x=>({id:String(x.id),data:normData(x.data),valor:Math.abs(nv(x.valor)),tipo:x.tipo==='rec'?'rec':'desp',desc:str(x.desc,'Sem descrição')}))})};
function normCfg(d){d=obj(d);const s=(x,p)=>typeof x==='string'&&x.trim()?x.trim():p,c=(x,p)=>({nome:s(obj(x).nome,p.nome),regime:obj(x).regime==='interino'?'interino':'titular'}),pc=(x,p)=>Number.isFinite(parseBR(x))?pctOk(x):p;
  return{...CFG0,...d,p1:s(d.p1,CFG0.p1),p2:s(d.p2,CFG0.p2),divPadrao:pc(d.divPadrao,CFG0.divPadrao),c1:c(d.c1,CFG0.c1),c2:c(d.c2,CFG0.c2),teto:d.teto==null?CFG0.teto:Math.abs(nv(d.teto)),outrasDed:Math.abs(nv(d.outrasDed)),dizimoPct:pc(d.dizimoPct,CFG0.dizimoPct),acertos:obj(d.acertos)}}

/* ============ índices e memória de cálculo ============ */
// Tudo que é calculado a partir dos dados fica guardado até os dados mudarem (mudou()).
let CONTAS=new Map(),IDX=null;const MEMO=new Map();
const mudou=()=>{MEMO.clear();IDX=null;CONTAS=new Map(S.contas.map(c=>[c.id,c]))};
const memo=(k,f)=>{let v=MEMO.get(k);if(v===undefined){v=f();MEMO.set(k,v)}return v};
const conta=id=>CONTAS.get(id);
const ehCartao=id=>conta(id)?.tipo==='cartao';
// Mês em que vence a fatura de uma compra feita no cartão.
function faturaMes(card,d){let i=ymIdx(d.slice(0,7));const fe=card.fecha||31;if(+d.slice(8,10)>fe)i++;if((card.vence||1)<=fe)i++;return idxYm(i)}
// Parcela guarda a data da compra (d0): cai uma fatura depois da anterior mesmo quando o dia da
// compra não existe no mês (compra no dia 31, parcela em fevereiro).
function faturaDe(card,l){const p=l.d0&&okData(l.d0)&&/^(\d+)\/\d+$/.exec(l.parc||'');return p?addMes(faturaMes(card,l.d0),+p[1]-1):faturaMes(card,l.data)}
// Uma passada pelos lançamentos: separa por painel e mês (compras de cartão pelo mês da fatura),
// soma as faturas por cartão e guarda as chaves usadas para achar repetidos.
function indice(){if(IDX)return IDX;
  const meses=new Map(),cart=new Map(),ruins=[],grp=new Map();
  const b=(esp,mes)=>{const k=esp+'|'+mes;let x=meses.get(k);if(!x)meses.set(k,x={lanc:[],cartao:[]});return x};
  for(const l of S.lanc){
    if(l.grp){const g=grp.get(l.grp);g?g.push(l):grp.set(l.grp,[l])}
    if(!l.data||!ESP_OK[l.esp]){ruins.push(l);continue}
    const c=CONTAS.get(l.conta);
    if(c&&c.tipo==='cartao'&&l.tipo==='desp'){const fm=faturaDe(c,l);b(l.esp,fm).cartao.push(l);let t=cart.get(c.id);if(!t)cart.set(c.id,t=new Map());t.set(fm,(t.get(fm)||0)+l.valor)}
    else b(l.esp,l.data.slice(0,7)).lanc.push(l)}
  return IDX={meses,cart,ruins,grp}}
// Lançamentos de um mês pela data em que aconteceram, do mais novo para o mais antigo (tela Lançamentos).
const doMes=mes=>memo('dm|'+mes,()=>S.lanc.filter(l=>l.data.startsWith(mes)&&ESP_OK[l.esp]).sort((x,y)=>x.data<y.data?1:x.data>y.data?-1:0));
// Chaves para achar repetidos (só são montadas quando há importação ou fila do banco):
// fit = identificador de origem; fitv = identificador + valor; chave = data + tipo + valor.
const repetidos=()=>memo('rep',()=>{const fit=new Set(),fitv=new Set(),chave=new Set();
  for(const l of S.lanc){if(l.fitid){fit.add(l.fitid);fitv.add(l.fitid+'|'+cent(l.valor))}if(l.data)chave.add(l.data+'|'+l.tipo+'|'+cent(l.valor))}
  return{fit,fitv,chave}});
const faturaTotal=(id,mes)=>indice().cart.get(id)?.get(mes)||0;

/* ============ cálculo ============ */
const valorFixa=(f,mes)=>{const x=f.valores[mes];return x==null?f.valor:Math.abs(nv(x))};
// Tudo que entra e sai de um painel num mês. gastos = cada despesa (para categoria e divisão);
// pagar = como o dinheiro sai (contas fixas, avulsos e faturas dos cartões).
function mesDe(esp,mes){return memo('m|'+esp+'|'+mes,()=>{
  const rec=[],gastos=[],pagar=[],bk=indice().meses.get(esp+'|'+mes),fat=new Map();
  for(const f of S.fixas){if(f.esp!==esp||f.ativo===false||(f.desde&&mes<f.desde))continue;
    const it={ref:'fixa',id:f.id,desc:f.desc,valor:valorFixa(f,mes),cat:f.cat,quem:f.quem,div:f.div,data:dataNoMes(mes,f.dia),pago:!!f.pagos[mes],est:f.est&&f.valores[mes]==null,nx:Array.isArray(f.anexosMes[mes])?f.anexosMes[mes].length:0};
    if(f.tipo==='rec')rec.push(it);else{gastos.push(it);pagar.push(it)}}
  if(bk){
    for(const l of bk.cartao){const c=CONTAS.get(l.conta);
      gastos.push({ref:'lanc',id:l.id,desc:l.desc,valor:l.valor,cat:l.cat,quem:c.dono,div:l.div,data:l.data,pago:true,cartao:c.id,parc:l.parc,nx:l.anexos.length});
      const a=fat.get(c.id);a?a.push(l):fat.set(c.id,[l])}
    for(const l of bk.lanc){const it={ref:'lanc',id:l.id,desc:l.desc,valor:l.valor,cat:l.cat,quem:l.quem,div:l.div,data:l.data,pago:l.pago!==false,parc:l.parc,nx:l.anexos.length};
      if(l.tipo==='rec')rec.push(it);else{gastos.push(it);pagar.push(it)}}}
  for(const[id,ls]of fat){const c=CONTAS.get(id);pagar.push({ref:'fatura',id,desc:'Fatura '+c.nome,valor:sum(ls,l=>l.valor),cat:'Cartão',quem:c.dono,data:dataNoMes(mes,c.vence),pago:!!c.pagos[mes],n:ls.length})}
  pagar.sort((a,b)=>a.data.localeCompare(b.data));
  const R=sum(rec,x=>x.valor),D=sum(gastos,x=>x.valor),porCat={};
  for(const g of gastos)porCat[g.cat||'Outros']=(porCat[g.cat||'Outros']||0)+g.valor;
  return{rec,gastos,pagar,R,D,tem:rec.length+gastos.length>0,porCat:Object.entries(porCat).sort((a,b)=>b[1]-a[1])}})}
// Divisão do casal: quanto cada um pagou e quanto era a parte de cada um.
function divisao(m){
  const r={comp:0,ind1:0,ind2:0,parte1:0,parte2:0,pagou1:0,pagou2:0,rec1:0,rec2:0};
  for(const x of m.rec)x.quem==='p2'?r.rec2+=x.valor:r.rec1+=x.valor;
  for(const g of m.gastos){const ind=g.div==null;const d1=ind?(g.quem==='p2'?0:100):g.div;
    const s1=g.valor*d1/100,s2=g.valor-s1;r.parte1+=s1;r.parte2+=s2;
    if(ind)g.quem==='p2'?r.ind2+=g.valor:r.ind1+=g.valor;else r.comp+=g.valor;
    g.quem==='p2'?r.pagou2+=g.valor:r.pagou1+=g.valor}
  r.acerto=r.pagou1-r.parte1; // >0: p2 devolve para p1
  return r;
}
function cartorio(esp,mes){return memo('c|'+esp+'|'+mes,()=>{
  const m=mesDe(esp,mes);const g={rep:0,ded:0,nd:0,ret:0};
  for(const x of m.gastos)g[grupo(x.cat)]+=x.valor;
  const res=m.R-g.rep-g.ded-g.nd;
  return{...m,...g,res,base:m.R-g.rep-g.ded,margem:pct(res,m.R)}})}
// Estimativa do carnê-leão: tabela mensal em vigor desde maio/2025 e redução da Lei 15.270/2025 (a partir de jan/2026).
function irMensal(base,mes){
  if(!(base>0))return 0;
  const T=[[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[Infinity,.275,908.73]];
  const f=T.find(t=>base<=t[0]);let imp=Math.max(0,base*f[1]-f[2]);
  if(mes>='2026-01'){const red=base<=5000?312.89:base<=7350?978.62-0.133145*base:0;imp=Math.max(0,imp-Math.max(0,red))}
  return Math.round(imp*100)/100;
}
function carne(mes){return memo('ir|'+mes,()=>{const a=cartorio('c1',mes),b=cartorio('c2',mes);const base=Math.max(0,a.base+b.base-cfg().outrasDed);return{a,b,base,imp:irMensal(base,mes)}})}
function statusPagar(it){if(it.pago)return['good','Pago'];const d=difDias(it.data,HOJE);if(d<0)return['bad','Atrasada'];if(d===0)return['warn','Vence hoje'];if(d===1)return['warn','Vence amanhã'];if(d<=5)return['warn',`Vence em ${d} dias`];return['','Vence dia '+it.data.slice(8)]}

// Lançamentos que chegaram do banco (Open Finance) e ainda não viraram lançamento nem foram ignorados.
// par = já existe um lançamento com a mesma data, tipo e valor; cred = crédito em cartão (pagamento ou estorno).
function pendentes(){return memo('pend',()=>{const out=[];if(!S.inbox.some(b=>b.itens.length))return out;const ix=repetidos(),visto=new Set(),porPl=new Map();
  for(const c of S.contas)if(c.pluggy&&!porPl.has(c.pluggy))porPl.set(c.pluggy,c);
  for(const b of S.inbox){const ct=porPl.get(b.id);for(const it of b.itens){if(visto.has(it.id)||ix.fit.has('pluggy:'+it.id)||S.ign[it.id])continue;visto.add(it.id);
    out.push({...it,banco:b.nome,ct,par:ix.chave.has(it.data+'|'+it.tipo+'|'+cent(it.valor)),cred:ct?.tipo==='cartao'&&it.tipo==='rec'})}}
  return out.sort((a,b)=>b.data.localeCompare(a.data))})}
const aceitavel=p=>p.ct&&p.data&&!p.par&&!p.cred;
const preOF=it=>{const esp=ESP_OK[it.ct?.esp]?it.ct.esp:'casa';return{esp,tipo:it.tipo,desc:it.desc,valor:it.valor,data:it.data,conta:it.ct?.id||'',quem:it.ct?.dono||'p1',cat:sugerirCat(it.desc,esp,it.tipo),fitid:'pluggy:'+it.id,origem:'openfinance'}};
const saldoDe=c=>{const b=c.pluggy&&S.inbox.find(x=>x.id===c.pluggy);return b&&b.saldo!=null?b.saldo:c.saldo};

const linhaPagar=(it,onde)=>{const [c,t]=statusPagar(it);return `<div class="row"><button class="chk" data-act="pagar" data-ref="${it.ref}" data-id="${h(it.id)}" aria-pressed="${it.pago}" aria-label="${it.pago?'Desmarcar':'Marcar'} ${h(it.desc)} como pago">${it.pago?ic('ok',14):''}</button>
  <button class="rowbtn" data-act="abrir" data-ref="${it.ref}" data-id="${h(it.id)}"><span class="t"><b>${h(it.desc)}</b><small>${onde?h(onde)+' · ':''}${it.ref==='fatura'?pl(it.n,'compra','compras'):h(it.cat||'Sem categoria')}${it.est?' · valor estimado':''}</small></span>${it.nx?clipe(it.nx):''}<span class="rt"><span class="num">${it.est?'≈ ':''}${brl(it.valor)}</span><span class="st ${c}">${t}</span></span></button></div>`};
function listaPagar(itens,vazio,esp){
  if(!itens.length)return `<p class="empty">${vazio}</p>`;
  const dias=[...new Set(itens.map(i=>i.data.slice(8)))],sel=dias.includes(S.dia[esp])?S.dia[esp]:null,vis=sel?itens.filter(i=>i.data.slice(8)===sel):itens;
  const chips=dias.length>1?`<div class="dias">${dias.map(d=>{const n=itens.filter(i=>i.data.slice(8)===d);return `<button class="dia" data-act="dia" data-esp="${esp}" data-id="${d}" aria-pressed="${sel===d}" aria-label="Dia ${d}: ${pl(n.length,'conta','contas')}"><b>${d}</b><span>${n.slice(0,5).map(i=>`<i class="${i.pago?'ok':''}"></i>`).join('')}</span></button>`}).join('')}</div>`:'';
  return chips+`<div class="list">${vis.map(it=>linhaPagar(it)).join('')}</div>`;
}
const CATIC=[[/morad|aluguel|condom/i,'casa'],[/luz|energia|contas da casa|água/i,'raio'],[/mercado|material|selos/i,'sacola'],[/aliment/i,'garfo'],[/transp/i,'carro'],[/saúde/i,'cor'],[/educa/i,'livro'],[/lazer/i,'aviao'],[/assin|sistema/i,'tela'],[/dízimo|oferta/i,'cor'],[/famíl|folha|encarg/i,'gente'],[/reserva|retirada/i,'cofre'],[/repasse|iss|imposto|carnê/i,'cart'],[/contab/i,'ir'],[/manuten/i,'aj']];
const catIc=c=>ic((CATIC.find(r=>r[0].test(c||''))||[0,'ponto'])[1],18);
function barrasCat(pares,total){
  if(!pares.length)return `<p class="empty">Nenhuma despesa em ${mesMin(S.mes)}. Use Novo lançamento para registrar a primeira.</p>`;
  const max=pares[0][1]||1;
  return pares.slice(0,10).map(([n,v])=>`<div class="catrow" data-tip="${h(n)}\n${brl(v)} · ${pct(v,total)}% das despesas"><span class="tile">${catIc(n)}</span><div class="t"><div class="two"><span class="cn">${h(n)}</span><span class="num">${brl(v)}</span></div><div class="prog"><i style="width:${Math.max(2,v/max*100)}%"></i></div></div><span class="muted pc">${pct(v,total)}%</span></div>`).join('');
}
function spark(vals){const W=120,H=34,mx=Math.max(...vals,1),mn=Math.min(...vals,0),x=i=>4+i*(W-8)/(vals.length-1),y=v=>H-4-(v-mn)/(mx-mn||1)*(H-8),p=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}
function stack(segs,total){return `<div class="stack" role="img" aria-label="${h(segs.map(s=>s[0]+' '+brl(s[1])).join(', '))}">${segs.filter(s=>s[1]>0).map(s=>`<span style="width:${s[1]/total*100}%;background:var(--${s[2]})" data-tip="${h(s[0])}\n${brl(s[1])} · ${pct(s[1],total)}%"></span>`).join('')}</div>
  <div class="legend">${segs.map(s=>`<div><label><span class="dot" style="background:var(--${s[2]})"></span>${h(s[0])}</label><span class="num">${brl(s[1])}</span> <span class="muted">${pct(s[1],total)}%</span></div>`).join('')}</div>`}
// Eixo vertical comum aos dois gráficos de colunas.
function eixo(max,W,H,L,B,T){
  const p=Math.pow(10,Math.floor(Math.log10(Math.max(max,1)))),passo=[1,2,5,10].map(k=>k*p).find(k=>max/k<=4)||p*10,top=Math.max(passo,Math.ceil(max/passo)*passo),y=v=>T+(H-T-B)*(1-v/top);
  const kf=v=>v>=1000?(v/1000).toLocaleString('pt-BR')+' mil':String(v);
  let g='';for(let v=0;v<=top+passo/2;v+=passo)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${kf(v)}</text>`;
  return{y,g}}

// Previsão dos próximos meses: contas fixas, o que já está lançado (parcelas e faturas) e uma
// estimativa do gasto variável pela média dos últimos 3 meses.
function previsao(esp,n=6){return memo('prev|'+esp+'|'+S.mes+'|'+n,()=>{
  const entra=g=>esp==='casa'||grupo(g.cat)!=='ret',ant=[0,1,2].map(i=>mesDe(esp,addMes(S.mes,-i)));
  const com=ant.filter(m=>m.gastos.some(g=>g.ref==='lanc')||m.rec.some(r=>r.ref==='lanc')).length||1;
  const mVar=sum(ant,m=>sum(m.gastos.filter(g=>g.ref==='lanc'&&!g.parc&&entra(g)),g=>g.valor))/com;
  const mRec=sum(ant,m=>sum(m.rec.filter(r=>r.ref==='lanc'),r=>r.valor))/com;
  return Array.from({length:n},(_,i)=>{const mm=addMes(S.mes,i+1),m=mesDe(esp,mm),gs=m.gastos.filter(entra);
    const fix=sum(gs.filter(g=>g.ref==='fixa'),g=>g.valor),lan=sum(gs.filter(g=>g.ref==='lanc'),g=>g.valor),ja=sum(gs.filter(g=>g.ref==='lanc'&&!g.parc),g=>g.valor);
    const vari=Math.max(0,mVar-ja),rec=sum(m.rec.filter(r=>r.ref==='fixa'),r=>r.valor)+Math.max(mRec,sum(m.rec.filter(r=>r.ref==='lanc'),r=>r.valor));
    return{m:mm,fix,lan,vari,tot:fix+lan+vari,rec,sobra:rec-fix-lan-vari}})})}
function previsaoHtml(esp){

  if(!P.some(p=>p.tot||p.rec))return '<p class="empty">A previsão aparece depois que houver contas fixas cadastradas ou pelo menos um mês de lançamentos.</p>';
  const {y,g:grade}=eixo(Math.max(1,...P.map(p=>Math.max(p.tot,p.rec))),W,H,L,B,T);
  let g=grade;
  P.forEach((p,i)=>{const cx=L+i*pw+pw/2,bw=Math.min(44,pw*.5);let ac=0;
    for(const[v,cor]of[[p.fix,'navy'],[p.lan,'p2'],[p.vari,'p1']]){if(v<=0)continue;const y1=y(ac+v),hh=y(ac)-y1;ac+=v;if(hh>2)g+=`<rect x="${cx-bw/2}" y="${y1+1}" width="${bw}" height="${hh-2}" rx="2" fill="var(--${cor})"/>`}
    g+=`<line x1="${cx-bw/2-6}" x2="${cx+bw/2+6}" y1="${y(p.rec)}" y2="${y(p.rec)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink3)">${mesAbr(p.m)} ${p.m.slice(2,4)}</text><rect x="${L+i*pw}" y="${T}" width="${pw}" height="${H-T-B}" fill="transparent" data-tip="${mesNome(p.m)} ${p.m.slice(0,4)}\nEntradas previstas ${brl(p.rec)}\nContas fixas ${brl(p.fix)}\nJá lançado ${brl(p.lan)}\nVariável estimado ${brl(p.vari)}\nSobra prevista ${brl(p.sobra)}"/>`});
  const med=sum(P,p=>p.tot)/P.length,pior=P.reduce((a,b)=>b.sobra<a.sobra?b:a);
  return `<div class="kpis"><div class="kpi"><label>Gasto médio previsto</label><span class="mny kp">${brl(med)}</span><small>por mês</small></div><div class="kpi"><label>Mês mais apertado</label><span class="mny kp ${pior.sobra<0?'neg':''}">${brl(pior.sobra)}</span><small>de sobra em ${mesMin(pior.m)}</small></div><div class="kpi"><label>Já comprometido</label><span class="mny kp">${brl(sum(P,p=>p.lan))}</span><small>em parcelas e compras lançadas</small></div></div>
  <div class="keys"><span><i class="dot" style="background:var(--navy)"></i>Contas fixas</span><span><i class="dot" style="background:var(--p2)"></i>Já lançado</span><span><i class="dot" style="background:var(--p1)"></i>Variável estimado</span><span><b></b>Entradas previstas</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:760px" role="img" aria-label="Previsão de gastos e entradas dos próximos meses">${g}</svg>
  <div class="tw"><table><thead><tr><th>Mês</th><th class="r">Fixas</th><th class="r">Já lançado</th><th class="r">Variável</th><th class="r">Total</th><th class="r">Entradas</th><th class="r">Sobra</th></tr></thead><tbody>${P.map(p=>`<tr><td style="white-space:nowrap">${mesAbr(p.m)} ${p.m.slice(0,4)}</td><td class="r num">${fmt(p.fix)}</td><td class="r num">${fmt(p.lan)}</td><td class="r num">≈ ${fmt(p.vari)}</td><td class="r num">${fmt(p.tot)}</td><td class="r num">${fmt(p.rec)}</td><td class="r num ${p.sobra<0?'neg':'pos'}">${p.sobra<0?'− ':''}${fmt(Math.abs(p.sobra))}</td></tr>`).join('')}</tbody></table></div>`;
}

function vGuia(){
  return `<section class="card prose"><header><h2>Como usar em cinco passos</h2></header>
  <div class="steps"><div class="step"><b>1. Ajuste os nomes e a divisão</b><p>Em Ajustes, confirme os nomes, o percentual padrão de divisão das contas da casa e o regime de cada cartório.</p></div><div class="step"><b>2. Cadastre contas e cartões</b><p>Informe cada conta bancária e cada cartão (com dia de fechamento e de vencimento), dizendo se é da casa ou de um cartório.</p></div><div class="step"><b>3. Cadastre o que se repete</b><p>Salários, aluguel, luz, folha, sistema e repasses viram contas fixas e aparecem todo mês para você só marcar como pagas.</p></div><div class="step"><b>4. Lance ou importe o resto</b><p>Use Novo lançamento para o avulso, ou importe o extrato em Conexões e apenas confira as categorias.</p></div><div class="step"><b>5. Feche o mês</b><p>Na Casa, faça o acerto do casal. Nos cartórios, baixe o livro caixa. Em Impostos, veja quanto reservar para o DARF.</p></div></div></section>
  <section class="card prose"><header><h2>O que significa cada termo</h2></header><dl>

  <dt>Conta fixa</dt><dd>Entrada ou saída que se repete todo mês. Se o valor varia (luz, água), marque como estimado e ajuste o valor do mês quando a conta chegar. Ao mudar o valor mensal, os meses que já passaram mantêm o valor antigo.</dd>
  <dt>Despesa dividida</dt><dd>Despesa da casa rateada entre os dois pelo percentual escolhido. Cada lançamento guarda o percentual com que foi gravado: mudar o padrão em Ajustes vale só para os próximos. Despesas marcadas como "só de" uma pessoa não entram no acerto.</dd>
  <dt>Acerto do mês</dt><dd>Diferença entre o que cada um pagou e a parte que lhe cabia nas despesas divididas. Indica quem devolve quanto para quem.</dd>
  <dt>Fatura</dt><dd>Soma das compras do cartão entre dois fechamentos. Uma compra feita depois do dia de fechamento cai na fatura seguinte. Compras parceladas viram uma parcela por fatura.</dd>
  <dt>Repasses obrigatórios</dt><dd>Parte do que o cartório arrecada e não pertence à serventia: taxas e fundos devidos ao Tribunal e o ISS do município. Se você já lança os emolumentos líquidos desses valores, não lance os repasses de novo.</dd>
  <dt>Despesa dedutível</dt><dd>Despesa necessária à atividade da serventia e escriturada no livro caixa, como folha, encargos, aluguel e sistema. Ela reduz a base do carnê-leão.</dd>
  <dt>Retirada do titular</dt><dd>Dinheiro que sai do caixa do cartório para você. Não é despesa: lance como "Retirada do titular" no cartório e como receita "Retirada do cartório" na Casa.</dd>
  <dt>Carnê-leão</dt><dd>Recolhimento mensal do imposto de renda da pessoa física sobre o resultado das serventias. A página estima o valor somando os dois cartórios, porque o imposto é um só por CPF.</dd>
  <dt>Teto do interino</dt><dd>Quem responde interinamente por uma serventia tem a remuneração limitada a 90,25% do subsídio de ministro do STF, e o excedente é recolhido ao Tribunal. Marque o regime "interino" em Ajustes para acompanhar.</dd></dl></section>`;
}

let ULT=null;
// Se uma tela falhar, só ela vira um aviso: o menu e as outras telas continuam funcionando.
function render(){
  relogio();
  try{renderNav()}catch(e){console.warn(e)}
  let corpo;
  try{
    if(S.semDb)corpo=`<div class="top"><h1>Casa & Cartórios</h1></div><section class="card"><h2>Os dados desta página não estão disponíveis agora</h2><p class="sub" style="margin:0">Abra o painel pelo claude.ai, com a sua conta, para carregar e gravar os lançamentos.</p></section>`;
    else if(!carregado())corpo=`<div class="top"><h1>Casa & Cartórios</h1></div><section class="card"><h2>${S.lento?'Ainda não foi possível carregar seus dados':'Carregando seus dados…'}</h2><p class="sub" style="margin:0">${S.lento?'A conexão parece lenta. A página continua tentando sozinha.':'Aqui vão aparecer o saldo previsto da casa, o resultado de cada cartório e as contas a pagar do mês.'}</p></section>`;
    else{
      const v=S.view;
      corpo=v==='casa'?vCasa():v==='cartorio-1'?vCartorio('c1'):v==='cartorio-2'?vCartorio('c2'):v==='lancamentos'?vLanc():v==='impostos'?vCarne():v==='conexoes'?vConexoes():v==='guia'?vGuia():v==='ajustes'?vAjustes():vGeral();
      const nEx=[...S.lanc,...S.fixas].filter(x=>x.ex).length,nR=indice().ruins.length;
      let avisos='';
      if(nR&&v!=='lancamentos')avisos+=`<div class="banner erro"><p><b>${pl(nR,'lançamento está','lançamentos estão')} com data ou painel inválido</b> e não entra${nR===1?'':'m'} nos cálculos.</p><button class="btn sm" data-act="verLanc" data-esp="todos">Corrigir</button></div>`;
      if(nEx&&v!=='guia')avisos+=`<div class="banner"><p><b>Os valores marcados como exemplo são fictícios</b> e servem só para mostrar como o painel funciona. Troque pelos seus aos poucos ou apague todos em Ajustes.</p><button class="btn sm" data-act="ir" data-id="guia">Ver o guia</button>${v==='ajustes'?'':'<button class="btn sm" data-act="ir" data-id="ajustes">Abrir Ajustes</button>'}</div>`;
      corpo=topo()+avisos+corpo;
    }
  }catch(e){
    console.warn(e);
    corpo=`<div class="top"><h1>${h((VIEWS().find(x=>x[0]===S.view)||[0,'Casa & Cartórios'])[1])}</h1></div><section class="card"><h2>Não foi possível montar esta tela</h2><p class="sub" style="margin:0">Algum dado gravado está em um formato que a página não esperava. As outras telas continuam funcionando, e nada foi apagado.</p><p class="sub" style="margin:0">Detalhe técnico: ${h(e?.message||e)}</p><div class="chips"><button class="btn" data-act="redesenhar">Tentar de novo</button><button class="btn" data-act="backup">Baixar cópia de segurança</button></div></section>`;
  }
  if(corpo===ULT)return;ULT=corpo;
  const main=$('#main'),at=document.activeElement,foco=at&&main.contains(at)?at.id:'',pos=foco?at.selectionStart:null;
  main.innerHTML=corpo;
  if(foco){const el=document.getElementById(foco);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}

let rq=0;const pedir=()=>{if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})};
// O aviso sobe para a camada de cima (popover) para aparecer também na frente de um formulário aberto.
function toast(t){const el=$('#toast'),some=()=>{try{el.hidePopover()}catch(e){}};el.textContent=t;el.hidden=false;some();try{el.showPopover()}catch(e){}clearTimeout(toast.t);toast.t=setTimeout(()=>{some();el.hidden=true},4200)}

/* ============ gravação ============ */
function erroMsg(e){return e?.code==='invalid_argument'?'Não foi possível salvar. Seu acesso a esta página pode ser só de leitura.':e?.code==='quota_exceeded'?'O espaço de dados desta página está cheio. Apague lançamentos antigos.':'Não foi possível salvar agora. Tente de novo em instantes.'}
async function gravar(col,id,data,merge){
  if(!DB){toast('Os dados não estão disponíveis nesta visualização.');return null}
  try{const ref=id?DB.collection(col).doc(id):DB.collection(col).doc();await(merge?ref.update(data):ref.set(data));return ref.id}catch(e){toast(erroMsg(e));return null}
}
async function apagar(col,id){if(!DB)return false;try{await DB.collection(col).doc(id).delete();return true}catch(e){toast(erroMsg(e));return false}}
const semId=o=>{const{id,...r}=o;return r};
// Grava em grupos de 6 por vez; para no primeiro grupo que falhar e diz quantos entraram.
async function emLotes(itens,fn,passo){let feitos=0;for(let i=0;i<itens.length;i+=6){const r=await Promise.all(itens.slice(i,i+6).map(fn));feitos+=r.filter(Boolean).length;passo?.(feitos);if(r.some(x=>!x))return{feitos,ok:false}}return{feitos,ok:true}}
// config/geral: atualiza só os campos alterados quando o documento já existe.
const gravarCfg=d=>S.tem.geral?gravar('config','geral',d,true):gravar('config','geral',{...semId(cfg()),...d,acertos:{...cfg().acertos,...(d.acertos||{})}});
const apagarAnexos=as=>{if(AS)for(const a of as||[])AS.delete(a.id).catch(()=>{})};

/* ============ formulários ============ */
// campos: função(valores) → lista de {k,l(rótulo),t(tipo),o(opções),full,dica}
// ajustar(v): corrige os valores antes de cada desenho; aoMudar(k,v,dlg): reage a um campo alterado.
function abrirForm({titulo,campos,valores,salvar,excluir,excluirTodos,extra,anexos,ajustar,aoMudar}){
  const dlg=$('#dlg');if(dlg.open)dlg.close();
  let v={...valores},conf=0,anx=anexos?anexos.map(a=>({...a})):null,rem=[],novos=[],env=0,ocup=false,salvo=false,aberto=true;
  const blob=a=>'/_blob/'+encodeURIComponent(a.id);
  const anxHtml=()=>!anx?'':`<div class="anx"><h3>Comprovantes e documentos</h3>${anx.length?`<div class="anxl">${anx.map((a,i)=>`<div class="anxi">${/^image\//.test(a.tipo)?`<a href="${blob(a)}" target="_blank" rel="noopener"><img src="${blob(a)}" alt=""></a>`:`<a class="tile" href="${blob(a)}" target="_blank" rel="noopener" aria-label="Abrir ${h(a.nome)}">${ic('ir',18)}</a>`}<a class="t" href="${blob(a)}" target="_blank" rel="noopener">${h(a.nome)}</a><button type="button" class="btn sm danger" data-f="rmanx" data-i="${i}" aria-label="Remover ${h(a.nome)}">Remover</button></div>`).join('')}</div>`:'<p class="sub" style="margin:0">Anexe o boleto, a nota ou o comprovante do pagamento (foto ou PDF, até 20 MB).</p>'}${AS?`<div><button type="button" class="btn sm" id="f__anx" data-f="anx" ${env?'disabled':''}>${env?'Enviando…':'Anexar arquivo'}</button><input type="file" id="anxArq" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" multiple hidden></div>`:'<p class="sub" style="margin:0">Só quem pode editar esta página consegue anexar arquivos.</p>'}</div>`;
  const ler=()=>{for(const el of dlg.querySelectorAll('[data-k]')){const k=el.dataset.k;v[k]=el.type==='checkbox'?el.checked:el.value}};
  const desenhar=()=>{
    const foco=dlg.contains(document.activeElement)?document.activeElement.id:'';ajustar?.(v);
    dlg.innerHTML=`<form class="dlg" method="dialog"><h2>${h(titulo)}</h2><div class="fg">${campos(v).map(c=>{
      const id='f_'+c.k,val=v[c.k]??'';
      if(c.t==='check')return `<label class="ck ${c.full?'full':''}"><input type="checkbox" id="${id}" data-k="${c.k}" ${val?'checked':''}> ${h(c.l)}</label>`;
      const ctl=c.t==='select'?`<select class="inp" id="${id}" data-k="${c.k}" ${c.re?'data-re="1"':''}>${c.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${h(a)}" ${String(val)===String(a)?'selected':''}>${h(b)}</option>`}).join('')}</select>`
        :`<input class="inp" id="${id}" data-k="${c.k}" type="${c.t==='date'?'date':c.t==='color'?'color':'text'}" ${c.t==='money'||c.t==='num'?'inputmode="decimal"':''} ${c.t==='date'||c.t==='color'?'':'autocomplete="off"'} value="${h(c.t==='money'&&typeof val==='number'?fmt(val):val)}" ${c.ph?`placeholder="${h(c.ph)}"`:''}>`;
      return `<label class="${c.full?'full':''}">${h(c.l)}${ctl}${c.dica?`<small>${h(c.dica)}</small>`:''}</label>`}).join('')}</div>${anxHtml()}
      <footer>${!excluir?'':!conf?'<button type="button" class="btn danger" id="f__del" data-f="del">Excluir</button>':`<button type="button" class="btn danger" id="f__del" data-f="del">${excluirTodos?'Excluir só este':'Confirmar exclusão'}</button>${excluirTodos?`<button type="button" class="btn danger" data-f="delT">${h(excluirTodos.l)}</button>`:''}`}${extra?`<button type="button" class="btn" data-f="extra">${h(extra.l)}</button>`:''}<span class="sp"></span><button type="button" class="btn" data-f="x">Cancelar</button><button type="submit" class="btn pri" id="f__ok">Salvar</button></footer></form>`;
    if(foco)dlg.querySelector('#'+CSS.escape(foco))?.focus()};
  const redes=()=>{ler();desenhar()};
  const trava=rot=>{ocup=true;for(const b of dlg.querySelectorAll('button'))b.disabled=true;if(rot)dlg.querySelector('#f__ok').textContent=rot};
  // Fecha e limpa: ao salvar, apaga os arquivos removidos; ao desistir, apaga os enviados nesta janela.
  const fechar=()=>{if(!aberto)return;aberto=false;if(AS)for(const id of salvo?rem:novos)AS.delete(id).catch(()=>{});dlg.close()};
  dlg.oncancel=e=>{e.preventDefault();if(!ocup)fechar()};
  dlg.onchange=async e=>{const t=e.target;
    if(t.dataset.re){redes();return}
    if(t.dataset.k&&aoMudar){ler();aoMudar(t.dataset.k,v,dlg)}
    if(t.id==='anxArq'){const fs=[...t.files];if(!fs.length)return;ler();env++;desenhar();
      for(const f of fs){const tipo=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':'');
        if(f.size>20*1048576){toast(`"${f.name}" passa de 20 MB. Envie um arquivo menor.`);continue}
        try{const r=await AS.upload(f,tipo?{type:tipo}:undefined);
          if(!aberto){AS.delete(r.id).catch(()=>{});continue}
          novos.push(r.id);anx.push({id:r.id,nome:f.name.slice(0,80),tipo:r.contentType||tipo})}
        catch(er){toast(er?.code==='too_large'?`"${f.name}" passa de 20 MB. Envie um arquivo menor.`:er?.code==='unsupported_type'?`"${f.name}" não é aceito. Use foto (JPG, PNG) ou PDF.`:er?.code==='quota_or_state'?'O espaço de arquivos desta página está cheio.':'Não foi possível enviar o arquivo agora. Tente de novo.')}}
      env--;if(aberto&&!ocup)redes()}};
  dlg.onclick=async e=>{const b=e.target.closest?.('[data-f]');if(!b||b.disabled||ocup)return;const f=b.dataset.f;
    if(f==='x')fechar();
    else if(f==='del'||f==='delT'){if(!conf){conf=Date.now();redes();return}if(Date.now()-conf<450)return; // segundo clique de um duplo clique não confirma
      trava();let ok=false;try{ok=await(f==='delT'?excluirTodos.f():excluir())}catch(er){console.warn(er);toast(erroMsg(er))}
      if(ok)fechar();else if(aberto){ocup=false;redes()}}
    else if(f==='anx')dlg.querySelector('#anxArq').click();
    else if(f==='rmanx'){ler();const a=anx.splice(+b.dataset.i,1)[0];if(a)rem.push(a.id);desenhar()}

    let mx=0;c.forEach((x,i)=>{if(i!==iD&&i!==iV&&x.length>mx&&/[a-z]/i.test(x)){mx=x.length;iT=i}})}
  const out=[],uno=semRepetir();
  for(const l of ls.slice(ini)){const c=splitCSV(l,sep),d=dataDe(c[iD]);if(!d)continue;
    const v=iV>=0?parseBR(c[iV]):Math.abs(nv(c[iC]))-Math.abs(nv(c[iB]));if(!Number.isFinite(v)||v===0)continue;
    const desc=(iT>=0?c[iT]:'')||'Sem descrição';
    out.push({data:d,valor:Math.abs(v),tipo:v<0?'desp':'rec',desc,fitid:uno(`csv:${d}:${v}:${desc}`.slice(0,150))})}
  return out}
function lerArquivo(file){
  if(file.size>8*1048576){toast('O arquivo passa de 8 MB. Exporte um período menor.');return}
  const ler=enc=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=er;r.readAsText(file,enc)});
  ler('utf-8').then(t=>t.includes(String.fromCharCode(65533))?ler('windows-1252'):t).then(t=>abrirImport(file.name,t)).catch(()=>toast('Não foi possível ler o arquivo.'));
}
function abrirImport(nome,t){
  const ofx=/<OFX|<STMTTRN/i.test(t),itens=ofx?parseOFX(t):parseCSV(t);
  if(!itens.length){toast('Não encontrei lançamentos neste arquivo. Exporte o extrato em OFX ou em CSV com colunas de data e valor.');return false}
  S.imp={nome,csv:!ofx,inv:false,esp:espDaView(),conta:'',itens:itens.map(i=>({...i,on:true}))};marcarImp();render();return true;
}
// dup = já importado (mesmo identificador; no OFX também o mesmo valor, porque alguns bancos repetem o FITID);
// sus = existe lançamento com a mesma data, tipo e valor; cred = crédito em cartão (pagamento ou estorno).
// Suspeitos e créditos em cartão começam desmarcados, a não ser que a pessoa já tenha mexido na caixa.
function marcarImp(){const imp=S.imp,ix=repetidos(),cart=ehCartao(imp.conta);
  for(const i of imp.itens){const tipo=impTipo(imp,i);
    i.dup=!!i.fitid&&(imp.csv?ix.fit.has(i.fitid):ix.fitv.has(i.fitid+'|'+cent(i.valor)));
    if(imp.busy)continue;
    i.sus=!i.dup&&ix.chave.has(i.data+'|'+tipo+'|'+cent(i.valor));i.cred=cart&&tipo==='rec';
    if(!i.man)i.on=!i.sus&&!i.cred}}
async function importar(){
  const imp=S.imp;if(!imp||imp.busy)return;
  const sel=impSel(imp),c=conta(imp.conta),btn=()=>{const b=$('#impBtn');if(b)b.textContent=impRot(imp)};
  if(!sel.length)return;imp.busy=true;imp.prog='';render();
  const r=await emLotes(sel,it=>{const tipo=impTipo(imp,it);
    return gravar('lanc',null,{esp:imp.esp,tipo,desc:it.desc.slice(0,120),valor:it.valor,data:it.data,cat:it.cat||sugerirCat(it.desc,imp.esp,tipo),conta:c?c.id:'',quem:c?.dono||'p1',div:imp.esp==='casa'&&tipo==='desp'?cfg().divPadrao:null,pago:true,origem:'importado',fitid:it.fitid,rev:true,anexos:[]})},
    n=>{imp.prog=`Gravando ${n} de ${sel.length}…`;btn()});
  imp.busy=false;imp.prog='';
  if(!r.ok){toast(`${pl(r.feitos,'lançamento foi importado','lançamentos foram importados')} antes do erro. Os que faltam continuam na lista.`);marcarImp();render();return}
  S.imp=null;S.view='lancamentos';S.fEsp='todos';S.busca='';S.mes=sel.reduce((a,b)=>b.data>a?b.data:a,'').slice(0,7)||S.mes;location.hash='lancamentos';
  toast(`${pl(r.feitos,'lançamento importado','lançamentos importados')}.`);render();
}

/* ============ ações ============ */
async function baixar(nome,dados){
  if(!DL){toast('O download não está disponível nesta visualização.');return}
  try{await DL.save({filename:nome,data:dados})}catch(e){if(e?.code!=='declined')toast('Não foi possível gerar o arquivo agora.')}
}
let filaIgn=Promise.resolve();
const ACOES={
  ir:d=>{if(!VIEWS().some(x=>x[0]===d.id))return;S.view=d.id;S.lim=200;S.confEx=false;location.hash=d.id;render();window.scrollTo(0,0)},
  verLanc:d=>{S.fEsp=d.esp||'todos';S.busca='';ACOES.ir({id:'lancamentos'})},
  redesenhar:()=>{ULT=null;mudou();render()},
  mais:()=>{const dlg=$('#dlg');if(dlg.open)dlg.close();dlg.innerHTML=`<div class="dlg"><h2>Mais áreas</h2><div>${VIEWS().slice(4).map(x=>`<button class="nav" data-act="ir" data-id="${x[0]}" data-fecha="1">${ic(x[2])}<span>${h(x[1])}</span></button>`).join('')}</div><h3>Tema</h3>${temas(true)}<footer><button class="btn" data-fecha="1">Fechar</button></footer></div>`;
    dlg.onsubmit=dlg.onchange=dlg.oncancel=null;dlg.onclick=e=>{if(e.target.closest('[data-fecha]'))dlg.close()};dlg.showModal()},
  mes:d=>{S.mes=d.id==='0'?MES_HOJE:addMes(S.mes,+d.id);S.lim=200;render()},
  tema:d=>{S.tema=d.id==='light'||d.id==='dark'?d.id:null;if(S.tema)document.documentElement.dataset.theme=S.tema;else delete document.documentElement.dataset.theme;try{localStorage.setItem('tema',S.tema||'')}catch(e){}render()},
  novo:()=>formLanc(),
  dizimo:d=>formLanc(null,{esp:'casa',tipo:'desp',desc:'Dízimo de '+mesMin(S.mes),cat:'Dízimos e ofertas',valor:+d.v||'',divm:'ind'}),
  abrir:d=>{if(d.ref==='lanc')formLanc(d.id);else if(d.ref==='fixa')formFixaMes(d.id);else formConta(d.id)},
  // Marca na tela na hora e grava em seguida; se a gravação falhar, volta ao que estava.
  pagar:async d=>{const mes=S.mes,troca=async(col,o,campo,de,para)=>{o[campo]=para;mudou();render();if(!await gravar(col,o.id,campo==='pago'?{pago:para}:{pagos:{[mes]:para[mes]}},true)){o[campo]=de;mudou();render()}};
    if(d.ref==='fixa'){const f=S.fixas.find(x=>x.id===d.id);if(f)await troca('fixas',f,'pagos',f.pagos,{...f.pagos,[mes]:!f.pagos[mes]})}
    else if(d.ref==='fatura'){const c=conta(d.id);if(c)await troca('contas',c,'pagos',c.pagos,{...c.pagos,[mes]:!c.pagos[mes]})}
    else{const l=S.lanc.find(x=>x.id===d.id);if(l)await troca('lanc',l,'pago',l.pago,l.pago===false)}},
  fixa:d=>formFixa(d.id,d.esp),
  conta:d=>formConta(d.id,d.tipo,d.esp),
  meta:d=>formMeta(d.id),
  cfg:()=>formCfg(),
  acerto:async()=>{await gravarCfg({acertos:{[S.mes]:!cfg().acertos[S.mes]}})},
  fesp:d=>{S.fEsp=d.id;S.lim=200;render()},
  maisLanc:()=>{S.lim+=200;render()},
  ofClass:d=>{const it=pendentes().find(x=>x.id===d.id);if(it)formLanc(null,preOF(it))},
  // Some da lista na hora; as gravações vão em fila e cada uma acrescenta só o seu id ao mapa.
  ofIgn:d=>{const id=d.id;S.ign={...S.ign,[id]:true};mudou();render();
    filaIgn=filaIgn.then(async()=>{const ok=S.tem.ign?await gravar('config','ofignorados',{ids:{[id]:true}},true):await gravar('config','ofignorados',{ids:{...S.ign,[id]:true}});
      if(ok)S.tem.ign=true;else{const{[id]:_,...r}=S.ign;S.ign=r;mudou();render()}})},
  ofVinc:d=>{const b=S.inbox.find(x=>x.id===d.id);if(b)formConta(null,b.tipo,'casa',{pluggy:b.id,nome:b.nome,limite:b.limite||''})},
  ofTodos:async()=>{if(S.ocup.of)return;const ls=pendentes().filter(aceitavel);if(!ls.length)return;S.ocup.of='Gravando…';render();
    const r=await emLotes(ls,it=>{const p=preOF(it);return gravar('lanc',null,{esp:p.esp,tipo:p.tipo,desc:p.desc.slice(0,120),valor:p.valor,data:p.data,cat:p.cat,conta:p.conta,quem:p.quem,div:p.esp==='casa'&&p.tipo==='desp'?cfg().divPadrao:null,pago:true,origem:'openfinance',fitid:p.fitid,rev:true,anexos:[]})},
      n=>{S.ocup.of=`Gravando ${n} de ${ls.length}…`;pedir()});
    S.ocup.of='';ULT=null;render();if(r.feitos)toast(`${pl(r.feitos,'lançamento gravado','lançamentos gravados')}.`)},
  dia:d=>{S.dia[d.esp]=S.dia[d.esp]===d.id?null:d.id;render()},
  arquivo:()=>$('#arq').click(),
  impCancel:()=>{if(S.imp?.busy)return;S.imp=null;render()},
  importar:()=>importar(),
  csv:d=>{const k=cartorio(d.esp,S.mes);const ls=[...k.rec.map(x=>({...x,t:'rec'})),...k.gastos.map(x=>({...x,t:'desp'}))].sort((a,b)=>a.data.localeCompare(b.data));
    const q=s=>{s=String(s??'');if(/^[=+\-@\t]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}; // texto começando por = + - @ não vira fórmula na planilha
    const csv=BOM+['Data;Histórico;Categoria;Grupo;Receita;Despesa',...ls.map(x=>[x.data.split('-').reverse().join('/'),q(x.desc),q(x.cat),x.t==='rec'?'Receita':q(GRN[grupo(x.cat)]),x.t==='rec'?fmt(x.valor):'',x.t==='desp'?fmt(x.valor):''].join(';'))].join('\r\n');
    baixar(`livro-caixa-${d.esp==='c2'?'2':'1'}-${S.mes}.csv`,csv)},
  backup:()=>baixar(`casa-e-cartorios-${HOJE}.json`,JSON.stringify({gerado:HOJE,config:cfg(),contas:S.contas,fixas:S.fixas,lancamentos:S.lanc,metas:S.metas,ignorados:Object.keys(S.ign)},null,1)),
  limparEx:async()=>{if(S.ocup.ex)return;if(!S.confEx){S.confEx=true;render();return}
    const tudo=[['lanc',S.lanc],['fixas',S.fixas],['metas',S.metas],['contas',S.contas]].flatMap(([col,arr])=>arr.filter(x=>x.ex).map(x=>[col,x.id]));
    S.ocup.ex='Apagando…';render();let falhas=0;
    for(let i=0;i<tudo.length;i+=6){const r=await Promise.all(tudo.slice(i,i+6).map(([col,id])=>apagar(col,id)));falhas+=r.filter(x=>!x).length;S.ocup.ex=`Apagando ${Math.min(i+6,tudo.length)} de ${tudo.length}…`;pedir()}
    S.ocup.ex='';S.confEx=false;ULT=null;render();
    toast(falhas?`${pl(falhas,'exemplo não pôde ser apagado','exemplos não puderam ser apagados')}. Tente de novo.`:'Exemplos apagados. O painel agora mostra só o que você lançar.')}
};
function acionar(el,e){if(!el||el.disabled)return;const f=ACOES[el.dataset.act];if(!f)return;if(el.tagName==='A')e.preventDefault();
  try{const r=f(el.dataset,el);if(r?.catch)r.catch(er=>{console.warn(er);toast(erroMsg(er))})}catch(er){console.warn(er);toast('Não foi possível concluir. Tente de novo.')}}
document.addEventListener('click',e=>acionar(e.target.closest?.('[data-act]'),e));
// linhas de tabela clicáveis também respondem ao teclado
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('tr[data-act]')){e.preventDefault();acionar(e.target,e)}});
let tBusca=0;
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='busca'){S.busca=t.value;S.lim=200;clearTimeout(tBusca);tBusca=setTimeout(()=>{const el=$('#lancLista');if(el)el.innerHTML=lancLista()},80)} // só a lista muda; a página não é remontada a cada tecla
  if(t.dataset.imp!=null&&S.imp){const it=S.imp.itens[+t.dataset.imp];if(it){it.on=t.checked;it.man=true}const b=$('#impBtn');if(b){b.textContent=impRot(S.imp);b.disabled=!impSel(S.imp).length}}});
document.addEventListener('change',e=>{const t=e.target,imp=S.imp;if(!imp||imp.busy)return;
  if(t.id==='impEsp'){imp.esp=ESP_OK[t.value]?t.value:'casa';imp.conta='';imp.itens.forEach(i=>delete i.cat);marcarImp();render()}
  if(t.id==='impConta'){imp.conta=t.value;if(imp.csv&&ehCartao(t.value))imp.inv=true;marcarImp();render()}
  if(t.id==='impInv'){imp.inv=t.checked;imp.itens.forEach(i=>delete i.cat);marcarImp();render()}
  if(t.dataset.impcat!=null&&imp.itens[+t.dataset.impcat])imp.itens[+t.dataset.impcat].cat=t.value});
$('#arq').addEventListener('change',e=>{const f=e.target.files[0];if(f)lerArquivo(f);e.target.value=''});
// dica ao passar o mouse ou tocar numa marca de gráfico
const tip=$('#tip');
const mostraTip=e=>{const el=e.target.closest?.('[data-tip]');if(!el){tip.hidden=true;return}tip.textContent=el.dataset.tip;tip.hidden=false;const x=Math.min(window.innerWidth-250,Math.max(8,e.clientX+12)),y=Math.max(8,e.clientY-tip.offsetHeight-10);tip.style.left=x+'px';tip.style.top=y+'px'};
document.addEventListener('pointermove',mostraTip);document.addEventListener('pointerdown',mostraTip);
window.addEventListener('scroll',()=>{tip.hidden=true},{passive:true});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS().some(x=>x[0]===v)&&v!==S.view){S.view=v;S.lim=200;render();window.scrollTo(0,0)}});

/* ============ início ============ */
async function iniciar(){
  try{const t=localStorage.getItem('tema');if(t==='light'||t==='dark'){S.tema=t;document.documentElement.dataset.theme=t}}catch(e){}
  const v=location.hash.slice(1);if(VIEWS().some(x=>x[0]===v))S.view=v;
  render();
  // os gráficos têm uma versão estreita; virou o dia, o "hoje" muda
  try{window.matchMedia('(max-width:639px)').addEventListener('change',()=>render())}catch(e){}
  setInterval(()=>{if(!document.hidden)render()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
  const lento=setTimeout(()=>{if(!carregado()){S.lento=true;render()}},10000);
  const use=async n=>{try{return await window.claude.use(n)}catch(e){return null}};
  [DB,DL,AS]=await Promise.all([use('db'),use('downloads'),use('assets')]);
  if(!DB){clearTimeout(lento);S.semDb=true;render();return}
  const fim=k=>{S.ok[k]=true;if(carregado())clearTimeout(lento);mudou();pedir()};
  const erro=()=>{clearTimeout(lento);if(!carregado())S.semDb=true;render()};
  const seguro=(f,g)=>s=>{try{f(s)}catch(e){console.warn(e);g?.()}};
  const docs=(q,n)=>q.docs.map(d=>{try{return n({...obj(d.data()),id:d.id})}catch(e){console.warn(e);return null}}).filter(Boolean);
  DB.doc('config/geral').onSnapshot(seguro(s=>{S.tem.geral=!!s.exists;S.cfg=normCfg(s.exists?s.data():{});BUSCA=new WeakMap();fim('cfg')}),erro);
  DB.doc('config/openfinance').onSnapshot(seguro(s=>{S.of=s.exists?s.data():null;pedir()}),()=>{});
  DB.doc('config/ofignorados').onSnapshot(seguro(s=>{S.tem.ign=!!s.exists;S.ign=s.exists?obj(obj(s.data()).ids):{};mudou();pedir()}),()=>{});
  DB.collection('of_inbox').onSnapshot(seguro(q=>{S.inbox=docs(q,NORM.inbox);mudou();pedir()}),()=>{});
  for(const k of['lanc','fixas','contas','metas'])
    DB.collection(k).onSnapshot(seguro(q=>{S[k]=docs(q,NORM[k]);BUSCA=new WeakMap();fim(k);if(k==='lanc'&&S.imp)marcarImp()}),erro);
}
iniciar();
