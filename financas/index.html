<title>Casa & Cartórios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
/* Layout: menu lateral no computador e barra flutuante no celular; cada área (casa, cartório) é uma grade de cartões brancos sobre fundo cinza-azulado, resumo antes do detalhe. */
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--soft:#F4F6FA;--line:#E6E9F0;
  --ink:#0E1320;--ink2:#566074;--ink3:#8690A3;
  --accent:#2457E6;--accent-soft:#E6EDFF;--pill:#0E1320;--pillfg:#FFFFFF;
  --p1:#2F8BFF;--p2:#D9457A;--navy:#4B3FB5;--sobra:#14A05A;--neutro:#C9CFDA;
  --rec:#2457E6;--sai:#E0812B;
  --good:#0E8A4B;--warn:#A86400;--bad:#CC2C3B;--good-soft:#E2F5EA;--warn-soft:#FFF1D6;--bad-soft:#FDE7E9;
  --shadow:0 1px 2px rgba(14,19,32,.04),0 10px 30px rgba(20,40,90,.07);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fd:'Inter Tight','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14;--card:#141923;--soft:#1A202C;--line:#262D3B;
  --ink:#EEF1F7;--ink2:#A7B0C4;--ink3:#727C92;
  --accent:#7398FF;--accent-soft:#1C2848;--pill:#EEF1F7;--pillfg:#0B0E14;
  --p1:#3B8BEA;--p2:#D9508A;--navy:#6A5AE0;--sobra:#1FA866;--neutro:#3A4252;
  --rec:#5F86F0;--sai:#D07A2A;
  --good:#3DCB84;--warn:#F0B34A;--bad:#FF6B78;--good-soft:#12301F;--warn-soft:#33270F;--bad-soft:#3A161B;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E14;--card:#141923;--soft:#1A202C;--line:#262D3B;
  --ink:#EEF1F7;--ink2:#A7B0C4;--ink3:#727C92;
  --accent:#7398FF;--accent-soft:#1C2848;--pill:#EEF1F7;--pillfg:#0B0E14;
  --p1:#3B8BEA;--p2:#D9508A;--navy:#6A5AE0;--sobra:#1FA866;--neutro:#3A4252;
  --rec:#5F86F0;--sai:#D07A2A;
  --good:#3DCB84;--warn:#F0B34A;--bad:#FF6B78;--good-soft:#12301F;--warn-soft:#33270F;--bad-soft:#3A161B;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1360px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;background:var(--card);border-radius:20px;padding:16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 12px}
.duo{display:flex}.duo b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px var(--f);border:2px solid var(--card)}
.duo b+b{margin-left:-8px}
.brand strong{font:700 15px var(--fd);display:block}.brand small{color:var(--ink3);font-size:12px}
.navlab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 4px}
.nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:500;text-align:left}
.nav:hover{background:var(--soft)}.nav[aria-current="page"]{font-weight:600}
.nav svg{flex:none}.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mes{display:flex;align-items:center;gap:4px}
.mes h1{font:700 24px var(--fd);margin:0 6px;white-space:nowrap}.mes h1 span{color:var(--ink3);font-weight:600}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--soft)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.danger{color:var(--bad)}
.grid{display:grid;align-items:start;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card>header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2{font:600 15px var(--f);margin:0}.card h2 small{color:var(--ink3);font-weight:500}
.card h3{font:600 13px var(--f);margin:0;color:var(--ink)}
details.info{display:contents}
details.info summary{list-style:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink3);cursor:pointer;font-weight:600}
details.info summary::-webkit-details-marker{display:none}
details.info p{flex-basis:100%;margin:0;background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--ink2);font-size:13px;max-width:70ch}
.mny{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.mny i{font-style:normal;color:var(--ink3);font-size:.6em;margin-right:.15em}.mny small{font-size:.5em;color:var(--ink3);font-weight:600}
.big{font-size:44px;line-height:1}.mid{font-size:30px;line-height:1.05}.kp{font-size:22px}
.muted{color:var(--ink3)}.sub{color:var(--ink2);font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.stack span{min-width:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.legend div{min-width:0}.legend label{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--ink3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.row{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left}
button.row:hover,.rowbtn:hover{background:var(--soft)}
.rowbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:4px;border-radius:8px}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--neutro);background:none;display:grid;place-items:center;color:#fff;padding:0}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.neu{background:var(--soft);color:var(--ink2)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.av{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 10px var(--f);flex:none}
.split{display:flex;gap:2px;height:28px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
.split span{display:flex;align-items:center;padding:0 8px;min-width:0;overflow:hidden}
.split span:last-child{justify-content:flex-end}

.acerto .t b,.acerto .t small{white-space:normal}
.two{display:flex;justify-content:space-between;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hbar i{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--soft);border-radius:14px;padding:12px 14px;min-width:0}
.kpi label{display:block;color:var(--ink2);font-size:12px;margin-bottom:4px}
.kpi small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr[data-act]{cursor:pointer}tbody tr[data-act]:hover{background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:500;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pillfg);border-color:var(--pill)}
.inp{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:220px}
.empty{color:var(--ink3);padding:14px 0;font-size:13px}
.ccard{border-radius:16px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:18px;min-width:0}
.ccard .mny i,.ccard .mny small{color:rgba(255,255,255,.7)}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step{background:var(--soft);border-radius:14px;padding:14px}
.step b{display:block;margin-bottom:4px}.step p{margin:0;color:var(--ink2);font-size:13px}
.prose p{max-width:70ch;margin:0 0 8px;color:var(--ink2)}.prose dt{font-weight:600;margin-top:10px}.prose dd{margin:2px 0 0;color:var(--ink2);max-width:70ch}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,22,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font:700 18px var(--fd)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:500;min-width:0}
.fg label.full{grid-column:1/-1}.fg label.ck{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.fg small{color:var(--ink3);font-weight:400}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pill);color:var(--pillfg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:60;max-width:calc(100vw - 32px)}
#tip{position:fixed;z-index:70;background:var(--pill);color:var(--pillfg);padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;white-space:pre-line;max-width:240px}
.card,.side,.top{border:1px solid var(--line)}
.card{position:relative}
.card.has-art>header{padding-right:96px;min-height:30px}
.art{position:absolute;top:8px;right:14px;width:92px;height:92px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(14,19,32,.12))}.art svg{width:100%;height:100%;display:block}
.hero .art{width:120px;height:120px;top:14px;right:22px}
.hero .big{font-size:58px}
.heroN{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;padding-right:120px}.heroN .sub{padding-bottom:6px}
.colL{grid-column:span 8;display:flex;flex-direction:column;gap:16px;min-width:0}
.acerto .t{min-width:150px}
.colR{grid-column:span 4;display:flex;flex-direction:column;gap:16px;min-width:0}
.kcard{border:1px solid var(--line);text-align:left;gap:6px;padding-bottom:0;overflow:hidden}.kcard h2{padding-right:70px}.kcard .art{width:64px;height:64px;top:10px;right:10px}
.spark{display:block;width:calc(100% + 40px);margin:6px -20px 0;height:44px}
.dias{display:flex;gap:6px;overflow-x:auto;padding:2px}
.dia{flex:1 0 50px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.dia b{font:700 15px var(--fd)}.dia span{display:flex;gap:3px;height:4px}.dia i{width:4px;height:4px;border-radius:50%;background:var(--neutro)}.dia i.ok{background:var(--good)}
.dia[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.dia[aria-pressed="true"] i{background:#fff}
.tile{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.catrow{display:flex;gap:12px;align-items:center;padding:8px 0}.catrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.catrow .pc{width:34px;text-align:right;font-size:12px}
.catrow .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:32px}
.ccs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 14px}
.cc{flex:0 0 min(310px,88%);aspect-ratio:1.586;border:0;border-radius:16px;padding:16px 18px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;background:repeating-linear-gradient(100deg,rgba(255,255,255,.045) 0 2px,transparent 2px 5px),linear-gradient(135deg,color-mix(in srgb,var(--cc) 76%,#fff),var(--cc) 45%,color-mix(in srgb,var(--cc) 60%,#000));box-shadow:0 10px 22px rgba(14,19,32,.25)}
.cc .two{align-items:center}.ccn{font:700 16px var(--fd);letter-spacing:.02em}.ccp{background:rgba(255,255,255,.2);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600}
.ccmid{display:flex;align-items:center;gap:12px}.ccv{flex:1;font:700 22px var(--fd);font-variant-numeric:tabular-nums}
.ccf{font-weight:600;font-size:13px}.ccf small{display:block;font-size:9px;letter-spacing:.12em;opacity:.7;font-weight:500}
.lab{font-size:11px!important;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)!important}
.prox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.px{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:118px;position:relative;overflow:hidden;border:1.5px solid transparent;text-align:center}
.px.on{border-color:var(--accent);background:var(--card)}.px b{font-size:12px;position:absolute;top:10px;left:0;right:0}
.px .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--accent-soft),transparent);border-top:2px solid var(--accent)}.px .num{position:relative;font-size:13px}
.splitw{position:relative}.splitw u{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.acerto{border:0!important;background:var(--soft);border-radius:12px;padding:10px 12px!important;flex-wrap:wrap}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--soft)}.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--sobra)}.gauge i.w{background:var(--sai)}.gauge u{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding:3px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tl{display:flex;gap:10px;align-items:center;min-width:0}.tl div{min-width:0}.tl small{display:block;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.waffle{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}.waffle i{aspect-ratio:1;border-radius:3px}
.nav[aria-current="page"]{background:var(--pill);color:var(--pillfg)}
.btn.pri{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.prog{height:8px}
@media (max-width:900px){.hero .big{font-size:42px}.hero .art{width:84px;height:84px;top:10px;right:12px}.heroN{padding-right:0}.card.has-art>header{padding-right:84px}}
.clp{display:inline-flex;align-items:center;gap:2px;color:var(--ink3);font-size:11px;font-weight:600;vertical-align:middle}
.anx{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}.anxl{display:flex;flex-direction:column;gap:6px}
.anxi{display:flex;align-items:center;gap:10px;min-width:0}.anxi img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}.anxi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent);font-weight:500}.anxi a.tile{text-decoration:none;width:44px;height:44px}
.bnav,.fab{display:none}
svg text{font-family:var(--f)}
@media (max-width:1100px){.colR,.colL{grid-column:span 12}.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:110px}.side{display:none}
  .big{font-size:36px}.mes h1{font-size:20px}.c3{grid-column:span 12}.fg{grid-template-columns:1fr}
  .bnav{display:flex;position:fixed;z-index:40;left:max(12px,env(safe-area-inset-left,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 68px);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:99px;box-shadow:0 6px 24px rgba(14,19,32,.18);padding:6px;justify-content:space-between;gap:2px}
  .bnav button{flex:1;min-width:0;border:0;background:none;border-radius:99px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink2);font-weight:500}
  .bnav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .bnav button[aria-current="page"]{background:var(--pill);color:var(--pillfg)}
  .fab{display:grid;place-items:center;position:fixed;z-index:40;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 6px 24px rgba(36,87,230,.4)}
  .top .add{display:none}
}
@media (prefers-reduced-motion:no-preference){.prog i,.stack span,.hbar i{transition:width .3s}}
</style>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"></main>

'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>(Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=v=>(v<0?'− ':'')+'R$ '+fmt(Math.abs(v));
const money=(v,cls='')=>{const [a,b]=fmt(Math.abs(v)).split(',');return `<span class="mny ${cls}">${v<0?'− ':''}<i>R$</i>${a}<small>,${b}</small></span>`};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const pad=n=>String(n).padStart(2,'0');
const hojeD=new Date();const HOJE=`${hojeD.getFullYear()}-${pad(hojeD.getMonth()+1)}-${pad(hojeD.getDate())}`;
const ymIdx=m=>{const [y,mm]=m.split('-').map(Number);return y*12+mm-1};
const idxYm=i=>`${Math.floor(i/12)}-${pad(i%12+1)}`;

const parseBR=s=>{s=String(s??'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};

// nd = não dedutível; ret = retirada do titular (não entra no resultado).
const CATS={
  casa:{rec:['Salário','Retirada do cartório','Cursos e aulas','Rendimentos','Outras receitas'],
        desp:['Moradia','Contas da casa','Mercado','Alimentação fora','Transporte','Saúde','Educação','Lazer e viagens','Assinaturas','Família','Dízimos e ofertas','Compras','Impostos','Reserva e investimentos','Outros']},
  cart:{rec:['Emolumentos','Ressarcimento de atos gratuitos','Complementação de renda mínima','Outras receitas'],
        desp:[['Repasses ao Tribunal e fundos','rep'],['ISS','rep'],['Folha de pagamento','ded'],['Encargos (INSS, FGTS)','ded'],['Aluguel do imóvel','ded'],['Sistema e informática','ded'],['Água, luz e internet','ded'],['Material de expediente','ded'],['Selos e papel de segurança','ded'],['Contabilidade','ded'],['Manutenção e limpeza','ded'],['Outras despesas dedutíveis','ded'],['Despesa não dedutível','nd'],['Carnê-leão (DARF)','nd'],['Retirada do titular','ret']]}};
const GRUPO=Object.fromEntries(CATS.cart.desp);
const GRN={rep:'Repasses obrigatórios',ded:'Despesas dedutíveis',nd:'Não dedutíveis',ret:'Retirada do titular'};
const grupo=c=>GRUPO[c]||'ded';
const catsDe=(esp,tipo)=>esp==='casa'?CATS.casa[tipo]:(tipo==='rec'?CATS.cart.rec:CATS.cart.desp.map(c=>c[0]));
const REGRAS=[[/supermerc|atacad|assai|mercad|hortifr|carrefour|mateus/i,'Mercado'],[/uber|99 ?app|posto|combust|ipiranga|shell|estaciona|ped[aá]gio/i,'Transporte'],[/netflix|spotify|prime|disney|hbo|youtube|icloud|google one|apple\.com/i,'Assinaturas'],[/ifood|restaur|padaria|lanch|pizza|burger|caf[eé]/i,'Alimentação fora'],[/farm[aá]c|drog|unimed|hapvida|cl[ií]nica|hospital|laborat/i,'Saúde'],[/aluguel|condom|imobili/i,'Moradia'],[/celpe|neoenergia|compesa|energia|vivo|claro|tim |oi fibra|internet/i,'Contas da casa'],[/escola|faculdade|curso|livraria|udemy/i,'Educação'],[/cinema|hotel|airbnb|latam|gol |azul |booking/i,'Lazer e viagens'],[/darf|iptu|ipva|receita federal/i,'Impostos']];
const sugerirCat=(desc,esp,tipo)=>{if(esp==='casa'&&tipo==='desp'){const r=REGRAS.find(r=>r[0].test(desc));return r?r[1]:'Outros'}return catsDe(esp,tipo)[esp==='casa'?catsDe(esp,tipo).length-1:(tipo==='rec'?0:11)]};

/* ============ cálculo ============ */
// Mês em que vence a fatura de uma compra feita no cartão.
function faturaMes(card,d){let i=ymIdx(d.slice(0,7));if(+d.slice(8,10)>(card.fecha||31))i++;if((card.vence||1)<=(card.fecha||31))i++;return idxYm(i)}
const valorFixa=(f,mes)=>f.valores?.[mes]??f.valor;
// Tudo que entra e sai de um espaço num mês. gastos = cada despesa (para categoria e divisão);
// pagar = como o dinheiro sai (contas fixas, avulsos e faturas dos cartões).
function mesDe(esp,mes){
  const rec=[],gastos=[],pagar=[];
  for(const f of S.fixas){if(f.esp!==esp||f.ativo===false||(f.desde&&mes<f.desde))continue;
    const it={ref:'fixa',id:f.id,desc:f.desc,valor:valorFixa(f,mes),cat:f.cat,quem:f.quem||'p1',div:f.div,data:dataNoMes(mes,f.dia),pago:!!f.pagos?.[mes],est:f.est&&f.valores?.[mes]==null,nx:f.anexosMes?.[mes]?.length||0};
    if(f.tipo==='rec')rec.push(it);else{gastos.push(it);pagar.push(it)}}
  const fat={};
  for(const l of S.lanc){if(l.esp!==esp)continue;const c=conta(l.conta);
    if(c&&c.tipo==='cartao'&&l.tipo==='desp'){if(faturaMes(c,l.data)!==mes)continue;
      gastos.push({ref:'lanc',id:l.id,desc:l.desc,valor:l.valor,cat:l.cat,quem:c.dono||l.quem||'p1',div:l.div,data:l.data,pago:true,cartao:c.id,parc:l.parc,nx:l.anexos?.length||0});
      (fat[c.id]??=[]).push(l);continue}
    if(l.data.slice(0,7)!==mes)continue;
    const it={ref:'lanc',id:l.id,desc:l.desc,valor:l.valor,cat:l.cat,quem:l.quem||'p1',div:l.div,data:l.data,pago:l.pago!==false,parc:l.parc,nx:l.anexos?.length||0};
    if(l.tipo==='rec')rec.push(it);else{gastos.push(it);pagar.push(it)}}
  for(const c of S.contas){if(c.tipo!=='cartao'||c.esp!==esp)continue;const ls=fat[c.id]||[];if(!ls.length)continue;
    pagar.push({ref:'fatura',id:c.id,desc:'Fatura '+c.nome,valor:sum(ls,l=>l.valor),cat:'Cartão',quem:c.dono||'p1',data:dataNoMes(mes,c.vence),pago:!!c.pagos?.[mes],n:ls.length})}
  pagar.sort((a,b)=>a.data.localeCompare(b.data));
  const R=sum(rec,x=>x.valor),D=sum(gastos,x=>x.valor);
  const porCat={};for(const g of gastos)porCat[g.cat||'Outros']=(porCat[g.cat||'Outros']||0)+g.valor;
  return{rec,gastos,pagar,R,D,porCat:Object.entries(porCat).sort((a,b)=>b[1]-a[1])};
}
// Divisão do casal: quanto cada um pagou e quanto era a parte de cada um.
function divisao(m){
  const r={comp:0,ind1:0,ind2:0,parte1:0,parte2:0,pagou1:0,pagou2:0,rec1:0,rec2:0};
  for(const x of m.rec)x.quem==='p2'?r.rec2+=x.valor:r.rec1+=x.valor;
  for(const g of m.gastos){const ind=g.div==null;const d1=ind?(g.quem==='p2'?0:100):g.div;
    const s1=g.valor*d1/100,s2=g.valor-s1;r.parte1+=s1;r.parte2+=s2;
    if(ind)g.quem==='p2'?r.ind2+=g.valor:r.ind1+=g.valor;else r.comp+=g.valor;
    g.quem==='p2'?r.pagou2+=g.valor:r.pagou1+=g.valor}
  r.acerto=r.pagou1-r.parte1; // >0: p2 devolve para p1
  return r;
}
function cartorio(esp,mes){
  const m=mesDe(esp,mes);const g={rep:0,ded:0,nd:0,ret:0};
  for(const x of m.gastos)g[grupo(x.cat)]+=x.valor;
  const res=m.R-g.rep-g.ded-g.nd;
  return{...m,...g,res,base:m.R-g.rep-g.ded,margem:pct(res,m.R)};
}
// Estimativa do carnê-leão: tabela mensal em vigor desde maio/2025 e redução da Lei 15.270/2025 (a partir de jan/2026).
function irMensal(base,mes){
  if(base<=0)return 0;
  const T=[[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[Infinity,.275,908.73]];
  const f=T.find(t=>base<=t[0]);let imp=Math.max(0,base*f[1]-f[2]);
  if(mes>='2026-01'){const red=base<=5000?312.89:base<=7350?978.62-0.133145*base:0;imp=Math.max(0,imp-Math.max(0,red))}
  return Math.round(imp*100)/100;
}
function carne(mes){const a=cartorio('c1',mes),b=cartorio('c2',mes);const base=Math.max(0,a.base+b.base-(cfg().outrasDed||0));return{a,b,base,imp:irMensal(base,mes)}}
function statusPagar(it){if(it.pago)return['good','Pago'];const d=difDias(it.data,HOJE);if(d<0)return['bad','Atrasada'];if(d===0)return['warn','Vence hoje'];if(d<=5)return['warn',`Vence em ${d} d`];return['neu','Dia '+it.data.slice(8)]}

// Lançamentos que chegaram do banco (Open Finance) e ainda não viraram lançamento nem foram ignorados.
function pendentes(){const tem=new Set(S.lanc.map(l=>l.fitid).filter(Boolean)),out=[];

  return out.sort((a,b)=>b.data.localeCompare(a.data))}

}

function spark(vals){const W=120,H=34,mx=Math.max(...vals,1),mn=Math.min(...vals,0),x=i=>4+i*(W-8)/(vals.length-1),y=v=>H-4-(v-mn)/(mx-mn||1)*(H-8),p=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');

// Barras dos últimos 12 meses: entradas x saídas (um eixo só).
function grafico12(serie){
  const W=720,H=220,L=46,B=26,T=10,pw=(W-L-8)/serie.length,max=Math.max(1,...serie.map(s=>Math.max(s.a,s.b)));
  const passo=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));return [1,2,5,10].map(k=>k*p).find(k=>max/k<=4)||p*10})();
  const top=Math.ceil(max/passo)*passo,y=v=>T+(H-T-B)*(1-v/top);
  const kf=v=>v>=1000?(v/1000).toLocaleString('pt-BR')+' mil':String(v);
  const bar=(x,v,cor)=>{const yy=y(v),hh=H-B-yy;if(hh<=0)return'';const r=Math.min(4,hh);return `<path d="M${x},${H-B}V${yy+r}q0,-${r} ${r},-${r}h${13-2*r}q${r},0 ${r},${r}V${H-B}z" fill="var(--${cor})"/>`};
  let g='';for(let v=0;v<=top;v+=passo)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${kf(v)}</text>`;
  serie.forEach((s,i)=>{const x=L+i*pw+pw/2;g+=bar(x-14,s.a,'rec')+bar(x+1,s.b,'sai')+`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--${s.m===S.mes?'ink':'ink3'})" font-weight="${s.m===S.mes?700:400}">${mesAbr(s.m)}</text><rect x="${L+i*pw}" y="${T}" width="${pw}" height="${H-T-B}" fill="transparent" data-tip="${mesNome(s.m)} ${s.m.slice(0,4)}\nEntradas ${brl(s.a)}\nSaídas ${brl(s.b)}\nResultado ${brl(s.a-s.b)}"/>`});
  return `<div class="chips" style="font-size:12px;color:var(--ink2);gap:14px"><span><span class="dot" style="background:var(--rec)"></span> Entradas</span><span><span class="dot" style="background:var(--sai)"></span> Saídas (repasses + despesas)</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entradas e saídas dos últimos 12 meses">${g}</svg>`;
}

/* ============ previsão ============ */
// Previsão dos próximos meses: contas fixas, o que já está lançado (parcelas e faturas) e uma
// estimativa do gasto variável pela média dos últimos 3 meses.
function previsao(esp,n=6){
  const conta=g=>esp==='casa'||grupo(g.cat)!=='ret',ant=[0,1,2].map(i=>mesDe(esp,addMes(S.mes,-i)));
  const com=ant.filter(m=>m.gastos.some(g=>g.ref==='lanc')||m.rec.some(r=>r.ref==='lanc')).length||1;
  const mVar=sum(ant,m=>sum(m.gastos.filter(g=>g.ref==='lanc'&&!g.parc&&conta(g)),g=>g.valor))/com;
  const mRec=sum(ant,m=>sum(m.rec.filter(r=>r.ref==='lanc'),r=>r.valor))/com;
  return Array.from({length:n},(_,i)=>{const mm=addMes(S.mes,i+1),m=mesDe(esp,mm),gs=m.gastos.filter(conta);
    const fix=sum(gs.filter(g=>g.ref==='fixa'),g=>g.valor),lan=sum(gs.filter(g=>g.ref==='lanc'),g=>g.valor),ja=sum(gs.filter(g=>g.ref==='lanc'&&!g.parc),g=>g.valor);
    const vari=Math.max(0,mVar-ja),rec=sum(m.rec.filter(r=>r.ref==='fixa'),r=>r.valor)+Math.max(mRec,sum(m.rec.filter(r=>r.ref==='lanc'),r=>r.valor));
    return{m:mm,fix,lan,vari,tot:fix+lan+vari,rec,sobra:rec-fix-lan-vari}});
}
function previsaoHtml(esp){
  const P=previsao(esp),W=720,H=230,L=46,B=26,T=12,pw=(W-L-8)/P.length,max=Math.max(1,...P.map(p=>Math.max(p.tot,p.rec)));
  if(!P.some(p=>p.tot||p.rec))return '<p class="empty">Cadastre as contas fixas e lance alguns meses de gastos para a previsão aparecer.</p>';
  const passo=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));return [1,2,5,10].map(k=>k*p).find(k=>max/k<=4)||p*10})(),top=Math.ceil(max/passo)*passo,y=v=>T+(H-T-B)*(1-v/top);
  const kf=v=>v>=1000?(v/1000).toLocaleString('pt-BR')+' mil':String(v);
  let g='';for(let v=0;v<=top;v+=passo)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${kf(v)}</text>`;
  P.forEach((p,i)=>{const cx=L+i*pw+pw/2,bw=Math.min(46,pw*.5);let ac=0;
    for(const[v,cor]of[[p.fix,'navy'],[p.lan,'p2'],[p.vari,'p1']]){if(v<=0)continue;const y1=y(ac+v),hh=y(ac)-y1;ac+=v;if(hh>2)g+=`<rect x="${cx-bw/2}" y="${y1+1}" width="${bw}" height="${hh-2}" rx="3" fill="var(--${cor})"/>`}
    g+=`<line x1="${cx-bw/2-7}" x2="${cx+bw/2+7}" y1="${y(p.rec)}" y2="${y(p.rec)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink3)">${mesAbr(p.m)} ${p.m.slice(2,4)}</text><rect x="${L+i*pw}" y="${T}" width="${pw}" height="${H-T-B}" fill="transparent" data-tip="${mesNome(p.m)} ${p.m.slice(0,4)}\nEntradas previstas ${brl(p.rec)}\nContas fixas ${brl(p.fix)}\nJá lançado ${brl(p.lan)}\nVariável estimado ${brl(p.vari)}\nSobra prevista ${brl(p.sobra)}"/>`});
  const med=sum(P,p=>p.tot)/P.length,pior=P.reduce((a,b)=>b.sobra<a.sobra?b:a);
  return `<div class="kpis"><div class="kpi"><label>Gasto médio previsto</label><span class="mny kp">${brl(med)}</span><small>por mês, nos próximos ${P.length} meses</small></div><div class="kpi"><label>Mês mais apertado</label><span class="mny kp ${pior.sobra<0?'neg':''}">${brl(pior.sobra)}</span><small>de sobra em ${mesNome(pior.m).toLowerCase()}</small></div><div class="kpi"><label>Parcelas e compras já lançadas</label><span class="mny kp">${brl(sum(P,p=>p.lan))}</span><small>comprometido nos próximos ${P.length} meses</small></div></div>
  <div class="chips" style="font-size:12px;color:var(--ink2);gap:14px"><span><span class="dot" style="background:var(--navy)"></span> Contas fixas</span><span><span class="dot" style="background:var(--p2)"></span> Já lançado (parcelas e faturas)</span><span><span class="dot" style="background:var(--p1)"></span> Variável estimado</span><span><b style="display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--ink);vertical-align:middle"></b> Entradas previstas</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Previsão de gastos e entradas dos próximos meses">${g}</svg>
  <div class="tw"><table><thead><tr><th>Mês</th><th class="r">Fixas</th><th class="r">Já lançado</th><th class="r">Variável</th><th class="r">Total</th><th class="r">Entradas</th><th class="r">Sobra</th></tr></thead><tbody>${P.map(p=>`<tr><td>${mesNome(p.m)} ${p.m.slice(0,4)}</td><td class="r num">${fmt(p.fix)}</td><td class="r num">${fmt(p.lan)}</td><td class="r num">≈ ${fmt(p.vari)}</td><td class="r num"><b>${fmt(p.tot)}</b></td><td class="r num">${fmt(p.rec)}</td><td class="r num ${p.sobra<0?'neg':'pos'}">${p.sobra<0?'− ':''}${fmt(Math.abs(p.sobra))}</td></tr>`).join('')}</tbody></table></div>`;
}

function metasHtml(){
  if(!S.metas.length)return '<p class="empty">Nenhuma meta ainda. Crie a primeira, como a reserva de emergência do casal ou o fundo de caixa de um cartório.</p>';
  return `<div class="kpis">${S.metas.map(m=>`<button class="kpi" data-act="meta" data-id="${m.id}" style="border:0;text-align:left"><label>${h(m.nome)} · ${h(espNome(m.esp||'casa'))}</label><span class="mny kp">${brl(m.atual||0)}</span><small>de ${brl(m.alvo||0)} · ${pct(m.atual||0,m.alvo||0)}%</small><div class="prog" style="margin-top:8px"><i style="width:${Math.min(100,pct(m.atual||0,m.alvo||0))}%"></i></div></button>`).join('')}</div>`;
}

    ${d.comp>0?`<div><div class="sub">Total das despesas do mês</div>${money(m.D,'mid')}</div>
    <div class="two"><div><div class="sub"><span class="dot" style="background:var(--p1)"></span> ${h(c.p1)} pagou</div><span class="num">${brl(d.pagou1)}</span></div><div style="text-align:right"><div class="sub">${h(c.p2)} pagou <span class="dot" style="background:var(--p2)"></span></div><span class="num">${brl(d.pagou2)}</span></div></div>
    <div class="splitw"><div class="split"><span style="width:${p1p}%;background:var(--p1)">${p1p}%</span><span style="flex:1;background:var(--p2)">${100-p1p}%</span></div><u style="left:${e1p}%" data-tip="Divisão combinada: ${e1p}% e ${100-e1p}%"></u></div>
    <div class="row acerto">${Math.abs(d.acerto)<0.01?'<span class="t"><b>Contas em dia entre vocês</b><small>Cada um pagou exatamente a sua parte.</small></span>':`${av(d.acerto>0?'p2':'p1')} → ${av(d.acerto>0?'p1':'p2')}<span class="t"><b>${h(pNome(d.acerto>0?'p2':'p1'))} devolve ${brl(Math.abs(d.acerto))}</b><small>para ${h(pNome(d.acerto>0?'p1':'p2'))}, por Pix, e o mês fica acertado</small></span><button class="btn sm" data-act="acerto">${acertoFeito?'✓ Acerto feito':'Marcar feito'}</button>`}</div>

function cartoesHtml(cartoes,esp){
  if(!cartoes.length)return '<p class="empty">Nenhum cartão cadastrado. Adicione o cartão com o dia de fechamento e de vencimento para as faturas se montarem sozinhas.</p>';
  const fat=(c,mm)=>sum(S.lanc.filter(l=>l.conta===c.id&&l.tipo==='desp'&&faturaMes(c,l.data)===mm),l=>l.valor);
  const meses=[0,1,2].map(i=>addMes(S.mes,i)),tot=meses.map(mm=>sum(cartoes,c=>fat(c,mm))),mx=Math.max(1,...tot);
  const chip='<svg width="38" height="28" viewBox="0 0 38 28" aria-hidden="true"><rect width="38" height="28" rx="5" fill="#e9e3d2"/><path d="M0 10h12M0 18h12M26 10h12M26 18h12M12 0v28M26 0v28" stroke="#9c9480" stroke-width="1.2"/></svg>';
  const onda='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8" aria-hidden="true"><path d="M6 8a6 6 0 0 1 0 8M10 5.5a10 10 0 0 1 0 13M14 3a14 14 0 0 1 0 18"/></svg>';
  return `<div><div class="sub">Faturas que vencem em ${mesNome(S.mes).toLowerCase()}</div>${money(tot[0],'mid')}</div>
  <div class="ccs">${cartoes.map(c=>{const atual=fat(c,S.mes),aberto=sum(S.lanc.filter(l=>l.conta===c.id&&l.tipo==='desp'&&faturaMes(c,l.data)>=S.mes&&!c.pagos?.[faturaMes(c,l.data)]),l=>l.valor);
    return `<button class="cc" data-act="conta" data-id="${c.id}" style="--cc:${h(c.cor||'#1b1f2a')}" aria-label="Editar ${h(c.nome)}"><span class="two"><b class="ccn">${h(c.nome)}</b><span class="ccp">${c.pagos?.[S.mes]?'Paga':atual>0?'Aberta':'Sem compras'}</span></span><span class="ccmid">${chip}<span class="ccv">${brl(atual)}</span>${onda}</span><span class="two ccf"><span><small>VENCE</small>${pad(c.vence||1)}/${S.mes.slice(5)}</span>${esp==='casa'?`<span><small>TITULAR</small>${h(pNome(c.dono))}</span>`:''}<span style="text-align:right"><small>${c.limite?'LIMITE LIVRE':'FECHA'}</small>${c.limite?brl(c.limite-aberto):'dia '+pad(c.fecha||1)}</span></span></button>`}).join('')}</div>
  <h3 class="lab">Próximas faturas</h3><div class="prox">${meses.map((mm,i)=>`<div class="px ${i===0?'on':''}" data-tip="${mesNome(mm)} ${mm.slice(0,4)}\n${cartoes.map(c=>h(c.nome)+': '+brl(fat(c,mm))).join('\n')}"><b>${mesAbr(mm)} ${mm.slice(2,4)}</b><span class="fill" style="height:${Math.round(34+tot[i]/mx*44)}px"></span><span class="num">${brl(tot[i])}</span></div>`).join('')}</div>`;
}

function vGuia(){
  return `<section class="card prose"><header><h2>Como usar em cinco passos</h2></header>
  <div class="steps"><div class="step"><b>1. Ajuste os nomes e a divisão</b><p>Em Ajustes, confirme os nomes, o percentual padrão de divisão das contas da casa e o regime de cada cartório.</p></div><div class="step"><b>2. Cadastre contas e cartões</b><p>Informe cada conta bancária e cada cartão (com dia de fechamento e de vencimento), dizendo se é da casa ou de um cartório.</p></div><div class="step"><b>3. Cadastre o que se repete</b><p>Salários, aluguel, luz, folha, sistema e repasses viram contas fixas e aparecem todo mês para você só marcar como pagas.</p></div><div class="step"><b>4. Lance ou importe o resto</b><p>Use "+ Novo lançamento" para o avulso, ou importe o extrato em Conexões e apenas confira as categorias.</p></div><div class="step"><b>5. Feche o mês</b><p>Na Casa, faça o acerto do casal. Nos cartórios, baixe o livro caixa. Em Impostos, veja quanto reservar para o DARF.</p></div></div></section>
  <section class="card prose"><header><h2>O que significa cada termo</h2></header><dl>
  <dt>Saldo previsto</dt><dd>Renda do mês menos tudo que está previsto para sair, pago ou não. Mostra quanto sobra se nada mais for gasto.</dd>
  <dt>Conta fixa</dt><dd>Entrada ou saída que se repete todo mês. Se o valor varia (luz, água), marque como estimado e ajuste o valor do mês quando a conta chegar.</dd>
  <dt>Despesa dividida</dt><dd>Despesa da casa rateada entre os dois pelo percentual escolhido. Despesas marcadas como "só de" uma pessoa não entram no acerto.</dd>
  <dt>Acerto do mês</dt><dd>Diferença entre o que cada um pagou e a parte que lhe cabia nas despesas divididas. Indica quem devolve quanto para quem.</dd>
  <dt>Fatura</dt><dd>Soma das compras do cartão entre dois fechamentos. Uma compra feita depois do dia de fechamento cai na fatura seguinte. Compras parceladas viram uma parcela por mês.</dd>
  <dt>Repasses obrigatórios</dt><dd>Parte do que o cartório arrecada e não pertence à serventia: taxas e fundos devidos ao Tribunal e o ISS do município. Se você já lança os emolumentos líquidos desses valores, não lance os repasses de novo.</dd>
  <dt>Despesa dedutível</dt><dd>Despesa necessária à atividade da serventia e escriturada no livro caixa, como folha, encargos, aluguel e sistema. Ela reduz a base do carnê-leão.</dd>
  <dt>Retirada do titular</dt><dd>Dinheiro que sai do caixa do cartório para você. Não é despesa: lance como "Retirada do titular" no cartório e como receita "Retirada do cartório" na Casa.</dd>
  <dt>Carnê-leão</dt><dd>Recolhimento mensal do imposto de renda da pessoa física sobre o resultado das serventias. A página estima o valor somando os dois cartórios, porque o imposto é um só por CPF.</dd>
  <dt>Teto do interino</dt><dd>Quem responde interinamente por uma serventia tem a remuneração limitada a 90,25% do subsídio de ministro do STF, e o excedente é recolhido ao Tribunal. Marque o regime "interino" em Ajustes para acompanhar.</dd></dl></section>`;
}

function parseOFX(t){const out=[],re=/<STMTTRN>([\s\S]*?)(?=<STMTTRN>|<\/BANKTRANLIST>|$)/gi,g=(b,k)=>{const r=new RegExp('<'+k+'>([^<\\r\\n]*)','i').exec(b);return r?r[1].trim():''};let m;

  const iD=H.findIndex(x=>/data|date/i.test(x)),iV=H.findIndex(x=>/valor|amount|montante/i.test(x)),iT=H.findIndex(x=>/descri|hist|lan[cç]amento|estabelec|title|detalhe/i.test(x));
  const out=[];for(const l of ls.slice(hi+1)){const c=splitCSV(l,sep);let d=c[iD]||'';const m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(d);if(m)d=`${m[3]}-${m[2]}-${m[1]}`;else d=d.slice(0,10);

    if(!itens.length){toast('Não encontrei lançamentos neste arquivo. Exporte o extrato em OFX ou em CSV com colunas de data e valor.');return}
    const esp=espDaView();S.imp={nome:file.name,csv:!ofx,inv:false,esp,conta:'',itens:itens.map(i=>({...i,on:true}))};marcarDup();render();
  }).catch(()=>toast('Não foi possível ler o arquivo.'));
}
function marcarDup(){const ids=new Set(S.lanc.filter(l=>l.fitid).map(l=>l.fitid));for(const i of S.imp.itens)i.dup=!!i.fitid&&ids.has(i.fitid)}
async function importar(){
  const imp=S.imp,sel=imp.itens.filter(i=>i.on&&!i.dup),c=conta(imp.conta);let n=0;
  for(const it of sel){const tipo=imp.inv?(it.tipo==='rec'?'desp':'rec'):it.tipo;imp.prog=`${n+1} de ${sel.length}…`;render();
    const ok=await gravar('lanc',null,{esp:imp.esp,tipo,desc:it.desc.slice(0,120),valor:it.valor,data:it.data,cat:it.cat||sugerirCat(it.desc,imp.esp,tipo),conta:imp.conta||'',quem:c?.dono||'p1',div:imp.esp==='casa'&&tipo==='desp'?cfg().divPadrao:null,pago:true,origem:'importado',fitid:it.fitid,rev:true});
    if(!ok){imp.prog='';render();return}n++}
  S.imp=null;toast(`${n} lançamento${n===1?'':'s'} importado${n===1?'':'s'}.`);S.view='lancamentos';location.hash='lancamentos';render();
}

/* ============ ações ============ */
async function baixar(nome,dados){
  if(!DL){toast('O download não está disponível nesta visualização.');return}
  try{await DL.save({filename:nome,data:dados})}catch(e){if(e?.code!=='declined')toast('Não foi possível gerar o arquivo agora.')}
}
const ACOES={
  ir:d=>{S.view=d.id;location.hash=d.id;render();window.scrollTo(0,0)},
  mais:()=>{const dlg=$('#dlg');dlg.innerHTML=`<div class="dlg"><h2>Mais áreas</h2>${VIEWS().slice(4).map(x=>`<button class="nav" data-act="ir" data-id="${x[0]}" data-fecha="1">${ic(x[2])}<span>${h(x[1])}</span></button>`).join('')}<footer><button class="btn" data-f="x">Fechar</button></footer></div>`;dlg.onclick=e=>{if(e.target.closest('[data-f],[data-fecha]'))dlg.close()};dlg.onsubmit=null;dlg.showModal()},
  mes:d=>{S.mes=d.id==='0'?HOJE.slice(0,7):addMes(S.mes,+d.id);render()},
  tema:d=>{S.tema=d.id||null;if(S.tema)document.documentElement.dataset.theme=S.tema;else delete document.documentElement.dataset.theme;try{localStorage.setItem('tema',d.id)}catch(e){}render()},
  novo:()=>formLanc(),
  dizimo:d=>formLanc(null,{esp:'casa',tipo:'desp',desc:'Dízimo de '+mesNome(S.mes).toLowerCase(),cat:'Dízimos e ofertas',valor:+d.v||'',divm:'ind'}),
  abrir:d=>{if(d.ref==='lanc')formLanc(d.id);else if(d.ref==='fixa')formFixaMes(d.id);else formConta(d.id)},
  pagar:async d=>{
    if(d.ref==='fixa'){const f=S.fixas.find(x=>x.id===d.id);if(f)await gravar('fixas',d.id,{pagos:{[S.mes]:!f.pagos?.[S.mes]}},true)}
    else if(d.ref==='fatura'){const c=conta(d.id);if(c)await gravar('contas',d.id,{pagos:{[S.mes]:!c.pagos?.[S.mes]}},true)}
    else{const l=S.lanc.find(x=>x.id===d.id);if(l)await gravar('lanc',d.id,{pago:l.pago===false},true)}},
  fixa:d=>formFixa(d.id,d.esp),
  conta:d=>formConta(d.id,d.tipo,d.esp),
  meta:d=>formMeta(d.id),
  cfg:()=>formCfg(),
  acerto:async()=>{const c=cfg();await gravar('config','geral',{...semId(c),acertos:{...(c.acertos||{}),[S.mes]:!c.acertos?.[S.mes]}})},
  fesp:d=>{S.fEsp=d.id;render()},
  ofClass:d=>{const it=pendentes().find(x=>x.id===d.id);if(it)formLanc(null,preOF(it))},
  ofIgn:async d=>{if(!await gravar('config','ofignorados',{ids:{...S.ign,[d.id]:true}}))return;toast('Lançamento ignorado.')},
  ofVinc:d=>{const b=S.inbox.find(x=>x.id===d.id);if(b)formConta(null,b.tipo,'casa',{pluggy:b.id,nome:b.nome,limite:b.limite||''})},
  ofTodos:async(d,el)=>{const ls=pendentes().filter(p=>p.ct);el.disabled=true;let n=0;
    for(const it of ls){const p=preOF(it);el.textContent=`Gravando ${n+1} de ${ls.length}…`;
      if(!await gravar('lanc',null,{esp:p.esp,tipo:p.tipo,desc:p.desc,valor:p.valor,data:p.data,cat:p.cat,conta:p.conta,quem:p.quem,div:p.esp==='casa'&&p.tipo==='desp'?cfg().divPadrao:null,pago:true,origem:'openfinance',fitid:p.fitid,rev:true,anexos:[]}))return;n++}
    toast(`${n} lançamento${n===1?'':'s'} gravado${n===1?'':'s'}.`)},
  dia:d=>{S.dia[d.esp]=S.dia[d.esp]===d.id?null:d.id;render()},
  arquivo:()=>$('#arq').click(),
  impCancel:()=>{S.imp=null;render()},
  importar:()=>importar(),
  csv:d=>{const k=cartorio(d.esp,S.mes);const ls=[...k.rec.map(x=>({...x,t:'rec'})),...k.gastos.map(x=>({...x,t:'desp'}))].sort((a,b)=>a.data.localeCompare(b.data));
    const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
    const csv=String.fromCharCode(65279)+['Data;Histórico;Categoria;Grupo;Receita;Despesa',...ls.map(x=>[x.data.split('-').reverse().join('/'),q(x.desc),q(x.cat),x.t==='rec'?'Receita':q(GRN[grupo(x.cat)]),x.t==='rec'?fmt(x.valor):'',x.t==='desp'?fmt(x.valor):''].join(';'))].join('\r\n');
    baixar(`livro-caixa-${S.mes}.csv`,csv)},
  backup:()=>baixar(`casa-e-cartorios-${HOJE}.json`,JSON.stringify({gerado:HOJE,config:cfg(),contas:S.contas,fixas:S.fixas,lancamentos:S.lanc,metas:S.metas},null,1)),
  limparEx:async(d,el)=>{if(el.dataset.conf!=='1'){el.dataset.conf='1';el.textContent=`Confirmar: apagar ${d.n} exemplos`;return}
    el.disabled=true;el.textContent='Apagando…';
    for(const[col,arr]of[['lanc',S.lanc],['fixas',S.fixas],['contas',S.contas],['metas',S.metas]])for(const x of arr.filter(x=>x.ex))if(!await apagar(col,x.id))return;
    toast('Exemplos apagados. O painel agora mostra só o que você lançar.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACOES[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el.dataset,el)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='busca'){S.busca=t.value;pedir()}
  if(t.dataset.imp!=null&&S.imp){S.imp.itens[+t.dataset.imp].on=t.checked;pedir()}});
document.addEventListener('change',e=>{const t=e.target;if(!S.imp)return;
  if(t.id==='impEsp'){S.imp.esp=t.value;S.imp.conta='';S.imp.itens.forEach(i=>delete i.cat);render()}
  if(t.id==='impConta'){S.imp.conta=t.value;if(S.imp.csv&&ehCartao(t.value))S.imp.inv=true;render()}
  if(t.id==='impInv'){S.imp.inv=t.checked;S.imp.itens.forEach(i=>delete i.cat);render()}
  if(t.dataset.impcat!=null)S.imp.itens[+t.dataset.impcat].cat=t.value});
$('#arq').addEventListener('change',e=>{const f=e.target.files[0];if(f)lerArquivo(f);e.target.value=''});
// dica ao passar o mouse ou tocar numa marca de gráfico
const tip=$('#tip');
const mostraTip=e=>{const el=e.target.closest?.('[data-tip]');if(!el){tip.hidden=true;return}tip.textContent=el.dataset.tip;tip.hidden=false;const x=Math.min(window.innerWidth-250,Math.max(8,e.clientX+12)),y=Math.max(8,e.clientY-tip.offsetHeight-10);tip.style.left=x+'px';tip.style.top=y+'px'};
document.addEventListener('pointermove',mostraTip);document.addEventListener('pointerdown',mostraTip);
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS().some(x=>x[0]===v)&&v!==S.view){S.view=v;render()}});

/* ============ início ============ */
async function iniciar(){
  try{const t=localStorage.getItem('tema');if(t){S.tema=t;document.documentElement.dataset.theme=t}}catch(e){}
  const v=location.hash.slice(1);if(VIEWS().some(x=>x[0]===v))S.view=v;
  render();
  const lento=setTimeout(()=>{if(!carregado()){S.lento=true;render()}},10000);
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [DB,DL,AS]=await Promise.all([use('db'),use('downloads'),use('assets')]);
  if(!DB){clearTimeout(lento);S.semDb=true;render();return}
  const fim=k=>{S.ok[k]=true;if(carregado())clearTimeout(lento);pedir()};
  const erro=()=>{clearTimeout(lento);S.semDb=true;render()};
  DB.doc('config/geral').onSnapshot(s=>{const d=s.exists?s.data():{};S.cfg={...CFG0,...d,c1:{...CFG0.c1,...(d.c1||{})},c2:{...CFG0.c2,...(d.c2||{})}};fim('cfg')},erro);
  DB.doc('config/openfinance').onSnapshot(s=>{S.of=s.exists?s.data():null;pedir()},()=>{});
  DB.doc('config/ofignorados').onSnapshot(s=>{S.ign=s.exists?(s.data().ids||{}):{};pedir()},()=>{});
  DB.collection('of_inbox').onSnapshot(q=>{S.inbox=q.docs.map(d=>({...d.data(),id:d.id}));pedir()},()=>{});
  for(const[col,k]of[['lanc','lanc'],['fixas','fixas'],['contas','contas'],['metas','metas']])
    DB.collection(col).onSnapshot(q=>{S[k]=q.docs.map(d=>({...d.data(),id:d.id}));if(k==='lanc'&&S.imp)marcarDup();fim(k)},erro);
}
iniciar();
</script>
