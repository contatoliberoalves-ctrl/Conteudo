<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const comLivro = q.get('livro') === '1';
const vista = q.get('vista') || 'frente';
const W = +q.get('w') || 1600, H = +q.get('h') || 1200;
const cor = { lateral: q.get('cl') || '#24426b', placa: q.get('cp') || '#d9a441' };
const M = await (await fetch('../montagem.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const sol = new THREE.DirectionalLight(0xffffff, 2.2);
sol.position.set(260, 420, 320); sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096); sol.shadow.radius = 6; sol.shadow.bias = -0.0004;
Object.assign(sol.shadow.camera, { left: -700, right: 700, top: 700, bottom: -700, near: 1, far: 1500 });
sol.target.position.set(0, 0, M.comp / 2); scene.add(sol, sol.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.6));

const chao = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: 0.22 }));
chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; scene.add(chao);

const plast = c => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.55, metalness: 0, clearcoat: 0.15, clearcoatRoughness: 0.6 });
const loader = new STLLoader();
const carregar = n => new Promise(r => loader.load('../' + n + '.stl', g => { g.computeVertexNormals(); r(g); }));
const [gLat, gPlaca, gTrav] = await Promise.all(['lateral', 'placa', 'travessa'].map(carregar));
const malha = (g, c) => { const m = new THREE.Mesh(g, plast(c)); m.castShadow = m.receiveShadow = true; return m; };

const grupo = new THREE.Group(); scene.add(grupo);
for (const z of [0, M.largura + M.vao]) { const m = malha(gLat, cor.lateral); m.position.z = z; grupo.add(m); }
// placa e travessa: comprimento em x no STL -> eixo z; face gravada (z do STL) -> +x
function barra(g, c, cx, cy, alt, esp) {
  const m = malha(g, c); m.rotation.y = Math.PI / 2;
  m.position.set(cx - esp / 2, cy - alt / 2, M.comp); grupo.add(m);
}
barra(gPlaca, cor.placa, M.pos_placa[0], M.pos_placa[1], M.placa[0], M.placa[1]);
barra(gTrav, cor.placa, M.pos_barra[0], M.pos_barra[1], M.barra, M.barra);

if (comLivro) {
  const a = M.angulo * Math.PI / 180;
  const u = new THREE.Vector3(-Math.cos(a), Math.sin(a), 0), n = new THREE.Vector3(Math.sin(a), Math.cos(a), 0), z = new THREE.Vector3(0, 0, 1);
  const o = new THREE.Vector3(M.o[0], M.o[1], 0);
  // textura de página: colunas de texto
  const tex = (() => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 720; const x = c.getContext('2d');
    x.fillStyle = '#f6f1e6'; x.fillRect(0, 0, 512, 720);
    x.fillStyle = '#2b2b2b'; x.font = 'bold 22px serif'; x.fillText('Art. 5º', 40, 60);
    for (let col = 0; col < 2; col++) for (let y = 90; y < 690; y += 13) {
      if (Math.random() < .06) continue;
      x.fillStyle = Math.random() < .08 ? '#555' : '#9a968f';
      const w = 200 - (Math.random() < .15 ? Math.random() * 120 : 0);
      x.fillRect(40 + col * 225, y, w, 5);
    }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  })();
  const capa = new THREE.MeshStandardMaterial({ color: '#7a1f24', roughness: 0.7 });
  const miolo = new THREE.MeshStandardMaterial({ color: '#efe8d8', roughness: 0.9 });
  const pagina = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
  const esp = 34, alt = 240, larg = 165, meio = M.comp / 2;
  for (const lado of [-1, 1]) {
    const g = new THREE.Group();
    const bloco = new THREE.Mesh(new THREE.BoxGeometry(esp - 3, alt - 6, larg - 4),
      [pagina, miolo, miolo, miolo, miolo, miolo]); // +x = face das páginas
    bloco.position.set((esp - 3) / 2 + 3, alt / 2, 0);
    const cp = new THREE.Mesh(new THREE.BoxGeometry(3, alt, larg), capa); cp.position.set(1.5, alt / 2, 0);
    for (const m of [bloco, cp]) { m.castShadow = m.receiveShadow = true; g.add(m); }
    // base: x=n, y=u, z=z
    const mat = new THREE.Matrix4().makeBasis(n, u, z);
    g.quaternion.setFromRotationMatrix(mat);
    g.position.copy(o).add(n.clone().multiplyScalar(0.5)).add(z.clone().multiplyScalar(meio + lado * (larg / 2 + 1)));
    // as duas metades abrem em V raso, com a lombada mais para trás
    g.rotateOnAxis(new THREE.Vector3(0, 1, 0), lado * 0.05);
    scene.add(g);
  }
}

const cam = new THREE.PerspectiveCamera(24, W / H, 10, 5000);
const alvo = new THREE.Vector3(-20, comLivro ? 120 : 85, M.comp / 2);
const pos = { frente: [620, 340, -260], lado: [760, 260, 520], livro: [720, 420, -330] }[vista];
cam.position.set(...pos); cam.lookAt(alvo);
if (q.get('dist')) cam.position.sub(alvo).multiplyScalar(+q.get('dist')).add(alvo);
renderer.render(scene, cam);
window.__pronto = true;
</script></body></html>
