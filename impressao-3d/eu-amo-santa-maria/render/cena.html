<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Placa montada: base (x comprimento, y fundo, z altura no STL) e peças (x, y altura, z espessura).
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = 1800, H = 900;
const M = await (await fetch('../montagem.json')).json();
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.8; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const cena = new THREE.Scene();
cena.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sol = new THREE.DirectionalLight(0xffffff, 2.0); sol.position.set(60, 260, 220); sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096); sol.shadow.radius = 5; sol.shadow.bias = -0.0004;
Object.assign(sol.shadow.camera, { left: -300, right: 300, top: 300, bottom: -300, near: 1, far: 1000 });
sol.target.position.set(120, 0, 15); cena.add(sol, sol.target, new THREE.HemisphereLight(0xffffff, 0xe0d8cc, 0.7));
const chao = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShadowMaterial({ opacity: 0.18 }));
chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; cena.add(chao);
const mat = c => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.6, clearcoat: 0.1 });
const ld = new STLLoader();
const carregar = n => new Promise(ok => ld.load('../' + n + '.stl', g => { g.computeVertexNormals(); ok(g); }));
const cores = { base: '#9a6b3f', eu: '#e39a1f', coracao: '#c3202b', 'texto-azul': '#1f3a8a', 'texto-amarelo': '#e39a1f' };
for (const [n, c] of Object.entries(cores)) {
  const m = new THREE.Mesh(await carregar(n), mat(c)); m.castShadow = m.receiveShadow = true;
  if (n === 'base') { m.rotation.x = -Math.PI / 2; m.position.z = M.fundo; }   // (x, y, z) -> (x, z, -y)
  else { m.position.set(0, M.altura_base, M.y0); }
  cena.add(m);
}
const cam = new THREE.PerspectiveCamera(22, W / H, 10, 4000);
cam.position.set(170, 95, 330); cam.lookAt(122, 30, 15);
r.render(cena, cam); window.__pronto = true;
</script></body></html>
